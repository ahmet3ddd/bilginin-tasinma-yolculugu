# GitHub Pages yayını — CANLI, elle tetiklenir.
# Site yayında: https://ahmet3ddd.github.io/bilginin-tasinma-yolculugu/
# Bu iş akışı kendiliğinden çalışmaz. index.html ya da başka bir dosya
# güncellendiğinde: Actions → Deploy to GitHub Pages → Run workflow.
# Her yüklemede kendiliğinden yayınlansın isterseniz aşağıdaki "push"
# bloğunun başındaki # işaretlerini kaldırın.
#
# Publishing to GitHub Pages is LIVE but manual: this workflow runs only when
# started from the Actions tab. Uncomment the "push" trigger below to deploy
# automatically on every push to main.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub'in Pages icin onerisi cancel-in-progress: false — boylece sirada
# bekleyen bir yayin, sonradan baslatilan biri yuzunden iptal edilip kaybolmaz.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
