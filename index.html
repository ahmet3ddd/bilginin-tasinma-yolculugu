ndan aktarım zincirinin fiilen işlediğini kanıtlayan tarihli belge.","A dated document proving the transmission chain was still actually working after the institutional break."],"shows":["Adlandırılmış bir yetki belgesi zinciri, onu doğuran yazı sistemi gündelik kullanımdan çıktıktan yarım yüzyıl sonra bile bilgiyi taşıyabilir.","A named credential chain can still carry knowledge half a century after the writing system that produced it left daily use."],"limits":["Tek bir icâzetnâme aktarılan becerinin düzeyini ölçmez; yalnızca ustanın onayını ve soyu kaydeder.","A single icâzetnâme measures nothing about the level of skill transmitted; it records only the master's approval and the lineage."],"source":["Türkiye'nin Ustaları — Hattat Hasan Çelebi dosyası","Türkiye'nin Ustaları — the Hasan Çelebi file"],"url":"https://www.turkiyeninustalari.org/tr/ustalar/hat-sanati/hasan-celebi"}},{"id":"ebru","cat":"threshold","civ":"ottoman","icon":"🌊","name":["Ebru","Ebru — Turkish marbling"],"era":["1540 → bugün","1540 → today"],"hook":["Ebrunun paketi neredeyse boştur: dört yüz yılda bilinen tek erken risale ve hiçbir tarif taşımayan bir yığın kâğıt. Sanat, elden başka bir yerde saklanmadığı için ayakta.","Ebru's packet is nearly empty: one known early treatise in four hundred years, and a stack of sheets that carry no instructions. The craft survives because it was never stored anywhere but in a hand."],"timeline":[{"y":1540,"t":["Topkapı Sarayı'ndaki en eski tarihli ebrular: Ârifî'nin Gûy u Çevgân nüshasındaki zemin ebruları. Kâğıt var, yöntem yok.","The earliest dated ebru at Topkapı: the ground papers in Ârifî's Gûy u Çevgân. The paper survives, the method does not."],"link":"packet","src":"https://isamveri.org/pdfdrg/D00193/2016_1/2016_1_GULGENH2.pdf"},{"y":1608,"t":["“Tertîb-i Risâle-i Ebrî”: tekniği anlatan bilinen tek erken yazma. Adını bildiğimiz ilk usta, Şebek mahlaslı Mehmed Efendi, burada geçer.","“Tertîb-i Risâle-i Ebrî”: the only known early manuscript describing the technique. The first master whose name we know, Mehmed Efendi “Şebek”, appears in it."],"link":"packet","src":"https://isamveri.org/pdfdrg/D00193/2016_1/2016_1_GULGENH2.pdf"},{"y":1773,"t":["Hatip Mehmed Efendi ölür. Kitre kıvamını düzelterek renkleri parlak ve deseni denetlenebilir kılmıştır; ebrunun aygıtı burada değişir.","Hatip Mehmed Efendi dies, having corrected the viscosity of the size so colours stay vivid and pattern becomes controllable: the apparatus changes here."],"link":"apparatus","src":"https://dergipark.org.tr/tr/pub/akdenizsanat/article/291519"},{"y":1846,"t":["Şeyh Sâdık Efendi ölür. Buhara yakınındaki Vabkent'te öğrendiği tarz-ı kadîmi Üsküdar'daki Özbekler Tekkesi'ne taşımıştır: zincir dışarıdan beslenmiştir.","Şeyh Sâdık Efendi dies, having carried the old manner he learned at Vabkent near Bukhara into the Özbekler lodge in Üsküdar: the chain was resupplied from outside."],"link":"decoder","src":"https://isamveri.org/pdfdrg/D00193/2016_1/2016_1_GULGENH2.pdf"},{"y":1904,"t":["Hezarfen İbrâhim Edhem Efendi ölür (1829–1904). Ebruyu babasından almış, Necmeddin Okyay'a devretmiştir; aktarım tekkeden okula geçmeye başlar.","Hezarfen İbrâhim Edhem Efendi (1829–1904) dies, having taken ebru from his father and passed it to Necmeddin Okyay: transmission starts moving from lodge to school."],"link":"maintenance","src":"https://islamansiklopedisi.org.tr/edhem-efendi-hezarfen"},{"y":1925,"t":["677 sayılı kanunla tekke ve zâviyeler kapatılır (30 Kasım). Ebrunun yüzyıllık kurumsal yuvası ve ona anlamını veren tasavvufî çerçeve ortadan kalkar.","Law 677 closes the dervish lodges on 30 November. Ebru loses both its institutional home of a century and the Sufi frame that gave it meaning."],"link":"context","src":"https://islamansiklopedisi.org.tr/ozbekler-tekkesi--uskudar"},{"y":1990,"t":["Mustafa Düzgünman ölür (1920–1990). Necmeddin Okyay'ın çiçekli ebrusuna papatyayı eklemiş, tekniği Fuat Başar ve Alparslan Babaoğlu'na aktarmıştır.","Mustafa Düzgünman (1920–1990) dies, having added the daisy to Necmeddin Okyay's floral ebru and passed the technique to Fuat Başar and Alparslan Babaoğlu."],"link":"tacit","src":"https://islamansiklopedisi.org.tr/duzgunman-mustafa"},{"y":2014,"t":["UNESCO “Ebru, Türk kâğıt süsleme sanatı”nı Temsilî Liste'ye alır (9.COM, dosya 00644); dosya temel yeterlik için usta yanında en az iki yıl öngörür.","UNESCO inscribes “Ebru, Turkish art of marbling” on the Representative List (9.COM, file 00644); the file sets a two-year minimum beside a master for competence."],"link":"maintenance","src":"https://ich.unesco.org/en/RL/ebru-turkish-art-of-marbling-00644"}],"links":{"packet":["Şaşırtıcı biçimde zayıf. Dört yüz yıllık tarihin bilinen tek erken yazılı kaynağı 1608 risalesidir; hayatta kalan ebrular ise çıktıdır, talimat değil. Bugünkü kitaplar da 20. yüzyıl ustalarının anlatımından türemiştir.","Surprisingly weak. The only known early written source across four hundred years is the 1608 treatise; the surviving sheets are outputs, not instructions. Even today's manuals derive from 20th-century masters' accounts."],"decoder":["Güçlü ve izlenebilir: yaşayan ustalar ve 17. yüzyıla kadar adlarıyla uzanan bir silsile var. Ama çözücü yalnızca insandır — ebruyu okuyabilecek hiçbir standart, ölçüt ya da cihaz yok.","Strong and traceable: living masters and a silsile of named practitioners running back to the 17th century. But the decoder is only people — there is no standard, metric or instrument that can read an ebru."],"context":["Kısmen kaybedildi. Ebruyu bir sabır ve teslimiyet terbiyesi olarak açıklayan tekke çerçevesinin yerini sanat piyasası ve atölye turizmi aldı; teknik sürüyor, gerekçesi değişti.","Partly lost. The lodge frame that explained ebru as a discipline of patience and surrender has been replaced by an art market and workshop tourism; the technique continues, its rationale has changed."],"tacit":["Zincirin taşıyıcısı ve indirgenemez kısmı burasıdır. Öd oranı her oturumda suyun sıcaklığına, kitrenin kıvamına ve boyanın partisine göre gözle ayarlanır; UNESCO dosyası temel yeterlik için asgarî iki yıl şart koşar.","This is what carries the chain and what cannot be reduced. The ox-gall ratio is set by eye at every session against water temperature, size viscosity and pigment batch; the UNESCO file requires a minimum of two years for basic competence."],"apparatus":["Kırılgan. Kitre, toprak boyalar, sığır ödü ve gül dalına bağlanmış at kılı fırçalar az sayıda tedarikçiye bağlı; malzemenin bir partisi değiştiğinde usta bütün ayarları yeniden bulmak zorunda kalır.","Fragile. Tragacanth, earth pigments, ox gall and brushes of horsehair bound to rose branch depend on a handful of suppliers; when one batch of material changes, the master must find every setting again."],"maintenance":["Altı halkanın en güçlüsü: UNESCO tescili, belediye ve halk eğitim kursları, üniversite programları ve binlerce amatör uygulayıcı. Buradaki risk yok olmak değil, seyrelmektir.","The strongest of the six: the UNESCO inscription, municipal and public-education courses, university programmes and thousands of amateur practitioners. The risk here is dilution, not extinction."]},"weakest":{"k":"packet","why":["Ebru, kaydedilmiş içeriği neredeyse sıfır olan bir zanaatın yalnızca elle dört yüzyıl taşınabildiğini gösterir; ama bu, dayanıklılığın değil şansın kanıtıdır. Yaşayan ustalar yarın çalışmayı bıraksa, 1608 risalesi ile müzelerdeki kâğıtlar tekniği yeniden kurmaya yetmez. Zincirin bütün yükü tek bir halkaya biner ve o halka bir insan ömrü uzunluğundadır.","Ebru shows that a craft with almost no recorded content can be carried four hundred years by hand alone — but that is evidence of luck, not of robustness. If the living masters stopped tomorrow, the 1608 treatise and the museum sheets would not suffice to rebuild the technique. The whole load rests on a single link, and that link is the length of one human life."]},"nearBreak":["19. yüzyılda Türk ebru zinciri tek bir düğüme indi. Teknik, Şeyh Sâdık Efendi'nin Buhara yakınındaki Vabkent'te öğrendiği bilgiyle dışarıdan beslenmiş ve Üsküdar'daki Özbekler Tekkesi'nde toplanmıştı; oğlu Hezarfen İbrâhim Edhem Efendi (1829–1904) döneminde bu tekke İstanbul'da ebrunun fiilen tek merkeziydi. 30 Kasım 1925'te 677 sayılı kanunla bütün tekkeler kapatıldığında zincir kopabilirdi. Kopmadı; çünkü Edhem Efendi bilgiyi bir kuşak önce tekkenin dışına, Necmeddin Okyay'a (1883–1976) aktarmıştı ve Okyay onu Güzel Sanatlar Akademisi'nde öğretmeyi sürdürdü. Ebru, kurumu kapanmadan önce kurum değiştirdiği için yaşadı.","In the 19th century the Turkish ebru chain narrowed to a single node. The technique had been resupplied from outside by Şeyh Sâdık Efendi, who learned it at Vabkent near Bukhara, and was concentrated in the Özbekler lodge in Üsküdar; under his son Hezarfen İbrâhim Edhem Efendi (1829–1904) that lodge was effectively the only centre of ebru in Istanbul. When Law 677 closed every lodge on 30 November 1925, the chain could have snapped. It did not — because Edhem Efendi had already moved the knowledge outside the lodge one generation early, to Necmeddin Okyay (1883–1976), who went on teaching it at the Academy of Fine Arts. Ebru survived because it changed institutions before its institution was abolished."],"thesis":["Bu vaka çalışmanın örtük becerinin bağlayıcı kısıt olduğu iddiasını destekler: paketi neredeyse boş bir zanaat dört yüzyıl boyunca yalnızca ellerle taşındı. Göstermediği şey, ebrunun ilkece yazılamaz olduğudur — öd ve kitre dengesinin ölçülüp tekrarlanabilir biçimde tanımlanması bugünkü cihazlarla mümkündür; sorun imkânsızlık değil, kimsenin bunu yapmamış olmasıdır.","The case supports the study's claim that tacit skill is the binding constraint: a craft with a near-empty packet was carried four centuries by hands alone. What it does not show is that ebru is unwritable in principle — the balance of ox gall and tragacanth could be characterised reproducibly with today's instruments; the problem is not impossibility but that no one has done it."],"sources":[{"t":["UNESCO, Ebru, Türk kâğıt süsleme sanatı (dosya 00644)","UNESCO, Ebru, Turkish art of marbling (file 00644)"],"m":["2014 tescili ve 9.COM oturumu; sözlü ve gayriresmî aktarım ile temel yeterlik için asgarî iki yıllık usta-çırak süresi.","The 2014 inscription and 9.COM session; oral and informal transmission, and the two-year minimum under a master for basic competence."],"u":"https://ich.unesco.org/en/RL/ebru-turkish-art-of-marbling-00644"},{"t":["Hicabi Gülgen, “Türk Ebru Tarihi'nde Ustalar ve Üslup Değişimi”, Uludağ Ü. İlahiyat Fakültesi Dergisi 25/1 (2016)","Hicabi Gülgen, “Masters and Stylistic Change in the History of Turkish Ebru”, Uludağ University Faculty of Theology Journal 25/1 (2016)"],"m":["Topkapı'daki 1540 tarihli en eski ebrular, 1608 tarihli risale, Şebek Mehmed Efendi ve Şeyh Sâdık Efendi'nin Buhara bağı.","The oldest ebru at Topkapı dated 1540, the 1608 treatise, Şebek Mehmed Efendi, and Şeyh Sâdık Efendi's Bukhara connection."],"u":"https://isamveri.org/pdfdrg/D00193/2016_1/2016_1_GULGENH2.pdf"},{"t":["Pınar Toktaş, “Türk Ebru Sanatçılarının Kronolojik Olarak İncelenmesi”, Akdeniz Sanat 5/9 (2012)","Pınar Toktaş, “A Chronological Study of Turkish Ebru Artists”, Akdeniz Sanat 5/9 (2012)"],"m":["Tarihli örneklerin listesi (1447, 1519, 1539, 1554, 1595), 1608 risalesinin içeriği ve usta-çırak silsilesi.","The list of dated examples (1447, 1519, 1539, 1554, 1595), the content of the 1608 treatise, and the master-apprentice lineage."],"u":"https://dergipark.org.tr/tr/pub/akdenizsanat/article/291519"},{"t":["TDV İslâm Ansiklopedisi, “Edhem Efendi, Hezarfen”","TDV Encyclopaedia of Islam, “Edhem Efendi, Hezarfen”"],"m":["1829–1904; ebruyu babası Sâdık Efendi'den alıp Necmeddin Okyay'a aktarması; Özbekler Tekkesi'nin merkez rolü.","1829–1904; taking ebru from his father Sâdık Efendi and passing it to Necmeddin Okyay; the central role of the Özbekler lodge."],"u":"https://islamansiklopedisi.org.tr/edhem-efendi-hezarfen"},{"t":["TDV İslâm Ansiklopedisi, “Düzgünman, Mustafa”","TDV Encyclopaedia of Islam, “Düzgünman, Mustafa”"],"m":["9 Şubat 1920 – 12 Eylül 1990; Necmeddin Okyay'ın öğrencisi; papatya motifi; kurum dışı, doğrudan çıraklıkla aktarım.","9 February 1920 – 12 September 1990; pupil of Necmeddin Okyay; the daisy motif; transmission by direct apprenticeship outside any institution."],"u":"https://islamansiklopedisi.org.tr/duzgunman-mustafa"}],"ev":{"year":1608,"start":1540,"end":2014,"type":"direct","conf":"medium","region":["İstanbul ve Üsküdar","Istanbul and Üsküdar"],"role":["Bir zanaatın dört yüz yıllık tarihindeki tek erken yazılı kaydı; paket halkasının ne kadar ince olabileceğinin ölçüsü.","The single early written record in four hundred years of a craft — a measure of how thin the packet link can get."],"shows":["Yazılı kaydı tek bir risaleye inen bir teknik, kesintisiz bir usta-çırak zinciriyle dört yüzyıl taşınabilmiştir.","A technique whose written record shrinks to a single treatise was nonetheless carried four hundred years by an unbroken master-apprentice chain."],"limits":["Risalenin 1608 tarihi doğrudan bir ferağ kaydından değil içeriğe dayanan atıftan gelir, ayrıca en eski ebru örneğinin tarihi kaynaklarda 1447 ile 1554 arasında değişir.","The 1608 date rests on attribution from content rather than a direct colophon, and the date of the earliest surviving ebru varies between 1447 and 1554 across sources."],"source":["Hicabi Gülgen, Uludağ Ü. İlahiyat Fakültesi Dergisi 25/1 (2016)","Hicabi Gülgen, Uludağ University Faculty of Theology Journal 25/1 (2016)"],"url":"https://isamveri.org/pdfdrg/D00193/2016_1/2016_1_GULGENH2.pdf"}},{"id":"sinan","cat":"loss","civ":"ottoman","icon":"🕌","name":["Süleymaniye ve Sinan'ın yapı bilgisi","The Süleymaniye and Sinan's structural knowledge"],"era":["1550 → bugün","1550 → today"],"hook":["Süleymaniye'nin inşaat defterleri kubbe için 255 küpün ikişer akçeye alındığını yazar; niçin alındığını yazmaz. Bunu öğrenmek için dört buçuk asır sonra binanın içinde ses ölçmek gerekti.","The Süleymaniye's ledgers record that 255 jars were bought for the dome at two akçe each. They do not record why. Finding that out took measuring sound inside the building four and a half centuries later."],"timeline":[{"y":1550,"t":["Temel atılır. Muhasebe defterleri işçiyi, malzemeyi ve akçeyi gün gün kaydeder; yöntemi hiç kaydetmez.","The foundations are laid. The account books register labour, material and akçe day by day — and never once the method."],"link":"packet","src":"https://yedikita.com.tr/mimarlik-tarihimizin-en-buyuk-insa-organizasyonlarindan-suleymaniye/"},{"y":1557,"t":["Cami ibadete açılır; kitâbe 1550 ve 1557 tarihlerini verir, külliye 1559'a kadar sürer. Ana kubbe 26,5 m çapında ve 53 m yüksekliğindedir.","The mosque opens; the inscription gives 1550 and 1557, while the complex runs on to 1559. The main dome is 26.5 m across and 53 m high."],"link":"tacit","src":"https://en.wikipedia.org/wiki/S%C3%BCleymaniye_Mosque"},{"y":1588,"t":["Sinan ölür. Sâî Mustafa Çelebi'nin tezkireleri hayatını ve yapılarının listesini bırakır: ne yapıldığını yazar, nasıl hesaplandığını yazmaz.","Sinan dies. Sâî Mustafa Çelebi's tezkires leave his life and a list of his buildings: they record what was built, never how it was calculated."],"link":"decoder","src":"https://islamansiklopedisi.org.tr/sai-mustafa-celebi"},{"y":1660,"t":["Büyük yangında cami zarar görür ve IV. Mehmed tarafından onartılır; onarımlar Sinan'ın özgün iç bezemesinin çoğunu ortadan kaldırır.","The mosque is damaged in the great fire and repaired under Mehmed IV; the repairs destroy most of Sinan's original interior decoration."],"link":"maintenance","src":"https://en.wikipedia.org/wiki/S%C3%BCleymaniye_Mosque"},{"y":1766,"t":["22 Mayıs depremi (M≈7,1): Süleymaniye'nin kubbesinin bir bölümü çöker. Aynı sarsıntı Sinan'ın Edirnekapı Mihrimah'ının ana kubbesini ve minaresini tamamen yıkar.","The 22 May earthquake (M≈7.1) collapses part of the Süleymaniye's dome; the same shock brings down the main dome and minaret of Sinan's Edirnekapı Mihrimah entirely."],"link":"context","src":"https://en.wikipedia.org/wiki/1766_Istanbul_earthquake"},{"y":1965,"t":["Rıfkı Melûl Meriç Tezkiretü'l-Ebniye'yi ilk kez yayımlar; Barkan 1970'lerde inşaat defterlerini basar. Paket dört yüzyıl sonra okunabilir hâle gelir.","Rıfkı Melûl Meriç first publishes the Tezkiretü'l-Ebniye; Barkan issues the construction ledgers in the 1970s. The packet becomes readable four centuries on."],"link":"decoder","src":"https://islamansiklopedisi.org.tr/sai-mustafa-celebi"},{"y":2010,"t":["2007–2010 restorasyonu: ana kubbedeki çatlaklar enjeksiyonla sağlamlaştırılır, korozyona uğramış demir kenetler paslanmaz çelikle değiştirilir, çimento ekleri sökülür.","The 2007–2010 restoration injects and consolidates cracks in the main dome, replaces corroded iron cramps with stainless steel and strips out cement additions."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/S%C3%BCleymaniye_Mosque"},{"y":2019,"t":["Zühre Sü Gül ölçüm ve simülasyonu yayımlar: defterdeki 255 küpe karşılık restorasyonda 256 küp bulunmuştur; 63–250 Hz'de Helmholtz rezonatörü gibi davranırlar.","Zühre Sü Gül publishes measurement and simulation: against the ledger's 255 jars, 256 were found in the restoration, behaving as Helmholtz resonators at 63–250 Hz."],"link":"context","src":"https://www.mdpi.com/2624-599x/1/3/28"}],"links":{"packet":["İki paket var ve ikisi de eksik. Bina, ayakta duran tam ölçekli bir kayıttır; muhasebe defterleri bir satın alma kaydıdır — 255 küpün fiyatını verir, işlevini vermez. Sâî'nin tezkireleri ise yapı listesidir, mühendislik metni değil.","There are two packets and both are partial. The building is a full-scale record that still stands; the ledgers are a purchasing record — they give the price of the 255 jars, not their function. Sâî's tezkires are a list of works, not an engineering text."],"decoder":["Çözücü tamamen değişti. Osmanlı hassa mimarları ocağı 19. yüzyılda dağıldı; bugün yapıyı okuyan, sonlu elemanlar modeli kuran ve titreşim ölçen inşaat mühendisleridir. Zincir aynı bilgiyi değil, aynı binayı devraldı.","The decoder changed completely. The Ottoman corps of court architects dissolved in the 19th century; those who read the building today are structural engineers building finite-element models and taking vibration measurements. The chain inherited the same building, not the same knowledge."],"context":["Yeniden kazanılıyor, ama parça parça. Kubbedeki küplerin niçin orada olduğu 2007–2011 restorasyonu ve akustik ölçümlerle anlaşıldı; buna karşılık harç oranlarının, kenet boyutlarının ve yükleme öncesi oturma süresinin gerekçeleri hâlâ yalnızca çıkarımdır.","Being recovered, but piecemeal. Why the jars are in the dome was established by the 2007–2011 restoration and by acoustic measurement; the reasoning behind mortar ratios, cramp dimensions and settlement time before loading remains inference only."],"tacit":["Kopmuş. Sinan'ın altmış yıllık şantiye sezgisi hiçbir metne geçmedi; 3.500'ü aşkın ustanın ve günde ortalama 1.700 kişilik bir işgücünün taşıdığı el bilgisi, ocakla birlikte dağıldı.","Broken. Sinan's sixty years of site judgement never reached any text; the hand knowledge carried by more than 3,500 master craftsmen and an average daily workforce of some 1,700 dispersed along with the corps."],"apparatus":["Malzeme değişti. 2007–2010'da kurşuna gömülü demir kenetlerin yerini paslanmaz çelik, çimento ekinin yerini özgünle uyumlu harç aldı; bina bugün Sinan'ın kullanamayacağı malzemelerle ayakta tutuluyor.","The materials have changed. In 2007–2010 stainless steel replaced the iron cramps set in lead and compatible mortar replaced cement additions; the building is now held up by materials Sinan could not have used."],"maintenance":["Sürekli ve kurumsal: 1660 yangınının ardından IV. Mehmed, 1766 depreminden sonra onarım, 1858–59, 1956, 1961–67 ve 2007–2010 restorasyonları. Bu yapının ayakta kalması bir tasarım özelliği değil, dört buçuk asırlık kesintisiz bakım emeğidir.","Continuous and institutional: Mehmed IV after the 1660 fire, repairs after the 1766 earthquake, then the restorations of 1858–59, 1956, 1961–67 and 2007–2010. That this building still stands is not a design property but four and a half centuries of unbroken maintenance labour."]},"weakest":{"k":"tacit","why":["Bina, defterler ve tezkireler bir arada Süleymaniye'nin ne olduğunu eksiksiz anlatır; hiçbiri Sinan'ın bir taşın yerini gördüğü anda verdiği kararı taşımaz. Hassa mimarları ocağı bu kararları yazıya değil şantiyeye emanet etmişti ve ocak dağıldığında karar da dağıldı. Bugün Süleymaniye'yi taş taş yeniden kurabiliriz; Sinan'ın Selimiye'de yaptığı gibi bir sonraki adımı atacak eli yeniden kuramayız.","Building, ledgers and tezkires together tell us completely what the Süleymaniye is; none of them carries the decision Sinan made the moment he saw where a stone should go. The corps of court architects entrusted those decisions to the site rather than to writing, and when the corps dissolved the decisions went with it. We can rebuild the Süleymaniye stone by stone today; we cannot rebuild the hand that would take the next step, as Sinan did at the Selimiye."]},"nearBreak":["Yaygın inanışın aksine Sinan'ın yapıları depreme dokunulmaz değildir, ve kopuş anı tam da bunu gösterir. 22 Mayıs 1766 depreminde (M≈7,1) Süleymaniye'nin ana kubbesinin bir bölümü çöktü; aynı sarsıntıda Sinan'ın 1563–70'te yaptığı Edirnekapı Mihrimah Sultan Camii'nin ana kubbesi ve minaresi tamamen yıkıldı, aynı yapı 1894'te minaresini, 1999 Kocaeli depreminde yeniden kubbesini kaybetti. Süleymaniye'yi ayakta tutan şey kırılmazlık değil kesintisiz onarım oldu: 2007–2010'da yapılan iş, korozyona uğramış demir kenetlerin paslanmaz çelikle değiştirilmesi ve kubbe çatlaklarının enjeksiyonla kapatılmasıydı. Bakım halkası, aygıt halkasını da yenileyerek çalıştı.","Contrary to popular belief Sinan's buildings are not earthquake-proof, and the moment of failure shows it. In the earthquake of 22 May 1766 (M≈7.1) part of the Süleymaniye's main dome collapsed; the same shock brought down the main dome and minaret of Sinan's Edirnekapı Mihrimah Sultan Mosque (1563–70) entirely, and that building lost its minaret again in 1894 and its dome again in the 1999 Kocaeli earthquake. What has kept the Süleymaniye standing is not invulnerability but unbroken repair: the work of 2007–2010 consisted of replacing corroded iron cramps with stainless steel and injecting the cracks in the dome. The maintenance link worked by renewing the apparatus link as well."],"thesis":["Bu vaka çalışmanın kaydın seçici olduğu ve seçimin çoğu zaman yanlış katmanı koruduğu iddiasını destekler: Süleymaniye'nin defterleri kubbedeki 255 küpün fiyatını ikişer akçeye kadar korudu, işlevini ise dört buçuk asır boyunca hiç kimseye aktarmadı. Göstermediği şey, Osmanlı mimarlarının bilgiyi bilinçli olarak sakladığıdır — muhasebe defteri bir mühendislik belgesi olmak üzere tutulmamıştı; boşluk sır saklamanın değil, kayıt türünün amacının sonucudur.","The case supports the study's claim that recording is selective and that the selection usually preserves the wrong layer: the Süleymaniye's ledgers preserved the price of the 255 jars in the dome down to two akçe each, and transmitted their function to nobody for four and a half centuries. What it does not show is that Ottoman architects deliberately withheld knowledge — the ledger was never kept as an engineering document, and the gap follows from what that kind of record was for, not from secrecy."],"sources":[{"t":["Zühre Sü Gül, “Acoustical Impact of Architectonics and Material Features in the Lifespan of Two Monumental Sacred Structures”, Acoustics 1/3 (2019), 493–516","Zühre Sü Gül, “Acoustical Impact of Architectonics and Material Features in the Lifespan of Two Monumental Sacred Structures”, Acoustics 1/3 (2019), 493–516"],"m":["İnşaat defterlerindeki 255 sebu ve ikişer akçelik fiyat; 2007–2011 restorasyonunda tespit edilen 256 küp; 63–250 Hz'de Helmholtz davranışı.","The 255 sebu in the construction accounts at two akçe each; the 256 pots detected in the 2007–2011 restoration; Helmholtz behaviour at 63–250 Hz."],"u":"https://www.mdpi.com/2624-599x/1/3/28"},{"t":["TDV İslâm Ansiklopedisi, “Sâî Mustafa Çelebi”","TDV Encyclopaedia of Islam, “Sâî Mustafa Çelebi”"],"m":["Tezkiretü'l-Bünyân'ın altı yapıyı anlatan hikâye biçimi, Tezkiretü'l-Ebniye'nin on üç bölümlük yapı listesi ve Meriç'in 1965 neşri.","The narrative form of the Tezkiretü'l-Bünyân covering six works, the thirteen-part list of buildings in the Tezkiretü'l-Ebniye, and Meriç's 1965 edition."],"u":"https://islamansiklopedisi.org.tr/sai-mustafa-celebi"},{"t":["1766 İstanbul depremi kaydı (Ambraseys & Finkel 1991 ve Müller-Wiener 1977 temelli)","Record of the 1766 Istanbul earthquake (after Ambraseys & Finkel 1991 and Müller-Wiener 1977)"],"m":["22 Mayıs 1766, M≈7,1; Süleymaniye'nin hasar görmesi, Fatih Camii kubbesinin ve Mihrimah'ın ana kubbesinin çökmesi.","22 May 1766, M≈7.1; damage to the Süleymaniye, and the collapse of the domes of the Fatih and Mihrimah mosques."],"u":"https://en.wikipedia.org/wiki/1766_Istanbul_earthquake"},{"t":["Mutbul Kayılı, “Acoustic Solutions in Classic Ottoman Architecture” (FSTC)","Mutbul Kayılı, “Acoustic Solutions in Classic Ottoman Architecture” (FSTC)"],"m":["Rezonatörlerin yalnızca restorasyon sırasında fiziksel incelemeyle bulunabilmesi; Şehzade'de 144, Sultanahmet'te 75 küp sayımı.","That the resonators could only be found by physical inspection during restoration; counts of 144 jars at the Şehzade and 75 at the Sultanahmet."],"u":"https://www.muslimheritage.com/uploads/Acoustic.pdf"},{"t":["Encyclopædia Britannica, “Süleymaniye Mosque”","Encyclopædia Britannica, “Süleymaniye Mosque”"],"m":["Kubbe 53 m yükseklik ve ~27 m çap; 1660 yangını, 1766 depremi ve 1956 ile 2007–2010 restorasyonları.","Dome 53 m high and ~27 m across; the 1660 fire, the 1766 earthquake, and the restorations of 1956 and 2007–2010."],"u":"https://www.britannica.com/topic/Suleymaniye-Mosque"}],"ev":{"year":1557,"start":1550,"end":1559,"type":"direct","conf":"high","region":["İstanbul — Haliç'e bakan üçüncü tepe","Istanbul — the third hill above the Golden Horn"],"role":["Yöntemi hiç yazılmamış bir yapı bilgisinin tam ölçekli ve hâlâ ayakta duran tek kaydı.","The only record — full-scale and still standing — of a structural knowledge whose method was never written."],"shows":["Çalışan bir yapı teknolojisi, onu üreten akıl yürütme hiç kaydedilmeden beş yüzyıl boyunca bina biçiminde aktarılabilir.","A working structural technology can be transmitted for five centuries in the form of a building while the reasoning that produced it goes entirely unrecorded."],"limits":["Binanın ayakta kalması Sinan'ın yönteminin sismik üstünlüğünü kanıtlamaz: aynı 1766 depremi bu kubbenin bir bölümünü çökertmiş, Sinan'ın Edirnekapı Mihrimah kubbesini ise tamamen yıkmıştır.","The building's survival does not prove the seismic superiority of Sinan's method: the same 1766 earthquake collapsed part of this dome and brought down Sinan's Edirnekapı Mihrimah dome completely."],"source":["Süleymaniye Camii kitâbesi ve inşaat muhasebe defterleri (Ö. L. Barkan neşri, 1550–1557)","The Süleymaniye foundation inscription and the construction account books (ed. Ö. L. Barkan, 1550–1557)"],"url":"https://en.wikipedia.org/wiki/S%C3%BCleymaniye_Mosque"}},{"id":"ottoman-script","cat":"loss","civ":"ottoman","icon":"✒️","name":["Osmanlı Türkçesi ve 1928 Harf İnkılâbı","Ottoman Turkish and the 1928 Alphabet Reform"],"era":["1862–2026: alfabe tartışmasından arşiv göçüne","1862–2026: from the alphabet debate to archive migration"],"hook":["Bir kod çözücü üç ayda değiştirilebilir; bir arşiv bir yüzyılda göçürülemez. 1928’de Türkiye ikisini aynı anda denedi ve aradaki farkı miras aldı.","A decoder can be replaced in three months; an archive cannot be migrated in a century. In 1928 Turkey attempted both at once, and inherited the gap between them."],"timeline":[{"y":1862,"t":["Münif Paşa, 12 Mayıs’ta Cemiyet-i İlmiyye-i Osmâniyye’de Arap harflerinin okuma yazmayı zorlaştırdığını anlatır ve harekeli bir ıslah önerir.","On 12 May Münif Paşa tells the Ottoman Scientific Society that Arabic script impedes literacy, and proposes a vowel-marked reform."],"link":"context","src":"https://atamdergi.gov.tr/tam-metin/193/tur"},{"y":1917,"t":["Enver Paşa’nın hurûf-ı munfasıla’sı (ordu elifbası): harfler bitişmez, sesliler yazılır. Askerî yazışmada denenir, yaygınlaşmaz.","Enver Paşa’s hurûf-ı munfasıla (army alphabet): letters unjoined, vowels written. Tried in military correspondence, never generalised."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/Hur%C3%BBf-%C4%B1_munfas%C4%B1la"},{"y":1928,"t":["23 Mayıs’ta Dil Encümeni kurulur; 29 harfli Latin esaslı alfabeyi hazırlar. 1 Kasım’da 1353 sayılı kanun kabul edilir (RG 3 Kasım 1928, sayı 1030).","On 23 May the Language Commission is formed and drafts a 29-letter Latin-based alphabet. On 1 November Law no. 1353 is passed (Gazette 3 Nov 1928, no. 1030)."],"link":"decoder","src":"https://www.mevzuat.gov.tr/MevzuatMetin/1.3.1353.pdf"},{"y":1929,"t":["1 Ocak: resmî dairelerde yeni harfler zorunlu; aynı gün Millet Mektepleri açılır (talimatname 24 Kasım 1928). Eski yazılı dilekçeler 1 Haziran’a dek kabul.","1 January: new letters compulsory in state offices; the Nation’s Schools open the same day (regulation 24 Nov 1928). Old-script petitions accepted until 1 June."],"link":"maintenance","src":"https://turkmaarifansiklopedisi.org.tr/millet-mektepleri"},{"y":1931,"t":["Osmanlı evrakından 27 ton, beş vagon hâlinde Bulgaristan’a hurda kâğıt fiyatına satılır; 2 Haziran’da Bulgar elçiliğinin bildirimiyle ortaya çıkar.","Twenty-seven tons of Ottoman documents are sold to Bulgaria as scrap paper in five wagons; the Bulgarian embassy’s own notice on 2 June exposes it."],"link":"maintenance","src":"https://bnrnews.bg/tr/post/378512/1931de-osmanli-arsiv-belgelerinin-bulgaristana-hurda-kagit-fiyatina-satilmasi-ve-kurtarilmasi"},{"y":1935,"t":["20 Ekim sayımı: altı yaş üstünde okuma yazma bilmeyenler %80,75 (kadın %90,19, erkek %70,65) — yani okuryazarlık yaklaşık %19,25.","Census of 20 October: 80.75% of those aged six and over cannot read or write (women 90.19%, men 70.65%) — literacy about 19.25%."],"link":"maintenance","src":"https://dergipark.org.tr/tr/download/article-file/926457"},{"y":2014,"t":["Aralık’taki 19. Millî Eğitim Şûrası kararıyla Osmanlı Türkçesi imam hatip liselerinde zorunlu, diğer ortaöğretimde seçmeli ders olur.","The 19th National Education Council in December makes Ottoman Turkish compulsory in religious vocational high schools and elective elsewhere."],"link":"decoder","src":"https://www.voanews.com/a/ottoman-language-drive-objections-turkey/2552449.html"},{"y":2026,"t":["Yazma Eserler Kurumu envanteri 784 bini aşar; 640 bin eser kataloglu, 483.600’ü görüntülü olarak dijital ortamda erişilebilir.","The Manuscripts Institution’s inventory passes 784,000 works; 640,000 catalogued and 483,600 available digitally with images."],"link":"apparatus","src":"https://www.hurriyet.com.tr/gundem/784-bin-eserlik-dev-hazine-turkiyenin-yazma-eser-envanteri-dunyanin-en-buyukleri-arasinda-43149971"}],"links":{"packet":["Paket, Arap harfli Osmanlı Türkçesiyle üretilmiş devasa bir külliyattır. Devlet Arşivleri Başkanlığı Osmanlı Arşivi’nde yaklaşık 95 milyon belge ve 400 bin defter bulunur; 2018’de bunun yaklaşık %75’inin sayım ve dökümünün tamamlandığı TBMM’ye bildirilmiştir. Buna Yazma Eserler Kurumu envanterindeki 784 binden fazla yazma ve nadir matbu eser, Vakıflar Genel Müdürlüğü arşivindeki 8.317 defter ve iki milyonu aşkın Osmanlıca varak, şer‘iyye sicilleri, kitâbeler ve mezar taşları eklenir. Paket kaybolmadı; yerli yerinde duruyor.","The packet is an enormous corpus produced in Arabic-script Ottoman Turkish. The Ottoman Archive of the Presidency State Archives holds roughly 95 million documents and 400,000 registers; in 2018 the government told parliament that some 75% had been inventoried and listed. To this add over 784,000 manuscripts and rare printed works in the Manuscripts Institution’s inventory, 8,317 registers and more than two million Ottoman-script folios in the Directorate General of Foundations archive, plus court registers, inscriptions and gravestones. The packet was not lost; it is still there."],"decoder":["Kod çözücü, Arap alfabesinin Türkçeye uyarlanmış hâlini ve onun el yazısı üsluplarını — rık‘a, dîvânî, siyâkat, ta‘lik — okuyabilen insanlardır. 1353 sayılı kanun bu çözücüyü resmî hayatta üç ay içinde değiştirdi: kanun 1 Kasım 1928’de kabul edildi, resmî dairelerde son tarih 1 Ocak 1929, kitap basımında yine Ocak 1929, halkın eski yazılı dilekçeleri için 1 Haziran 1929 oldu. Yeni çözücü hızla ve büyük ölçüde başarıyla yayıldı. Eski çözücü ise bir kuşak içinde genel bir yetenek olmaktan çıkıp meslekî bir uzmanlığa dönüştü.","The decoder is the set of people who can read the Arabic alphabet as adapted to Turkish, and its hands — rık‘a, dîvânî, siyâkat, ta‘lik. Law no. 1353 replaced that decoder in official life within three months: passed 1 November 1928, with deadlines of 1 January 1929 for state offices, January 1929 for printed books, and 1 June 1929 for petitions still submitted in the old script. The new decoder spread quickly and largely successfully. The old one, within a generation, ceased to be a general competence and became a professional specialism."],"context":["Bağlam, yazının neden tartışıldığını ve sınırlarının nerede olduğunu anlatır. Arap alfabesi ünsüz iskeletini yazar; Türkçe ise ünlü bakımından zengin ve eklemeli bir dildir, bu yüzden aynı harf dizisi birden çok okumaya açıktır. Tartışma 1928’de doğmadı: Münif Paşa 1862’de harekeli ıslah, Mirza Fethali Ahundzade 1863’te yeni bir alfabe önermiş, Encümen-i Dâniş bunu uygulanamaz bulmuştu. Hata tarihi de vardır: Enver Paşa’nın 1917’deki hurûf-ı munfasıla denemesi savaş şartlarında tutunamamıştır. 1926 Bakü Türkoloji Kongresi’nin Latin alfabesini 101’e 7 oyla benimsemesi ise kararı bölgesel bir bağlama oturtur.","Context says why the script was argued over and where its limits lay. The Arabic alphabet writes a consonantal skeleton; Turkish is vowel-rich and agglutinative, so one letter-string admits several readings. The debate did not begin in 1928: Münif Paşa proposed vowel-marked reform in 1862 and Mirza Fethali Ahundzade a new alphabet in 1863, which the Ottoman academy judged unworkable. There is an error history too: Enver Paşa’s 1917 hurûf-ı munfasıla failed under wartime conditions. And the 1926 Baku Turcological Congress, which voted 101 to 7 for Latin script, places the decision in a regional context."],"tacit":["Osmanlıca okumak bir tablo bakışı değildir. Metin çoğu zaman noktasız, harekesiz ve yıpranmıştır; siyâkat rakamları ayrı bir sistemdir; kâtip elleri belgeden belgeye değişir; anlamı bağlam, diplomatika ve kalıp ifade bilgisi çözer. Bu beceri yıllara yayılan çıraklıkla, gerçek belgeler üzerinde kazanılır ve tam olarak yazıya dökülemez — bugünkü OCR ve el yazısı tanıma sistemlerinin matbu metinde iyi, yazma elde hâlâ zayıf kalmasının sebebi budur.","Reading Ottoman is not table lookup. Texts are often undotted, unvocalised and damaged; siyâkat numerals are a separate system; scribal hands vary from document to document; meaning is resolved by context, diplomatics and knowledge of formulae. The skill is acquired over years of apprenticeship on real documents and can never be fully written down — which is why today’s OCR and handwriting-recognition systems do well on print and remain weak on manuscript hands."],"apparatus":["Aygıt hem yazan hem okuyan makinedir. Arap harfli dizgi, bitişik yazının başta, ortada, sonda ve tek başına biçimleri yüzünden yüzlerce hurufat gerektirirken Latin dizgi otuz kadarıyla yetinir; daktilo, telgraf ve linotip Latin alfabesi için tasarlanmıştı. Bugün aygıt tarafı tersine dönmüştür: tarama, sayısal katalog ve çevrim içi erişim sistemleri Osmanlıca metni ekrana getirmektedir — Yazma Eserler Kurumu’nun dijital külliyatında 483.600 eser görüntülü biçimde açıktır.","The apparatus is the machine that writes and the machine that reads. Arabic-script typesetting requires hundreds of sorts, because cursive letters take initial, medial, final and isolated forms, where Latin typesetting needs about thirty; typewriters, telegraphy and linotype were built for the Latin alphabet. Today the apparatus side has reversed: scanning, digital catalogues and online access now put Ottoman text on screen — 483,600 works are open with images in the Manuscripts Institution’s digital corpus."],"maintenance":["Bakım, yeni çözücünün öğretilmesi ve eskisinin canlı tutulmasıdır; ikisi de kurumsallaştı. Millet Mektebi Talimatnamesi 24 Kasım 1928’de yayımlandı, mektepler 1 Ocak 1929’da açıldı ve 1928–1935 arasında 60.373 Millet Mektebi’nde 2.486.845 kişi kayıt yaptırdı, 1.358.001 kişi sınavı geçerek belge aldı. Eski çözücünün bakımı ise arşiv uzmanlığı, üniversitelerdeki Osmanlı Türkçesi dersleri, 2014 sonrası ortaöğretim programı ve çeviri yazı–dijitalleştirme programlarıyla sürüyor. Bakım halkası kopmadı; ölçeği paketin ölçeğine yetişmiyor.","Maintenance means teaching the new decoder and keeping the old one alive; both were institutionalised. The Nation’s Schools regulation was issued on 24 November 1928, the schools opened on 1 January 1929, and between 1928 and 1935 some 2,486,845 people enrolled in 60,373 of them, of whom 1,358,001 passed the examination and were certified. Maintenance of the old decoder continues through archival professional training, Ottoman Turkish courses at universities, the post-2014 secondary curriculum, and transliteration and digitisation programmes. The maintenance link did not break; its scale simply does not match the scale of the packet."]},"weakest":{"k":"decoder","why":["Kopan tek halka kod çözücüdür ve kopuş kasıtlı, yasal ve tarihlidir — bu yüzden Linear B’nin modern eşdeğeridir. Paket yerinde, aygıt her zamankinden güçlü, bakım kurumsal; ancak bir metni okuyabilen nüfusun oranı bir kanun ve bir öğretim seferberliğiyle bir kuşakta değiştirildi. 1927 sayımına göre eski yazıyı okuyabilenler zaten azdı, dolayısıyla kayıp yaygın bir yeteneğin değil, mevcut ve büyümekte olan bir yeteneğin devamlılığının kesilmesidir. Sonuç şudur: paketi çözebilecek insan sayısı, paketin büyüklüğüne göre çok küçüktür.","The one link that broke is the decoder, and it broke deliberately, by statute, on a dated day — which is what makes this the modern equivalent of Linear B. The packet is in place, the apparatus is stronger than ever, maintenance is institutional; but the share of the population able to read a given text was changed within a generation by a law and a teaching campaign. The 1927 census shows that few could read the old script to begin with, so the loss is not of a widespread ability but of the continuity of an existing and growing one. The result: the number of people who can decode the packet is very small relative to the size of the packet."]},"nearBreak":["En yakın kopuş 1928’de değil 1931’de yaşandı. Tasfiye edilen devlet dairelerinden çıkan Osmanlı evrakından 27 ton, beş vagon hâlinde Bulgaristan’daki Knyajevo kâğıt fabrikasına okkası üç kuruş on paradan satıldı; olay 2 Haziran 1931’de Bulgaristan’ın İstanbul elçiliğinin Maarif Vekâleti’ne yaptığı bildirimle ortaya çıktı. İsmail Hakkı Konyalı ve Muallim Cevdet gibi isimlerin uyarısı üzerine satış durduruldu, iki vagon iade edildi; kalan üç vagon bugün Sofya’daki Millî Kütüphane’nin Şarkiyat bölümündedir. Tehlike kanun metninde değil, elden çıkaran dairede evrakı okuyabilecek kimsenin kalmadığı o kısa aralıktaydı.","The nearest break came not in 1928 but in 1931. Twenty-seven tons of Ottoman paperwork cleared out of abolished government offices were sold in five railway wagons to a paper mill at Knyazhevo in Bulgaria at scrap rates; the affair surfaced on 2 June 1931 when Bulgaria’s Istanbul embassy notified the Ministry of Education. Warned by figures such as İsmail Hakkı Konyalı and Muallim Cevdet, the government stopped the sale and two wagons were returned; the remaining three are today in the Oriental Department of the National Library in Sofia. The danger lay not in the text of the law but in the short interval during which no one in the disposing office could read what was being disposed of."],"thesis":["1928, aktarım zincirinin altı halkasının birbirinden bağımsız hızlarda hareket ettiğinin en iyi belgelenmiş kanıtıdır. Bir kod çözücü, bir kanun ve bir öğretim seferberliğiyle üç ayda değiştirilebilir; doksan beş milyon belgelik bir arşiv ise bir yüzyılda göçürülemez. İki hızın arasındaki fark, kaybın kendisidir — ve bu fark ancak süregiden, sıkıcı, kadrolu bakım emeğiyle kapatılabilir.","1928 is the best-documented proof that the six links of the transmission chain move at independent speeds. A decoder can be replaced in three months by a statute and a teaching campaign; an archive of ninety-five million documents cannot be migrated in a century. The difference between those two speeds is the loss itself — and it can only be closed by continuous, unglamorous, salaried maintenance labour."],"sources":[{"t":["Türk Harflerinin Kabul ve Tatbiki Hakkında Kanun, no. 1353","Law on the Adoption and Application of Turkish Letters, no. 1353"],"m":["Birincil mevzuat metni: kabul 1 Kasım 1928, RG 3 Kasım 1928 sayı 1030; 3., 4., 5. ve 8. maddelerdeki 1929 son tarihleri.","Primary statute: passed 1 November 1928, Gazette 3 November 1928 no. 1030; the 1929 deadlines in articles 3, 4, 5 and 8."],"u":"https://www.mevzuat.gov.tr/MevzuatMetin/1.3.1353.pdf"},{"t":["Millet Mektepleri","Nation’s Schools"],"m":["Türk Maarif Ansiklopedisi maddesi: 24 Kasım 1928 talimatnamesi, 1 Ocak 1929 açılışı, yaş sınırları ve kurs–diploma sayıları.","Turkish Encyclopaedia of Education: the 24 November 1928 regulation, the 1 January 1929 opening, age limits, and course and diploma counts."],"u":"https://turkmaarifansiklopedisi.org.tr/millet-mektepleri"},{"t":["1927 sayımı aslında neyi ölçtü?","What did the 1927 census actually measure?"],"m":["Tartışmalı okuryazarlık rakamının ayrıntılı çözümlemesi: 7 yaş üstü %10,58 (erkek %17,42, kadın %4,63); tüm nüfusta ~%8,6; ölçüm eski yazı üzerinden.","A detailed analysis of the contested literacy figure: 10.58% of those aged 7+ (men 17.42%, women 4.63%); about 8.6% of the whole population; measured in the old script."],"u":"https://daktilo1984.com/daktilo2/osmanlida-okuryazarlik-bolum-3-1927-sayimi-aslinda-neyi-olctu/"},{"t":["Osmanlı Arşivi’nin hacmi ve tasnif durumu","Volume and cataloguing status of the Ottoman Archive"],"m":["Cumhurbaşkanı Yardımcısı Fuat Oktay’ın 31 Ekim 2018 tarihli TBMM soru önergesi cevabı: ~95 milyon belge, 400 bin defter, ~%75 tasnifli.","Vice-President Fuat Oktay’s answer to a parliamentary question, 31 October 2018: c. 95 million documents, 400,000 registers, c. 75% catalogued."],"u":"https://www.sabah.com.tr/gundem/2018/10/31/osmanli-arsivinde-95-milyon-belge-var"},{"t":["1931’de Bulgaristan’a satılan Osmanlı evrakı","The Ottoman documents sold to Bulgaria in 1931"],"m":["27 ton belgenin beş vagonla satışı, 2 Haziran 1931’deki bildirim, iki vagonun iadesi ve kalanların Sofya Millî Kütüphanesi’ndeki âkıbeti.","The sale of 27 tons in five wagons, the notification of 2 June 1931, the return of two wagons, and the fate of the rest in the Sofia National Library."],"u":"https://bnrnews.bg/tr/post/378512/1931de-osmanli-arsiv-belgelerinin-bulgaristana-hurda-kagit-fiyatina-satilmasi-ve-kurtarilmasi"}],"ev":{"year":1928,"start":1928,"end":1929,"type":"direct","conf":"high","region":["Türkiye Cumhuriyeti — Ankara, Resmî Gazete","Republic of Turkey — Ankara, Official Gazette"],"role":["Bir kod çözücünün kanunla ve tarihli son günlerle değiştirilmesinin birincil kaydı","Primary record of a decoder replaced by statute with dated deadlines"],"shows":["1353 sayılı kanun ve 1 Ocak 1929 son tarihi, ulusal ölçekli bir okuma standardının üç ay içinde değiştirilebildiğini tarihli ve resmî bir belgeyle kanıtlar.","Law no. 1353 and the deadline of 1 January 1929 prove, in a dated official document, that a national-scale reading standard can be replaced within three months."],"limits":["Bu belge harf inkılâbının bilgiyi yok ettiğini göstermez — arşivler yerinde, tasnifli ve uzman kadroyla açıktır — inkılâbın kaçınılmaz ya da kaçınılabilir olduğunu da göstermez; gösterdiği tek şey, bir kod çözücünün bir arşivin göçürülebileceğinden çok daha hızlı değiştirilebildiğidir.","The document does not show that the reform destroyed knowledge — the archives survive, catalogued, open and professionally staffed — nor does it show that the reform was avoidable or unavoidable; what it shows is that a decoder can be replaced far faster than an archive can be migrated."],"source":["T.C. Cumhurbaşkanlığı Mevzuat Bilgi Sistemi, Kanun no. 1353","Legislation Information System of the Presidency of Türkiye, Law no. 1353"],"url":"https://www.mevzuat.gov.tr/MevzuatMetin/1.3.1353.pdf"}},{"id":"ottoman-vakif","cat":"threshold","civ":"ottoman","icon":"🕌","name":["Vakıf Sistemi ve Süleymaniye Vakfiyesi","The Waqf System and the Süleymaniye Endowment Deed"],"era":["1540–2007: bakımı hukuk metnine yazmak","1540–2007: writing maintenance into a legal instrument"],"hook":["Osmanlılar bakımın kendiliğinden süreceğine güvenmediler; onu noterlenmiş bir hukuk metnine yazdılar — kim, hangi iş için, günde kaç akçe, hangi gelirden.","The Ottomans did not trust upkeep to look after itself; they wrote it into a notarised legal instrument — who, for what duty, at how many akçe a day, out of which revenue."],"timeline":[{"y":1540,"t":["Yalnız Anadolu’da 342 cami, 1055 mescid, 110 medrese, 626 zâviye ve hankah, 45 imaret, 154 muallimhâne vakıf eliyle işletilmektedir.","In Anatolia alone 342 mosques, 1,055 prayer halls, 110 colleges, 626 lodges, 45 soup kitchens and 154 schools are run by endowments."],"link":"apparatus","src":"https://islamansiklopedisi.org.tr/vakif"},{"y":1557,"t":["Süleymaniye vakfiyesi düzenlenir (7 Receb 964 / 6 Mayıs 1557): cami, dört medrese, dârülhadis, tıp medresesi, dârüşşifâ, imaret, tabhâne, sıbyan mektebi.","The Süleymaniye deed is drawn up (7 Receb 964 / 6 May 1557): mosque, four colleges, hadith school, medical college, hospital, soup kitchen, hospice, primary school."],"link":"packet","src":"https://ikf.marmara.edu.tr/dosya/ikf/iib-dergi/2022-2/VAZ%C4%B0FE%20YOKLAMA%20DEFTER%C4%B0NE%20G%C3%96RE%20S%C3%9CLEYMAN%C4%B0YE%20VAKFI%20%C3%87ALI%C5%9EANLARI.pdf"},{"y":1702,"t":["1113 tarihli vazife yoklama defteri, vakfiyeden 145 yıl sonra maaşların hâlâ ödendiğini gösterir: mütevelliye günde 100, en alt kadroya 1–2 akçe.","A 1113/1702 duty roll shows salaries still being paid 145 years after the deed: 100 akçe a day to the trustee, 1–2 to the lowest posts."],"link":"maintenance","src":"https://ikf.marmara.edu.tr/dosya/ikf/iib-dergi/2022-2/VAZ%C4%B0FE%20YOKLAMA%20DEFTER%C4%B0NE%20G%C3%96RE%20S%C3%9CLEYMAN%C4%B0YE%20VAKFI%20%C3%87ALI%C5%9EANLARI.pdf"},{"y":1826,"t":["II. Mahmud, 12 Rebîülevvel 1242 (14 Ekim 1826) tarihinde Evkâf-ı Hümâyun Nezâreti’ni kurar; Yeniçeri Ocağı’nın kaldırılmasıyla boşalan vakıflar da devralınır.","Mahmud II founds the Imperial Waqfs Ministry on 12 Rebîülevvel 1242 (14 October 1826); waqfs left ownerless by the abolition of the Janissaries pass to it."],"link":"maintenance","src":"https://islamansiklopedisi.org.tr/evkaf-i-humayun-nezareti"},{"y":1838,"t":["1586’da kurulan Evkâf-ı Haremeyn Nezâreti de Evkâf-ı Hümâyun’a bağlanır; sekiz istisna dışında bütün vakıflar tek merkezde toplanır.","The Haremeyn Waqfs Ministry, founded in 1586, is merged into the Imperial Waqfs Ministry; save eight exceptions, all waqfs come under one centre."],"link":"decoder","src":"https://islamansiklopedisi.org.tr/evkaf-i-humayun-nezareti"},{"y":1924,"t":["3 Mart’ta Şer‘iyye ve Evkaf Vekâleti kaldırılır; vakıflar Başvekâlete bağlı bir umum müdürlüğe devredilir.","On 3 March the Ministry of Religious Affairs and Waqfs is abolished; waqfs pass to a directorate general under the Prime Ministry."],"link":"maintenance","src":"https://www.vgm.gov.tr/kurumsal/tarihce/kurumumuzun-tarihcesi"},{"y":1935,"t":["5 Haziran’da kabul edilen 2762 sayılı Vakıflar Kanunu (RG 13 Haziran 1935, sayı 3027) mütevellisi kalmayan vakıfları “mazbut” sayarak devlete devreder.","Law no. 2762 of 5 June (Gazette 13 June 1935, no. 3027) declares waqfs without a functioning trustee “mazbut” and transfers them to the state."],"link":"maintenance","src":"https://www.lexpera.com.tr/mevzuat/kanunlar/vakiflar-kanunu-2762-1"},{"y":2007,"t":["Vakıflar Genel Müdürlüğü 19.656 tescilli taşınmaz kültür varlığını yönetir — Türkiye’deki anıt eserlerin ~%82’si; 2003–2007’de 2.613’ü onarılır.","The Directorate General administers 19,656 registered immovable cultural properties — c. 82% of Turkey’s monuments; 2,613 restored in 2003–2007."],"link":"apparatus","src":"https://erdem.gov.tr/tam-metin/182/tur"}],"links":{"packet":["Paket, vakfiyedir: kadı huzurunda tescil edilmiş, bağlayıcı, ayrıntılı bir bakım şartnamesi. Vakfiye hangi mülkün (akar) hangi hizmeti (hayrat) fonlayacağını, kaç görevli çalışacağını, her birinin günlük ücretini ve gelirin nasıl paylaştırılacağını yazar. Süleymaniye vakfiyesi 6 Mayıs 1557’de düzenlenmiştir ve yalnız caminin kadrosunu 277 kişi olarak tespit eder; hatibe günde 30, imamlara 10, müezzine 5 akçe tayin eder. Vakıflar Genel Müdürlüğü arşivinde Selçuklu, Beylikler ve Osmanlı dönemlerinden 27 binden fazla vakfiye ve zeyl korunmaktadır.","The packet is the vakfiye: a binding, itemised maintenance specification registered before a judge. It states which property (akar) funds which service (hayrat), how many staff are employed, what each is paid per day, and how revenue is apportioned. The Süleymaniye deed was drawn up on 6 May 1557 and fixes the mosque’s establishment alone at 277 people, assigning the preacher 30 akçe a day, the imams 10 and the muezzin 5. The Directorate General’s archive preserves more than 27,000 deeds and supplements from the Seljuk, principality and Ottoman periods."],"decoder":["Çözücü, vakfiyeyi okuyup uygulatabilen makamlardır: şartları denetleyen kadı ve şer‘î mahkeme, günlük idareyi yürüten mütevelli, hesabı tutan kâtipler ve muhasebe defterleri. Osmanlı hukuku bu okumayı çok sert bir kuralla bağlar — “şart-ı vâkıf nass-ı şâri‘ gibidir”: vâkıfın koyduğu şart, kanun koyucunun metni gibi bağlayıcıdır. Bugünkü çözücü, aynı defterleri okuyan Vakıf Kayıtlar Arşivi uzmanlarıdır; arşivde 8.317 defter ve iki milyonu aşkın Osmanlıca varak bulunur.","The decoder is the set of offices that could read the deed and enforce it: the judge and religious court that policed the conditions, the trustee who ran daily operations, the scribes and the account books. Ottoman law bound that reading with an unusually hard rule — “the founder’s condition is like the lawgiver’s text”: a stipulation in the deed binds as statute does. Today’s decoder is the specialist staff of the Waqf Registry Archive, who read the same registers; it holds 8,317 registers and over two million Ottoman-script folios."],"context":["Bağlam, mekanizmanın neden çalıştığını ve nerede çuvalladığını açıklar. Vakıf, gelir getiren mülkü (dükkân, han, hamam, değirmen, çiftlik, su hakkı) hayrî hizmete kalıcı olarak bağlar; te’bîd, yani süreklilik şartı, mülkün satılmasını, bağışlanmasını ve mirasla bölünmesini engeller. Zaafı da tam buradadır: ücretler akçe cinsinden sabit yazılmıştır, dolayısıyla tağşiş ve enflasyon vakfın ödeme gücünü sessizce eritir; mütevelli suistimali ve merkezin gelire el koyması ise ikinci arıza kaynağıdır. 1826 merkezîleşmesinin gerekçesi zaten dağınıklık ve yolsuzluk olarak gösterilmiştir.","Context explains why the mechanism worked and where it failed. A waqf permanently ties income-producing property — shops, inns, baths, mills, farms, water rights — to a charitable service; the condition of perpetuity blocks sale, gift and division by inheritance. Its weakness lies exactly there: wages are written as fixed sums in akçe, so debasement and inflation quietly erode the endowment’s purchasing power; trustee abuse and central appropriation of revenue are the second failure mode. The stated grounds for the 1826 centralisation were precisely disorder and corruption."],"tacit":["Vakfiye ne bir duvarın nasıl örüleceğini ne de bir su yolunun nasıl temizleneceğini yazar; yalnız o işi yapacak kişiyi ve ücretini yazar. Asıl beceri sahada durur: taşçı ve kurşuncu ustaları, suyolcu, kandilci, imaret aşçısı, hattat ve mücellit. Mimar Sinan’ın yaptığı on dört imaret külliyesinde toplam 2.529 kişinin çalıştığı tespit edilmiştir. Bu el bilgisi ustadan çırağa, aynı yapı üzerinde aktarılır; kadro fonsuz kaldığında yalnız maaş değil, o yapının bakım geleneği de kesilir.","The deed never says how to lay a wall or clean a water channel; it says only who does the work and what they are paid. The real skill sits on site: masons and lead-workers, water-channel keepers, lamplighters, kitchen cooks, calligraphers and binders. Fourteen soup-kitchen complexes built by Mimar Sinan have been shown to employ 2,529 people in total. That hand knowledge passes from master to apprentice on the building itself; when the establishment loses its funding, what stops is not only the wage but the tradition of caring for that particular structure."],"apparatus":["Aygıt, geliri üreten mülk yığınıdır — bakımın motoru. Fatih imaretine 4.250 dükkân, üç iş hanı, dört hamam, yedi köşk, dokuz bahçe ve 1.130 ev bağlanmıştı. Bu akar olmadan vakfiyenin hükmü kâğıt üstünde kalır. Aygıtın erozyonu ölçülebilir: 1926–1972 arasında 3.900 vakıf hayratı satılmış, 1920–1970 arasında binlerce gelir getiren taşınmaz programlı biçimde elden çıkarılmıştır.","The apparatus is the stock of revenue-producing property — the engine of upkeep. The Fatih soup kitchen was endowed with 4,250 shops, three commercial inns, four baths, seven pavilions, nine gardens and 1,130 houses. Without that income base the deed’s provisions remain paper. The erosion of the apparatus is measurable: between 1926 and 1972, 3,900 charitable waqf properties were sold, and between 1920 and 1970 thousands of income-producing properties were disposed of as a matter of programme."],"maintenance":["Bu, çalışmadaki en saf bakım vakasıdır, çünkü kurum yalnızca bakım için tasarlanmıştır ve mekanizma gerçekten yüzyıllarca iş görmüştür: Süleymaniye’nin 1702 tarihli vazife yoklama defteri, vakfiyeden 145 yıl sonra kadroların hâlâ ücret aldığını gösterir. Ama süreklilik bedavaya gelmedi — merkezîleşme (1826), bakanlığın kaldırılması (1924) ve 2762 sayılı kanunla devirler (1935) birbirini izledi. Bugün bakım devletleşmiş hâlde sürüyor: Vakıflar Genel Müdürlüğü 2007’de 19.656 tescilli taşınmazı yönetiyor, bütçesinin %40–47’sini onarıma ayırıyordu; oysa 1924–1950 arasında bu pay %10’un altındaydı.","This is the purest maintenance case in the study, because the institution was designed for nothing else and the mechanism genuinely worked for centuries: Süleymaniye’s duty roll of 1702 shows posts still drawing their wages 145 years after the deed. But continuity was not free — centralisation (1826), abolition of the ministry (1924) and transfers under Law 2762 (1935) followed one another. Today maintenance continues in state hands: in 2007 the Directorate General administered 19,656 registered properties and was spending 40–47% of its budget on restoration, where between 1924 and 1950 that share had been under 10%."]},"weakest":{"k":"apparatus","why":["Vakfiye (paket) hayatta kaldı, arşiv ve uzman kadro (çözücü) hayatta kaldı, hukukî doktrin (bağlam) hayatta kaldı — çöken, geliri üreten mülk temeliydi. Sabit akçe ücretleri tağşiş karşısında eridi, 19. yüzyılda gelirler merkeze aktarıldı ve Cumhuriyet döneminde 1926–1972 arasında 3.900 hayrat satıldı. Şartname okunabilir durumdaydı ama onu finanse edecek akar elden çıkmıştı; bakım halkası bu yüzden kendi başına değil, aygıt halkası çekildiği için zayıfladı.","The deed (packet) survived, the archive and its trained staff (decoder) survived, the legal doctrine (context) survived — what collapsed was the income-producing property base. Fixed akçe wages dissolved against debasement, revenues were pulled to the centre in the nineteenth century, and in the Republic 3,900 charitable properties were sold between 1926 and 1972. The specification remained readable, but the estate that was to fund it had been sold; maintenance weakened not on its own account but because the apparatus link was pulled out from under it."]},"nearBreak":["Sistem iki kez kopma noktasına geldi. Birincisi 1826–1838 merkezîleşmesidir: Evkâf-ı Hümâyun Nezâreti beş yıl içinde 632 vakfı devraldı ve 1838’de Haremeyn vakıflarını da bağladı; bu, dağınık yolsuzluğu durdurdu ama vakıf gelirini hazine mantığına açtı. İkincisi Cumhuriyet devrindeki mülk tasfiyesidir: 1926–1972 arasında 3.900 vakıf hayratı satılmış, onarım payı 1924–1950 arasında bütçenin %10’unun altına düşmüştür. Zincir kopmadı, çünkü vakfiyeler ve defterler saklandı ve 1980’lerden sonra onarım payı yeniden yükseldi — ancak arada kalan kuşakta bakım, hukuk metninin öngördüğü şeyden çok daha azıydı.","The system twice came close to breaking. First, the centralisation of 1826–1838: the Imperial Waqfs Ministry absorbed 632 endowments within five years and annexed the Haremeyn waqfs in 1838, which halted scattered corruption but exposed waqf revenue to treasury logic. Second, the Republican-era liquidation of property: 3,900 charitable waqf properties were sold between 1926 and 1972, and the restoration share of the budget fell below 10% between 1924 and 1950. The chain did not break, because the deeds and registers were kept and the restoration share rose again after the 1980s — but for the generation in between, upkeep fell far short of what the legal instrument had specified."],"thesis":["Vakıf, bakımın bir erdem değil bir bütçe kalemi olduğunu kabul eden nadir kurumlardan biridir: kim, ne yapacak, hangi gelirden, ne kadar alacak — hepsi baştan yazılır. Süleymaniye’nin 1557 vakfiyesinin 1702’de hâlâ maaş ödetiyor olması, yazılı bir bakım şartnamesinin gerçekten yüzyıllar taşıyabildiğini kanıtlar. Ama aynı örnek sınırı da gösterir: şartname geliri üretmez, yalnız onu tahsis eder. Akar gittiğinde metin okunur hâlde kalır ve bakım durur.","The waqf is one of the rare institutions that treats maintenance as a budget line rather than a virtue: who does what, out of which revenue, for how much — all written in advance. That Süleymaniye’s deed of 1557 was still paying wages in 1702 proves a written maintenance specification really can carry across centuries. But the same case shows the limit: a specification does not generate revenue, it only allocates it. When the estate goes, the text stays readable and the upkeep stops."],"sources":[{"t":["Vakıflar Genel Müdürlüğü — Kurumumuzun Tarihçesi","Directorate General of Foundations — Institutional History"],"m":["Resmî kurum tarihçesi: 1826 Evkâf-ı Hümâyun Nezâreti, 1924 devri, 1935 tarihli 2762 sayılı kanun ve sonraki yapılanmalar.","Official institutional history: the 1826 Imperial Waqfs Ministry, the 1924 transfer, Law 2762 of 1935 and later reorganisations."],"u":"https://www.vgm.gov.tr/kurumsal/tarihce/kurumumuzun-tarihcesi"},{"t":["Vakıf Kayıtlar Arşivi","The Waqf Registry Archive"],"m":["Arşivin resmî tanıtımı: 8.317 defter, iki milyonu aşkın Osmanlıca varak, 39 fon; koleksiyonun 1936’da Ankara’ya nakli.","The archive’s official description: 8,317 registers, over two million Ottoman-script folios, 39 collections; the 1936 transfer to Ankara."],"u":"https://www.vgm.gov.tr/kurumsal/vakif-kayitlar-arsivi/vakif-kayitlar-arsivi"},{"t":["Vazife Yoklama Defterine Göre Süleymaniye Vakfı Çalışanları","The Süleymaniye Waqf’s Employees according to the Duty Roll"],"m":["Marmara Üniversitesi hakemli makalesi: vakfiyenin 7 Receb 964 / 6 Mayıs 1557 tarihi, kadro dökümü ve 1113/1702 tarihli defterdeki ücretler.","Peer-reviewed article, Marmara University: the deed’s date of 7 Receb 964 / 6 May 1557, the establishment list, and the wages in the 1113/1702 roll."],"u":"https://ikf.marmara.edu.tr/dosya/ikf/iib-dergi/2022-2/VAZ%C4%B0FE%20YOKLAMA%20DEFTER%C4%B0NE%20G%C3%96RE%20S%C3%9CLEYMAN%C4%B0YE%20VAKFI%20%C3%87ALI%C5%9EANLARI.pdf"},{"t":["Evkāf-ı Hümâyun Nezâreti","The Imperial Waqfs Ministry"],"m":["TDV İslâm Ansiklopedisi maddesi: 12 Rebîülevvel 1242 (14 Ekim 1826) kuruluşu, 1828–1830’da 632 vakfın devri, 1838 Haremeyn birleşmesi.","TDV Encyclopaedia of Islam: the foundation on 12 Rebîülevvel 1242 (14 October 1826), the transfer of 632 waqfs in 1828–1830, the 1838 Haremeyn merger."],"u":"https://islamansiklopedisi.org.tr/evkaf-i-humayun-nezareti"},{"t":["Vakıflar Genel Müdürlüğü ve Vakıf Kültür Varlıklarının Korunması","The Directorate General and the Conservation of Waqf Cultural Property"],"m":["Erdem dergisindeki makale: 19.656 tescilli taşınmaz, 2003–2007’de 2.613 onarım, dönemlere göre bütçe payları ve 1926–1972 arasında satılan 3.900 hayrat.","Article in Erdem: 19,656 registered properties, 2,613 restorations in 2003–2007, budget shares by period, and the 3,900 charitable properties sold between 1926 and 1972."],"u":"https://erdem.gov.tr/tam-metin/182/tur"}],"ev":{"year":1557,"start":1557,"end":1702,"type":"direct","conf":"high","region":["İstanbul — Süleymaniye Külliyesi","Istanbul — the Süleymaniye complex"],"role":["Yazılı bakım şartnamesi ve onun yüz kırk beş yıl sonraki uygulama kaydı","A written maintenance specification and the record of its enforcement 145 years later"],"shows":["6 Mayıs 1557 tarihli vakfiye ile 1113/1702 tarihli vazife yoklama defterinin birlikte okunması, yazılı bir bakım şartnamesinin kadroları ve ücretleri bir buçuk asır boyunca fiilen ayakta tutabildiğini gösterir.","Read together, the deed of 6 May 1557 and the duty roll of 1113/1702 show that a written maintenance specification actually sustained posts and wages for a century and a half."],"limits":["Bu iki belge vakıf sisteminin bir bütün olarak başarılı olduğunu göstermez — Süleymaniye imparatorluğun en zengin ve en görünür vakıflarından biridir, dolayısıyla küçük ve taşra vakıflarının kaderi hakkında temsilî değildir — ayrıca ücretlerin akçe cinsinden sabitliğinin tağşiş karşısında ne kadar değer yitirdiğini de tek başına ölçmez.","The two documents do not show that the waqf system succeeded as a whole — Süleymaniye was among the empire’s richest and most visible endowments, so it is not representative of small or provincial waqfs — nor do they by themselves measure how much the akçe-denominated wages lost to debasement."],"source":["Marmara Üniversitesi İktisadi ve İdari Bilimler Dergisi (2022)","Marmara University Journal of Economics and Administrative Sciences (2022)"],"url":"https://ikf.marmara.edu.tr/dosya/ikf/iib-dergi/2022-2/VAZ%C4%B0FE%20YOKLAMA%20DEFTER%C4%B0NE%20G%C3%96RE%20S%C3%9CLEYMAN%C4%B0YE%20VAKFI%20%C3%87ALI%C5%9EANLARI.pdf"}},{"id":"ottoman-print","cat":"threshold","civ":"ottoman","icon":"🖨️","name":["İbrahim Müteferrika Matbaası, 1729","The Müteferrika Press, 1729"],"era":["1493–1757: hazır teknoloji, geciken eşik","1493–1757: available technology, a delayed threshold"],"hook":["Matbaa İstanbul’da 1493’ten beri çalışıyordu. Eksik olan makine değildi: Arap harfleriyle basma izni, o işi yapacak kadro ve matbaayı kurucusundan sonra da ayakta tutacak yinelenen emekti.","Printing had been running in Istanbul since 1493. What was missing was not the machine: it was permission to print in Arabic script, the staff to do it, and the recurring labour to keep a press alive after its founder."],"timeline":[{"y":1493,"t":["David ve Samuel ibn Nahmias kardeşler İstanbul’da Jacob ben Asher’in Arba‘ah Turim’ini basar (13 Aralık 1493): imparatorlukta basılan ilk kitap.","David and Samuel ibn Nahmias print Jacob ben Asher’s Arba‘ah Turim in Istanbul on 13 December 1493: the first book printed in the empire."],"link":"packet","src":"https://www.historyofinformation.com/detail.php?id=342"},{"y":1553,"t":["Pierre Belon, İstanbul’daki Yahudi matbaacıların “Türkçe ve Arapça basmadıklarını, çünkü buna izin verilmediğini” kaydeder: sınırlama harfe dairdir.","Pierre Belon records that Istanbul’s Jewish printers “do not print in Turkish or Arabic, because it is not permitted to them”: the restriction is about the script."],"link":"context","src":"https://www.ageofinvention.xyz/p/age-of-invention-did-the-ottomans"},{"y":1567,"t":["İstanbul’da ilk Ermeni matbaası kurulur; 1627’de Nikodemos Metaxas’ın Rum matbaası açılır, misyonerlik kaygısıyla ertesi yıl kapatılır.","The first Armenian press opens in Istanbul; in 1627 Nikodemos Metaxas’s Greek press follows, closed the next year over missionary concerns."],"link":"apparatus","src":"https://www.dailysabah.com/feature/2015/06/08/myths-and-reality-about-the-printing-press-in-the-ottoman-empire"},{"y":1727,"t":["Temmuz 1727: III. Ahmed’in fermanı ve Şeyhülislâm Yenişehirli Abdullah Efendi’nin fetvasıyla izin verilir — tefsir, hadis, fıkıh ve kelâm basılmamak şartıyla.","July 1727: Ahmed III’s decree and the fetva of Şeyhülislâm Yenişehirli Abdullah Efendi permit printing — excluding exegesis, hadith, law and theology."],"link":"context","src":"https://islamansiklopedisi.org.tr/muteferrika-matbaasi"},{"y":1729,"t":["Matbaanın ilk eseri basılır: Vankulu Mehmed Efendi’nin Terceme-i Sıhâh-ı Cevherî’si, iki cilt, yaklaşık 1.000 nüsha.","The press issues its first work: Vankulu Mehmed Efendi’s Terceme-i Sıhâh-ı Cevherî, in two volumes, about 1,000 copies."],"link":"packet","src":"https://islamansiklopedisi.org.tr/ibrahim-muteferrika"},{"y":1742,"t":["Müteferrika’nın son kitabı çıkar. Matbaada toplam on yedi eser, yirmi üç cilt basılmıştır; ilk kitaplar 1.000–1.200 adet basılırken sonrakilerde tiraj 500’e inmiştir.","Müteferrika’s last book appears. The press printed seventeen works in twenty-three volumes in all; the first books were run at 1,000–1,200 copies, later ones at 500."],"link":"maintenance","src":"https://islamansiklopedisi.org.tr/ibrahim-muteferrika"},{"y":1747,"t":["Müteferrika ölür (kimi kaynakta 1745). Matbaa halefleri elinde kalır; yeni eser çıkmaz.","Müteferrika dies (1745 in some sources). The press passes to successors; no new titles appear."],"link":"tacit","src":"https://islamansiklopedisi.org.tr/muteferrika-matbaasi"},{"y":1757,"t":["Halefleri yalnız Vankulu Lügati’nin ikinci baskısını yapar, ardından matbaa büsbütün durur — kuruluşundan yirmi sekiz yıl sonra.","The successors produce only a second edition of the Vankulu dictionary, after which the press stops altogether — twenty-eight years after its founding."],"link":"maintenance","src":"https://islamansiklopedisi.org.tr/muteferrika-matbaasi"}],"links":{"packet":["Paket iki katmanlıdır: bir yanda basma teknolojisinin kendisi — pres, hurufat, mürekkep, dizgi bilgisi — öte yanda basılan kitaplar. Teknoloji İstanbul’da 1493’ten beri fiilen mevcuttu; Nahmias kardeşler o yılın 13 Aralık’ında Arba‘ah Turim’i basmıştı. Müteferrika matbaasının ürünü ise 1729–1742 arasında on yedi eser, yirmi üç cilttir: ilk kitap Vankulu Lügati, ardından tarih, coğrafya, dil, askerlik ve mıknatıs üzerine eserler ve basılı haritalar.","The packet has two layers: the printing technology itself — press, type, ink, the knowledge of composition — and the books it produced. The technology had been physically present in Istanbul since 1493, when the Nahmias brothers printed the Arba‘ah Turim on 13 December of that year. The Müteferrika press’s own output was seventeen works in twenty-three volumes between 1729 and 1742: the Vankulu dictionary first, then works on history, geography, language, military affairs and magnetism, plus printed maps."],"decoder":["Çözücü burada iki ayrı topluluktur ve bu ayrım vakanın bütün açıklamasıdır. Basma tekniğini kullanabilenler İstanbul’da vardı — Yahudi (1493’ten), Ermeni (1567’den) ve Rum (1627) matbaacılar. Arap harfli Türkçe metni basacak ve satın alacak topluluk ise ayrıydı: devlet kalemleri, medrese ve okur kitlesi. Teknolojiyi bilenlerle onu Arap harfleriyle kullanmasına izin verilenler aynı insanlar değildi; Pierre Belon 1553’te İstanbul’daki Yahudi matbaacıların Türkçe ve Arapça basmalarına izin verilmediğini kaydeder.","The decoder here is two distinct communities, and that distinction is the whole explanation of the case. People who could operate the technology existed in Istanbul — Jewish printers from 1493, Armenian from 1567, Greek in 1627. The community that would print and buy Arabic-script Turkish was a different one: the state chanceries, the colleges, the reading public. Those who knew the technology and those permitted to use it in Arabic script were not the same people; Pierre Belon recorded in 1553 that Istanbul’s Jewish printers were not permitted to print in Turkish or Arabic."],"context":["“Osmanlılar matbaayı yasakladı” cümlesi yanlış kurulmuş bir iddiadır ve bu çalışma tam da böyle iddiaları düzeltmek için vardır. II. Bayezid’in 1485 ve I. Selim’in 1515 tarihli sözde yasakları André Thevet’ye dayanır ve Osmanlı kayıtlarında karşılığı yoktur. Fiilen görülen şey bir yasak değil, harfe bağlı bir sınırlamadır: gayrimüslim cemaatler kendi harfleriyle serbestçe basmış, Arap harfiyle basmamıştır. 1727 izni de bunu doğrular — izin verilmiş, ancak dinî ilimler (tefsir, hadis, fıkıh, kelâm) kapsam dışında bırakılmıştır. III. Murad’ın 1587 fermanı ise Avrupa’da basılmış Arapça, Farsça ve Türkçe kitapların satışına izin vermektedir.","The sentence “the Ottomans banned printing” is a badly formed claim, and this study exists precisely to correct claims of that kind. The alleged bans of Bayezid II in 1485 and Selim I in 1515 rest on André Thevet and have no counterpart in Ottoman records. What is actually visible is not a ban but a script-bound restriction: non-Muslim communities printed freely in their own alphabets and not in Arabic script. The 1727 permission confirms this — it was granted, but the religious sciences (exegesis, hadith, jurisprudence, theology) were placed outside its scope. And a decree of Murad III in 1587 permitted the sale of Arabic, Persian and Turkish books printed in Europe."],"tacit":["El becerisi burada iki yönde çalışır. Bir yanda dizgi zanaatı: Arap yazısının bitişikliği, harflerin baş–orta–son–münferit biçimleri ve bağlamaları yüzünden Latin dizgisinin otuz kadar hurufatına karşılık yüzlerce dökümü gerektirir; naskh hattını punch ve matris hâline getirmek başlı başına bir ustalıktır. Öte yanda müstensih ekonomisi: mevcut talebi karşılayan, hızlı ve ucuz bir el kopyalama ağı zaten işliyordu. Müteferrika’nın kendisi bu iki beceriyi tek kişide toplamıştı ve öldüğünde onunla birlikte gitti.","Hand skill works in two directions here. On one side the craft of composition: Arabic script’s cursive joins and its initial, medial, final and isolated forms demand hundreds of sorts against Latin’s thirty or so, and cutting punches and striking matrices for a naskh hand is a mastery in itself. On the other, the copyist economy: a fast, cheap manuscript-copying network already met existing demand. Müteferrika combined both competences in one person, and when he died they went with him."],"apparatus":["Aygıt tarafı gerçekten kuruldu: pres, İstanbul’da dökülen hurufat, mürekkep, kâğıt tedariki ve harita basımı için gravür. Ölçek de belgelidir — ilk kitaplarda 1.000–1.200 nüshalık tirajlar, sonradan satışın zayıflığı yüzünden 500’e indirilmiştir; matbaanın toplam üretimi yaklaşık 10.000–11.000 cilt olarak hesaplanır. Yani aygıt çalıştı ve ürün verdi; sorun onu besleyen ekonomideydi.","The apparatus was genuinely built: press, type cast in Istanbul, ink, a paper supply and engraving for the maps. Its scale is documented too — the first books ran to 1,000–1,200 copies, later cut to 500 because sales were weak; total output is reckoned at roughly 10,000–11,000 volumes. The apparatus, in other words, worked and produced; the problem lay in the economy that fed it."],"maintenance":["Zincirin kopan yeri budur. Müteferrika matbaası bir kurum değil, bir kişinin girişimiydi: ne sürekli bir kadro, ne çırak yetiştiren bir düzen, ne de vakıf benzeri bir gelir bağı vardı. Basılan 10.000–11.000 cildin ancak ~%70’i satılabildi ve tiraj 1.200’den 500’e düştü. 1742’den sonra yeni eser çıkmadı; halefleri 1757’de yalnız Vankulu Lügati’nin ikinci baskısını yaptı ve matbaa durdu. Osmanlı’da sürekli basımın yerleşmesi için Mühendishâne ve Matbaa-i Âmire gibi devlet kurumlarının işi üstlenmesi gerekecekti.","This is where the chain broke. The Müteferrika press was one man’s undertaking, not an institution: no standing staff, no system for training apprentices, no endowment-like tie to a revenue stream. Only about 70% of the 10,000–11,000 volumes printed could be sold, and print runs fell from 1,200 to 500. No new title appeared after 1742; the successors managed only a second edition of the Vankulu dictionary in 1757, and then it stopped. Continuous printing in the Ottoman lands would have to wait until state institutions such as the Engineering School and the Imperial Press took the work over."]},"weakest":{"k":"maintenance","why":["Paket, çözücü, bağlam ve aygıt yerli yerindeydi: teknoloji 1493’ten beri şehirdeydi, izin 1727’de alınmıştı, kitaplar basıldı ve satıldı. Eksik olan tek şey işi kurucusundan sonra sürdürecek yinelenen emekti — maaşlı kadro, çırak yetiştirme ve düzenli gelir. Vakıf sistemi tam bu işlevi başka alanlarda yüzyıllarca yerine getirmiş, matbaaya ise uygulanmamıştı. Matbaa on üç yıl çalışıp yirmi sekiz yılda tamamen sustu; eşik aşıldı ama tutunamadı.","Packet, decoder, context and apparatus were all in place: the technology had been in the city since 1493, permission came in 1727, books were printed and sold. The one thing missing was the recurring labour to continue the work after its founder — salaried staff, apprenticeship, steady revenue. The waqf system had performed exactly this function for centuries in other fields, and was never applied to the press. The press ran for thirteen years and fell silent within twenty-eight; the threshold was crossed but not held."]},"nearBreak":["Bu vakanın öğreticiliği, kopuşun “yasak” diye anlatılan yerde değil, hiç bakılmayan yerde olmasıdır. Hattatlar loncasının matbaayı engellediği anlatısı — divitlerini tabuta koyup Bâbıâli’ye yürüdükleri hikâyesi dâhil — Osmanlı kaynaklarında belgelenmemiştir; iddia 17. yüzyıl Avrupa seyahatnamelerinde ortaya çıkar, sayı bir avuç kâtipten doksan bine kadar şişer ve Marsigli’nin anlatımı bunun yabancılara verilen bir gerekçe olduğunu düşündürür. TDV İslâm Ansiklopedisi ise hattat direncinden hiç söz etmeyip tam tersine, sonraki yıllarda “doğru düzgün yazı yazacak hattat kalmadığını” kaydeder. Karar tarihçilerce hâlâ tartışmalıdır ve bu çalışma onu tartışmalı olarak bırakır.","What makes this case instructive is that the break happened not where the story locates it — in a “ban” — but where nobody was looking. The narrative that the calligraphers’ guild blocked the press, including the tale of inkwells carried in coffins to the Sublime Porte, is undocumented in Ottoman sources; the claim surfaces in seventeenth-century European travel accounts, the numbers inflate from a handful of scribes to ninety thousand, and Marsigli’s version suggests it was a reason given to foreigners. The TDV Encyclopaedia of Islam, for its part, mentions no calligraphic resistance at all and records the opposite — that in later years “there were no longer calligraphers who could write properly.” The question remains contested among historians, and this study leaves it contested."],"thesis":["Bir teknolojinin varlığı onun benimseneceği anlamına gelmez ve benimsenmemesi bir yasakla açıklanmak zorunda değildir. Matbaa İstanbul’da 236 yıl boyunca çalıştı; Arap harfli baskının önündeki engel bir dinî yasak değil, harfe bağlı bir izin rejimi, farklı bir zanaat ekonomisi ve her şeyden çok kurumsal bakımın yokluğuydu. Müteferrika eşiği aştı; onu aşık tutacak yinelenen emek örgütlenmediği için matbaa yirmi sekiz yılda sustu.","That a technology exists does not mean it will be adopted, and non-adoption does not have to be explained by a ban. Printing operated in Istanbul for 236 years; the obstacle to Arabic-script printing was not a religious prohibition but a script-bound permission regime, a different craft economy, and above all the absence of institutional maintenance. Müteferrika crossed the threshold; because no recurring labour was organised to hold it open, the press fell silent within twenty-eight years."],"sources":[{"t":["Müteferrika Matbaası","The Müteferrika Press"],"m":["TDV İslâm Ansiklopedisi maddesi: Temmuz 1727 izni, dinî kitapların kapsam dışı bırakılması, 1729–1742 arası eser sayısı, tirajlar ve 1757’de duruş.","TDV Encyclopaedia of Islam: the July 1727 permission, the exclusion of religious books, the titles printed 1729–1742, print runs, and the halt in 1757."],"u":"https://islamansiklopedisi.org.tr/muteferrika-matbaasi"},{"t":["İbrâhim Müteferrika","İbrâhim Müteferrika"],"m":["TDV İslâm Ansiklopedisi maddesi: III. Ahmed’in fermanı, Vankulu Lügati’nin 1729 başındaki basımı, on yedi kitap–yirmi üç cilt ve 1.000–1.200’den 500’e düşen tirajlar.","TDV Encyclopaedia of Islam: Ahmed III’s decree, the printing of the Vankulu dictionary in early 1729, seventeen works in twenty-three volumes, and runs falling from 1,000–1,200 to 500."],"u":"https://islamansiklopedisi.org.tr/ibrahim-muteferrika"},{"t":["Did the Ottomans Ban Print?","Did the Ottomans Ban Print?"],"m":["Anton Howes’un kaynak eleştirisi: 1485/1515 yasaklarının André Thevet’ye dayanması, sınırlamanın harfe bağlılığı ve hattat loncası anlatısının belgesizliği.","Anton Howes’s source criticism: the 1485/1515 bans resting on André Thevet, the script-bound nature of the restriction, and the undocumented status of the scribes’-guild story."],"u":"https://www.ageofinvention.xyz/p/age-of-invention-did-the-ottomans"},{"t":["İmparatorlukta basılan ilk kitap","The first book printed in the empire"],"m":["Arba‘ah Turim’in David ve Samuel ibn Nahmias tarafından 4 Tevet 5254 / 13 Aralık 1493’te İstanbul’da tamamlandığının kaydı.","The record that the Arba‘ah Turim was completed by David and Samuel ibn Nahmias in Constantinople on 4 Tevet 5254 / 13 December 1493."],"u":"https://www.historyofinformation.com/detail.php?id=342"},{"t":["İbrahim Müteferrika ve ilk matbaa","İbrahim Müteferrika and the first press"],"m":["Türkçe gazetecilik incelemesi: dinî kitap basmama şartı ve ulemâ ile hattatların engellediği iddiasına dair “somut bir kanıt” bulunmadığı tespiti.","A Turkish journalistic study: the condition against printing religious books, and the finding that there is “no concrete evidence” for the claim that scholars and calligraphers obstructed the press."],"u":"https://journo.com.tr/ibrahim-muteferrika-ilk-matbaa"}],"ev":{"year":1729,"start":1727,"end":1742,"type":"direct","conf":"high","region":["İstanbul — Dârü’t-tıbâati’l-âmire","Istanbul — the Dârü’t-tıbâati’l-âmire"],"role":["Eşiğin aşıldığını kanıtlayan tarihli, fiziksel ve sayılabilir çıktı","Dated, physical, countable output proving the threshold was crossed"],"shows":["1729’da basılan Vankulu Lügati ve onu izleyen on altı eser, Arap harfli Türkçe baskının teknik ve hukukî olarak mümkün olduğunu, sorunun teknolojinin yokluğu olmadığını doğrudan kanıtlar.","The Vankulu dictionary of 1729 and the sixteen works that followed prove directly that Arabic-script Turkish printing was technically and legally possible, and that the problem was not the absence of the technology."],"limits":["Bu çıktı, matbaanın neden 1729’dan önce kurulmadığını açıklamaz ve “yasak vardı” ya da “hattatlar engelledi” iddialarından hiçbirini kanıtlama
