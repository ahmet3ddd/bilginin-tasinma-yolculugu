<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f3; --ink:#17191d; --muted:#696f79;
  --line:#dfe2e7; --blue:#315cf4; --blue-soft:#e8edff; --amber:#cc8d22; --rose:#bc5c70;
  --green:#26856f; --violet:#6d4fc4; --focus:#1d4ed8; --shadow:0 12px 32px -18px #0f172a40;
}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#181b20; --surface-2:#21252b; --ink:#f2f4f7; --muted:#a3a9b3;
  --line:#30353d; --blue:#7f9bff; --blue-soft:#202b54; --amber:#e4aa4c; --rose:#dc8296;
  --green:#62bba4; --violet:#a68cf0; --focus:#a8bcff; --shadow:0 12px 32px -18px #000000a0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body.menu-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button,a,summary,select,input{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
h1,h2,h3{text-wrap:balance}
.skip{position:fixed;left:16px;top:-60px;z-index:100;padding:10px 14px;border:0;background:var(--ink);color:var(--bg);border-radius:8px;text-decoration:none;font:inherit}
.skip:focus{top:12px}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- shell ---------- */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:64px;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand>span:last-child{display:grid;line-height:1.2;min-width:0}
.brand b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{margin-top:4px;color:var(--muted);font-size:11px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-mark{width:28px;height:28px;flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;align-items:end;padding:5px;border-radius:8px;background:var(--ink)}
.brand-mark i{display:block;border-radius:2px 2px 0 0;background:var(--bg)}
.brand-mark i:nth-child(1){height:35%}.brand-mark i:nth-child(2){height:80%;background:var(--blue)}.brand-mark i:nth-child(3){height:55%;background:var(--amber)}
.actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.icon,.share,.lang{min-width:44px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:background .15s,border-color .15s}
.icon:hover,.share:hover,.lang:hover{background:var(--surface-2)}
.share,.lang{padding:0 13px;font-size:13px;font-weight:600}
.lang{font-variant-numeric:tabular-nums;letter-spacing:.03em}
.icon{width:44px;font-size:18px}
.mobile-menu{display:none}
.tabbar{height:46px;position:sticky;top:64px;z-index:35;display:flex;align-items:stretch;gap:24px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar a,.tabbar button{position:relative;display:flex;align-items:center;padding:0;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;transition:color .15s}
.tabbar a:hover,.tabbar button:hover{color:var(--ink)}
.tabbar a[aria-current="page"],.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"]::after,.tabbar button[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue)}
main{flex:1;min-height:calc(100vh - 158px)}

/* ---------- layout ---------- */
/* The shell is full-bleed so the context panel lines up with the header brand.
   The working column keeps its own measure and centres inside the remaining space. */
.view-grid,.reading-shell{display:grid;grid-template-columns:330px minmax(0,1fr);width:100%;margin:0}
.context-panel{min-height:calc(100vh - 110px);position:sticky;top:110px;align-self:start;padding:30px 22px 50px 28px;border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 110px)}
.context-panel h2{margin:5px 0 22px;font-size:20px;line-height:1.25;font-weight:600}
.context-panel>a,.context-panel>button{width:100%;display:block;padding:10px 11px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:var(--muted);text-align:left;font-size:13px;text-decoration:none;transition:background .15s,color .15s}
.context-panel>a:hover,.context-panel>button:hover,.context-panel>button.active{background:var(--surface-2);color:var(--ink)}
.eyebrow,.index{display:block;color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
/* No width cap here: the charts are the point of this column and they read better wide.
   Only the text blocks below keep a measure. */
.workspace{min-width:0;padding:34px clamp(20px,3vw,46px) 64px}
.workspace-head{display:flex;flex-direction:column;margin-bottom:22px}
.workspace-head h1,.reading h1,.sources h1{margin:9px 0 8px;font-size:clamp(30px,3vw,40px);line-height:1.12;letter-spacing:-.035em;font-weight:600}
.workspace-head p,.lead{max-width:720px;margin:0;color:var(--muted);font-size:16px}
.status{display:inline-block;color:var(--muted);font-size:12px}
.status b{color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-size:11px}

/* ---------- controls ---------- */
.range{display:block;margin:18px 0}
.range-top{display:flex;align-items:center;gap:5px}
.range-top label{min-width:0;font-size:12.5px;font-weight:600;line-height:1.35;cursor:pointer;overflow-wrap:anywhere}
.range output{flex:0 0 auto;margin-left:auto;padding-left:4px;color:var(--ink);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qm{position:relative;flex:0 0 auto;width:16px;height:16px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);font-size:10px;font-weight:700;line-height:1;transition:all .15s}
/* 16px reads better beside a 12.5px label, but the tap target stays 28px. */
.qm::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%)}
.qm:hover{border-color:var(--blue);color:var(--blue)}
.qm[aria-expanded="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
.range-help{margin-top:9px;padding:12px 13px;border-left:2px solid var(--blue);border-radius:0 9px 9px 0;background:var(--surface-2);color:var(--muted);font-size:11.5px;line-height:1.6}
.range-help b{color:var(--ink);font-weight:600}
.range-help[hidden]{display:none}
.chart-card .range-top{max-width:430px}
.range input{width:100%;accent-color:var(--blue);margin:6px 0 0}
.range small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.45}
details>summary{cursor:pointer;font-weight:600}
.context-panel details{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.context-panel details summary{font-size:13px}
.field{display:grid;gap:7px;margin:18px 0;font-size:13px;font-weight:600}
.field select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px}
.check{display:flex;align-items:center;gap:9px;margin:18px 0;font-size:13px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--blue);flex:0 0 auto}
.panel-note{padding:12px;background:var(--surface-2);border-radius:9px;color:var(--muted);font-size:11px;line-height:1.5}
.mobile-controls{display:none}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:11.5px;font-weight:600;transition:all .15s}
.chip:hover{border-color:var(--blue);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--ink)}
.chip.dirty{background:none;border-style:dashed;border-color:var(--blue);color:var(--ink)}
.chip.dirty::after{content:"·";margin-left:5px;color:var(--blue);font-weight:700}
.preset-revert{display:block;width:100%;margin:-2px 0 12px;padding:0;border:0;background:none;color:var(--blue);font-size:11.5px;font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:2px}
.preset-revert:hover{color:var(--focus)}
.preset-revert[hidden]{display:none}
.chip.danger:hover{border-color:var(--rose);color:var(--rose)}
.panel-actions{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.freeze-hint{display:flex;align-items:flex-start;gap:8px;margin:0 0 4px}
.freeze-hint .key{flex:0 0 auto;margin-top:5px}
.index-note{margin:0 0 10px;padding:9px 11px;border-left:2px solid var(--violet);border-radius:0 8px 8px 0;background:var(--surface-2);color:var(--muted);font-size:11px;line-height:1.55}
.frozen-list{display:grid;gap:6px;margin:10px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.frozen-row{display:flex;align-items:center;gap:8px;min-width:0}
.frozen-row span{flex:1;min-width:0;font-size:12px;overflow-wrap:anywhere}
.frozen-row.off span{color:var(--muted);text-decoration:line-through}
.eye{flex:0 0 auto;width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);transition:all .15s}
.eye:hover{border-color:var(--violet)}
.eye[aria-pressed="false"]{opacity:.4}
.rm{flex:0 0 auto;width:22px;height:22px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);font-size:15px;line-height:1}
.rm:hover{background:var(--surface-2);color:var(--rose)}
.legend-toggle{border:0;padding:0;background:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:11px;color:var(--muted);cursor:pointer}
.legend-toggle:hover{color:var(--ink)}
.legend-toggle.off{opacity:.45;text-decoration:line-through}
.plot.rebuilt.pending{stroke-width:5;filter:drop-shadow(0 0 3px var(--green))}

/* ---------- metrics + charts ---------- */
.metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px;max-width:1400px}
.metric{min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.metric span,.metric small{display:block;color:var(--muted);font-size:11px}
.metric strong{display:block;margin:4px 0;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chart-card{min-width:0;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{flex:0 0 auto}
.key{display:inline-block;width:18px;height:2px;background:var(--blue)}
.key.c,.key.hc{background:var(--amber)}
.key.r{height:0;border-top:2px dashed var(--green);background:none}
.key.hr{height:0;border-top:2px dashed var(--violet);background:none}
.key.hp{background:var(--blue)}
.key.band{height:9px;background:color-mix(in srgb,var(--violet) 18%,transparent)}
.key.ghost,.key.g1,.key.g2,.key.g3{background:var(--violet);opacity:.7}
.key.g2{background:repeating-linear-gradient(90deg,var(--violet) 0 4px,transparent 4px 8px)}
.key.g3{background:repeating-linear-gradient(90deg,var(--violet) 0 9px,transparent 9px 14px)}
.key.archive{background:var(--blue)}
.key.context{background:var(--amber)}
.key.rebuilt{height:0;border-top:2px dashed var(--green);background:none}
.hover-dot{fill:var(--surface);stroke-width:2}
.k-archive,.k-hp{stroke:var(--blue)}
.k-context,.k-hc{stroke:var(--amber)}
.k-rebuilt{stroke:var(--green)}
.k-hr{stroke:var(--violet)}
.empty-note{padding:14px 16px;margin:12px 0 0;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12.5px;text-align:center}
.key.dot{width:9px;height:9px;border-radius:50%;background:var(--amber)}
.key.dia{width:9px;height:9px;background:var(--rose);transform:rotate(45deg)}
.chart-tools{display:flex;gap:6px}
.chart-tools button{min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:11px;font-weight:600}
.chart-tools button:hover{color:var(--ink);border-color:var(--blue)}
.chart-wrap{position:relative;min-width:0;width:100%}
.chart{display:block;max-width:100%;height:auto;color:var(--ink);touch-action:pan-y}
.grid{stroke:var(--line);stroke-width:1}
.axis-line{stroke:var(--muted);stroke-width:1}
.axis,.lane{fill:var(--muted);font-size:11px}
.lane{font-weight:600}
.plot{fill:none;stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.plot.archive{stroke:var(--blue)}
.plot.context{stroke:var(--amber)}
.plot.rebuilt{stroke:var(--green);stroke-dasharray:8 5;stroke-width:3}
.plot.hp{stroke:var(--blue)}
.plot.hc{stroke:var(--amber)}
.plot.hr{stroke:var(--violet);stroke-dasharray:8 5;stroke-width:3}
.plot.ghost{stroke:var(--violet);stroke-width:1.8;opacity:.5}
.plot.ghost.g2{stroke-dasharray:4 4}
.plot.ghost.g3{stroke-dasharray:9 5}
.guide{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 5;opacity:.5}
.scenario-band{fill:var(--violet);opacity:.13}
.whisker{stroke:var(--muted);stroke-width:1.5;opacity:.8}
.direct{fill:var(--rose)}
.proxy{fill:var(--amber)}
.direct.medium,.proxy.medium{fill-opacity:.35;stroke:var(--ink);stroke-width:1.2}
.event-active{fill:none;stroke:var(--blue);stroke-width:2}
.event{cursor:pointer}
.event:focus-visible{outline:none}
.event:focus-visible .hit{stroke:var(--focus);stroke-width:2;fill:none}
.hit{fill:transparent}
.hover-dot{fill:var(--surface);stroke-width:2}
.tip{position:absolute;z-index:20;pointer-events:none;min-width:150px;max-width:250px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:11.5px;line-height:1.5;opacity:0;transform:translate(-50%,-115%);transition:opacity .12s}
.tip[data-show="1"]{opacity:1}
.tip b{display:block;margin-bottom:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tip u{display:flex;justify-content:space-between;gap:14px;text-decoration:none;font-variant-numeric:tabular-nums}
.tip u i{font-style:normal;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tip em{font-style:normal;font-weight:600}
.persistent{max-width:1000px;margin-top:14px;padding:13px 15px;border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);color:var(--muted);font-size:12px}
.persistent b{color:var(--ink)}
.persistent h3{margin:0 0 8px;font-size:14px;color:var(--ink)}
.persistent.civ-note{max-width:none;font-size:12.5px;line-height:1.65}
.ev-tension{margin:14px 0;padding:10px 12px;border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent);font-size:12px;line-height:1.6}
.ev-tension .eyebrow{display:block;margin-bottom:5px}
.ev-tension p{margin:0;color:var(--muted)}
.civ-badge{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.reading-details{margin-top:18px;padding:16px 0;border-top:1px solid var(--line)}
.reading-details summary{font-size:14px}
.reading-details p{max-width:74ch;color:var(--muted)}
.data-table{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.data-table summary{font-size:12.5px;color:var(--muted)}
.data-table .scroll{max-height:290px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
caption{padding:10px 12px;color:var(--muted);font-size:11px;text-align:left}
th,td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--surface-2);font-size:11px;font-weight:700;z-index:1}
tbody tr:last-child td{border-bottom:0}

/* ---------- history ---------- */
.history-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,390px);gap:14px;align-items:start}
.evidence-detail{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);position:sticky;top:124px}
.evidence-detail h2{margin:7px 0 6px;font-size:20px;line-height:1.25;font-weight:600}
.event-meta{color:var(--muted);font-size:11px;margin:0}
.evidence-detail dl{margin:18px 0}
.evidence-detail dl div{margin:14px 0}
.evidence-detail dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.evidence-detail dd{margin:4px 0;color:var(--muted);font-size:13px}
.text-link{display:inline-block;color:var(--blue);font-size:13px;font-weight:600;text-decoration:none}
.text-link:hover{text-decoration:underline}
.nav-pair{display:flex;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.nav-pair button{flex:1;min-height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600}
.nav-pair button:hover:not(:disabled){color:var(--ink);border-color:var(--blue)}
.nav-pair button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- overview ---------- */
.overview{max-width:1280px;margin:0 auto;padding:0 32px 72px}
.hero{min-height:430px;display:flex;flex-direction:column;justify-content:center;padding:64px 0;border-bottom:1px solid var(--line)}
.hero h1{max-width:880px;margin:12px 0 18px;font-size:clamp(42px,6vw,78px);line-height:.99;letter-spacing:-.055em;font-weight:600}
.hero>p{max-width:710px;margin:0;color:var(--muted);font-size:18px;line-height:1.6}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.primary,.secondary{min-height:46px;padding:0 18px;border-radius:10px;font-size:13px;font-weight:700}
.primary{border:1px solid var(--blue);background:var(--blue);color:#fff}
.primary:hover{filter:brightness(1.08)}
.secondary{border:1px solid var(--line);background:var(--surface)}
.secondary:hover{border-color:var(--blue)}
.overview-section{padding:64px 0;border-bottom:1px solid var(--line)}
.overview-section>h2{max-width:700px;margin:10px 0 30px;font-size:clamp(28px,4vw,46px);line-height:1.1;letter-spacing:-.035em;font-weight:600}
.chain{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.chain div{min-height:150px;padding:18px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.chain div:last-child{border-right:0}
.chain b{display:block;color:var(--blue);font-size:11px}
.chain span{display:block;margin-top:auto;max-width:150px;font-size:14px;font-weight:600}
.chain em{display:block;margin-top:6px;color:var(--muted);font-size:11.5px;font-style:normal;font-weight:400;line-height:1.45}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12%}
.split h2{margin:8px 0 20px;font-size:32px;letter-spacing:-.03em}
.split ul{padding:0;list-style:none;margin:0}
.split li{padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.conclusion{padding:72px 0}
.conclusion>span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.conclusion blockquote{max-width:1000px;margin:16px 0;font-size:clamp(26px,4vw,48px);line-height:1.22;letter-spacing:-.035em;font-weight:500}
.origin{max-width:760px;padding:18px 0;border-top:1px solid var(--line)}
.origin ol{color:var(--muted)}

/* ---------- reading ---------- */
.reading,.sources{max-width:900px;padding:48px clamp(24px,5vw,72px) 80px;min-width:0}
.reading section{padding:42px 0 18px;border-bottom:1px solid var(--line);scroll-margin-top:130px}
.reading section:last-child{border-bottom:0}
.reading h2,.sources h2{margin:0 0 14px;font-size:26px;line-height:1.25;letter-spacing:-.025em}
.reading h3{font-size:17px;margin:0 0 8px}
.reading p,.reading li{max-width:74ch;color:var(--muted)}
.definitions{margin:0}
.definitions div{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:14px 0;border-bottom:1px solid var(--line)}
.definitions dt{font-weight:700}
.definitions dd{margin:0;color:var(--muted)}
.formula{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.formula code{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.comparison>div{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.comparison ul{padding-left:18px;margin:0}
.changes div{display:grid;grid-template-columns:56px 1fr 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.changes b{color:var(--blue)}
.changes span{color:var(--muted)}
.changes em{font-style:normal;font-weight:600}

/* ---------- loss cases ---------- */
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.case{display:flex;flex-direction:column;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.case>.tag{align-self:flex-start}
.case h3{margin:8px 0 4px;font-size:17px;line-height:1.3;font-weight:600}
.case>p.event-meta{margin-bottom:14px}
.case dl{margin:0 0 16px;flex:1}
.case dl div{padding:9px 0;border-top:1px solid var(--line)}
.case dt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.case dd{margin:3px 0 0;font-size:12.5px;line-height:1.5}
.case dd.dim{color:var(--muted)}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.tag.carrier{background:color-mix(in srgb,var(--rose) 16%,transparent);color:var(--rose)}
.tag.decoder{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.tag.tacit{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.tag.apparatus{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.tag.maintenance{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.tag.secrecy{background:var(--surface-2);color:var(--muted)}
.myth{padding:16px 18px;border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:0 12px 12px 0;background:var(--surface);margin:10px 0}
.myth summary{font-size:14px;color:var(--ink)}
.myth summary::marker{color:var(--rose)}
.myth p{margin:12px 0 0;max-width:80ch;color:var(--muted);font-size:13.5px}
.myth .false{display:block;margin-bottom:8px;color:var(--rose);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.stat{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat strong{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--blue)}
.stat span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}
.loss-types{display:grid;gap:0;margin:20px 0;border-top:1px solid var(--line)}
.loss-types>div{display:grid;grid-template-columns:170px 1fr 190px;gap:20px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.loss-types p{margin:0;font-size:13.5px}
.loss-types cite{font-style:normal;color:var(--muted);font-size:12px}

/* ---------- chain maps ---------- */
.lk{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lk-packet{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.lk-decoder{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.lk-context{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.lk-tacit{background:color-mix(in srgb,var(--rose) 16%,transparent);color:var(--rose)}
.lk-apparatus{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.lk-maintenance{background:var(--surface-2);color:var(--muted)}
.lk-btn{border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:9px 14px;font-size:12px;transition:all .15s}
.lk-btn:hover{transform:translateY(-1px);border-color:currentColor}
.held{color:var(--green);font-weight:700}
.broke{color:var(--rose);font-weight:700}
.ch-card{text-align:left;border:1px solid var(--line);cursor:pointer;transition:border-color .15s,transform .15s;font:inherit;color:inherit}
.ch-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.ch-ic{font-size:26px;line-height:1}
.ch-hook{flex:1;margin:10px 0;color:var(--muted);font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ch-game h3{margin:0 0 14px;font-size:16px}
.ch-chips{display:flex;flex-wrap:wrap;gap:8px}
.ch-reveal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.ch-verdict{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-yours{display:inline-flex;align-items:center;gap:6px;padding-left:12px;margin-left:4px;border-left:1px solid var(--line);color:var(--muted);font-size:12px}
.lk-faded{opacity:.55}
.ch-retry{flex:0 0 auto;font-size:11.5px}
.ch-retry:hover{border-color:var(--blue);color:var(--ink)}
.ok-txt{color:var(--green)}
.no-txt{color:var(--rose)}
.ch-links{margin:10px 0 0}
.ch-links div{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.ch-links dt .lk{margin-top:2px}
.ch-links dd{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.ch-links div.weak{background:color-mix(in srgb,var(--amber) 7%,transparent);border-radius:8px;padding:11px 10px;border-top-color:transparent}
.ch-links div.weak dd{color:var(--ink)}
.ch-tl{margin-top:26px}
.ch-tl h2,.ch-thesis h2{margin:0 0 14px;font-size:22px;letter-spacing:-.02em}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:112px 1fr;gap:16px;padding:0 0 22px 22px}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--blue)}
.tl-y{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.5}
.tl li p{margin:0 0 6px;max-width:74ch;color:var(--muted);font-size:13.5px;line-height:1.6}
.tl-src{color:var(--blue);font-size:11px;text-decoration:none;font-weight:600}
.tl-src:hover{text-decoration:underline}
.ch-thesis{max-width:860px;margin-top:26px}
.ch-thesis p{color:var(--muted)}
.ch-lessons{margin-top:52px;padding-top:34px;border-top:1px solid var(--line)}
.ch-lessons h2{margin:0 0 10px;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em}
.ch-lessons>p{max-width:720px;color:var(--muted)}

/* ---------- comparison matrix ---------- */
.cmp{margin-top:44px;padding-top:32px;border-top:1px solid var(--line)}
.cmp h2{margin:0 0 10px;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em}
.cmp>p{max-width:800px;color:var(--muted)}
.cmp-legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin:18px 0 12px;color:var(--muted);font-size:11.5px}
.cmp-legend span{display:inline-flex;align-items:center;gap:7px}
.mm{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;flex:0 0 auto;border-radius:50%;font-size:10px;font-weight:800;line-height:1}
.mm-full{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.mm-partial{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.mm-none{background:color-mix(in srgb,var(--rose) 18%,transparent);color:var(--rose)}
.cell-on{display:inline-block;width:15px;height:15px;border-radius:5px;background:var(--blue)}
.cell-on.lk-packet{background:var(--blue)}.cell-on.lk-decoder{background:var(--green)}
.cell-on.lk-context{background:var(--amber)}.cell-on.lk-tacit{background:var(--rose)}
.cell-on.lk-apparatus{background:var(--violet)}.cell-on.lk-maintenance{background:var(--muted)}
.cell-off{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--line)}
.cmp-scroll{max-height:none;margin-top:0}
.cmp-tbl{font-size:12px}
.cmp-tbl thead th{padding:9px 8px;text-align:center;vertical-align:bottom;font-size:10.5px;line-height:1.35;white-space:normal;min-width:74px}
.cmp-tbl thead th:first-child{text-align:left;min-width:180px}
.cmp-tbl td{text-align:center;padding:7px 8px}
.cmp-tbl tbody th{padding:0;background:var(--surface);position:sticky;left:0;z-index:1}
.cmp-name{width:100%;padding:7px 12px 7px 0;border:0;background:none;color:inherit;font:inherit;font-size:12.5px;text-align:left;cursor:pointer;white-space:nowrap}
.cmp-name:hover{color:var(--blue)}
.cmp-verdict{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cmp-verdict h3{margin:0 0 8px;font-size:18px}
.cmp-verdict>p{max-width:80ch;color:var(--muted);font-size:13.5px}
.cmp-verdict .stat-row{margin:16px 0}
.st-full strong{color:var(--green)}.st-partial strong{color:var(--amber)}.st-none strong{color:var(--rose)}

/* ---------- model bridge + case lens ---------- */
.mc-bridge{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.mc-bridge>span{margin-top:3px}
.mc-bridge p{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.6}
.mc-lens{margin-bottom:14px;padding:20px;border:1px solid var(--blue);border-left-width:3px;border-radius:0 14px 14px 0;background:color-mix(in srgb,var(--blue) 5%,var(--surface))}
.mc-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mc-lens h3{margin:8px 0 10px;font-size:20px}
.mc-intro{margin:0 0 14px;max-width:80ch;color:var(--muted);font-size:12.5px;line-height:1.6}
.mc-facts{display:flex;flex-wrap:wrap;gap:10px 34px;margin:0 0 14px}
.mc-facts dt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mc-facts dd{margin:5px 0 0;display:flex;align-items:center;gap:7px;font-size:13px}
.mc-lens>p{max-width:80ch;color:var(--muted);font-size:13px;line-height:1.6}
.mc-do{margin:10px 0 14px;padding:10px 12px;border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:12.5px}
.mc-rule{margin:14px 0}
.mc-tbl{width:auto;min-width:340px;margin-top:8px;font-size:12px}
.mc-tbl td{text-align:left;padding:6px 14px 6px 0;border-bottom:1px solid var(--line);white-space:normal}
.mc-tbl td:nth-child(2){font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc-tbl tr.mc-low td{color:var(--rose)}
.mc-tbl tr.mc-low td:first-child{font-weight:700}
.mc-tacit{margin:10px 0 0;max-width:80ch;color:var(--muted);font-size:12.5px;line-height:1.6}
.ch-pregame{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pr-name{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px}
.pr-group{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pr-group h3{margin:0 0 6px}
.pr-q{padding:13px 0;border-top:1px solid var(--line)}
.pr-q:first-of-type{border-top:0}
.pr-q>p{margin:0 0 9px;max-width:78ch;font-size:13.5px}
.pr-opts{display:flex;flex-wrap:wrap;gap:7px}
.pr-strong.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--ink)}
.pr-weak.on{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--ink)}
.pr-unknown.on{border-color:var(--muted);background:var(--surface-2);color:var(--ink)}
.pr-how{margin-top:9px}
.pr-how summary{font-size:12px;color:var(--muted);font-weight:600}
.pr-how p{margin:8px 0 0;max-width:78ch;color:var(--muted);font-size:12.5px}
.pr-result{margin-top:18px}
.unk-txt{color:var(--muted)}
.mc-target{border-radius:10px;outline:2px solid var(--blue);outline-offset:6px}

/* ---------- sources ---------- */
.source-group{margin-top:38px}
.source-list{border-top:1px solid var(--line)}
.source-list a{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.source-list a:hover b{color:var(--blue)}
.source-list b,.source-list small{display:block}
.source-list b{font-size:14px}
.source-list small{margin-top:3px;color:var(--muted);font-size:12px}
.source-list i{font-style:normal;color:var(--muted);flex:0 0 auto}

/* ---------- drawer + dialog ---------- */
.backdrop{position:fixed;inset:0;z-index:70;border:0;background:#0008;backdrop-filter:blur(2px)}
.drawer{position:fixed;left:0;top:0;bottom:0;z-index:80;width:min(360px,90vw);padding:20px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.drawer>div{display:flex;align-items:center;justify-content:space-between}
.drawer nav{display:grid;margin-top:28px}
.drawer nav a,.drawer nav button{display:block;width:100%;padding:13px 10px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;text-decoration:none}
.drawer nav a[aria-current="page"],.drawer nav button[aria-current="page"]{color:var(--blue);font-weight:700}
.drawer p{margin-top:30px;color:var(--muted);font-size:12px}
.sheet{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:#0008;backdrop-filter:blur(2px)}
.sheet>div{width:min(420px,100%);max-height:85vh;overflow:auto;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.sheet h2{margin:6px 0 18px;font-size:20px}
.keys{display:grid;gap:0;margin:0}
.keys div{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.keys div:last-child{border-bottom:0}
.keys dt{color:var(--muted);font-size:13px}
.keys dd{margin:0;flex:0 0 auto}
kbd{display:inline-block;min-width:24px;padding:3px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;z-index:95;transform:translateX(-50%) translateY(14px);padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast[data-show="1"]{opacity:1;transform:translateX(-50%) translateY(0)}
footer{min-height:48px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;padding:14px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
footer a{color:var(--muted)}
footer a:hover{color:var(--blue)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .loss-types>div{grid-template-columns:150px 1fr;gap:6px 18px}
  .loss-types cite{grid-column:2}
}
@media (max-width:1020px){
  .context-panel{padding-left:20px;padding-right:16px}
  .history-layout{grid-template-columns:1fr}
  .evidence-detail{position:static;margin-top:0}
  .split{gap:8%}
}
@media (max-width:760px){
  .topbar{height:56px;padding:0 12px;gap:8px}
  .brand small{display:none}
  .tabbar{display:none}
  .mobile-menu{display:inline-flex}
  .icon[data-act="help"]{display:none}
  .brand b{font-size:14px}
  .view-grid,.reading-shell{display:block}
  .desktop-panel{display:none}
  .mobile-controls{display:block;margin-bottom:18px}
  .mobile-controls details{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .mobile-controls details[open] summary{margin-bottom:18px}
  .workspace{padding:24px 14px 48px}
  .workspace-head h1,.reading h1,.sources h1{font-size:30px}
  .metric-row{grid-template-columns:1fr}
  .metric{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:center}

  mlPersistent: ["<b>Kalıcı ayrım:</b> Kapasite nedeniyle seçilmeyen bilgi, bağlamını kaybetmiş bilgi değildir. Katkının artması <i>seçilen</i> payı seyreltir (%100 → %18) ama bağlam oranını <i>yükseltir</i> (0,01 → 0,22) — ikisini de “Brüt yeni katkı” kaydırıcısında, 40. nesilde sınayabilirsiniz. İki farklı açık, iki farklı çare.", "<b>A distinction that holds:</b> knowledge left unselected because of capacity is not the same as knowledge that has lost its context. Rising input dilutes the <i>selected</i> share (100% → 18%) while <i>raising</i> the context ratio (0.01 → 0.22) — check both on the “Gross new input” slider, at generation 40. Two different shortfalls, two different remedies."],
  mlOddSummary: ["İlk grafikteki tuhaf davranış neden oluştu?", "Why did the first chart behave so strangely?"],
  mlOddBody: ["İlk sürüm, yeni katkıyı tam bağlamlı kabul ediyor ve açığı mutlak alanla gösteriyordu. Katkı azalınca toplam arşiv ve renkli alan birlikte küçülüyor, kalite artmış gibi hissediliyordu. Bu sürüm oranı, stoku ve seçilen paketi ayrı tutar.", "The first version treated all new input as fully contextualised and displayed the shortfall as an absolute area. When input fell, the total archive and the shaded area shrank together, which felt like a gain in quality. This version keeps the ratio, the stock and the selected packet separate."],

  hLead: ["Tarihsel kayıtları, onlardan ayrı tutulan açık varsayım modeliyle inceleyin.", "Examine the historical record alongside an explicit assumption model that is deliberately kept separate from it."],
  hChartTitle: ["100.000 yıllık aktarım senaryosu", "A 100,000-year transmission scenario"],
  hChartDesc: ["Üç model endeksi ve ayrı kanıt şeritleri. Çizgiler ölçüm değildir.", "Three model indices plus separate evidence lanes. The lines are not measurements."],
  hLegendP: ["Paketleme endeksi P", "Packaging index P"],

  hLegendR: ["Üretilebilirlik endeksi R", "Reproducibility index R"],
  hIndexNote: ["Bu üç eğri 0–100 ölçeğinde <b>endekstir</b> ve Model Laboratuvarı'nın birimleriyle karşılaştırılamaz. İki araç ayrı sorular sorar ve varsayılan ayarlarda ters yönlerde hareket eder; ayrım Yöntem bölümünde açıklanır.", "These three curves are <b>indices</b> on a 0–100 scale and are not comparable with the units in the Model Lab. The two instruments ask different questions and, under the default settings, move in opposite directions; the distinction is set out in the Method section."],
  hLegendBand: ["Senaryo aralığı", "Scenario range"],
  hLaneDirect: ["Tarihlenmiş maddi kayıt", "Dated material record"],
  hLaneProxy: ["Dolaylı gösterge", "Indirect indicator"],
  hLaneCriterion: ["<b>Ölçüt:</b> Bir kayıt, iddia edilen olgunun kendisi tarihlenmiş fiziksel ya da belgesel bir iz bıraktıysa <b>maddi kayıt</b>tır. İz başka bir şeye aitse, iddia bir çıkarım adımı gerektiriyorsa ya da veri uzun bir dönem için istatistiksel olarak yeniden kurulmuşsa <b>dolaylı gösterge</b>dir. Ayrım kanıtın gücüne değil, türüne işaret eder.", "<b>Criterion:</b> a record is a <b>material record</b> when the phenomenon being claimed itself left a dated physical or documentary trace. It is an <b>indirect indicator</b> when the trace belongs to something else, when the claim requires an inference step, or when the data is a statistical reconstruction across a long period. The distinction marks the kind of evidence, not its strength."],

  hTension: ["Eğriyle çelişen yer", "Where this contradicts the curve"],
  hCivTitle: ["Otuz haritanın eğriye söylediği", "What the thirty maps say to the curve"],
  hCivNote: ["Bu sekmeye Osmanlı ve Roma haritalarından on üç tarihli tanık eklendi. Eklenen tek şey <b>işaretlerdir</b>; eğrideki hiçbir sayı değiştirilmedi — ve bunun nedeni dürüstlükten çok, ölçünün kendisidir.<br><br>1928'de harf devrimi bir bölgede <i>çözücü</i> halkasını bir kuşakta kopardı: okuryazar bir nüfus, kendi arşivini okuyamaz hâle geldi. Yukarıdaki küresel eğri ise 1928'de yükseliyor. Aynı çelişki 1648'de İznik atölyelerinin dokuza inmesinde ve 1584'te İstanbul'da yapılan bir hamamın, Batı'nın dört yüz yıl önce terk ettiği ısıtma ilkesiyle hâlâ çalışıyor olmasında da var. Bu bir hata değil: <b>kayıp yereldir, endeks küreseldir.</b> Tek bir dünya endeksi, tanımı gereği bölgesel bir kopuşu gösteremez.<br><br>Doğru olan, eğriyi vakaya uydurmak değil, eğrinin ne ölçemediğini vakayla göstermektir. Şeritlerdeki her elmas ve daire tarihlenmiş bir gözlemdir; eğriye konacak bir nokta ise ölçmediğimiz bir iddia olurdu.", "Thirteen dated witnesses from the Ottoman and Roman maps were added to this tab. What was added is <b>markers only</b>; not one number in the curve was changed — and the reason is less about honesty than about the measure itself.<br><br>In 1928 the alphabet reform severed the <i>decoder</i> link in one region within a single generation: a literate population became unable to read its own archive. The global curve above is rising at 1928. The same tension appears in the Iznik workshops falling to nine by 1648, and in a bath built in Istanbul in 1584 still working on a heating principle the West had abandoned four centuries earlier. This is not an error: <b>the loss is local, the index is global.</b> A single world index cannot, by definition, show a regional break.<br><br>The right response is not to bend the curve to the case but to use the case to show what the curve cannot measure. Every diamond and circle on the lanes is a dated observation; a point added to the curve would be a claim we have not measured."],
  chCiv: ["Uygarlık", "Civilisation"],
  chCivModern: ["Modern dünya", "The modern world"],

  chCivTest: ["Üç dünyanın sınavı", "The test across three worlds"],
  chCivTestBody: ["Altı halka modeli modern nesnelerden çıkarıldı. Eğer yalnız modern sanayiyi tarif ediyorsa, beş yüz ve iki bin yıl öncesine götürüldüğünde dağılması gerekirdi. Dağılmadı: on üç Osmanlı ve Roma nesnesinin her birinde en ince halka altı halkadan biri çıktı ve dağılım modern on yediyle şaşırtıcı ölçüde benzer (modelin yalıtabildiği vaka oranı %29'dan %33'e çıktı). Değişen şey vurgudur: modern nesnelerde <i>aparat</i> ve <i>örtük bilgi</i> öne çıkarken, tarihsel nesnelerde dört kez <i>bakım</i> öne çıkıyor — su kemerleri, kodeks, Müteferrika matbaası, hypocaust. Bu bir doğrulama değil, bir sınavın geçilmesidir; model hâlâ yanlış olabilir, ama “yalnız moderniteyi tarif ediyor” itirazı artık veriyle karşılanabilir.", "The six-link model was derived from modern objects. If it merely described modern industry, it should have fallen apart when carried back five hundred and two thousand years. It did not: in each of the thirteen Ottoman and Roman objects the thinnest link came out as one of the six, and the distribution is strikingly close to that of the modern seventeen (the share of cases the model can isolate rises from 29% to 33%). What changes is the emphasis: modern objects lean on <i>apparatus</i> and <i>tacit knowledge</i>, while the historical ones lean four times on <i>maintenance</i> — the aqueducts, the codex, the Müteferrika press, the hypocaust. This is not a proof but a test passed; the model may still be wrong, but the objection that it only describes modernity can now be met with data."],

  lPanelEyebrow: ["İçindekiler", "Contents"],
  lPanelTitle: ["Kayıp vakaları", "Loss cases"],
  lNavCases: ["Vaka dosyaları", "The case files"],
  lNavMyths: ["Efsane düzeltmeleri", "Myth corrections"],
  lNavDigital: ["Dijital karanlık çağ", "The digital dark age"],

  lBadge: ["Vaka dosyaları", "Case files"],
  lBadgeNote: ["Her madde kaynağına bağlıdır", "Every entry links to its source"],
  lTitle: ["Eser kaldı, tarif kayboldu", "The artifact survived, the recipe did not"],
  lLead: ["Aşağıdaki vakalar tezin en sert sınavıdır: nesnenin kendisi elimizde durduğu hâlde onu üreten zincir çalışmıyor. Her kartta ayrıca vakanın <em>ne kanıtlamadığı</em> yazılıdır; çünkü bu vakaların çoğu popüler anlatıda abartılmıştır.", "These cases are the hardest test of the argument: the object itself is in our hands, yet the chain that produced it no longer runs. Each card also states what the case <em>does not</em> prove, because most of them are exaggerated in the popular telling."],
  lWhatSurvived: ["Ne kaldı?", "What survived?"],
  lWhatLost: ["Ne kayboldu?", "What was lost?"],
  lMythTitle: ["Popüler anlatı nerede yanlış?", "Where the popular story goes wrong"],
  lMythLead: ["Bu tür vakalar kolayca çarpıtılır. Aşağıdaki düzeltmeler, çalışmanın kendi örneklerine karşı yapılmıştır.", "Cases like these are easy to distort. The corrections below are aimed at this study's own examples."],
  lMythFalse: ["Yaygın ama yanlış", "Common but wrong"],
  lDigitalTitle: ["Dijital karanlık çağ", "The digital dark age"],
  lDigitalLead: ["Modelin en tartışmalı iddiası şudur: arşiv tarihte hiç olmadığı kadar büyürken, onu açık tutan bakımın ömrü kısaldı. Aşağıdaki sayılar bu iddianın ölçülebilen kısmıdır — hepsi bağlantı çürümesini ölçer, yani <b>bakım kaybını</b>. Aparat kaybının buradaki tek vakası Domesday'dir ve kendi düzeltme paneli, verinin aslında hiç okunamaz hâle gelmediğini söyler.", "The model's most contested claim is this: while the archive has grown as never before, the lifetime of the maintenance that keeps it open has shortened. The figures below are the measurable part of that claim — all of them measure link rot, which is <b>maintenance loss</b>. The only apparatus case here is Domesday, and its own myth panel says the data never actually became unreadable."],
  lDigitalNote: ["<b>Dikkat:</b> Pew'in ölçtüğü şey <b>canlı</b> erişilebilirliktir. Yönlendirme bırakarak taşınan sayfalar <i>yaşıyor</i> sayılır ve %38'in içinde değildir. Ama yönlendirme bırakmadan taşınan bir sayfa, içeriği başka bir adreste dursa da “gitmiş” sayılır; buna karşılık yumuşak 404'ler ve DNS kaynaklı olmayan zaman aşımları <i>yaşıyor</i> sayılır. Yani %38, ölü URL'ler için bir <b>alt sınırdır</b> ve içerik kaybının ölçüsü değildir. Ayrıca bu sayfaların bir kısmı web arşivlerinde durur — Pew canlı web'i ölçer, arşivleri değil. Doğru ifade “internet yok oluyor” değil, “canlı bağlantılar çürür; arşiv ancak bakımı yapıldığı sürece vardır” olmalıdır.", "<b>Caveat:</b> what Pew measured is <b>live</b> availability. Pages that moved and left a redirect are counted as <i>alive</i> and are not inside the 38%. But a page moved without a redirect counts as gone even though its content may survive elsewhere, while soft 404s and timeouts other than DNS failures were counted as <i>alive</i>. So 38% is a <b>floor</b> for dead URLs, not a measure of lost content. Some of those pages also sit in web archives — Pew measures the live web, not the archives. The accurate statement is not “the internet is disappearing” but “live links decay, and an archive exists only as long as it is maintained.”"],
  lAiTitle: ["Zincirin bugünkü hali: yapay zekâ", "The chain today: artificial intelligence"],
  lAiLead: ["Büyük dil modelleri, bu çalışmadaki zincirin hem paketleyici hem de çözücü halkasına aynı anda yerleşir. Bu, aktarımı ucuzlatır; aynı zamanda yeni bir kayıp biçimi üretir.", "Large language models sit simultaneously in the packaging link and the decoder link of the chain described here. This makes transmission cheaper, and at the same time produces a new form of loss."],
  lAiBody1: ["<b>Paketleyici olarak:</b> model, devasa bir külliyatı sorulara cevap verebilen sıkıştırılmış bir yüzeye indirger. Bu, bu çalışmadaki <em>G</em> (paketleme kazancı) teriminin şimdiye kadarki en büyük sıçramasıdır.", "<b>As packager:</b> the model reduces an enormous corpus to a compressed surface that can answer questions. This is the largest jump the <em>G</em> term — packaging gain — has ever seen."],
  lAiBody2: ["<b>Çözücü olarak:</b> model, uzman diline erişimi olmayan birine metni açar. Bu, <em>q<sub>d</sub></em> (çözücü ve erişim) terimini yükseltir ve çalışmanın 200 yıllık okuryazarlık eğrisinden sonraki en büyük erişim genişlemesidir.", "<b>As decoder:</b> the model opens specialist text to someone without access to its language. This raises the <em>q<sub>d</sub></em> term — decoder and access — and is the largest expansion of access since the two-century literacy curve in this study."],
  lAiBody3: ["<b>Riskin adı:</b> Nature'da 2024'te yayımlanan çalışma, her kuşağın eğitim verisi büyük ölçüde bir önceki kuşağın çıktısıyla değiştirildiğinde <em>model çöküşü</em> yaşandığını gösteriyor. Önce dağılımın kuyrukları — nadir olan, aykırı olan, azınlıkta kalan — kayboluyor; sonra model kendi karikatürüne yakınsıyor. Bu, tam olarak bu çalışmanın <em>q<sub>c</sub></em> (bağlam aktarımı) teriminin çöküşüdür: paket taşınmaya devam eder, çeşitliliği ve sınır bilgisi taşınmaz.", "<b>The name of the risk:</b> a 2024 Nature paper shows that when each generation's training data is largely replaced by the previous generation's output, <em>model collapse</em> occurs. The tails of the distribution go first — the rare, the atypical, the minority — and then the model converges on a caricature of itself. This is precisely a collapse in this study's <em>q<sub>c</sub></em> term: the packet keeps travelling, its diversity and its boundary knowledge do not."],
  lAiBody4: ["<b>Ne iddia etmiyoruz:</b> Bu, “yapay zekâ interneti kaçınılmaz olarak zehirleyecek” demek değildir. Aynı literatürün devamı — Gerstgrasser ve diğerleri, 2024 — gerçek veriyi sentetikle <em>değiştirmek</em> yerine <em>biriktirmenin</em> çöküşü deneylerinde tümüyle önlediğini gösteriyor; Schaeffer ve diğerleri (2025) ise “model çöküşü” teriminin sekiz ayrı anlamda kullanıldığını sayıyor. Kritik değişken teknoloji değil, kaynağı belli insan üretimi verinin bakımının sürdürülüp sürdürülmediğidir — yani bu çalışmanın en başından beri söylediği şey.", "<b>What we are not claiming:</b> this does not mean “AI will inevitably poison the internet.” Follow-up work in the same literature — Gerstgrasser et al. 2024 — shows that <em>accumulating</em> real data alongside synthetic data, rather than <em>replacing</em> it, avoids collapse outright in their experiments; Schaeffer et al. 2025 go further and count eight distinct things the term “model collapse” is used to mean. The critical variable is not the technology but whether provenanced human-authored data continues to be maintained — which is what this study has said from the start."],
  lAiPersistent: ["<b>Simetri:</b> Yazı, matbaa ve web de menzili artırırken bağlamı inceltti. Yapay zekânın farkı tür değil, derecedir — ama derecedeki fark büyüktür: hız ve döngünün kapanma süresi. Bir kuşak artık yüzyıl değil, aylar sürebilir.", "<b>The symmetry:</b> writing, print and the web also extended reach while thinning context. What is different about AI is not kind but degree — though the difference in degree is large: speed, and the time it takes the loop to close. A generation can now take months rather than a century."],

  mLead: ["Bu çalışma toplam insan bilgisini ölçmez. Bireysel kuşak simülasyonu ile kolektif tarihsel endeks ayrı araçlardır ve sayıları doğrudan karşılaştırılamaz.", "This study does not measure total human knowledge. The individual generational simulation and the collective historical index are separate instruments, and their numbers cannot be compared directly."],

  mFormulaBody: ["Bunlar sitedeki grafiğin <b>birebir çalıştırdığı</b> bağıntılardır; sadeleştirilmiş bir özet değildir. K bireysel öğrenme bütçesi, G paketleme kazancı, H etkin kapsam, A<sub>t</sub> t. nesildeki dış arşiv stoku, C<sub>t</sub> bağlamlı stok, R<sub>t</sub> yeniden kurulabilen kapsamdır. <b>r = 2<sup>−1/h</sup></b> nesil başına kalıcılık oranıdır (h = arşiv yarı ömrü); <b>n = ι · 0,85 · 0,90</b> ise brüt katkının (ι) doğrulamayı geçen %85'inin, kaydedilen %90'ıdır. Başlangıç koşulu A<sub>0</sub> = C<sub>0</sub> = 2K yük taşır: q<sub>c</sub> = 1 olduğunda C<sub>t</sub> = A<sub>t</sub> <b>tam olarak</b> bunun için sağlanır, yani bağlam açığı tümüyle kapanır.", "These are the relations the chart on this site <b>actually runs</b>, not a simplified summary. K is the individual learning budget, G the packaging gain, H the effective reach, A<sub>t</sub> the external archive stock at generation t, C<sub>t</sub> the contextual stock, R<sub>t</sub> the reproducible reach. <b>r = 2<sup>−1/h</sup></b> is the per-generation retention rate (h = archive half-life); <b>n = ι · 0.85 · 0.90</b> is the 85% of gross input (ι) that passes verification, of which 90% is recorded. The initial condition A<sub>0</sub> = C<sub>0</sub> = 2K is load-bearing: it is precisely why q<sub>c</sub> = 1 yields C<sub>t</sub> = A<sub>t</sub>, closing the context gap completely."],
  mFormulaIdx: ["Araç 2 — Tarihsel endeks (100.000 Yıl)", "Instrument 2 — The historical index (100,000 Years)"],
  mFormulaIdxBody: ["Tarihsel görünümdeki P (paketleme), C (bağlamlı) ve R (üretilebilir) eğrileri <b>yukarıdaki formüllerden hesaplanmaz.</b> Bunlar 0–100 ölçeğinde elle konmuş, 17 çapa noktası arasında doğrusal aradeğerlenen senaryo değerleridir. Yorumlanmış bir okumadır; bir ölçüm ya da bir simülasyon çıktısı değildir.", "The P (packaging), C (contextual) and R (reproducible) curves in the historical view are <b>not computed from the formulas above.</b> They are hand-set scenario values on a 0–100 scale, linearly interpolated between 17 anchor points. They are an interpreted reading, not a measurement and not a simulation output."],
  mFormulaWarn: ["<b>İki araç aynı yönde hareket etmez.</b> Tarihsel endekste R başladığı yerin çok üstünde biter (4 → 70), ama tekdüze değil: MÖ 3200 dolayında başlangıç değerine geri düşer, sonra uzun yükseliş başlar — yazı menzili genişletirken okuyabilenlerin çemberini daraltmıştı. Simülasyonda R, dört ön ayarın dördünde de ve ayarların çoğunda düşer: sabit bir öğrenme bütçesi, büyüyen bir arşiv karşısında giderek küçülen bir payı taşıyabilir. Bu zorunlu değildir — Bağlam aktarımını %97 ve üstüne çıkarın, düşüş tersine döner. Bu tersine dönüş, modelin kendi tezinin yanlış olması için nelerin doğru olması gerektiğini söyler. Bunlar farklı sorulardır — biri kolektif kapasiteyi, diğeri bireysel payı sorar — ve <b>sayıları karşılaştırılamaz.</b> Bu sitede iki eğri ayrı adlarla ve ayrı renklerle çizilir.", "<b>The two instruments do not move in the same direction.</b> In the historical index R ends far above where it began (4 → 70), though not monotonically: it falls back to its starting value around 3200 BCE before the long rise, as writing widened reach while narrowing who could read. In the simulation R falls under all four presets and under most settings: a fixed learning budget carries an ever smaller share of a growing archive. It is not forced to — push Context transfer to 97% or above and the fall reverses. That reversal is the model's own statement of what would have to be true for the argument to fail. These are different questions — one asks about collective capacity, the other about the individual share — and <b>their numbers are not comparable.</b> On this site the two curves are drawn under different names and in different colours."],

    survived:["Tek bir aşınmış bronz düzenek: güneş, ay ve tutulma döngülerini mekanik olarak kodlayan hassas dişli takımı.","A single corroded bronze device: a precision gear train that mechanically encodes solar, lunar and eclipse cycles."],
    lost:["Kılavuz yok ve Helenistik dünyadan ikinci bir makine yok. Ama dişli gelenek tümüyle kaybolmadı: ~500 tarihli Bizans taşınabilir dişli takvim-güneş saati parçalar hâlinde durur, el-Bîrûnî ~1000'de bir dişli takvim aletini <b>tarif eder</b> (alet değil, metin kalmıştır) ve 1221/22 tarihli dişli usturlap bütün olarak ayaktadır. Kaybolan şey bu <b>karmaşıklık düzeyi</b> ve onu üreten atölyedir.","No manual survives, and no second machine from the Hellenistic world. But the geared tradition did not vanish outright: a Byzantine portable geared sundial-calendar of c. 500 survives in fragments, al-Bīrūnī <b>described</b> a geared calendrical instrument c. 1000 (the text survives, not the object), and a complete geared astrolabe of 1221/22 survives. What was lost is this <b>level of complexity</b> and the workshop that produced it."],
    shows:["Tek bir eser, Helenistik dünyada mekanik hesaplamanın var olduğunu kanıtlar — ama zincirin geri kalanı yoktur.","A single artifact proves that mechanical computation existed in the Hellenistic world — yet the rest of the chain is absent."],
    limits:["Dişli hesaplamanın yaygın olduğunu göstermez — ama kesintisiz bir geleneğin <b>yokluğunu</b> da göstermez: uzman literatürü, hayatta kalan sonraki dişli aletleri süregelen bir geleneğin kanıtı sayar. Yapım tarihi (~MÖ 205 mi ~MÖ 150-100 mü), yapımcısı ve atölyesi hâlâ tartışmalıdır. Popüler ön yüz rekonstrüksiyonları gözlem değil, parçalı kanıta uydurulmuş modellerdir.","It does not show that geared computation was widespread — but neither does it show the <b>absence</b> of a continuing tradition: the specialist literature reads the surviving later geared instruments as evidence of one. Its date (~205 BCE vs ~150-100 BCE), maker and workshop remain disputed. The popular front-dial reconstructions are models fitted to fragmentary evidence, not observations."],

    survived:["Yaklaşık yirmi beş oyma ahşap nesne. Roma'daki dört tabletin doğrudan radyokarbon tarihlemesi şunu verdi: Tablet D 1493-1509, Tablet C 1694-1727, Tablet B 1832-1857, Tablet A 1862-1887. Yani <b>dördünden yalnız biri</b> temas öncesine düşüyor.","About twenty-five inscribed wooden objects. Direct radiocarbon dating of four Rome-held tablets returned: Tablet D 1493-1509, Tablet C 1694-1727, Tablet B 1832-1857, Tablet A 1862-1887. Only <b>one of the four</b> falls before contact."],
    lost:["Onları okuyabilen herkes. Okuryazarlık yönetici ailelerle rahiplerin ayrıcalığıydı; 1862-63 Peru köle baskınları ve ardından gelen salgınlar bu dar uzman zümreyi ortadan kaldırdı ve nüfus 1870'lerde 200'ün altına düştü. Nesneler duruyor, anahtar durmuyor.","Everyone who could read them. Literacy was the privilege of the ruling families and priests; the Peruvian slave raids of 1862-63 and the epidemics that followed removed that narrow specialist class, and the population fell below 200 by the 1870s. The objects persist, the key does not."],
    shows:["Taşıyıcı sağlamken çözücünün tek başına yok olabileceğinin en net örneğidir.","The clearest example of a decoder vanishing on its own while the carrier remains intact."],
    limits:["Radyokarbon ahşabı tarihler, oyma anını değil — sürüklenmiş odun ve yeniden kullanım olasıdır. Temas öncesi icat iddiası <b>tek bir örneğe</b> dayanır ve bu haliyle kırılgandır. Rongorongo'nun tam bir yazı mı, bellek desteği mi, yoksa İspanyol belgelerine tepki olarak doğmuş bir sistem mi olduğu hâlâ açıkça tartışılıyor.","Radiocarbon dates the wood, not the carving — driftwood and reuse are likely. The pre-contact-invention claim rests on <b>a single sample</b>, which is why it remains fragile. Whether rongorongo is full writing, a mnemonic system, or a post-contact response to Spanish documents is still openly contested."],

    limits:["Sık alıntılanan “Temmuz 1562'de Maní'de 27 kitap yakıldı” rakamı Diego de Landa'nın kendi anlatısına dayanır ve gerçek hacim bilinemez. Üstelik aynı Landa, Knorozov'un Maya yazısını çözerken kullandığı işaret-hece “alfabesini” de kaydetmiştir: yok eden, anahtarın bir parçasını da bırakmıştır.","The often-cited “27 books burned at Maní in July 1562” rests on Diego de Landa's own account, and the true volume is unknowable. The same Landa also recorded the glyph-and-syllable “alphabet” that Knorozov later used to crack Maya writing: the destroyer also supplied part of the key."],

  { id:"journal", cat:"threshold", year:1665, start:1665, end:1832, type:"proxy", conf:"high",

    limits:["Bilimin 1665'te başladığı anlamına gelmez — ve <b>hakemliğin 1665'te başladığı anlamına kesinlikle gelmez.</b> Royal Society yayın denetimini ve Makaleler Komitesi'ni ancak 1752'de kurdu; bağımsız hakem raporları 1830'lara uzanır; “peer review” terimi ise 1965'te Science'ta görülür ve ancak 1970'lerde yerleşir. 1665'te ayrıca Journal des sçavans (5 Ocak) Philosophical Transactions'tan (6 Mart) iki ay önce çıkmıştı; öncelik tartışmalıdır.","It does not mean science began in 1665 — and it certainly <b>does not mean peer review began in 1665.</b> The Royal Society took editorial control and created a Committee of Papers only in 1752; independent referee reports date from the 1830s, and the term “peer review” appears in Science in 1965, settling into ordinary use only in the 1970s. In 1665 the Journal des sçavans (5 January) also preceded Philosophical Transactions (6 March) by two months; the priority question is contested."],

    url:"https://www.cambridge.org/core/journals/historical-journal/article/royal-society-and-the-prehistory-of-peer-review-16651965/93B903FD4D6561AA7224C62EE57B0C18" },

  { id:"wootz", cat:"loss", loss:"tacit", year:1750, start:1600, end:1850, type:"proxy", conf:"medium",

    shows:["Bir tekniğin, onu uygulayanların farkında olmadığı bir girdiye bağlı olduğunda sessizce durabileceğini gösterir.","Shows a technique halting silently when it depends on an input its practitioners were never aware of."],

  { id:"domesday", cat:"digital", loss:"apparatus", year:1986, start:1986, end:2011, type:"direct", conf:"high",

  { id:"cerf", cat:"digital", year:2015, start:2015, end:2015, type:"direct", conf:"high",

    shows:["TCP/IP'nin mimarlarından biri, 13 Şubat 2015'te San Jose'deki AAAS Yıllık Toplantısı'nda verdiği bir konuşmada bit düzeyinde depolamanın yetersiz olduğunu; dijital materyali yüzyıllarca korumanın anlamı bitlerle birlikte taşımayı gerektirdiğini savundu ve buna açıkça Rosetta Taşı biçiminde bir öneri olan “Dijital Tirşe” adını verdi.","One of the architects of TCP/IP argued in a talk at the 2015 AAAS Annual Meeting in San Jose on 13 February that bit-level storage is insufficient, that preserving digital material for centuries requires carrying the semantics with the bits — an explicitly Rosetta-Stone-shaped proposal he called “Digital Vellum”."],

  { id:"link-rot", cat:"digital", loss:"maintenance", year:2024, start:2013, end:2024, type:"direct", conf:"high",

    region:["Küresel · World Wide Web","Global · the World Wide Web"],
    role:["Bakım durunca arşivin kapanması","The archive closing when maintenance stops"],
    shows:["Pew'in tarama temelli çalışması, 2013'te var olan sayfaların %38'inin Ekim 2023'te erişilemez olduğunu buldu (2023 sayfaları için %8, 2013-2023 aralığının tamamı için %25). Haber sayfalarının %23'ü ve devlet sayfalarının %21'i en az bir kırık bağlantı taşıyor; İngilizce Vikipedi maddelerinin %54'ünde ölü bir kaynak bağlantısı var.","Pew's crawl-based study found 38% of webpages that existed in 2013 were inaccessible by October 2023 (8% for pages from 2023, 25% across the whole 2013-2023 span). 23% of news pages and 21% of government pages carry at least one broken link, and 54% of English Wikipedia articles have a dead reference link."],
    limits:["Bunlar erişilebilirlik ölçümüdür, içerik kaybı ölçümü değil — “gitmiş” sayfaların bir kısmı web arşivlerinde durur; Pew bunu ölçmemiştir. Örneklem Common Crawl'dan alınmıştır, webin sayımı değildir ve kaybolan materyalin bilimsel değeri olup olmadığı ölçülmemiştir.","These are availability measurements, not content-loss measurements — some “gone” pages survive in web archives, though Pew did not measure that. The sample is drawn from Common Crawl and is not a census of the web, and the study cannot say whether the vanished material had scholarly value."],

  { id:"model-collapse", cat:"digital", year:2024, start:2023, end:2024, type:"direct", conf:"high",

    region:["Birleşik Krallık ve Kanada","United Kingdom and Canada"],
    role:["Bağlam teriminin makine ölçeğinde çöküşü","The context term collapsing at machine scale"],
    shows:["Bir dil modeli (125 milyon parametreli OPT-125m'in WikiText-2 üzerinde ince ayarı), varyasyonel otokodlayıcılar ve Gauss karışım modellerinde, ardışık kuşakları bir öncekinin çıktısıyla eğitmek “model çöküşü” üretti: önce özgün dağılımın kuyrukları kayboldu, sonra model düşük varyanslı bir karikatüre yakınsadı. Yazarlar, model üretimi içeriğin ayrım gözetmeden kullanılmasının “geri döndürülemez kusurlara” yol açtığını yazıyor.","In a language model (a fine-tune of the 125-million-parameter OPT-125m on WikiText-2), in variational autoencoders and in Gaussian mixture models, training successive generations on the previous generation's output produced “model collapse”: the tails of the original distribution disappeared first, then the model converged on a low-variance caricature. The authors conclude that indiscriminate use of model-generated content causes “irreversible defects”."],
    limits:["Başlıktaki sonuç, her kuşağın eğitim verisinin büyük ölçüde sentetik çıktıyla <em>değiştirildiği</em> bir rejimden gelir. Sonraki çalışmalar (Gerstgrasser ve diğerleri, 2024) gerçek veriyi sentetiğin yanında <em>biriktirmenin</em> çöküşü önlediğini gösteriyor; yani “internet kaçınılmaz olarak yapay zekâyı zehirleyecek” bu makalenin kurduğu şey değildir.","The headline result comes from a regime where each generation's training data is largely <em>replaced</em> by synthetic output. Follow-up work (Gerstgrasser et al., 2024) shows that <em>accumulating</em> real data alongside synthetic data avoids collapse — so “the internet will inevitably poison AI” is not what this paper establishes."],

var myths = [
  { claim: ["İskenderiye Kütüphanesi bir yangında yandı ve antik bilgi yok oldu.", "The Library of Alexandria burned in a fire and ancient knowledge was destroyed."],
    fix: ["Tek bir felaket yangınının antik bilgiyi yok ettiğine dair doğrudan kanıt yoktur. Bagnall'ın çözümlemesi, ünlü 500.000 tomar rakamlarının antik retorik olduğunu (muhtemelen bir büyüklük mertebesi fazla), Sezar'ın MÖ 48 yangınının, 391 Serapeum olayının ve 642 Arap hikâyesinin tartışmalı ya da kurgusal olduğunu gösteriyor. Koleksiyon büyük olasılıkla papirüsün olağan çürümesi artı yeniden kopyalama iradesinin sona ermesiyle dağıldı. Akdeniz neminde papirüs tomarı bir ilâ üç yüzyıl dayanır: <b>bir koleksiyonu koruyan şey yangına dayanıklılık değil, bakımdır.</b> Bu yüzden bu vaka çalışmanın zaman çizelgesinde bir veri noktası olarak yer almıyor.", "There is no direct evidence that a single catastrophic fire destroyed ancient knowledge. Bagnall's analysis shows the famous 500,000-roll figures are ancient rhetoric (plausibly an order of magnitude too high), and that Caesar's 48 BCE fire, the 391 CE Serapeum episode and the 642 CE Arab story are contested or fictional. The collection most likely dissolved through the ordinary decay of papyrus plus the end of the will to keep recopying it. A papyrus roll in Mediterranean humidity survives perhaps one to three centuries: <b>what preserves a collection is maintenance, not fireproofing.</b> This is why the case appears nowhere as a data point on this study's timeline."],
    src: ["Roger S. Bagnall, “Alexandria: Library of Dreams”, Proc. Am. Phil. Soc. 146(4), 2002", "Roger S. Bagnall, “Alexandria: Library of Dreams”, Proc. Am. Phil. Soc. 146(4), 2002"],
    url: "https://archive.nyu.edu/bitstream/2451/28263/2/D172-Alexandria%20Library%20of%20Dreams.pdf" },
  { claim: ["NASA Satürn V'in planlarını kaybetti.", "NASA lost the blueprints for the Saturn V."],
    fix: ["Yanlış. Orijinal F-1 dokümantasyonu 2011-2013 Marshall söküm çalışmasında arşivden çıkarıldı ve kullanıldı. Çürümüş olan şey kayıt değil, <b>yeniden yürütme kapasitesiydi</b>: elle lehimlenen boru duvar kaynağı gibi atölye içi örtük bilgi, 1960'ların tedarikçi ve malzeme tabanı ve çizimlerin durduğu analog/eskimiş formatlar. Mühendislerin gerçek bir motoru söküp 3B taramak zorunda kalmasının nedeni buydu. Bu, hikâyeyi zayıflatmaz — güçlendirir: <b>tam dokümantasyon bile tek başına çalıştırılabilir bir çözücü değildir.</b>", "False. The original F-1 documentation was retrieved and used in the 2011-2013 Marshall teardown. What had decayed was not the record but the <b>capacity to re-execute it</b>: tacit shop-floor knowledge such as hand-brazed tube-wall welding, the 1960s supplier and materials base, and the analogue or obsolete formats the drawings sit in. That is why engineers had to disassemble and 3D-scan a real engine. This does not weaken the argument — it strengthens it: <b>even complete documentation is not, on its own, a runnable decoder.</b>"],
    src: ["NASA NTRS · Erin M. Betts, “Waking a Giant: Bringing the Saturn F-1 Engine Back to Life”, 2013", "NASA NTRS · Erin M. Betts, “Waking a Giant: Bringing the Saturn F-1 Engine Back to Life”, 2013"],
    url: "https://ntrs.nasa.gov/citations/20140011656" },
  { claim: ["Şam çeliğinin sırrı sonsuza dek kayboldu.", "The secret of Damascus steel was lost forever."],
    fix: ["Fazla iddialı. Cevher tükenmesi ve vanadyum gibi eser elementlere dayanan açıklama bir hipotezdir, kanıtlanmış değil. Modern metalurjistler wootz benzeri desenli çeliği laboratuvarda yeniden üretti. Ayrıca bugün “Şam çeliği” diye satılan malzeme desen-kaynaklı (pattern-welded) çeliktir — görsel olarak benzer, metalurjik olarak farklı. Doğru ifade “sonsuza dek kayboldu” değil, <b>“aktarım zinciri koptu ve yeniden kurulması iki yüzyıl ve modern analitik araçlar gerektirdi”</b> olmalıdır.", "Overstated. The ore-exhaustion account resting on trace elements such as vanadium is a hypothesis, not proof. Modern metallurgists have reproduced wootz-like patterned steel in the laboratory. And the material sold as “Damascus steel” today is pattern-welded steel — visually similar, metallurgically different. The accurate statement is not “lost forever” but <b>“the transmission chain broke, and rebuilding it took two centuries and modern analytical instruments.”</b>"],
    src: ["JOM · Verhoeven, Pendray & Dauksch, 1998; Nature · Reibold ve diğerleri, 2006", "JOM · Verhoeven, Pendray & Dauksch, 1998; Nature · Reibold et al., 2006"],

  { claim: ["Dijital Domesday 1000 yıl değil, sadece 15 yıl dayandı.", "The digital Domesday lasted only 15 years, not 1,000."],
    fix: ["Etkileyici ama abartılı. Veri hiçbir zaman gerçekten okunamaz hâle gelmedi: hayatta kalan LV-ROM oynatıcılar ve CAMiLEON emülasyon çalışması onu kurtardı, 2011'de yeniden yayımlandı. Gerçek ders daha ince: <b>ortam değil, okuyucu aparat yok oldu</b> — ve kurtarma pahalı, gecikmeli ve etkileşim açısından kısmiydi. Kaybın biçimi “yok olma” değil, “planlanmamış kurtarma maliyeti”dir.", "Striking but overstated. The data never actually became unreadable: surviving LV-ROM players and the CAMiLEON emulation effort recovered it, and it was republished in 2011. The real lesson is finer: <b>it was the reading apparatus, not the medium, that went extinct</b> — and recovery was expensive, delayed and only partial in its interactivity. The shape of the loss is not annihilation but unbudgeted recovery cost."],

  { claim: ["İnternet yok oluyor: sayfaların %38'i kayboldu.", "The internet is disappearing: 38% of pages are gone."],
    fix: ["Yarısı doğru. Pew'in %38 rakamı <b>canlı URL erişilebilirliğini</b> ölçer, içeriğin kalıcı kaybını değil; o sayfaların bir kısmı web arşivlerinde durur. Örneklem Common Crawl'dan alınmıştır ve webin sayımı değildir. Doğru cümle “internet yok oluyor” değil, <b>“canlı bağlantılar çürür; arşiv ancak bakımı yapıldığı sürece vardır”</b>dır.", "Half right. Pew's 38% measures <b>live URL availability</b>, not permanent loss of content; some of those pages still sit in web archives. The sample is drawn from Common Crawl and is not a census of the web. The accurate sentence is not “the internet is disappearing” but <b>“live links decay, and an archive exists only as long as it is maintained.”</b>"],

  { claim: ["Hakemlik 1665'te, Philosophical Transactions ile başladı.", "Peer review began in 1665, with Philosophical Transactions."],
    fix: ["Bu, bilim tarihinin en çok tekrarlanan yanlış tarihlerinden biri — ve bu çalışmanın kendisi de v4.0 dahil olmak üzere bir kayıt başlığında taşıyordu. Philosophical Transactions, Henry Oldenburg'un <b>özel ticari girişimiydi;</b> Royal Society yayın denetimini ve Makaleler Komitesi'ni ancak <b>1752'de</b> kurdu. Komiteye bilgi veren bağımsız hakem raporları <b>1830'larda</b> başlar. “Peer review” terimi 1960'lar-70'lerin bir Amerikan icadıdır: <b>1965'te</b> Science'ta NIH proje değerlendirmesi için kullanılır, dergi hakemliğinin olağan adı hâline gelmesi ancak <b>1970'lerdedir</b>. Nature'ın sistematik dış hakemliği <b>1973'e</b> kadar yoktur. Dahası 1665'te Journal des sçavans (5 Ocak), Philosophical Transactions'tan (6 Mart) iki ay önce çıkmıştı.", "This is one of the most-repeated false dates in the history of science — and through v4.0 this study carried it in a record title of its own. Philosophical Transactions was Henry Oldenburg's <b>private commercial venture;</b> the Royal Society took editorial control and created a Committee of Papers only in <b>1752</b>. Independent referee reports informing that committee begin in the <b>1830s</b>. The term “peer review” is an American coinage of the 1960s-70s: it appears in Science in <b>1965</b> for NIH grant review, and does not become the ordinary word for journal refereeing until the <b>1970s</b>. Nature had no systematic external refereeing until <b>1973</b>. And in 1665 the Journal des sçavans (5 January) preceded Philosophical Transactions (6 March) by two months."],
    src: ["Baldwin · Isis 109:3, 2018 (terimin doğuşu ve Nature 1973); kurumsal tarih için Moxham & Fyfe, Historical Journal, 2018 — ikisi de Kaynakça'da", "Baldwin · Isis 109:3, 2018 (the coinage and Nature 1973); for the institutional history, Moxham & Fyfe, Historical Journal, 2018 — both in the Sources"],
    url: "https://www.journals.uchicago.edu/doi/10.1086/700070" },
  { claim: ["Yapay zekâ internete yayıldıkça kendini kaçınılmaz olarak zehirleyecek.", "As AI spreads across the internet it will inevitably poison itself."],
    fix: ["Nature 2024 makalesinin kurduğu şey bu değildir. Çöküş, her kuşağın eğitim verisinin büyük ölçüde sentetik çıktıyla <b>değiştirildiği</b> bir rejimde gösterildi. Sonraki çalışmalar (Gerstgrasser ve diğerleri, 2024), gerçek veriyi sentetikle değiştirmek yerine <b>biriktirmenin</b> etkiyi önlediğini buldu: kaç kuşak geçerse geçsin test hatası sınırlı kalıyor. Yani kritik değişken teknolojinin kendisi değil, kaynağı belli insan üretimi verinin bakımının sürdürülüp sürdürülmediğidir.", "This is not what the 2024 Nature paper establishes. Collapse was demonstrated in a regime where each generation's training data is largely <b>replaced</b> by synthetic output. Follow-up work (Gerstgrasser et al., 2024) finds that <b>accumulating</b> real data alongside synthetic data, rather than replacing it, avoids the effect: the test error stays bounded however many generations run. The critical variable is not the technology itself but whether provenanced human-authored data continues to be maintained."],
    src: ["Nature · Shumailov ve diğerleri, 2024, 631:755-759", "Nature · Shumailov et al., 2024, 631:755-759"],

  ["Örtük bilgi, aparat ve bakım kaybını: ilk ikisi için modelde <b>hiçbir ayrı terim yoktur</b>, üçüncüsü yarı ömrün içinde erir. Zincir Haritaları'ndaki 30 nesnenin 19'unda en kırılgan halka tam da bu üçünden biridir — yani model, gerçek vakaların çoğunda asıl olan şeyi göremez. Osmanlı ve Roma nesneleri bu tabloyu değiştirmedi, pekiştirdi: on üçünün dördünde en ince halka <i>bakım</i>dır; otuz nesnenin tamamında bakım altı kez öne çıkıyor.", "The loss of tacit knowledge, of apparatus and of maintenance: the model has <b>no separate term</b> for the first two, and the third dissolves into the half-life. In 19 of the 30 objects in the Chain Maps, the thinnest link is one of these three — so in most real cases the model cannot see what actually matters. The Ottoman and Roman objects did not change that picture, they sharpened it: in four of the thirteen the thinnest link is <i>maintenance</i>, and across all thirty maintenance leads six times."],
