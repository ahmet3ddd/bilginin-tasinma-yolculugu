nt Ofisi, RCA/Zworykin'e karşı Farnsworth lehine karar verir. Kanıt, lise öğretmeni Justin Tolman'ın 1922 tahta çizimini hatırlamasıdır.","July 1935: the Patent Office rules for Farnsworth against RCA/Zworykin. The decisive evidence is his high-school teacher Justin Tolman recalling a 1922 blackboard sketch."],"link":"decoder","src":"https://explorepahistory.com/hmarker.php?markerId=1-A-3A6"},{"y":1937,"t":["6 Şubat 1937: BBC, Baird'in 240 satırlık sistemini terk edip Marconi-EMI 405 satıra geçer. Kazananın aygıtı, zaferinden on bir yıl sonra yetim kalır.","6 February 1937: the BBC abandons Baird's 240-line system for Marconi-EMI's 405-line. The winner's own apparatus is orphaned eleven years after his triumph."],"link":"apparatus","src":"https://blog.scienceandmediamuseum.org.uk/history-of-british-television-timeline/"},{"y":1953,"t":["17 Aralık 1953: FCC, NTSC renk standardını onaylar. Renk alt taşıyıcıya gizlenir; siyah-beyaz alıcılar onu yok sayar. Kurulu aygıt tabanı bilerek yaşatılır.","17 December 1953: the FCC adopts NTSC colour. Colour hides on a subcarrier that monochrome sets simply ignore — the installed base is deliberately kept alive."],"link":"maintenance","src":"https://ethw.org/Milestones:Monochrome-Compatible_Electronic_Color_Television,_1946-1953"},{"y":1972,"t":["1970'lerin başında BBC bantları yeniden kullanmak için siler. Hartnell–Troughton dönemi Doctor Who'nun 253 bölümünden 97'si hâlâ kayıp: paketin kendisi silinmiştir.","In the early 1970s the BBC wipes videotape for reuse. Of 253 Hartnell–Troughton Doctor Who episodes, 97 are still missing — the packet itself was erased to save tape."],"link":"packet","src":"https://www.doctorwho.tv/news-and-features/why-are-some-doctor-who-episodes-missing"},{"y":2012,"t":["24 Ekim 2012: Birleşik Krallık'ın son analog vericisi (Divis, Belfast) kapatılır; ABD 12 Haziran 2009'da bitirmişti. Dönüştürücüsüz her analog alıcı körleşir.","24 October 2012: the UK's last analogue transmitter (Divis, Belfast) goes off; the US finished on 12 June 2009. Analogue-only sets go blank without a converter."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/Digital_switchover_dates_in_the_United_Kingdom"}],"links":{"packet":["Bugünün yayın kayıtları dosya olarak sağlam; ama televizyonun ilk otuz yılı büyük ölçüde yok. Canlı yayınların çoğu hiç kaydedilmedi, kaydedilenlerin bir kısmı bant tasarrufu için üzerine yazıldı. Ayakta kalan asıl paket, standart metinleridir: ITU tavsiyeleri, hâlâ okunabilir ve hâlâ uygulanır.","Today's broadcast masters are solid as files, but television's first three decades are largely gone: most live output was never recorded, and some of what was recorded was taped over to save stock. The packet that actually survived is the standards literature — ITU recommendations, still readable and still implemented."],"decoder":["Milyarlarca insan televizyon izleyebilir; bu bir çözücü değil, bir alışkanlıktır. Gerçek çözücü — dalga biçimini okuyan, bir yayın zincirini kuran, bir arşiv bandını doğru hızda okutan mühendis — birkaç on binlik bir meslektir ve analog dönem bilgisi hızla emekli oluyor.","Billions can watch television, but watching is a habit, not a decoding skill. The real decoder — the engineer who reads a waveform, builds a broadcast chain, or plays an archive tape back at the right speed — is a profession of tens of thousands, and its analogue-era knowledge is retiring fast."],"context":["Televizyonun 'neden'i standart belgelerinde yaşıyor: neden geçmeli tarama, neden 29,97 kare, neden renk alt taşıyıcı. Bu gerekçeler yazıldı ve saklandı — bu zincirin en iyi haberi. Kötü haber: gerekçeleri okuyabilenlerle formatı kullananlar arasındaki mesafe her kuşakta açılıyor.","Television's 'why' lives in its standards documents: why interlace, why 29.97 frames, why a colour subcarrier. Those reasons were written down and kept — this chain's best news. The bad news is that the distance between the people who can read the reasons and the people who use the format widens each generation."],"tacit":["Kamera hareketi, kurgu ritmi, canlı yayın rejisi, renk düzeltme — hiçbiri kitaptan öğrenilmez; stüdyo galerisinde omuz omuza aktarılır. Bu bağ hâlâ canlı ama incelen bir kanaldan geçiyor: uzaktan ve otomatik prodüksiyon, çırağın ustayı izlediği odayı ortadan kaldırıyor.","Camera movement, cutting rhythm, live gallery direction, colour grading: none of it is learned from a book — it passes shoulder to shoulder in a control room. The link is alive but running through a narrowing channel, as remote and automated production removes the room where the apprentice watched the master."],"apparatus":["Bu zincirin en güçlü ve en acımasız bağı. Televizyon aygıtını ve formatını, çalışmadaki her üründen daha sık ve daha eksiksiz değiştirdi: mekanik disk, 405 satır, NTSC/PAL, quadruplex ve U-matic bant, analog kapanış, HD, akış. Her geçiş bir kuşak makineyi ve bir kuşak kaydı geride bıraktı.","The strongest and most brutal link here. Television has changed its apparatus and its formats more often, and more completely, than any other product in this study: mechanical disc, 405-line, NTSC/PAL, quadruplex and U-matic tape, analogue shutdown, HD, streaming. Each transition left a generation of machines and a generation of recordings behind."],"maintenance":["Kurumsal arşivler (BBC, INA, Library of Congress) bilinçli göç yapıyor ve 1953'ün geriye uyumlu renk kararı bakımın en iyi örneklerinden biri. Ama 20. yüzyıl yayın malzemesinin büyük bölümü hâlâ bozulan bantta duruyor ve göç, bandın ömrüyle yarışıyor.","Institutional archives (BBC, INA, the Library of Congress) migrate deliberately, and the backwards-compatible colour decision of 1953 is one of the best acts of maintenance in the study. But much of the twentieth century's broadcast material still sits on decaying tape, and migration is racing the tape's lifetime."]},"weakest":{"k":"apparatus","why":["Televizyonda kayıt, onu okuyan makineden ayrılamaz: bir bant, onu doğru standartta çalacak bir makine olmadan boş bir kutudur. Ve televizyon, aygıtını en sık değiştiren ortamdır — 1937'de Baird sistemi, 1985'te 405 satır, 2009 ve 2012'de analog yayın. Bu geçişlerin hiçbiri çürümeyle olmadı; hepsi bir kurulun aldığı kararla, ilan edilmiş bir tarihte oldu. 24 Ekim 2012 gecesi Britanya'daki her analog-yalnız alıcı, tek bir idari kararla ekranını kaybetti. Aygıt yok oluşları burada doğal afet değil, takvimli politikadır.","In television the record cannot be separated from the machine that reads it: a tape without a machine that plays its standard is a sealed box. And television has changed its apparatus more often than any other medium — the Baird system in 1937, 405-line in 1985, analogue broadcasting in 2009 and 2012. None of these losses happened by decay; every one happened by committee decision, on an announced date. On the night of 24 October 2012 every analogue-only set in Britain lost its picture to a single administrative choice. Here, apparatus extinction is not a natural disaster but scheduled policy."]},"nearBreak":["Mayıs 1932'de RCA, Farnsworth'e karşı patent çekişme davası açtı: Amerika'nın en büyük elektronik şirketi, avukat kadrosu ve Zworykin'in 1923 tarihli başvurusuyla, sermayesiz bir mucidin önceliğini elinden almanın eşiğindeydi. Zincir tek bir insan hafızasıyla kurtuldu — lise kimya öğretmeni Justin Tolman, Farnsworth'ün 1922'de tahtaya çizdiği şemayı mahkemede yeniden çizdi. Temmuz 1935'te Patent Ofisi Farnsworth lehine karar verdi ve RCA 1939 sonbaharında tarihinde ilk kez telif ödemeyi kabul etti: 1 milyon dolar artı satılan her alıcı için pay. İroni tam burada: Farnsworth'ün patentleri, televizyonun asıl kitlesel patlamasından hemen önce, 1940'ların sonunda süresini doldurdu ve icadının getirdiği kârın payını hiçbir zaman gerçekten alamadı.","In May 1932 RCA opened a patent-interference action against Farnsworth: the largest electronics company in America, with its legal department and Zworykin's 1923 application, came close to taking priority from an inventor with no capital behind him. The chain was saved by a single human memory — Justin Tolman, his high-school chemistry teacher, redrew in court the diagram Farnsworth had chalked on a blackboard in 1922. In July 1935 the Patent Office ruled for Farnsworth, and in the autumn of 1939 RCA agreed, for the first time in its history, to pay rather than collect royalties: $1 million plus a share of every set sold. The irony is exact: Farnsworth's patents ran out in the late 1940s, just as television's real mass market arrived, and he never took a real share of the profits his invention created."],"thesis":["Bu ürün, çalışmanın 'aygıt bağı çoğunlukla çürümeyle değil, kararla kopar' iddiasını destekliyor: 1937, 1985, 2009 ve 2012 kapanışlarının hepsi ilan edilmiş tarihlerdi. Aynı zamanda karşı örneği de veriyor — 1953 NTSC kararı, bir standardın kurulu aygıt tabanını öldürmeden değişebileceğini kanıtlıyor; yani aygıt yok oluşu kaçınılmaz değil, tercih edilmiş bir maliyet. Dürüst sınır: televizyonun içeriği büyük ölçüde ticari ve yenilenebilirdi. Erken canlı yayının kaybı kültürel olarak acı verici ama işlevsel olarak sonuçsuzdu; bu yüzden televizyon, aygıt kaybının gerçekten kritik bilgi için ne kadar yıkıcı olduğunu abartma riski taşır.","This product supports the study's claim that the apparatus link usually breaks by decision rather than by decay: the shutdowns of 1937, 1985, 2009 and 2012 were all announced dates. It also supplies the counter-example — the NTSC decision of 1953 proves a standard can change without killing the installed base, which makes apparatus extinction a chosen cost rather than an inevitable one. Honest limit: television's content was largely commercial and replaceable. Losing most early live broadcasting is culturally painful but was functionally inconsequential, so television risks overstating how catastrophic apparatus loss is for knowledge that actually matters."],"sources":[{"t":["DE30105C – 'Elektrisches Teleskop', Nipkow (Google Patents)","DE30105C – 'Elektrisches Teleskop', Nipkow (Google Patents)"],"m":["Patent metninin kendisi: 6 Ocak 1884 başvuru, 15 Ocak 1885 tescil. Paketin tarihini birincil kaynaktan doğrular.","The patent document itself: filed 6 January 1884, granted 15 January 1885 — the packet's date from the primary record."],"u":"https://patents.google.com/patent/DE30105C/en"},{"t":["IEEE Milestone: İlk kamuya açık televizyon gösterimi, 1926","IEEE Milestone: First Public Demonstration of Television, 1926"],"m":["Baird'in 26 Ocak 1926 gösterimini yeri ve tanıkları ile birlikte doğrulayan resmî IEEE anıt kaydı.","The official IEEE milestone record confirming Baird's 26 January 1926 demonstration, its address and its witnesses."],"u":"https://ethw.org/Milestones:First_Public_Demonstration_of_Television,_1926"},{"t":["IEEE Milestone: Siyah-beyazla uyumlu elektronik renkli televizyon, 1946–1953","IEEE Milestone: Monochrome-Compatible Electronic Color Television, 1946–1953"],"m":["FCC'nin 17 Aralık 1953 onayını ve renk alt taşıyıcısının siyah-beyaz alıcıları neden bozmadığını açıklar.","Confirms the FCC's approval on 17 December 1953 and explains why the colour subcarrier left monochrome sets working."],"u":"https://ethw.org/Milestones:Monochrome-Compatible_Electronic_Color_Television,_1946-1953"},{"t":["Britanya televizyonu zaman çizelgesi – National Science and Media Museum","History of British television timeline – National Science and Media Museum"],"m":["1926, 1929, 1932, 2 Kasım 1936 Alexandra Palace açılışı ve Baird sisteminin 6 Şubat 1937'de terk edilişi.","Dates for 1926, 1929, 1932, the Alexandra Palace launch of 2 November 1936, and the abandonment of the Baird system on 6 February 1937."],"u":"https://blog.scienceandmediamuseum.org.uk/history-of-british-television-timeline/"},{"t":["Philo T. Farnsworth tarihî levhası – ExplorePAhistory","Philo T. Farnsworth historical marker – ExplorePAhistory"],"m":["1934'te başlayan RCA davası, Temmuz 1935 kararı, 1939'daki 1 milyon dolarlık uzlaşma ve Farnsworth'ün kazanamayışı.","The RCA litigation from 1934, the July 1935 ruling, the $1 million settlement of 1939, and Farnsworth's failure to profit."],"u":"https://explorepahistory.com/hmarker.php?markerId=1-A-3A6"}]},{"id":"computer","cat":"info","civ":"modern","icon":"💻","name":["Bilgisayar","The computer"],"era":["1837 – günümüz","1837 – present"],"hook":["Babbage'in 2 No'lu Fark Makinesi'nin tam çizimleri 1849'dan beri hazır bekliyordu; Science Museum 1985–1991'de onu, Babbage'in kendi ulaştığı hassasiyeti hiç aşmadan inşa etti — 8.000 parça, beş ton — ve makine çalıştı. Paket 142 yıl boyunca sağlamdı; eksik olan yalnızca aygıt ve kurumsal iradeydi.","The complete drawings for Babbage's Difference Engine No. 2 had been ready since 1849, and between 1985 and 1991 the Science Museum built it to a precision no finer than Babbage himself had achieved — 8,000 parts, five tonnes — and it worked. The packet had been sound for 142 years; all that was missing was the apparatus and the institutional will."],"timeline":[{"y":1842,"t":["Başbakan Robert Peel, Babbage'in makinelerine devlet desteğini keser. Bir yazışmasında sorar: 'Mr. Babbage'den ve hesap makinesinden nasıl kurtulacağız?'","Prime Minister Robert Peel cancels government support for Babbage's engines, asking in a note: 'What shall we do to get rid of Mr. Babbage and his calculating machine?'"],"link":"maintenance","src":"https://www.computerhistory.org/babbage/robertpeel/"},{"y":1843,"t":["Ada Lovelace'in Menabrea çevirisine düştüğü G Notu, var olmayan bir makine için döngülü ve koşullu dallanmalı bir Bernoulli programı yazar.","Ada Lovelace's Note G, appended to her translation of Menabrea, sets out a Bernoulli-number program with loops and conditional branching for a machine that did not exist."],"link":"context","src":"https://www.cs.virginia.edu/~robins/Ada_and_the_First_Computer.pdf"},{"y":1936,"t":["Turing'in 'On Computable Numbers' makalesi 28 Mayıs 1936'da alınır (PLMS s2-42, 230–265): evrensel makine, biri inşa edilmeden on iki yıl önce tanımlanır.","Turing's 'On Computable Numbers' is received on 28 May 1936 (PLMS s2-42, 230–265): the universal machine is defined twelve years before one is built."],"link":"packet","src":"https://academic.oup.com/plms/article-abstract/s2-42/1/230/1491926"},{"y":1945,"t":["30 Haziran 1945: von Neumann'ın EDVAC taslağı 24 kişiye dağıtılır. Çözücünün ortak dilini kurar; önceden yayın sayıldığı için ENIAC patentini de geçersiz kılar.","30 June 1945: von Neumann's EDVAC draft goes to 24 people. It standardises the decoder's shared vocabulary — and, as prior publication, later voids the ENIAC patent."],"link":"decoder","src":"https://www.historyofinformation.com/detail.php?id=639"},{"y":1948,"t":["21 Haziran 1948: Manchester Baby, Kilburn'ün saklanan programını çalıştırır; günler içinde 2^18'in en büyük çarpanını 52 dakikada bulur.","21 June 1948: the Manchester Baby runs Kilburn's stored program; within days it finds the highest factor of 2^18 in 52 minutes."],"link":"apparatus","src":"https://curation.cs.manchester.ac.uk/computer50/www.computer50.org/mark1/new.baby.html"},{"y":1991,"t":["Science Museum, 2 No'lu Fark Makinesi'nin hesaplama bölümünü Babbage'in 200. doğum yılında tamamlar; baskı düzeneği Mart 2002'de biter. 8.000 parça, beş ton, çalışıyor.","The Science Museum finishes Difference Engine No. 2's calculating section for Babbage's bicentenary; its printer follows in March 2002. 8,000 parts, five tonnes, working."],"link":"packet","src":"https://www.sciencemuseum.org.uk/sites/default/files/2023-09/DE2_Technical_Description.pdf"},{"y":2020,"t":["Nisan 2020: New Jersey, Connecticut ve Florida COBOL programcısı arar. Kod 40 yıldır çalışıyordu; okuyabilecek insanlar emekli olmuştu.","April 2020: New Jersey, Connecticut and Florida appeal for COBOL programmers. The code had run for 40 years; the people who could read it had retired."],"link":"decoder","src":"https://spectrum.ieee.org/tech-talk/computing/software/cobol-programmers-answer-call-unemployment-benefits-systems"},{"y":2024,"t":["Mart 2024: xz utils arka kapısı. Neredeyse her Linux dağıtımındaki bir kütüphanenin tükenmiş tek gönüllü bakımcısına yıllarca sosyal mühendislik; tesadüfen yakalandı.","March 2024: the xz utils backdoor. Years of social engineering against the exhausted lone volunteer maintaining a library in almost every Linux distro; caught by chance."],"link":"maintenance","src":"https://www.atlanticcouncil.org/content-series/the-5x5/the-5x5-the-xz-backdoor-trust-and-open-source-software/"}],"links":{"packet":["Çalışmadaki en iyi korunan paket. Kaynak kod, standartlar, makaleler ve Babbage'in çizim arşivi eksiksiz denecek kadar sağlam; kopyalama maliyeti sıfıra yakın. Tek istisna kapalı ikili dosyalar: mevcut ama okunamayan bir paket, kutuda kilitli bir mektup gibidir.","The best-preserved packet in this study. Source code, standards, papers and the Babbage drawing archive are close to complete, and copying costs almost nothing. The exception is closed binaries: a packet that is present but unreadable is a letter locked in its box."],"decoder":["Çalışmadaki en geniş çözücü tabanı — on milyonlarca insan program yazabiliyor ve açık kaynak bunu kitlesel hâle getirdi. Ama çözücü dile bağlı: COBOL, Fortran, ana bilgisayar JCL'si hâlâ bankaların ve devletlerin altında çalışıyor, okuyabilenlerin yaş ortalaması ise 45–60.","The widest decoder base in the study — tens of millions can program, and open source made that decoder a mass phenomenon. But decoding is language-specific: COBOL, Fortran and mainframe JCL still run underneath banks and governments, while the people who can read them average 45 to 60 years old."],"context":["Bilgisayarın en zayıf yazdığı şey gerekçedir. Kod hayatta kalır; 'bu şema neden böyle', 'bu zaman aşımı neden 30 saniye' sorusunun cevabı ekiple birlikte dağılır. RFC'ler ve tasarım belgeleri istisnadır — ve tam da bu yüzden en uzun ömürlü sistemler onlardır.","Rationale is the thing computing writes down worst. The code survives; the answer to 'why this schema', 'why is this timeout 30 seconds' disperses with the team that made it. RFCs and design documents are the exception — which is precisely why the systems built on them last longest."],"tacit":["Hata ayıklama, sistem sezgisi, kötü bir tasarımı adlandıramadan sezmek — hiçbiri belgede değil. Kod incelemesi ve birlikte programlama yoluyla çıraklıkla aktarılıyor; bağ sağlam ama junior işlerin üretilmiş kodla dolduğu ortamda çıraklık kanalı daralıyor.","Debugging, systems intuition, sensing a bad design before you can name it: none of it is in the documentation. It moves by apprenticeship — code review, pairing. The link is sound, but the apprenticeship channel narrows as junior work fills up with generated code."],"apparatus":["Öykünme ve sanallaştırma olgun: 1941'in Z3'ü de 1948'in Baby'si de bugün simüle edilebiliyor, yani makine ölse bile format yaşayabiliyor. Fiziksel ortam ise tersi: delikli kart, 8 inçlik disket, DAT bandı — çürüme okuyucu makinelerin ömründen hızlı.","Emulation and virtualisation are mature: a 1941 Z3 and a 1948 Baby can both be simulated today, so the format can outlive the machine. Physical media run the other way — punched cards, 8-inch floppies, DAT — decaying faster than the readers that can play them survive."],"maintenance":["Biçimsel olarak en güçlü bağ: sürüm kontrolü, paket depoları, dağıtımlar, sürekli entegrasyon. Toplumsal olarak en kırılganı: kritik kütüphanelerin çoğu ücretsiz çalışan tek tek insanların elinde. xz utils, koca bir zincirin yorgun tek bir kişinin üzerinde durabildiğini gösterdi.","Formally the strongest link: version control, package registries, distributions, continuous integration. Socially the most fragile: many critical libraries rest on single unpaid individuals. xz utils showed that an entire chain can balance on one exhausted person."]},"weakest":{"k":"context","why":["Bilgisayar, paketi (kod) ve çözücüyü (programcılar) çalışmadaki her üründen daha iyi koruyor; attığı şey gerekçe. 2020'de New Jersey'nin sorunu kodun kaybolması değildi — kod kusursuz çalışıyordu. Sorun, o kodun neden öyle yazıldığını, hangi kuralı, hangi kısıtı, hangi ödünleşmeyi kodladığını kimsenin söyleyememesiydi. Eski sistem tam olarak budur: canlı çözücüsü olan, ama bağlamı ölmüş bir paket — okunabilir, çalıştırılabilir, değiştirilemez. Babbage'in başarısızlığı da bir bağlam başarısızlığıydı: hükümete makinenin neden değerli olduğu, hükümetin değer verdiği terimlerle anlatılamadı.","Computing preserves the packet (code) and the decoder (programmers) better than any other product in this study; what it discards is rationale. New Jersey's problem in 2020 was not that the code was lost — the code ran perfectly. The problem was that nobody could say why it was written that way, which rule, which constraint, which trade-off it encoded. That is exactly what legacy is: a packet with a live decoder and a dead context — readable, runnable, unmodifiable. Babbage's failure was itself a context failure: no one could explain to the government why the machine was worth having in terms the government valued."]},"nearBreak":["Babbage'in yüzyılı. Robert Peel 1842'de devlet desteğini kesti; 1834'te tasarlanan ve 1840'a gelindiğinde büyük ölçüde tamamlanan Analitik Makine hiç inşa edilmedi. Babbage'in ömrü boyunca tamamlanan tek şey, 1 No'lu Fark Makinesi'nin yaklaşık 2.000 parçalık, yedide birlik bir gösteri parçasıydı. Zincirin kopmadığı tek nokta paketti: çizimler ve defterler arşive girdi ve orada kaldı. Bir Fark Makinesi'nin gerçekten çalıştığını görmek 1842'den 1991'e, yani 149 yıl sürdü — ve çalıştığında, Science Museum'un teknik açıklamasının kaydettiği gibi, hiçbir parçası 'Babbage'in kendi kalıntılarında gösterilebilir biçimde ulaştığı hassasiyetin' ötesine geçmiyordu. Kopan bağ paket ya da bağlam değildi; aygıt ve onu finanse edecek kurumsal iradeydi.","Babbage's century. Robert Peel cut government support in 1842; the Analytical Engine, conceived in 1834 and largely designed by 1840, was never built. The only thing completed in Babbage's lifetime was a one-seventh demonstration piece of Difference Engine No. 1, some 2,000 parts, assembled in 1832. The single link that never broke was the packet: the drawings and notebooks went into an archive and stayed there. It took from 1842 to 1991 — 149 years — for a working Difference Engine to exist, and when it did, as the Science Museum's technical description records, no part of it was made to a precision 'higher than was demonstrably achievable by Babbage' in his own surviving relics. The link that broke was not packet or context. It was apparatus, and the institutional will to pay for it."],"thesis":["Bu ürün, çalışmanın 'altı bağ birbirinden bağımsız kopar' iddiasının en temiz kanıtı: Babbage'de paket ve bağlam bir buçuk yüzyıl boyunca eksiksiz kaldı, yalnızca aygıt ve bakım koptu, ve kayıt eksiksiz olduğu için zincir sonradan yeniden kuruldu. Dürüst sınır: 2 No'lu Fark Makinesi elverişli bir örnektir. Çizimler alışılmadık ölçüde eksiksizdi, Science Museum ekibi yine de çizimlerdeki tutarsızlıkları ve eksikleri modern mühendislik yargısıyla gidermek zorunda kaldı — yani 'paket tek başına yetti' demek fazla cömert olur — ve 8.000 bronz ve dökme demir parçadan oluşan bir makineyi yeniden kurmak, bir kimyasal süreci ya da yaşayan bir zanaati yeniden kurmaktan çok daha bağışlayıcıdır.","This product is the cleanest proof of the study's claim that the six links fail independently: in Babbage's case packet and context stayed complete for a century and a half while apparatus and maintenance broke, and because the record was complete the chain could be rebuilt afterwards. Honest limit: Difference Engine No. 2 is a favourable case. The drawings were unusually complete, and even so the Science Museum's engineers had to resolve inconsistencies and omissions in them with modern judgement — so 'the packet alone sufficed' would be too generous — and reconstructing a machine of 8,000 bronze and cast-iron parts is far more forgiving than reconstructing a chemical process or a living craft."],"sources":[{"t":["2 No'lu Fark Makinesi – Teknik Açıklama (Science Museum)","Difference Engine No. 2 – Technical Description (Science Museum)"],"m":["8.000 parça, 5 ton, 7. dereceden polinom, 31 basamak; hesaplama bölümü 1991, baskı düzeneği Mart 2002; Babbage'in hassasiyetini aşmama ilkesi.","8,000 parts, 5 tonnes, 7th-order polynomials to 31 places; calculating section 1991, printing apparatus March 2002; the rule not to exceed Babbage's own precision."],"u":"https://www.sciencemuseum.org.uk/sites/default/files/2023-09/DE2_Technical_Description.pdf"},{"t":["Babbage Motoru: Modern Bir Devam – Computer History Museum","The Babbage Engine: A Modern Sequel – Computer History Museum"],"m":["'Tamamlanan makine Babbage'in amaçladığı gibi çalışıyor' ve başarısızlığın teknolojiden çok siyaset ve ekonomiyle ilgili olduğu değerlendirmesi.","'The completed machine works as Babbage intended', and the judgement that the 19th-century failure was as much about politics and economics as technology."],"u":"https://www.computerhistory.org/babbage/modernsequel/"},{"t":["ENIAC patentiyle ilgili gelişmeler – History of Information","Key Developments Concerning the ENIAC Patent – History of Information"],"m":["30 Haziran 1945'te 24 kişiye dağıtım, 1947'de patent avukatının uyarısı ve 19 Ekim 1973 Honeywell–Sperry Rand kararı.","The 30 June 1945 circulation to 24 people, the patent attorney's 1947 warning, and the Honeywell v. Sperry Rand ruling of 19 October 1973."],"u":"https://www.historyofinformation.com/detail.php?id=639"},{"t":["COBOL programcıları çağrıya yanıt veriyor – IEEE Spectrum","COBOL Programmers Answer Call – IEEE Spectrum"],"m":["Nisan 2020'de New Jersey, Connecticut ve Florida'nın çağrısı; 40 yıllık sistemler; COBOL'un ATM işlemlerindeki payı ve programcıların yaş aralığı.","The April 2020 appeals from New Jersey, Connecticut and Florida; 40-year-old systems; COBOL's share of ATM transactions and the age range of its programmers."],"u":"https://spectrum.ieee.org/tech-talk/computing/software/cobol-programmers-answer-call-unemployment-benefits-systems"},{"t":["5x5: xz arka kapısı, güven ve açık kaynak – Atlantic Council","The 5x5: The XZ backdoor, trust and open source software – Atlantic Council"],"m":["Mart 2024 olayının ayrıntısı: 2022'den beri süren sosyal mühendislik, tek bakımcının tükenmişliği ve tesadüfen yakalanması.","The March 2024 incident in detail: social engineering running since 2022, the sole maintainer's exhaustion, and the discovery by chance."],"u":"https://www.atlanticcouncil.org/content-series/the-5x5/the-5x5-the-xz-backdoor-trust-and-open-source-software/"}]},{"id":"internet","cat":"info","civ":"modern","icon":"🌐","name":["İnternet","The internet"],"era":["1969 – günümüz","1969 – present"],"hook":["İnternetin ilk mesajı, 29 Ekim 1969 saat 22:30'da, 'lo' oldu: Charley Kline 'login' yazarken sistem iki harften sonra çöktü. Bugün o ağın kök güven anahtarı hâlâ yılda dört kez, iki odada, satır satır yazılmış bir törenle imzalanıyor.","The internet's first message, at 22:30 on 29 October 1969, was 'lo': Charley Kline typed 'login' and the system crashed after two characters. Today that same network's root of trust is still signed four times a year, in two rooms, from a line-by-line script."],"timeline":[{"y":1969,"t":["7 Nisan 1969: Steve Crocker RFC 1'i yayımlar. Seri herkese açık, ücretsiz ve bugün 10.000'inci numarayı geçmiş durumda — 57 yıldır yaşayan tek belge dizisi.","7 April 1969: Steve Crocker publishes RFC 1. The series is open to anyone, free to read, and has now passed number 10,000 — a single living document series, 57 years old."],"link":"packet","src":"https://www.internetsociety.org/blog/2019/04/celebrating-50-years-of-the-rfcs-that-define-how-the-internet-works/"},{"y":1969,"t":["29 Ekim 1969, 22:30: UCLA'dan SRI'ya ilk ana bilgisayar mesajı. 'login' yazılırken sistem 'l' ve 'o'dan sonra çöker; tam giriş yaklaşık bir saat sonra yapılır.","29 October 1969, 22:30: the first host-to-host message, UCLA to SRI. The system crashes after 'l' and 'o' of 'login'; the full login succeeds about an hour later."],"link":"apparatus","src":"https://www.lk.cs.ucla.edu/internet_first_words.html"},{"y":1974,"t":["Mayıs 1974: Cerf ve Kahn'ın 'A Protocol for Packet Network Intercommunication' makalesi (IEEE Trans. Comm. COM-22/5, 627–641) internetin gerekçesini yazar.","May 1974: Cerf and Kahn's 'A Protocol for Packet Network Intercommunication' (IEEE Trans. Comm. COM-22(5), 627–641) writes down the internet's rationale."],"link":"context","src":"https://www.internetsociety.org/internet/history-internet/brief-history-internet/"},{"y":1983,"t":["Kasım 1981'de Postel'in RFC 801'i tarihi koyar; 1 Ocak 1983'te ARPANET NCP'yi bırakıp TCP/IP'ye geçer. Bütün ağ, ilan edilmiş tek bir günde göç eder.","Postel's RFC 801 of November 1981 sets the date; on 1 January 1983 ARPANET drops NCP for TCP/IP. An entire network migrates on one announced day."],"link":"maintenance","src":"https://www.rfc-editor.org/rfc/rfc801.txt"},{"y":1989,"t":["1989: Berners-Lee CERN'de bir hipermetin bilgi sistemi önerir; ilk web sitesi kendi NeXT makinesinde yayına girer, 1992'de satır modlu tarayıcı yaygınlaşır.","1989: Berners-Lee proposes a hypertext information system at CERN; the first website goes live on his own NeXT machine, and a line-mode browser spreads it from 1992."],"link":"apparatus","src":"https://home.cern/science/computing/birth-web"},{"y":1993,"t":["30 Nisan 1993: CERN, web istemcisini, sunucusunu ve ortak kod kütüphanesini kamu malı ilan eder. Belgeyi müdürler W. Hoogland ve H. Weber imzalar.","30 April 1993: CERN places the web client, server and common code library in the public domain. The document is signed by directors W. Hoogland and H. Weber."],"link":"decoder","src":"https://www.w3.org/History/1995/WWW/Paper/cern-www-conditions.txt"},{"y":2008,"t":["24 Şubat 2008: Pakistan Telekom YouTube'u yurt içinde engellemek için bir rota duyurur; rota transit sağlayıcılara sızar ve YouTube dünyanın büyük kısmında kararır.","24 February 2008: Pakistan Telecom announces a route to block YouTube domestically; the route leaks to its transit providers and YouTube goes dark for much of the world."],"link":"context","src":"https://nanog.org/stories/articles/a-brief-history-of-the-internets-biggest-bgp-incidents/"},{"y":2010,"t":["16 Haziran 2010: ilk kök KSK töreni Culpeper'da yapılır. O günden beri kök güven anahtarı yılda dört kez, iki tesiste, senaryolu bir törenle imzalanıyor.","16 June 2010: the first root KSK ceremony is held at Culpeper. Since then the root of trust has been signed four times a year, in two facilities, from a script."],"link":"maintenance","src":"https://www.iana.org/dnssec/ceremonies"}],"links":{"packet":["Çalışmadaki en dikkat çekici paket RFC dizisi: 7 Nisan 1969'da başladı, 10.000 numarayı geçti, hiçbir zaman kapanmadı, hiçbir zaman ücretli olmadı. Ölü protokoller bile silinmiyor — NCP'nin belgeleri hâlâ yerinde. Nadir bir özellik: paket yalnızca ne yapıldığını değil, neyin denenip bırakıldığını da taşıyor.","The most remarkable packet in the study is the RFC series: begun 7 April 1969, past number 10,000, never closed, never paywalled. Even dead protocols are not deleted — the NCP documents are still there. That is rare: the packet carries not only what was done but what was tried and abandoned."],"decoder":["İki katmanlı bir çözücü. Üst katman muazzam: milyarlarca kullanıcı, milyonlarca web geliştiricisi. Alt katman ince: BGP politikası yazabilen, bir kök bölge dosyasını doğrulayabilen, IETF'te bir taslağı savunabilen insan sayısı birkaç bin. Zinciri taşıyan alt katman.","A two-layer decoder. The upper layer is enormous: billions of users, millions of web developers. The lower layer is thin: the number of people who can write BGP policy, validate a root zone file, or defend a draft at the IETF runs to a few thousand. The lower layer is the one carrying the chain."],"context":["İnternetin gerekçesi olağandışı biçimde iyi yazılmış — Cerf–Kahn 1974, RFC 801, tasarım tartışmalarının tamamı arşivde. Ama işleyen şeylerin bir kısmı yazılı kuralda değil, sözleşmede: BGP'de bir yönlendirici, komşusunun söylediğine inanır. 2008'de Pakistan olayı bunun bir mekanizma değil, bir teamül olduğunu gösterdi.","The internet's rationale is unusually well written down — Cerf–Kahn 1974, RFC 801, the whole design argument in the archive. But part of what makes it work is convention rather than rule: in BGP a router believes what its neighbour tells it. The Pakistan incident of 2008 showed that this is a custom, not a mechanism."],"tacit":["Ağ işletmeciliği büyük ölçüde yazılmamış bilgidir: bir kesintiyi koklamak, hangi komşuyu ne zaman arayacağını bilmek, bir sızıntının nerede başladığını on dakikada görmek. Operatör listeleri ve NANOG gibi buluşmalar bu bilginin taşıyıcısı; kurum değil, tanıdıklık ağı.","Network operations is largely unwritten knowledge: smelling an outage, knowing which neighbour to phone and when, seeing in ten minutes where a leak began. Operator mailing lists and gatherings such as NANOG are its carriers — a web of acquaintance rather than an institution."],"apparatus":["İnternetin aygıtı bilinçli olarak katmanlı: IP, altındaki fiziksel taşıyıcıya kayıtsız kalacak biçimde tasarlandı, bu yüzden bakır, fiber, uydu ve radyo kuşakları boyunca değişirken protokol yaşamayı sürdürdü. Bu, çalışmadaki en dayanıklı aygıt bağı.","The internet's apparatus is deliberately layered: IP was designed to be indifferent to whatever carries it, so the protocol survived while copper, fibre, satellite and radio changed underneath it across generations. This is the most durable apparatus link in the study."],"maintenance":["Biçimsel olarak canlı ama insan olarak ince. 13 kök sunucu kimliği yaklaşık on iki kuruluş tarafından işletiliyor; kök imzalama anahtarı Los Angeles ve Culpeper'daki iki odada, yılda dört kez, yirmi bir kişilik bir güvenilir topluluk temsilcisi havuzuyla imzalanıyor. IANA, RFC Editor ve IETF de benzer ölçekte küçük.","Formally alive, humanly thin. Thirteen root-server identities are run by around a dozen organisations; the root signing key is signed in two rooms, in Los Angeles and Culpeper, four times a year, drawing on a pool of twenty-one Trusted Community Representatives. IANA, the RFC Editor and the IETF are small on a similar scale."]},"weakest":{"k":"maintenance","why":["İnternetin paketi (RFC'ler) ve bağlamı (tasarım tartışmaları) çalışmadaki en iyi yazılmış kayıtlar arasında; aygıtı katmanlı olduğu için kuşaklar boyunca hayatta kaldı. Kırılgan olan, hepsini ayakta tutan insan katmanı. Kök bölge, on iki kadar kuruluşun işlettiği on üç sunucu kimliğine bağlı; kök güven anahtarı, yılda dört kez iki odada toplanan yirmi bir kişilik bir temsilci havuzuyla imzalanıyor; adres tahsisi IANA'da, standartlar IETF'te, belgeler RFC Editor'da — hepsi birkaç yüz kişilik yapılar. Üstelik yönlendirmenin kendisi güvene dayanıyor: 24 Şubat 2008'de tek bir operatörün yurt içi engelleme girişimi, transit sağlayıcıları üzerinden YouTube'u dünyanın büyük kısmında kararttı. Bu bir rahip sınıfıdır — yetkin, açık ve iyi niyetli, ama sayıca çok küçük ve büyük ölçüde gönüllü.","The internet's packet (the RFCs) and its context (the design arguments) are among the best-written records in this study, and its layered apparatus has survived generations of physical change. What is fragile is the human layer holding all of it up. The root zone depends on thirteen server identities run by around a dozen organisations; the root of trust is signed by a pool of twenty-one representatives meeting in two rooms four times a year; addressing sits with IANA, standards with the IETF, documents with the RFC Editor — all bodies of a few hundred people. And routing itself runs on trust: on 24 February 2008 one operator's attempt at a domestic block, leaked through its transit providers, blacked out YouTube for much of the world. This is a priesthood — competent, open and well-intentioned, but very small and largely voluntary."]},"nearBreak":["Nisan 1997, AS7007 olayı. Tek bir yönlendiricideki yazılım hatası, küresel yönlendirme tablosunun büyük bölümünü kendi üzerinden geçiyormuş gibi duyurdu; dünyanın trafiği taşıyamayacağı bir ağa çekildi ve düştü. NANOG'un derlediği kayda göre bu, yönlendirme sızıntısının yol açtığı ilk büyük internet kesintisiydi. On bir yıl sonra aynı yapısal açık tekrarlandı: 24 Şubat 2008'de Pakistan Telekom, YouTube'u yurt içinde engellemek için daha özgül bir rota duyurdu, rota transit sağlayıcılarına geçti ve oradan tüm dünyaya yayıldı. İki olayın ortak dersi tekniktir ama sonucu kurumsaldır: BGP'de doğrulama yoktur, komşunun sözü esastır. Zincirin bu bağı bir mekanizmayla değil, birkaç bin operatörün birbirine duyduğu güvenle ve birbirini arayabilmesiyle ayakta duruyor.","April 1997, the AS7007 incident. A software fault on one router announced a large part of the global routing table as originating with it; the world's traffic was drawn into a network that could not carry it and was dropped. In NANOG's account this was the first major internet disruption caused by a routing leak. Eleven years later the same structural gap repeated: on 24 February 2008 Pakistan Telecom announced a more-specific route to block YouTube domestically, the route passed to its transit providers, and from there it went worldwide. The shared lesson is technical but the consequence is institutional: BGP has no validation, and a neighbour's word is taken as true. This link of the chain stands not on a mechanism but on the trust a few thousand operators place in each other, and on their being able to pick up the phone."],"thesis":["Bu ürün, çalışmanın 'bakım bağı, paket ne kadar iyi yazılmış olursa olsun ayrı bir kırılganlıktır' iddiasını destekliyor; ayrıca bir zincirin kasıtlı olarak açılabileceğini gösteriyor — 30 Nisan 1993'te CERN, web'i kamu malı ilan ederek çözücü bağını gizlilikle daraltmak yerine bilerek genişletti ve bugünkü ölçek büyük ölçüde o kararın sonucudur. Dürüst sınır: internet henüz kuşak değişimi sınavını tam olarak vermedi. RFC 1'den bu yana 57 yıl geçti; kurucu kuşak henüz tümüyle sahneden çekilmedi, dolayısıyla 'küçük bakım kadrosu' modelinin ikinci ya da üçüncü nesle sorunsuz devredilip devredilemeyeceğini gerçekte bilmiyoruz.","This product supports the study's claim that maintenance is a separate fragility no matter how well the packet is written; it also shows that a chain can be opened deliberately — on 30 April 1993 CERN put the web in the public domain, widening the decoder link on purpose instead of narrowing it with secrecy, and today's scale largely follows from that decision. Honest limit: the internet has not yet fully faced the generational test. Fifty-seven years have passed since RFC 1, but the founding cohort has not entirely left the stage, so we do not actually know whether the small-maintenance-crew model hands over cleanly to a second or third generation."],"sources":[{"t":["İnternetin ilk sözleri – Leonard Kleinrock, UCLA","The first words of the internet – Leonard Kleinrock, UCLA"],"m":["Olayın içinde bulunan kişinin birinci elden anlatımı: 29 Ekim 1969, 22:30, Charley Kline, 'lo' ve bir saat sonraki tam giriş.","A first-hand account by the supervising professor: 29 October 1969 at 22:30, Charley Kline, 'lo', and the full login about an hour later."],"u":"https://www.lk.cs.ucla.edu/internet_first_words.html"},{"t":["RFC 801: NCP/TCP Geçiş Planı – Jon Postel","RFC 801: NCP/TCP Transition Plan – Jon Postel"],"m":["Bayrak gününün birincil kaynağı: Kasım 1981 tarihli plan, 1 Ocak 1983 hedefi ve ara dönem için ikili protokol köprüleri.","The primary source for the flag day: the November 1981 plan, the target of 1 January 1983, and the dual-protocol relays for the interim."],"u":"https://www.rfc-editor.org/rfc/rfc801.txt"},{"t":["CERN W3 yazılımının dağıtım koşulları (1993) – W3C arşivi","CERN's conditions for distributing W3 software (1993) – W3C archive"],"m":["Belgenin metni: satır modlu istemci, temel sunucu ve ortak kod kütüphanesi kamu malı; imzalar W. Hoogland ve H. Weber.","The text of the document: line-mode client, basic server and common code library placed in the public domain; signed by W. Hoogland and H. Weber."],"u":"https://www.w3.org/History/1995/WWW/Paper/cern-www-conditions.txt"},{"t":["Kök KSK törenleri – IANA","Root KSK Ceremonies – IANA"],"m":["İlk törenin 16 Haziran 2010'da Culpeper'da yapıldığını, törenlerin yılda dört kez düzenlendiğini ve planlanan tören sayısını doğrular.","Confirms the first ceremony on 16 June 2010 at Culpeper, that ceremonies are held four times a year, and the full scheduled list."],"u":"https://www.iana.org/dnssec/ceremonies"},{"t":["İnternetin en büyük BGP olaylarının kısa tarihi – NANOG","A Brief History of the Internet's Biggest BGP Incidents – NANOG"],"m":["1997 AS7007 sızıntısı ve 24 Şubat 2008 Pakistan–YouTube olayının operatör topluluğunca yazılmış kaydı.","The operator community's own record of the 1997 AS7007 leak and the Pakistan–YouTube incident of 24 February 2008."],"u":"https://nanog.org/stories/articles/a-brief-history-of-the-internets-biggest-bgp-incidents/"}]},{"id":"ai","cat":"info","civ":"modern","icon":"🧠","name":["Yapay zekâ","Artificial intelligence"],"era":["1943 – günümüz","1943 – present"],"hook":["Bugünkü yapay zekânın çekirdek fikirleri — 1943'te yapay nöron, 1958'de algılayıcı, 1974 ve 1986'da geri yayılım — iki kez terk edildi. Aynı paketler üçüncü denemede işe yaradı: değişen fikirler değil, iki ekran kartı ve milyonlarca etiketli görüntüydü.","The core ideas of today's AI — the artificial neuron in 1943, the perceptron in 1958, backpropagation in 1974 and 1986 — were abandoned twice. The same packets worked on the third attempt: what changed was not the ideas but two graphics cards and millions of labelled images."],"timeline":[{"y":1943,"t":["Aralık 1943: McCulloch ve Pitts, sinir olaylarının önermeler mantığıyla ele alınabileceğini gösterir (Bull. Math. Biophys. 5, 115–133). Yapay nöron doğar.","December 1943: McCulloch and Pitts show that neural events can be treated by propositional logic (Bull. Math. Biophys. 5, 115–133). The artificial neuron is born."],"link":"packet","src":"https://link.springer.com/article/10.1007/BF02478259"},{"y":1955,"t":["31 Ağustos 1955: McCarthy, Minsky, Rochester ve Shannon'ın Dartmouth önerisi alana adını verir; 1956 yazındaki çalıştay bir topluluk kurar — çözücü doğar.","31 August 1955: the Dartmouth proposal by McCarthy, Minsky, Rochester and Shannon names the field; the summer 1956 workshop creates a community — the decoder is born."],"link":"decoder","src":"https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1904"},{"y":1958,"t":["Temmuz 1958: Rosenblatt'ın algılayıcısı Deniz Kuvvetleri Araştırma Ofisi'yle bir IBM 704 üzerinde tanıtılır. Vaatler tek katmanın yapabileceğini fazlasıyla aşar.","July 1958: Rosenblatt's perceptron is demonstrated with the Office of Naval Research on an IBM 704. The claims made for it run well past what one layer can do."],"link":"context","src":"https://news.cornell.edu/stories/2019/09/professors-perceptron-paved-way-ai-60-years-too-soon"},{"y":1973,"t":["Minsky–Papert'in 1969 'Perceptrons'u ve Lighthill'in 1973'te yayımlanan raporu: Britanya'da yapay zekâ araştırması üç üniversite dışında sökülür, DARPA kesintileri izler.","Minsky and Papert's Perceptrons (1969) and the Lighthill report, published 1973: AI research in Britain is dismantled outside three universities, and DARPA cuts follow."],"link":"maintenance","src":"https://en.wikipedia.org/wiki/AI_winter"},{"y":1986,"t":["Werbos geri yayılımı 1974 Harvard tezinde anlatır ve fark edilmez. Rumelhart, Hinton ve Williams 9 Ekim 1986'da Nature'da yeniden yayımlar; bu kez okunur.","Werbos describes backpropagation in his 1974 Harvard thesis and is overlooked. Rumelhart, Hinton and Williams republish it in Nature on 9 October 1986; now it is read."],"link":"decoder","src":"https://www.nature.com/articles/323533a0"},{"y":1987,"t":["1987: özel yapay zekâ donanımı pazarı — yarım milyar dolarlık bir sektör — tek bir yılda silinir; DARPA'nın Stratejik Hesaplama bütçesi sert biçimde kesilir.","1987: the specialised AI hardware market — an industry worth about half a billion dollars — is wiped out in a single year, and DARPA's Strategic Computing money is cut."],"link":"maintenance","src":"https://en.wikipedia.org/wiki/AI_winter"},{"y":2012,"t":["AlexNet, ImageNet'te ilk beş hata oranını %15,3'e düşürür; ikinci %26,2'de kalır. Eğitim, iki GTX 580 kartında beş-altı gün sürer. Değişen paket değil, aygıttır.","AlexNet cuts ImageNet's top-5 error to 15.3% against 26.2% for the runner-up, after five to six days on two GTX 580 cards. The apparatus changed, not the packet."],"link":"apparatus","src":"https://cvml.ista.ac.at/courses/DLWT_W17/material/AlexNet.pdf"},{"y":2017,"t":["12 Haziran 2017: 'Attention Is All You Need' yinelemeyi ve evrişimi tümüyle bırakan Transformer mimarisini önerir; bugünkü büyük modellerin ortak paketi olur.","12 June 2017: 'Attention Is All You Need' proposes the Transformer, dropping recurrence and convolution entirely; it becomes the shared packet of today's large models."],"link":"packet","src":"https://arxiv.org/abs/1706.03762"}],"links":{"packet":["Olağanüstü güçlü: makaleler arXiv'de saatler içinde ücretsiz yayılıyor ve 1943, 1958, 1974, 1986 paketlerinin hepsi kendi terk edilişlerini sağ atlattı — kütüphane rafında bekleyerek. Zayıflayan yön, ağırlıkların ve eğitim verisinin giderek kapanması: yayımlanan makale artık üretilen sistemi tam tarif etmiyor.","Extraordinarily strong: papers spread free on arXiv within hours, and the packets of 1943, 1958, 1974 and 1986 all survived their own abandonment simply by sitting on a library shelf. The weakening edge is that weights and training data are increasingly closed: the published paper no longer fully describes the system that was built."],"decoder":["Geniş ama sığ. Milyonlarca insan bir API çağırabilir; bir modeli sıfırdan eğitebilenler çok daha az; sınır ölçekte eğitim yığınını gerçekten anlayan birkaç bin kişi. Piramidin tepesi, çalışmadaki herhangi bir ürünün taşıyıcı katmanından daha dar.","Broad but shallow. Millions can call an API; far fewer can train a model from scratch; a few thousand genuinely understand the frontier training stack. The top of that pyramid is narrower than the carrying layer of any other product in this study."],"context":["En ince bağ. Sistemleri kurabiliyor, kopyalayabiliyor ve dağıtabiliyoruz; içeride ne olup bittiğini tam olarak açıklayamıyoruz. DARPA bunu 2016'da XAI programını kurarken makinelerin 'kararlarını ve eylemlerini insan kullanıcılara açıklayamama' sorunu diye adlandırdı; o tarihten bu yana modeller büyüdükçe aradaki mesafe açıldı.","The thinnest link. We can build, copy and deploy these systems, and we cannot fully explain what happens inside them. DARPA named this in 2016 when it founded the XAI programme, calling it machines' 'current inability to explain their decisions and actions to human users'; the gap has widened as models have grown since."],"tacit":["Gerçek ve neredeyse tümüyle yazısız: hiperparametre sezgisi, veri temizliğinde yargı, bir eğitim koşusunun ne zaman raydan çıktığını kayıp eğrisine bakarak anlamak. Birkaç yüz laboratuvarda yaşıyor ve yalnızca insanlar iş değiştirdiğinde yer değiştiriyor — kâğıtla değil, transferle taşınıyor.","Real and almost entirely unwritten: hyperparameter intuition, judgement in data cleaning, knowing from a loss curve when a training run has gone wrong. It lives in a few hundred labs and moves only when people move — carried by transfer, not by paper."],"apparatus":["Her şeyi değiştiren bağ — ve şimdi tek yoğunlaşma noktası. 2012'de iki oyun kartı yeterliydi; bugün sınır eğitimi, avuç dolusu çip tasarımcısına, birkaç dökümhaneye ve az sayıda veri merkezine bağlı. Paket herkese açıkken, onu çalıştıracak aygıt tarihte hiç olmadığı kadar dar.","The link that changed everything — and now the single point of concentration. In 2012 two gaming cards sufficed; today frontier training depends on a handful of chip designers, a few foundries and a small number of data centres. The packet is open to all while the apparatus that can run it is narrower than at any point in its history."],"maintenance":["Bugün kurumsal olarak güçlü — para, hesaplama gücü, kariyer yolu, hepsi yerinde. Ama tarihsel olarak iki kez kopan bağ tam olarak buydu. Yeni bir aşınma biçimi de eklendi: modeller kendi çıktılarıyla eğitildiğinde dağılımın kuyrukları kayboluyor (Nature, 24 Temmuz 2024) — yani bakımın kopyaladığı malzemenin kendisi bozulabiliyor.","Institutionally strong today — funding, compute and career paths are all in place. But this is precisely the link that broke twice. A new form of erosion has been added: when models are trained on their own output the tails of the distribution disappear (Nature, 24 July 2024) — the material that maintenance copies can itself degrade."]},"weakest":{"k":"context","why":["Yapay zekâ, çalışmadaki tek üründür ki paketi, onu anlayışımızdan güçlüdür. Ağırlıkları bit bit kopyalayabiliyoruz; neden çalıştıklarını söyleyemiyoruz. Bu, bağlam bağının tanımı gereği kopuk olması demektir: bağlam 'neden işe yarıyor ve sınırları nerede' bilgisidir, ve bir sistemin sınırlarını söyleyemiyorsanız onları bir sonraki kuşağa öğretemezsiniz. Üstelik bu, alanın ilk kez yaşadığı bir kusur değil. 1958'de algılayıcı için yapılan vaatler tek katmanın yapabileceğini aştı ve 1969'daki tepki bu boşluğa oturdu; 1980'lerde uzman sistemler için yapılanlar da öyle. İki yapay zekâ kışının ortak nedeni, sistemlerin çalışmaması değil, alanın nelerin yapılabilir olduğunu doğru söyleyememesiydi. Bugün yetenek çok daha büyük; bağlam açığı aynı yerde duruyor.","AI is the only product in this study whose packet is stronger than our understanding of it. We can copy the weights bit for bit and cannot say why they work. That is a broken context link by definition: context is the knowledge of why something works and where it fails, and if you cannot state a system's limits you cannot teach them to the next generation. Nor is this a first-time flaw. The claims made for the perceptron in 1958 ran past what a single layer could do, and the 1969 backlash landed in that gap; the same happened with expert systems in the 1980s. The shared cause of both AI winters was not that the systems failed to work but that the field could not accurately say what was and was not possible. Today the capability is far greater; the context deficit sits in the same place."]},"nearBreak":["İki yapay zekâ kışı — aynı zincirin aynı bağının iki kez kopuşu. Birincisi: Minsky ve Papert'in 1969'daki 'Perceptrons' kitabı tek katmanlı ağların sınırlarını öne çıkardı, ardından Lighthill'in Bilim Araştırma Konseyi için hazırlayıp 1973'te yayımlanan raporu geldi; Britanya'da yapay zekâ araştırması Edinburgh, Essex ve Sussex dışında sökülmüş oldu ve Mansfield Değişikliği sonrası DARPA da akademik desteği kesti. İkincisi: 1987'de özel yapay zekâ donanımı pazarı, yaklaşık yarım milyar dolarlık bütün bir sektör, tek bir yıl içinde genel amaçlı iş istasyonlarınca silindi; DARPA'nın Stratejik Hesaplama parası aynı dönemde sert biçimde kesildi. Her iki kışta da paketler yerli yerinde durdu — makaleler kütüphanelerdeydi, kimse onları yakmadı. Kopan şey, çözücüyü besleyen kurumlardı: bütçeler, kadrolar, doktora programları, kariyer beklentisi. Zincir, birkaç yüz kişinin kendi kariyer riskini üstlenerek okumayı sürdürmesiyle taşındı; ACM 27 Mart 2019'da Bengio, Hinton ve LeCun'a Turing Ödülü'nü verirken tam olarak bunu, yaklaşımın kuşkuyla karşılandığı yıllarda sürdürülmesini kaydetti.","The two AI winters — the same link of the same chain breaking twice. First: Minsky and Papert's Perceptrons (1969) foregrounded the limits of single-layer networks, and then came Lighthill's report for the Science Research Council, published in 1973; AI research in Britain was dismantled outside Edinburgh, Essex and Sussex, and after the Mansfield Amendment DARPA cut its academic support too. Second: in 1987 the specialised AI hardware market — an entire industry worth roughly half a billion dollars — was wiped out within a single year by general-purpose workstations, and DARPA's Strategic Computing money was cut hard in the same period. In both winters the packets stayed exactly where they were: the papers sat in libraries and nobody burned them. What broke was the institutions feeding the decoder — budgets, posts, doctoral programmes, the expectation of a career. The chain was carried by a few hundred people who kept reading at their own professional risk; when ACM gave Bengio, Hinton and LeCun the Turing Award on 27 March 2019, it recorded precisely that: persistence through years when the approach was met with skepticism."],"thesis":["Bu ürün, çalışmanın 'bakım bağı paketten bağımsızdır ve kaybı, kayıt sağ kaldığı sürece onlarca yıl sonra geri alınabilir' iddiasını destekliyor: 1943, 1958 ve 1974 paketleri iki kurumsal çöküşü hiç değişmeden atlattı. Dürüst sınır: 2012'deki dönüş, eski paketin saf bir doğrulanması değildi. 1986'nın geri yayılımı, 2012'de işe yarayan şeyin kendisi değildi; ImageNet'in milyonlarca etiketli görüntüsü ve iki GPU bağımsız olarak ortaya çıkan yeni girdilerdi. Yani bu vaka, hayatta kalan bir paketin gerekli olduğunu gösteriyor — yeterli olduğunu değil. Aygıt ve veri kendiliğinden gelmeseydi, paket bugün de rafta bekliyor olacaktı.","This product supports the study's claim that maintenance is independent of the packet and that its loss can be reversed decades later so long as the record survives: the packets of 1943, 1958 and 1974 came through two institutional collapses unchanged. Honest limit: the return in 2012 was not a pure vindication of the old packet. Backpropagation as of 1986 was not itself the thing that worked in 2012; ImageNet's millions of labelled images and two GPUs were new inputs that arrived independently. So this case shows that a surviving packet is necessary — not that it is sufficient. Had the apparatus and the data not turned up on their own, the packet would still be sitting on the shelf."],"sources":[{"t":["Geri yayılımla temsil öğrenme – Nature 323, 533–536","Learning representations by back-propagating errors – Nature 323, 533–536"],"m":["Rumelhart, Hinton ve Williams'ın 9 Ekim 1986 tarihli makalesi: 1974'te göz ardı edilen paketin yeniden dolaşıma girdiği an.","The Rumelhart, Hinton and Williams paper of 9 October 1986: the moment the packet overlooked in 1974 re-entered circulation."],"u":"https://www.nature.com/articles/323533a0"},{"t":["Derin evrişimli ağlarla ImageNet sınıflandırması (AlexNet)","ImageNet Classification with Deep Convolutional Neural Networks (AlexNet)"],"m":["%15,3'e karşı %26,2 ilk-beş hata oranı ve iki GTX 580 üzerinde beş-altı günlük eğitim: aygıtın belirleyici olduğunun sayısal kanıtı.","The 15.3% versus 26.2% top-5 error and five-to-six days of training on two GTX 580s: the numerical evidence that the apparatus was decisive."],"u":"https://cvml.ista.ac.at/courses/DLWT_W17/material/AlexNet.pdf"},{"t":["Attention Is All You Need – arXiv:1706.03762","Attention Is All You Need – arXiv:1706.03762"],"m":["12 Haziran 2017 tarihli ilk sürüm; yineleme ve evrişimi tümüyle bırakan mimarinin birincil kaydı.","The first version, submitted 12 June 2017: the primary record of the architecture that dispensed with recurrence and convolution."],"u":"https://arxiv.org/abs/1706.03762"},{"t":["Açıklanabilir Yapay Zekâ (XAI) – DARPA","Explainable Artificial Intelligence (XAI) – DARPA"],"m":["Bağlam açığının kurumsal ifadesi: makinelerin 'kararlarını ve eylemlerini insan kullanıcılara açıklayamaması'. Program tamamlandı, sorun sürüyor.","The institutional statement of the context gap: machines' 'current inability to explain their decisions and actions to human users'. The programme has ended; the problem has not."],"u":"https://www.darpa.mil/research/programs/explainable-artificial-intelligence"},{"t":["Yinelemeli üretilmiş veriyle eğitilen modeller çöker – Nature 631, 755–759","AI models collapse when trained on recursively generated data – Nature 631, 755–759"],"m":["24 Temmuz 2024: model çıktısıyla beslenen eğitimin dağılımın kuyruklarını yok ettiğini gösteren birincil bulgu.","24 July 2024: the primary finding that training on model output destroys the tails of the distribution."],"u":"https://www.nature.com/articles/s41586-024-07566-y"}]},{"id":"iznik","cat":"loss","civ":"ottoman","icon":"🏺","name":["İznik çinisi","Iznik ceramics"],"era":["1480'ler → bugün","1480s → today"],"hook":["Nesne kusursuz korundu, tarif hiç yazılmadı. İznik'in kuvars hamurunu bugün biliyoruz; çünkü onu bir metinden okumadık, kırıklarından geri hesapladık.","The object survived intact; the recipe was never written. We know the Iznik quartz body today not because we read it in a text, but because we back-calculated it from the sherds."],"timeline":[{"y":1480,"t":["İznik'te kuvars esaslı beyaz hamur ve sıraltı kobalt tekniği yerleşir; desen sarayın nakkaşhânesinden gelir, pişirim taşrada yapılır.","A quartz-based white body with underglaze cobalt takes hold at Iznik; the designs come from the palace studio, the firing stays in a provincial town."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/Iznik_pottery"},{"y":1557,"t":["Süleymaniye için yapılan kandil: bol kırmızısının tarihlenebilen ilk İznik örneği. Kırmızı burada hâlâ ince ve düzensiz sürülmüştür.","The lamp made for the Süleymaniye: the earliest dateable Iznik piece carrying bole red. Here the red is still thin and unevenly applied."],"link":"packet","src":"https://collections.vam.ac.uk/item/O9232/lamp-unknown"},{"y":1560,"t":["Kabartma bol kırmızısı olgunlaşır, sıraltı paleti tamamlanır; İznik'in zirvesi sayılan kırk yıl başlar. Çini ölçüsü 25 cm'de standartlaşır.","Relief bole red matures and the underglaze palette is complete; the forty years counted as Iznik's peak begin. Tile size standardises at 25 cm."],"link":"tacit","src":"https://islamicceramics.ashmolean.org/Iznik/peak.htm"},{"y":1617,"t":["Sultan Ahmed Camii tamamlanır: yirmi binden fazla çini. Ustaların bu iş sürerken başkasına çalışması yasaklanır, sabit fiyat enflasyonu emer.","Sultan Ahmed Mosque is completed: over 20,000 tiles. Potters are forbidden to work for others meanwhile, while fixed prices absorb the inflation."],"link":"maintenance","src":"https://islamicceramics.ashmolean.org/Iznik/c17th.htm"},{"y":1648,"t":["Evliya Çelebi İznik'te dokuz atölye sayar; elli yıl önce üç yüzden fazla olduğunu söyler. Rakam abartılı olabilir, yön tartışmasızdır.","Evliya Çelebi counts nine workshops at Iznik against more than three hundred fifty years earlier. The figure may be inflated; the direction is not."],"link":"maintenance","src":"https://islamicceramics.ashmolean.org/Iznik/c17th.htm"},{"y":1963,"t":["Oktay Aslanapa İznik çini fırınları kazısını başlatır; ikinci dönem 1981'den beri sürer. Üretim yerinin İznik olduğu ilk kez arkeolojik olarak kanıtlanır.","Oktay Aslanapa begins excavating the Iznik kilns; a second campaign has run since 1981. Iznik is archaeologically proved to be the production site."],"link":"apparatus","src":"https://turkiyeturizmansiklopedisi.com/iznik-cini-firinlari-kazilari"},{"y":1993,"t":["İznik Vakfı kurulur. İTÜ, MIT ve Princeton'la yürütülen yaklaşık iki yıllık deneme-yanılma sonunda kuvars hamuru yeniden tutturulur.","The İznik Foundation is established; roughly two years of trial and error with İTÜ, MIT and Princeton finally get the quartz body to work again."],"link":"decoder","src":"https://malaymail.com/news/life/2025/11/20/iznik-reborn-how-turkiye-cracked-the-lost-secret-of-ottoman-tilemaking/198972"},{"y":2004,"t":["Paynter, Okyar, Wolf ve Tite hamuru ölçer: ağırlıkça %65–75 kuvars, %15–18 soda-kireç fritti, %8–13 kil. Tarif ilk kez sayıya döner.","Paynter, Okyar, Wolf and Tite measure the body: 65–75% quartz, 15–18% soda-lime frit, 8–13% clay by weight. The recipe becomes a number for the first time."],"link":"context","src":"https://doi.org/10.1111/j.1475-4754.2004.00166.x"}],"links":{"packet":["Paket fizikseldir: müzelerdeki bütün parçalar ve fırın kazılarından çıkan on binlerce kırık. Tek satır tarif yok — nesne kendi reçetesini değil, yalnızca sonucunu taşıyor.","The packet is physical: whole pieces in museums and tens of thousands of sherds from the kiln excavations. Not one line of recipe survives — the object carries its result, never its instructions."],"decoder":["Bugünkü çözücü arkeometriktir: SEM-EDX, XRF, ince kesit petrografisi ve kazı alanında taşınabilir XRF. Gereken, Osmanlıca okuyan biri değil, elektron mikroskobu okuyan biri.","Today's decoder is archaeometric — SEM-EDX, XRF, thin-section petrography, portable XRF on the dig. What is needed is not someone who reads Ottoman but someone who reads an electron microscope."],"context":["En ince halka. Bileşimi biliyoruz, kararları bilmiyoruz: fire oranı neydi, hangi denemeler elendi, ustabaşı iyi bir pişirimi neye bakarak anlıyordu — hiçbirinin kaydı yok.","The thinnest link. We know the composition but not the decisions: what the loss rate was, which trials were rejected, what a kiln master looked at to judge a good firing. None of it is recorded."],"tacit":["Canlı, ama miras değil yeniden inşa. Bugünkü İznik ustalarının eli 17. yüzyıldan devralınmadı; 1993'ten sonra sıfırdan kuruldu ve benzer bir sonuca vardı.","Alive, but reconstructed rather than inherited. The hands of today's Iznik masters were not handed down from the 17th century; they were built from nothing after 1993 and arrived at a similar result."],"apparatus":["Termokupllu elektrikli ve gazlı fırınlar odun fırınının yerini aldı, kuvars endüstriyel olarak öğütülüyor. Çalışıyor — ama aynı alet değil.","Thermocouple-controlled electric and gas kilns have replaced the wood kiln, and the quartz is milled industrially. It works — but it is not the same apparatus."],"maintenance":["İznik'te yaklaşık yüz kayıtlı atölye, Kütahya'da dört yüzden fazlası çalışıyor. Bakım turizme ve mimarî siparişe bağlı: ayakta, ama ekonomik olarak kırılgan.","About a hundred registered workshops in Iznik and more than four hundred in Kütahya. Upkeep rides on tourism and architectural commissions: standing, but economically brittle."]},"weakest":{"k":"context","why":["Kopan paket değil bağlamdı. Nesneler eksiksiz korundu, çözücü bugün her zamankinden güçlü, el yeniden kuruldu; geri getirilemeyen tek şey hangi seçeneğin neden elendiğinin hafızası. Analiz bize bir bileşim verir, o bileşimin arkasındaki gerekçeyi vermez — ve gerekçe olmadan reçete, her yeni sorunda baştan keşfedilmek zorunda kalır.","What broke was not the packet but the context. The objects survived complete, the decoder is stronger than ever, the hand has been rebuilt; the one thing unrecoverable is the memory of which option was rejected and why. Analysis yields a composition, never the reasoning behind it — and without the reasoning, the recipe must be rediscovered from scratch at every new problem."]},"nearBreak":["Bu zincir “neredeyse” değil, tamamen koptu. 17. yüzyılın ikinci yarısında İznik'te üretim durdu; Atasoy ve Raby kopuşu iki nedene bağlar — saray himayesinin çekilmesi ve enflasyon döneminde dayatılan sabit fiyatlar — buna Çin porseleni ithalatının artışı eklenir. Yeniden kurulma metinden değil maddeden geldi: 1963'te başlayan fırın kazıları üretim yerini kanıtladı, 1993'te kurulan İznik Vakfı hamuru laboratuvarda yeniden türetti. Ama geri gelen şey aslın kopyası değil işlevsel eşdeğeridir; Vakfın tanıttığı %85'e varan kuvars oranı, Tite ekibinin tarihî gövdelerde ölçtüğü %65–75 aralığının dışında kalır.","This chain did not nearly break; it broke outright. Production at Iznik stopped in the second half of the 17th century. Atasoy and Raby attribute the collapse to two causes — the withdrawal of court patronage, and fixed prices imposed during a period of inflation — with rising imports of Chinese porcelain compounding both. Recovery came from matter, not from text: the kiln excavations begun in 1963 proved where the ware had been made, and the İznik Foundation, set up in 1993, re-derived the body in a laboratory. But what returned is a functional equivalent, not a copy: the Foundation's quoted quartz content of up to 85% falls outside the 65–75% that Tite's team measured in historical bodies."],"thesis":["Bu vaka çalışmanın şu iddiasını destekler: çözücüsü ve bağlamı ölmüş bir paket, ne kadar kusursuz korunursa korunsun bilgi değildir — İznik çinileri dört yüzyıl hiç bozulmadan durdu ve bu, tek bir tabağın yeniden yapılmasına yetmedi. Göstermediği şey, yeniden türetmenin aktarımla eşdeğer olduğudur: ölçülen tarihî bileşim ile bugün üretilen hamur ölçülebilir biçimde farklıdır.","The case supports the study's claim that a packet whose decoder and context have died is not knowledge, however perfectly it is preserved: Iznik tiles stood unaltered for four centuries, and that was not enough to remake a single dish. What it does not show is that re-derivation equals transmission — the measured historical composition and the body produced today differ measurably."],"sources":[{"t":["Paynter, Okyar, Wolf & Tite, “The production technology of Iznik pottery — a reassessment”, Archaeometry 46/3 (2004)","Paynter, Okyar, Wolf & Tite, “The production technology of Iznik pottery — a reassessment”, Archaeometry 46/3 (2004)"],"m":["Hamurun ve sırın ölçülmüş bileşimi: %65–75 kuvars, %15–18 soda-kireç fritti, %8–13 kil; sırda %20–40 PbO ve %3–8,5 SnO₂.","The measured composition of body and glaze: 65–75% quartz, 15–18% soda-lime frit, 8–13% clay; 20–40% PbO and 3–8.5% SnO₂ in the glaze."],"u":"https://doi.org/10.1111/j.1475-4754.2004.00166.x"},{"t":["Victoria and Albert Museum, kandil, env. 131-1885","Victoria and Albert Museum, mosque lamp, museum no. 131-1885"],"m":["1557 civarı, Süleymaniye Camii için yapılmıştır; kırmızı içeren en eski tarihlenebilir İznik parçası.","Made c. 1557 for the Süleymaniye Mosque; the earliest dateable Iznik piece with red in its decoration."],"u":"https://collections.vam.ac.uk/item/O9232/lamp-unknown"},{"t":["Ashmolean Museum, Islamic Ceramics — İznik: 17. yüzyıl gerilemesi","Ashmolean Museum, Islamic Ceramics — Iznik: C17th Decline"],"m":["Evliya Çelebi'nin 1648'de kaydettiği dokuz atölye rakamı ve bu rakamın abartılı olabileceği uyarısı.","Evliya Çelebi's count of nine workshops in 1648, with the caution that the figure is probably exaggerated."],"u":"https://islamicceramics.ashmolean.org/Iznik/c17th.htm"},{"t":["Vedat Kacar, “Cumhuriyet'in 100. Yılında Türk Çini Sanatı”, yedi 2023","Vedat Kacar, “Turkish Tile Art in the Republic's Centennial Year”, yedi, 2023"],"m":["Üretimin 17. yüzyıl ortasında tamamen durması, Kütahya'ya kayması ve bugünkü atölye sayıları (İznik ~100, Kütahya 400+).","Production ceasing entirely by the mid-17th century, its shift to Kütahya, and today's workshop counts (Iznik ~100, Kütahya 400+)."],"u":"https://dergipark.org.tr/en/download/article-file/3271219"},{"t":["AFP, “Iznik reborn: how Türkiye cracked the lost secret of Ottoman tilemaking” (2025)","AFP, “Iznik reborn: how Türkiye cracked the lost secret of Ottoman tilemaking” (2025)"],"m":["İznik Vakfı'nın 1993'te Işıl Akbaygil tarafından kurulması, iki yıllık deneme süreci ve %85'e varan kuvars iddiası.","The İznik Foundation's establishment by Işıl Akbaygil in 1993, the two-year trial process, and the claim of up to 85% quartz."],"u":"https://malaymail.com/news/life/2025/11/20/iznik-reborn-how-turkiye-cracked-the-lost-secret-of-ottoman-tilemaking/198972"}],"ev":{"year":1648,"start":1480,"end":1700,"type":"proxy","conf":"medium","region":["İznik, Bursa — Kuzeybatı Anadolu","Iznik, Bursa province — northwest Anatolia"],"role":["Bir zanaat zincirinin çöküşünü tarihleyen, döneme en yakın sayısal tanıklık.","The closest near-contemporary numerical witness dating the collapse of a craft chain."],"shows":["Bir üretim zinciri, ürünü hâlâ hayranlık uyandırırken elli yıl içinde atölye sayısı ölçeğinde çökebilir.","A production chain can collapse at workshop-count scale within fifty years while its output is still admired."],"limits":["Evliya Çelebi'nin sayıları gezi anlatısına özgü abartıya açıktır ve ne üç yüz ne de dokuz rakamı bağımsız bir kayıtla doğrulanmıştır.","Evliya Çelebi's figures carry the exaggeration typical of travel narrative, and neither the three hundred nor the nine is confirmed by an independent record."],"source":["Ashmolean Museum, Islamic Ceramics — İznik: 17. yüzyıl gerilemesi","Ashmolean Museum, Islamic Ceramics — Iznik: C17th Decline"],"url":"https://islamicceramics.ashmolean.org/Iznik/c17th.htm"}},{"id":"hat","cat":"threshold","civ":"ottoman","icon":"🖋️","name":["Hat sanatı ve icâzet","Ottoman calligraphy and the ijāza"],"era":["1480'ler → bugün","1480s → today"],"hook":["Hat, aktarımını belgeye bağlayan nadir zanaatlardan biridir: icâzetnâme yalnızca bir diploma değil, ustadan ustaya geriye doğru isim isim yürüyen bir zincir kaydıdır.","Calligraphy is one of the rare crafts that tied its transmission to a document: the icâzetnâme is not merely a diploma but a record of the chain, running backwards master by named master."],"timeline":[{"y":1485,"t":["II. Bayezid'in “Yâkut'un tavrından başka bir yol” önerisiyle Şeyh Hamdullah aklâm-ı sittede Osmanlı üslûbunu kurar.","At Bayezid II's suggestion of “a new path beside Yâkut's manner”, Şeyh Hamdullah founds the Ottoman style in the six scripts."],"link":"tacit","src":"https://islamansiklopedisi.org.tr/hamdullah-efendi-seyh"},{"y":1520,"t":["Şeyh Hamdullah ölür: kırk yedi mushaf, binden fazla sûre nüshası ve bir ölçüt bırakır — övgünün en yükseği artık “şeyh gibi yazdı”dır.","Şeyh Hamdullah dies, leaving forty-seven Qur'ans, over a thousand sura copies, and a standard: the highest praise becomes “he wrote like the Şeyh”."],"link":"packet","src":"https://islamansiklopedisi.org.tr/hamdullah-efendi-seyh"},{"y":1698,"t":["Hâfız Osman ölür (3 Aralık). Yirmi beş mushaf yazmış, yaklaşık elli hattat yetiştirmiş, aktarımı iki ayrı kola ayırmıştır.","Hâfız Osman dies on 3 December, having written twenty-five Qur'ans, trained some fifty calligraphers, and split the transmission into two lines."],"link":"decoder","src":"https://islamansiklopedisi.org.tr/hafiz-osman"},{"y":1915,"t":["Medresetü'l-hattâtîn açılır (20 Mayıs): meşk ilk kez ustanın odasından çıkıp müfredatlı bir kuruma taşınır.","The Medresetü'l-hattâtîn opens on 20 May: meşk moves for the first time out of the master's room and into an institution with a syllabus."],"link":"maintenance","src":"https://islamansiklopedisi.org.tr/medresetul-hattatin"},{"y":1928,"t":["Harf inkılâbı (1 Kasım). Yazı gündelik işlevini yitirir; hat, çalışan bir yazı sisteminin mühendisliği olmaktan çıkıp güzel sanata dönüşür.","The alphabet reform of 1 November strips the script of daily function; hat ceases to be the engineering of a working writing system and becomes a fine art."],"link":"context","src":"https://turkmaarifansiklopedisi.org.tr/hat"},{"y":1975,"t":["Hâmid Aytaç, Hasan Çelebi'ye sülüs-nesih icâzeti verir; belge, 1928'de kesilen bağlamın üzerinden zinciri atlatır.","Hâmid Aytaç issues Hasan Çelebi his icâzet in sülüs and nesih — a document that carries the chain across the context severed in 1928."],"link":"decoder","src":"https://www.turkiyeninustalari.org/tr/ustalar/hat-sanati/hasan-celebi"},{"y":1982,"t":["Aytaç ölür (19 Mayıs). 1928'den sonra geçimini klişecilik, çinkografi ve Paşabahçe'de cam üstü yazıyla sağlamış, meşki piyasa dışında sürdürmüştür.","Aytaç dies on 19 May. After 1928 he had lived off clichéing, zincography and writing on Paşabahçe glass, keeping meşk alive outside the market."],"link":"apparatus","src":"https://islamansiklopedisi.org.tr/aytac-hamit"},{"y":2021,"t":["UNESCO “Hüsn-i hat, Türkiye'de İslam sanatında geleneksel hat sanatı” ögesini Temsilî Liste'ye alır (16.COM, dosya 01684).","UNESCO inscribes “Hüsn-i hat, traditional calligraphy in Islamic art in Turkey” on the Representative List (16.COM, file 01684)."],"link":"maintenance","src":"https://ich.unesco.org/en/RL/husn-i-hat-traditional-calligraphy-in-islamic-art-in-turkey-01684"}],"links":{"packet":["Çok güçlü. Ketebeli ve tarihli on binlerce levha, mushaf ve murakka müzelerde duruyor; ayrıca icâzetnâmenin kendisi, zinciri isim isim yazan ikinci bir pakettir.","Very strong. Tens of thousands of signed and dated panels, Qur'ans and albums sit in museums; and the icâzetnâme is itself a second packet, writing the chain out name by name."],"decoder":["İşliyor: ustalar hâlâ icâzet veriyor ve silsile kesintisiz izlenebiliyor. Ama bir hattı beğenenlerle onu okuyup hükme bağlayabilenler arasındaki uçurum genişliyor.","Working: masters still issue icâzet and the silsile is traceable without a gap. But the gap widens between those who admire a hat and those who can read one and judge it."],"context":["En zayıf halka. Aklâm-ı sittenin nispet kuralları, hızla yazılan bir sistemin okunurluk kısıtlarıydı; kimse o yazıyla gündelik iş görmediğinden kurallar bugün sınanabilir bir mühendislik değil, korunan bir doktrindir.","The weakest link. The proportion rules of the six scripts were legibility constraints on a system written at speed; since nobody now does daily work in that script, they survive as preserved doctrine rather than testable engineering."],"tacit":["Sağlam ve kanıtlanmış biçimde aktarılabilir. Hasan Çelebi (1937–2025) yurt içinden ve dışından yüze yakın kişiye icâzet verdi; el, kurumsal kopuşa rağmen taşındı.","Robust, and demonstrably transmissible. Hasan Çelebi (1937–2025) issued icâzet to close to a hundred people at home and abroad; the hand travelled despite the institutional break."],"apparatus":["Dar boğaz burada. Kamış kalem, is mürekkebi, âharlı kâğıt, kalemtıraş ve makta hâlâ elde ve çok az atölyede üretiliyor; malzeme zinciri sanatçı zincirinden ince.","Here is the bottleneck. Reed pens, soot ink, âhar-sized paper, the penknife and the makta are still made by hand in very few workshops; the material chain is thinner than the chain of practitioners."],"maintenance":["İyi durumda: 1986'dan beri IRCICA yarışmaları, vakıf ve üniversite programları, belediye kursları ve 2021 UNESCO tescili düzenli bir çoğaltma ve öğretme yükünü finanse ediyor.","In good shape: IRCICA's competitions since 1986, foundation and university programmes, municipal courses and the 2021 UNESCO inscription all fund a steady load of copying and teaching."]},"weakest":{"k":"context","why":["Paket, çözücü, el ve bakım ayakta; eksilen, yazının niçin öyle olması gerektiğini sınayan gündelik kullanımdır. 1928'den sonra bir nesih satırı artık hiçbir iş görmüyor, dolayısıyla nispet kurallarının hangi kısıtı çözdüğü ampirik olarak sınanamıyor. Sınanmayı bırakan bir kural aktarılmaya devam eder ama düzeltilemez hâle gelir; hat çevresindeki bugünkü tartışma tam olarak budur.","Packet, decoder, hand and upkeep all stand; what is missing is the daily use that once tested why the script had to be as it was. After 1928 a line of nesih does no work, so the constraint the proportion rules solved can no longer be tested empirically. A rule that stops being tested keeps being transmitted but can no longer be corrected — and that is exactly the argument inside the tradition today."]},"nearBreak":["Kopuşa en çok yaklaşılan an 1924–1936 arasıdır. Medresetü'l-hattâtîn 1924'te Tevhîd-i Tedrîsat Kanunu ile kapandı; 1 Kasım 1928 harf inkılâbı yazının işlevini bitirdi; kurum 1930'da Şark Tezyînî San'atlar Mektebi adıyla yeniden açıldı ve 1936'da Güzel Sanatlar Akademisi'ne bağlandı. Türk Maarif Ansiklopedisi'nin aktardığı bir hattat sözü dönemi özetler: “hattatım demeye korktuğumuz yıllar.” Zincir kurumla değil kişiyle taşındı — Hâmid Aytaç matbaacılık ve cam üstü yazıyla geçinirken meşk vermeyi ve icâzet yazmayı hiç bırakmadı; 1975'te Hasan Çelebi'ye verdiği icâzet, bugünkü silsilelerin çoğunun kopuş üzerinden geçtiği köprüdür.","The closest approach to a break falls between 1924 and 1936. The Medresetü'l-hattâtîn was closed in 1924 under the Unification of Education Law; the alphabet reform of 1 November 1928 ended the script's function; the institution reopened in 1930 as the School of Oriental Decorative Arts and was absorbed into the Academy of Fine Arts in 1936. A calligrapher's phrase recorded in the Türk Maarif Ansiklopedisi sums up the period: “the years when we were afraid to call ourselves calligraphers.” The chain travelled through persons, not institutions — Hâmid Aytaç, living off printing work and glass engraving, never stopped giving meşk or writing icâzet, and the licence he issued to Hasan Çelebi in 1975 is the bridge most present-day chains cross."],"thesis":["Bu vaka çalışmanın altı halka içinde çözücünün en dayanıklısı olduğu iddiasını destekler: kendi zincirini adlarıyla yazan bir yetki belgesi, hem bağlam hem pazar ortadan kalktığında bile ayakta kalmıştır. Göstermediği şey, icâzetin kaliteyi güvence altına aldığıdır — belge soyu tasdik eder, ustalığı değil; geleneğin kendi içinde icâzetin enflasyona uğradığı yolundaki tartışma da sürüyor.","The case supports the study's claim that the decoder is the most durable of the six links: a credential that writes out its own chain by name survived even when both context and market disappeared. What it does not show is that the icâzet guarantees quality — the document certifies lineage, not mastery, and the tradition itself continues to argue that icâzet has inflated."],"sources":[{"t":["UNESCO, Hüsn-i hat, Türkiye'de İslam sanatında geleneksel hat sanatı (dosya 01684)","UNESCO, Hüsn-i hat, traditional calligraphy in Islamic art in Turkey (file 01684)"],"m":["Ögenin resmî adı, 2021 tescil yılı ve 16.COM oturumu; usta-çırak aktarımının dosyadaki merkezî yeri.","The element's official name, the 2021 inscription and the 16.COM session; the centrality of master-apprentice transmission in the file."],"u":"https://ich.unesco.org/en/RL/husn-i-hat-traditional-calligraphy-in-islamic-art-in-turkey-01684"},{"t":["TDV İslâm Ansiklopedisi, “Hamdullah Efendi, Şeyh”","TDV Encyclopaedia of Islam, “Hamdullah Efendi, Şeyh”"],"m":["Doğum 1426–1430, ölüm 1520; Hayreddin Mar'aşî'den alınan icâzet; kırk yedi mushaf; II. Bayezid'in teşviki.","Born 1426–1430, died 1520; the icâzet received from Hayreddin Mar'aşî; forty-seven Qur'ans; Bayezid II's encouragement."],"u":"https://islamansiklopedisi.org.tr/hamdullah-efendi-seyh"},{"t":["TDV İslâm Ansiklopedisi, “Hâfız Osman”","TDV Encyclopaedia of Islam, “Hâfız Osman”"],"m":["1642 – 3 Aralık 1698; yirmi beş mushaf; yaklaşık elli hattat ve iki ayrı aktarım kolu.","1642 – 3 December 1698; twenty-five Qur'ans; some fifty calligraphers trained and two distinct lines of transmission."],"u":"https://islamansiklopedisi.org.tr/hafiz-osman"},{"t":["TDV İslâm Ansiklopedisi, “Medresetü'l-hattâtîn”","TDV Encyclopaedia of Islam, “Medresetü'l-hattâtîn”"],"m":["20 Mayıs 1915 kuruluşu, 1924 kapanışı, 1930'da Şark Tezyînî San'atlar Mektebi'ne, 1936'da Akademi'ye dönüşü.","Founded 20 May 1915, closed 1924, reopened in 1930 as the School of Oriental Decorative Arts and absorbed into the Academy in 1936."],"u":"https://islamansiklopedisi.org.tr/medresetul-hattatin"},{"t":["IRCICA, 1. Milletlerarası Hat Yarışması (1986)","IRCICA, 1st International Calligraphy Competition (1986)"],"m":["Hâmid Aytaç adına düzenlendi; 18 ülkeden 356 katılımcı, 1272 eser, 17 ülkeden 43 kişiye 62 ödül.","Held in Hâmid Aytaç's name; 356 entrants from 18 countries, 1,272 works, 62 awards to 43 people from 17 countries."],"u":"https://arts.ircica.org/competition/1st-calligraphy-competition"}],"ev":{"year":1975,"start":1485,"end":2025,"type":"direct","conf":"high","region":["İstanbul","Istanbul"],"role":["Kurumsal kopuşun ardı
