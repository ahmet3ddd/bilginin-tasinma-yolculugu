 Modern hesaplamalar 45 metrekarelik tek bir ısıtılan odanın kışlık ihtiyacını yaklaşık 5,5 ton kayın odununa koyar; buna her gün ocağın başında duracak bir insan eklenir. Villa ve kent ekonomisi çekildiğinde bu tekrarlayan gider ödenemez oldu.","This is the link that broke. Modern calculations put the winter demand of a single heated room of 45 m² at roughly 5.5 tonnes of beech, plus a person at the furnace every day. When the villa and civic economy withdrew, that recurring cost could no longer be met."]},"weakest":{"k":"maintenance","why":["Hipokaustun kaybı bir unutma vakası değildir. Tarif kitaplıkta, örnek tarlada duruyordu; Doğu’da aynı ustalar aynı sistemi kurmaya devam etti. Batı’da biten şey, her kış tekrarlanması gereken emek ve yakıt masrafını karşılayabilen toplumsal düzendi. PACKET ve APPARATUS ayakta kaldı, MAINTENANCE çöktü ve sistem onunla birlikte gitti.","The loss of the hypocaust is not a case of forgetting. The specification sat in the library and the example sat in the field; in the East the same masters went on building the same system. What ended in the West was the social order that could meet the labour and fuel cost repeated every winter. PACKET and APPARATUS held; MAINTENANCE collapsed, and the system went with it."]},"nearBreak":["Batı’da gerçekten koptu — ama Türk okuru için asıl nokta kopmadığı yerdir. Osmanlı hamamının ısıtma düzeni doğrudan aynı ilkedir: külhandaki ateş döşemenin altındaki cehennemlikte dolaşır ve duvarlardaki tütekliklerden çıkar. Semavi Eyice’nin deyişiyle umumi Türk hamamları “ısıtma sistemi bakımından eski Roma hamamlarına benzemekle beraber mimarileri bütünüyle değişiktir”. 1584’te yapılan Çemberlitaş Hamamı bu düzenle bugün hâlâ ısınıyor; yani sistem hiç arkeolojiye dönüşmedi, yalnızca Batı’da dönüştü.","In the West it did break — but for a Turkish reader the point is where it did not. The heating layout of the Ottoman hamam is the same principle directly: the fire in the külhan circulates through the cehennemlik beneath the floor and leaves by the tüteklik flues in the walls. In Semavi Eyice’s formulation, public Turkish baths “resemble the old Roman baths in their heating system while their architecture is entirely different”. Çemberlitaş Hamam, built in 1584, is still heated this way; the system never became archaeology — it became archaeology only in the West."],"thesis":["Hipokaust, MAINTENANCE halkasının tek başına bir teknolojiyi öldürebileceğini gösterir: paket de donanım da yerindeyken, tekrarlayan emeği ödeyen düzen çekildiği için sistem Batı’da terk edildi. “Romalılarda merkezi ısıtma vardı, sonra Avrupa 1500 yıl dondu” cümlesi bu yüzden yanlıştır; sistem hiçbir zaman dünya ölçeğinde ölmedi, yalnızca belli bir ekonomik coğrafyadan çekildi ve Doğu’da hamam olarak sürdü. Ama vaka şunu göstermez: Roma hipokaustundan Osmanlı cehennemliğine kesintisiz tek bir teknik soy ağacı çizilemez. Süreklilik alttan ısıtma ilkesinde ve soğukluk–ılıklık–sıcaklık dizisindedir; hamamın kubbe örtüsü, kazanlı su ısıtması ve mekân kurgusu Bizans ile İslam dönemlerinin kendi çözümleridir. Aynı şekilde 14. yüzyıl Baltık ısı depolamalı hipokaustları ve Kastilya’daki gloria da Roma’dan doğrudan miras olmayabilir; benzer sorunun bağımsız olarak bulunmuş benzer cevapları olmaları pekâlâ mümkündür.","The hypocaust shows that the MAINTENANCE link alone can kill a technology: with packet and apparatus both intact, the system was abandoned in the West because the order that paid for the recurring labour withdrew. The sentence “the Romans had central heating and then Europe froze for 1,500 years” is therefore wrong; the system never died globally, it withdrew from one economic geography and continued in the East as the hamam. But the case does not show this: no unbroken single technical lineage can be drawn from the Roman hypocaust to the Ottoman cehennemlik. The continuity lies in the underfloor principle and in the cold-warm-hot sequence; the hamam’s domed roofing, its cauldron water heating and its spatial arrangement are the Byzantine and Islamic periods’ own solutions. Equally, the 14th-century Baltic heat-storage hypocausts and the Castilian gloria may not be direct Roman inheritance at all; they may well be independently found answers to a similar problem."],"sources":[{"t":["G. G. Fagan, “Sergius Orata: Inventor of the Hypocaust?”, Phoenix 50 (1996)","G. G. Fagan, “Sergius Orata: Inventor of the Hypocaust?”, Phoenix 50 (1996)"],"m":["Roma geleneğinin Orata’ya yaptığı atfın neden güvenilmez olduğunu gösteren temel makale; başlığındaki soru işareti alandaki şüphenin özetidir.","The key article showing why Roman tradition’s attribution to Orata is unreliable; the question mark in its title summarises the discipline’s scepticism."],"u":"https://www.semanticscholar.org/paper/Sergius-Orata:-Inventor-of-the-Hypocaust-Fagan/318db85dd9b88f7e22e38fff683732c39263b066"},{"t":["S. Lucore ve M. Trümper (ed.), “Greek Baths and Bathing Culture” (Leuven, 2013)","S. Lucore and M. Trümper (eds.), “Greek Baths and Bathing Culture” (Leuven, 2013)"],"m":["Fregellae’deki tam hipokaustun Pompeii örneğinden yaklaşık yarım yüzyıl eski olduğunu ve Hellenistik ısıtma sistemlerinin öncülüğünü ortaya koyar.","Establishes that the full hypocaust at Fregellae predates the Pompeian example by about half a century, and the precedence of Hellenistic heating systems."],"u":"https://ajaonline.org/book-review/1872/"},{"t":["E. Kanetaki, “The Still Existing Ottoman Hamams in the Greek Territory”, ODTÜ Mimarlık Fakültesi Dergisi (2004)","E. Kanetaki, “The Still Existing Ottoman Hamams in the Greek Territory”, METU JFA (2004)"],"m":["Osmanlı hamamının ısıtma düzenini teknik olarak tarif eder: külhan, cehennemlik ve tüteklik; Roma ile Bizans hamamlarının devamı olduğunu açıkça belirtir.","Technically describes the Ottoman hamam’s heating layout — külhan, cehennemlik and tüteklik — and states explicitly that these continue the Roman and Byzantine baths."],"u":"https://jfa.arch.metu.edu.tr/uploads/docs/sayilar/sayi-21-1-2/81-110.pdf"},{"t":["Semavi Eyice, “Hamam”, TDV İslâm Ansiklopedisi (1997)","Semavi Eyice, “Hamam”, TDV Encyclopaedia of Islam (1997)"],"m":["Türkçe kaynak: hipokaust sisteminin Roma’dan Emevî ve Osmanlı hamamlarına aktarımını ortaya koyarken mimarinin bütünüyle farklılaştığını da vurgular.","The Turkish authority: it sets out the transfer of the hypocaust system from Rome to Umayyad and Ottoman baths while insisting that the architecture became entirely different."],"u":"https://islamansiklopedisi.org.tr/hamam"},{"t":["H. Lehar, “The Roman Hypocaust Heating System: Calculations…” (CHNT 17, Viyana 2013)","H. Lehar, “The Roman Hypocaust Heating System: Calculations…” (CHNT 17, Vienna 2013)"],"m":["On bir Roma yapısına modern ısı hesabı uygular: yakıt tüketimi, gerekli döşeme sıcaklığı ve orman alanı rakamları buradan gelir.","Applies modern heat calculations to eleven Roman buildings: the figures for fuel consumption, required floor temperature and forest area come from here."],"u":"https://www.academia.edu/29145599/The_Roman_Hypocaust_Heating_System_Calculations_and_thoughts_about_construction_performance_and_function"},{"t":["English Heritage, “Baths and Bathing in Roman Britain”","English Heritage, “Baths and Bathing in Roman Britain”"],"m":["Sistemin bir eyaletteki yaygınlığını gösterir: kent hamamları, sınır kaleleri ve villalar; sıcaklık odası yaklaşık 40 derece.","Shows how widespread the system was in a single province: town baths, frontier forts and villas, with a hot room of about 40°C."],"u":"https://www.english-heritage.org.uk/learn/story-of-england/romans/roman-bathing/"}],"ev":{"year":1584,"start":1580,"end":1590,"type":"direct","conf":"high","region":["İstanbul, Çemberlitaş","Istanbul, Çemberlitaş"],"role":["Alttan ısıtma ilkesinin, Batı’daki kesintiden bağımsız olarak sürdüğünün yaşayan kanıtı.","Living evidence that the underfloor heating principle continued independently of the break in the West."],"shows":["1584’te yapılan bir hamam, döşemenin altındaki cehennemlik ve duvarlardaki tüteklikler yoluyla bir Roma caldarium’uyla aynı ilkeye göre ısınır ve hâlâ çalışır durumdadır.","A bath built in 1584 is heated on the same principle as a Roman caldarium, through a cehennemlik beneath the floor and tüteklik flues in the walls, and remains in operation."],"limits":["Isıtma ilkesinin sürekliliği yapı tipinin sürekliliği demek değildir; Osmanlı hamamının planı, kubbesi ve kazanlı su ısıtma düzeni Roma hamamından belirgin biçimde farklıdır ve mimari hat Roma’dan İstanbul’a tek adımda değil, geç antik ve Bizans hamamları ile Emevî yapıları üzerinden geçer.","Continuity of the heating principle is not continuity of the building type; the Ottoman hamam’s plan, dome and cauldron water heating differ markedly from the Roman bath, and the architectural line runs not in one step from Rome to Istanbul but through late antique and Byzantine baths and Umayyad buildings."],"source":["E. Kanetaki, ODTÜ Mimarlık Fakültesi Dergisi (2004); Semavi Eyice, “Hamam”, TDV İslâm Ansiklopedisi (1997)","E. Kanetaki, METU Journal of the Faculty of Architecture (2004); Semavi Eyice, “Hamam”, TDV Encyclopaedia of Islam (1997)"],"url":"https://jfa.arch.metu.edu.tr/uploads/docs/sayilar/sayi-21-1-2/81-110.pdf"}}];

var EV_CAT = { "hypocaust": "threshold" };
var EV_TENSION = {
  "ottoman-script": ["Küresel eğri 1928'de yükseliyor; bu kayıt aynı yılda bir bölgede çözücü halkasının koptuğunu gösteriyor. İkisi de doğru olabilir — çünkü endeks küresel, kopuş yereldir. Model bu ayrımı yapamaz.", "The global curve is rising in 1928, while this record shows the decoder link severed in one region that same year. Both can be true — the index is global, the break is local. The model cannot make that distinction."],
  "iznik": ["Atölye sayısı elli yılda üç yüzden dokuza inerken küresel eğri yükselmeye devam ediyor. Zincirin çöküşü ürünün itibarına değil, bakımın bütçesine bağlıdır.", "Workshop counts fall from three hundred to nine in fifty years while the global curve keeps rising. A chain collapses on the budget for maintenance, not on the reputation of its product."],
  "hypocaust": ["Alttan ısıtma Batı'da 4.-5. yüzyılda terk edilirken aynı ilke Doğu'da hiç kesilmedi: 1584'te İstanbul'da yapılan Çemberlitaş Hamamı bugün hâlâ aynı ilkeyle ısınıyor. Küresel eğri bu iki gerçeği aynı anda taşıyamaz — bir teknik, bakım bütçesi çöken yerde biterken bir uygarlık ötede yaşamaya devam edebilir. Kayıp yereldir.", "Underfloor heating was abandoned in the West in the fourth and fifth centuries while the same principle never broke in the East: the Çemberlitaş Hamam, built in Istanbul in 1584, is still heated on it today. A global curve cannot hold both facts at once — a technique can end where the maintenance budget fails and stay alive one civilisation over. The loss is local."]
};
evidence = evidence.concat(products.filter(function (p) { return p.ev; }).map(function (p) {

  };
})).sort(function (a, b) { return a.year - b.year; });

var MODEL_MAP = {

/* ============================================================
   Simulation
   ============================================================ */
function simulate(p) {
  var retention = Math.exp(-Math.log(2) / p.halfLife);
  var archive = p.capacity * 2, contextual = archive, out = [];
  for (var i = 0; i < p.generations; i++) {
    var recorded = p.innovation * .85 * .9;
    archive = archive * retention + recorded;
    // New input carries context in the same proportion as everything else: at q<sub>c</sub> = 1
    // the contextual stock tracks the archive exactly, which is what the slider promises.
    contextual = (contextual * retention + recorded) * p.qc;
    var effective = p.capacity * p.gain;
    var selected = Math.min(archive, effective);
    var rebuilt = selected * (archive ? contextual / archive : 0) * p.qd;
    out.push({ g: i + 1, archive: archive, contextual: contextual, rebuilt: rebuilt, effective: effective, selected: selected });
  }
  return out;
}

  if (year >= 2026) return Object.assign({}, hp[hp.length - 1], { year: year });
  for (var i = 1; i < hp.length; i++) {
    var a = hp[i - 1], b = hp[i];
    if (year <= b.year) {
      var f = (year - a.year) / (b.year - a.year);
      return { year: year, p: a.p + (b.p - a.p) * f, c: a.c + (b.c - a.c) * f, r: a.r + (b.r - a.r) * f,
               low: a.low + (b.low - a.low) * f, high: a.high + (b.high - a.high) * f };
    }
  }
  return hp[hp.length - 1];
}

      ["hp", t("hLegendP"), nf(p.p, 0)],
      ["hc", t("hLegendC"), nf(p.c, 0)],
      ["hr", t("hLegendR"), nf(p.r, 0)],
      ["band", t("hLegendBand"), nf(p.low, 0) + "–" + nf(p.high, 0)]
    ];
    cy = [["hp", Y2(p.p)], ["hc", Y2(p.c)], ["hr", Y2(p.r)]];
    drawHover(svg, layer, tip, px, cy, head, rows, box, sx);
  }
}
function drawHover(svg, layer, tip, X, cy, head, rows, box, sx) {
  var H = svg.viewBox.baseVal.height;
  var g = '<line class="guide" x1="' + X.toFixed(1) + '" x2="' + X.toFixed(1) + '" y1="14" y2="' + (H - 6) + '" opacity=".28"/>';
  cy.forEach(function (c) {
    g += '<circle class="hover-dot k-' + c[0] + '" cx="' + X.toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="4"/>';
  });
  layer.innerHTML = g;
  var html = "<b>" + esc(head) + "</b>";
  rows.forEach(function (r) {
    html += '<u><i><span class="key ' + r[0] + '"></span>' + esc(r[1]) + "</i><em>" + esc(r[2]) + "</em></u>";
  });
  tip.innerHTML = html;
  tip.dataset.show = "1";
  var left = X / sx;
  var tw = tip.offsetWidth || 170;
  left = Math.max(tw / 2 + 4, Math.min(box.width - tw / 2 - 4, left));
  tip.style.left = left + "px";
  tip.style.top = Math.max(54, (cy.length ? Math.min.apply(null, cy.map(function (c) { return c[1]; })) / sx : 60)) + "px";
}

function inlineChartCss() {
  var cs = getComputedStyle(document.documentElement);
  var v = function (n) { return (cs.getPropertyValue(n) || "").trim() || "#333"; };
  return "svg{background:" + v("--surface") + "}" +
    "text{font-family:Inter,system-ui,-apple-system,sans-serif}" +
    ".grid{stroke:" + v("--line") + ";stroke-width:1;fill:none}" +
    ".axis-line{stroke:" + v("--muted") + ";stroke-width:1}" +
    ".axis,.lane{fill:" + v("--muted") + ";font-size:11px}.lane{font-weight:600}" +
    ".plot{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}" +
    ".plot.archive,.plot.hp{stroke:" + v("--blue") + "}" +
    ".plot.context,.plot.hc{stroke:" + v("--amber") + "}" +
    ".plot.rebuilt{stroke:" + v("--green") + ";stroke-dasharray:8 5;stroke-width:3}" +
    ".plot.hr{stroke:" + v("--violet") + ";stroke-dasharray:8 5;stroke-width:3}" +
    ".plot.ghost{stroke:" + v("--violet") + ";stroke-width:1.8;opacity:.5}" +
    ".plot.ghost.g2{stroke-dasharray:4 4}.plot.ghost.g3{stroke-dasharray:9 5}" +
    ".guide{stroke:" + v("--ink") + ";stroke-width:1.5;stroke-dasharray:3 5;opacity:.5}" +
    ".scenario-band{fill:" + v("--violet") + ";opacity:.13}" +
    ".whisker{stroke:" + v("--muted") + ";stroke-width:1.5;opacity:.8}" +
    ".direct{fill:" + v("--rose") + "}.proxy{fill:" + v("--amber") + "}" +
    ".direct.medium,.proxy.medium{fill-opacity:.35;stroke:" + v("--ink") + ";stroke-width:1.2}" +
    ".event-active{fill:none;stroke:" + v("--blue") + ";stroke-width:2}.hit{fill:none}";
}
function serializeChart(which) {
  var svg = document.querySelector('svg[data-chart="' + which + '"]');
  if (!svg) return null;
  var clone = svg.cloneNode(true);
  var hv = clone.querySelector(".hover-layer"); if (hv) hv.remove();
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  var st = document.createElementNS("http://www.w3.org/2000/svg", "style");
  st.textContent = inlineChartCss();
  clone.insertBefore(st, clone.firstChild);
  return { xml: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone),
           w: svg.viewBox.baseVal.width, h: svg.viewBox.baseVal.height };
}
function saveBlob(blob, name) {
  try {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  } catch (e) { toast(t("dlFailed")); }
}
function downloadChart(which, fmt) {
  var r = null;
  try { r = serializeChart(which); } catch (e) {}
  if (!r) { toast(t("dlFailed")); return; }
  var base = "aktarim-zinciri-" + which;
  if (fmt === "svg") { saveBlob(new Blob([r.xml], { type: "image/svg+xml;charset=utf-8" }), base + ".svg"); toast(t("downloaded")); return; }
  var img = new Image(), scale = 2, url;
  try { url = URL.createObjectURL(new Blob([r.xml], { type: "image/svg+xml;charset=utf-8" })); }
  catch (e) { toast(t("dlFailed")); return; }
  img.onload = function () {
    try {
      var c = document.createElement("canvas");
      c.width = r.w * scale; c.height = r.h * scale;
      var ctx = c.getContext("2d");
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim() || "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { if (b) { saveBlob(b, base + ".png"); toast(t("downloaded")); } else toast(t("dlFailed")); });
    } catch (e) { toast(t("dlFailed")); }
  };
  img.onerror = function () { URL.revokeObjectURL(url); toast(t("dlFailed")); };
  img.src = url;
}

var HELP = {
  capacity: [
    "Bir insanın ömrü boyunca gerçekten öğrenip ustalaşabileceği miktarın soyut karşılığı. Zekâ ölçüsü değil; zaman, dikkat ve eğitim fırsatının toplamı.<br><br>Modelde asıl mesele şu: <b>bu bütçe tarih boyunca neredeyse hiç değişmedi.</b> 100.000 yıl önce de bugün de bir ömür bir ömürdür. Arşiv büyürken bu sayı sabit kaldığı için her kuşak arşivin giderek daha küçük bir yüzdesini taşıyabilir.<br><br>Yükseltmek, daha uzun eğitim ve daha iyi öğretim yöntemleri varsaymak demektir — kafatasının büyüdüğünü değil.",
    "An abstract stand-in for how much one person can genuinely learn and master in a lifetime. Not a measure of intelligence, but the sum of time, attention and educational opportunity.<br><br>The point of the model is this: <b>this budget has barely changed across history.</b> A lifetime was a lifetime 100,000 years ago and it still is. Because the number stays flat while the archive grows, each generation can carry an ever smaller share of it.<br><br>Raising it means assuming longer schooling and better teaching methods — not a bigger skull."],
  gain: [
    "Bir sembolün, formülün ya da prosedürün ne kadar deneyimi tek bir taşınabilir birime sıkıştırdığı. Kapasiteyi büyütmez; <b>aynı bütçeyle ne kadar geniş bir alana erişildiğini</b> büyütür.<br><br>“F = ma” üç işaretle sayısız gözlemi taşır; kazanç tam olarak budur. Yazı, matbaa, matematiksel gösterim ve bugün dil modelleri bu terimi sıçratan şeylerdir.<br><br><b>Modelin bir sınırı, açıkça:</b> bu denklemlerde G'nin bir maliyeti yoktur. Yalnız H = K × G'de görünür, A ve C özyinelemelerinde yapısal olarak yoktur — bu kaydırıcıyı 1'den 8'e çekin, bağlamlı stok kılını kıpırdatmazken R %631 yükselir (40. nesilde). Tarih tersini düşündürüyor: paketleme kazancındaki her sıçrama paketten bağlam da söktü. Bu ödünleşim metinde ve kayıp vakalarında tartışılır; burada <b>temsil edilmiyor.</b> Yükselen eğriyi kazancın bedava olduğunun kanıtı saymayın.",
    "How much experience a symbol, formula or procedure compresses into a single portable unit. It does not enlarge capacity; it enlarges <b>how much ground the same budget can cover</b>.<br><br>“F = ma” carries countless observations in three marks — that is the gain. Writing, print, mathematical notation and now language models are what made this term jump.<br><br><b>A limit of the model, stated plainly:</b> in these equations G has no cost. It appears only in H = K × G and is structurally absent from the A and C recursions — push this slider from 1 to 8 and the contextual stock does not move at all, while R rises 631% (at generation 40). History suggests otherwise: every jump in packaging gain also stripped context out of the packet. That trade-off is argued in the text and in the loss cases; it is <b>not</b> represented here. Do not read the rising curve as evidence that gain is free."],
  qc: [
    "Paketle birlikte <b>yöntemin, kanıtın, hata geçmişinin ve geçerlilik sınırlarının</b> ne kadarının taşındığı.<br><br>%100, her sonucun yanında “nasıl bulundu, neden doğru sayıldı, nerede çalışmaz” bilgisinin de gitmesi demek. Düşük değerler ise tarihte kuraldır: Antikythera düzeneği elimizde ama kılavuzu yok; Roma harcı elimizde ama onu kendini onarır kılan adım metinde yok.<br><br>Bu terim düştüğünde arşiv büyümeye devam eder, <b>yeniden üretilebilirlik çöker.</b> Grafikte turuncu çizginin maviden ayrılması tam olarak budur.",
    "How much of the <b>method, the evidence, the history of errors and the limits of validity</b> travels along with the packet.<br><br>100% means every result arrives together with “how it was found, why it was believed, where it fails.” Low values are the historical norm: we hold the Antikythera mechanism but not its manual; Roman builders left the mortar but not the step that made it self-healing.<br><br>When this term falls, the archive keeps growing while <b>reproducibility collapses.</b> That gap is exactly the orange line pulling away from the blue one."],
  qd: [
    "Paketi açabilecek insanların oranı ve niteliği: dil, okuryazarlık, ortak kavramlar, standartlar, eğitim ve fiziksel erişim.<br><br>Kayıt var olsa bile onu okuyabilen kimse yoksa aktarım gerçekleşmez. Linear B tabletleri tam bu yüzden 3.000 yıl sessiz kaldı; rongorongo hâlâ sessiz.<br><br>Okuryazarlığın yayılması, ortak bir bilim dili ve internet erişimi bu terimi yükseltti. Buna karşılık yazının ilk çağlarında arşiv büyürken çözücü <b>uzman bir yazıcı sınıfında kilitliydi</b> — “Yazı sonrası” ön ayarının düşük olmasının sebebi budur.",
    "The share and quality of people who can open the packet: language, literacy, shared concepts, standards, training and physical access.<br><br>If a record exists but nobody can read it, no transmission occurs. That is precisely why the Linear B tablets stayed silent for 3,000 years — and why rongorongo still is.<br><br>Spreading literacy, a shared scientific language and internet access all raised this term. In the first ages of writing, by contrast, the archive grew while the decoder stayed <b>locked inside a scribal class</b> — which is why the “After writing” preset sets it low."],
  innovation: [
    "Her kuşağın hazır bulduğunun üstüne eklediği ham üretim. “Brüt”, çünkü hepsi arşive girmez: model bunun %85'inin doğrulamayı geçtiğini ve %90'ının gerçekten kaydedildiğini varsayar.<br><br>Bu sayıyı yükseltmek arşivi hızla büyütür. Bağlam oranını <b>seyreltmez</b> — varsayılan ayarlarda ve 40. nesilde ölçüldüğünde katkı 0'dan 5'e çıkarken C/A oranı 0,01'den 0,22'ye <b>yükselir</b>; çünkü taze katkı, kırk nesildir aşınmakta olan eski stoktan daha bağlamlı gelir.<br><br>Katkının gerçekten seyrelttiği şey, arşivin <b>seçilebilen</b> payıdır: aynı aralıkta %100'den %18'e düşer, çünkü öğrenme bütçesi H sabittir, arşiv değildir. Bu bir kapasite tavanıdır, bağlam kaybı değil. R tam olarak ikisine ayrışır: R = (min(A,H)/A) × C × q<sub>d</sub>; yani kanallar <i>terim</i> olarak ayrı durur. Ama <i>kaldıraç</i> olarak bağımsız değildirler — kapasite, katkı ve yarı ömür ikisini birden oynatır. Tavanı tek başına oynatan yalnız kazanç, bağlam oranını tek başına oynatan yalnız q<sub>c</sub>'dir.",
    "The raw output each generation adds on top of what it inherited. “Gross”, because not all of it enters the archive: the model assumes 85% passes verification and 90% is actually recorded.<br><br>Raising this grows the archive fast. It does <b>not</b> dilute the context ratio — measured on the default settings at generation 40, C/A actually climbs from 0.01 to 0.22 as input goes from 0 to 5, because fresh input arrives better contextualised than old stock that has been decaying for forty generations.<br><br>What input <b>does</b> dilute is the share of the archive that gets selected at all: from 100% down to 18% over the same range, because the learning budget H is fixed while the archive is not. That is a capacity ceiling, not a loss of context. R factorises exactly into the two: R = (min(A,H)/A) × C × q<sub>d</sub>, so the channels stay separable as terms. They are not independent as <i>levers</i>, though — capacity, input and half-life each move both at once. Only gain moves the ceiling alone, and only q<sub>c</sub> moves the context ratio alone."],
  halfLife: [
    "Kayıtların yarısının erişilemez hâle gelmesi için geçen kuşak sayısı. Sabit bir yüzde yerine sürekli bir aşınma oranı kullanılır.<br><br>Kısa yarı ömür yalnız yangın ve savaş demek değildir: papirüsün çürümesi, formatın eskimesi, oynatıcının üretimden kalkması ve bağlantı çürümesi de aynı terime girer. Bakımı yapılmayan arşiv, kimse ona dokunmasa bile küçülür.<br><br><b>Yönü dikkatle okuyun.</b> Bu kaydırıcının büyük bölümünde <i>uzun</i> yarı ömür, yeniden kurulabilen kapsamı düşürür: 40. nesilde h = 5 arşivi 8,9 birim bırakır ve %49'u bağlamlıdır; h = 100 ise 47,8 birim bırakır ama yalnız %17'si bağlamlıdır. Ama tekdüze değildir — varsayılan ayarlarda R yaklaşık h ≈ 12'de tepe yapar ve sonra düşer. Nedeni kesindir: tepenin altında arşiv hâlâ öğrenme bütçesi H'den küçüktür, tavana hiçbir şey kurban edilmez ve R doğrudan bağlamlı stoku izler (R = C · q<sub>d</sub>). Tepenin üstünde arşiv H'yi aşar ve geriye yalnız düşen bağlam oranı kalır. Ham kayıt r hızıyla, bağlam ise daha yavaş olan r·q<sub>c</sub> hızıyla yaşar; dolayısıyla dayanıklı bir arşiv, onu okuma imkânını biriktirdiğinden daha hızlı malzeme biriktirir. Model “çürüme iyidir” demiyor — bağlamın bakımı yapılmadan sağlanan dayanıklılığın hacim kazandırdığını, bilgi kazandırmadığını söylüyor. Buradaki yarı ömür <b>kayıt ömrünü</b> ölçer, bakımı değil; ayrı bir bakım terimi yoktur ve bu, modelin gerçek sınırlarından biridir.",
    "How many generations it takes for half the records to become inaccessible. A continuous decay rate is used rather than a fixed percentage.<br><br>A short half-life does not only mean fire and war: papyrus decay, format obsolescence, the reading machine going out of production and link rot all fall under the same term. An unmaintained archive shrinks even when nobody touches it.<br><br><b>Read the direction carefully.</b> Over most of this slider a <i>longer</i> half-life lowers the reproducible reach: at generation 40, h = 5 leaves an archive of 8.9 units with 49% of it contextual, while h = 100 leaves 47.8 units with only 17%. It is not monotonic, though — on the default settings R peaks around h ≈ 12 and falls after it. The reason is exact: below the peak the archive is still smaller than the learning budget H, so nothing is lost to the ceiling and R simply tracks the contextual stock (R = C · q<sub>d</sub>). Above it the archive overruns H and only the falling context ratio is left. Raw records survive at rate r, context at the slower rate r·q<sub>c</sub>, so a more durable archive accumulates material faster than it accumulates the means to read it. The model is not saying decay is good — it is saying that durability without maintenance of context buys volume, not knowledge. Half-life here measures <b>record survival</b>, not upkeep; there is no separate maintenance term, and that is one of the model's real limits."],
  generations: [
    "Kaç kuşak ileri bakılacağı. Takvim yılı değil, <b>soyut adım sayısıdır</b>; bir “kuşak” aktarımın bir kez gerçekleştiği aralıktır.<br><br>Uzatmak yeni bilgi eklemez, yalnız mevcut varsayımların uzun vadeli eğilimini gösterir. Dikkat: uzun yarı ömürlerde arşiv 60. nesilde hâlâ dengeye oturmamıştır — varsayılan h = 35'te sınırının %75'indedir ve nesil başına yaklaşık %0,7 yükselmeye devam eder.<br><br>Kısaltmak, kısa vadeli davranışı — özellikle ilk kuşaklardaki geçiş etkisini — daha net okumanızı sağlar.",
    "How many generations to look ahead. Not calendar years but <b>an abstract number of steps</b>; a “generation” is one interval in which transmission happens once.<br><br>Extending it adds no new information — it only shows the long-run trend of the current assumptions. Note that at long half-lives the archive has still not settled by generation 60: at the default h = 35 it is at 75% of its limit and still climbing about 0.7% per generation.<br><br>Shortening it makes the short-run behaviour easier to read, especially the transient in the first few generations."],
  selGen: [
    "Grafikteki dikey kılavuzun ve üstteki üç sayının hangi kuşağı gösterdiğini seçer.<br><br>Modeli <b>değiştirmez</b> — yalnızca hangi ana baktığınızı değiştirir. Eğrilerin biçimi aynı kalır.",

// A range row is a <div>, not a <label>: a <button> inside a <label> would forward its
// click to the slider. The label/input pair is tied together with an explicit id instead.
function rangeRow(pfx, key, labelText, valueText, inputAttrs, hintText) {

  var help = HELP[key] ? '<button type="button" class="qm" data-act="rhelp" data-k="' + key +

    esc(t("whatIsThis")) + ": " + esc(labelText) + '" title="' + esc(t("whatIsThis")) + '">?</button>' : "";
  return '<div class="range' + (mcHighlight(key) ? " mc-target" : "") + '"><div class="range-top"><label for="' + id + '">' + esc(labelText) + "</label>" + help +
    '<output data-out="' + key + '" for="' + id + '">' + esc(valueText) + "</output></div>" +
    '<input id="' + id + '" type="range" data-inp="' + key + '" ' + inputAttrs + '>' +
    '<small>' + esc(hintText) + "</small>" +
    (HELP[key] ? '<div class="range-help" id="' + hid + '" data-help-for="' + key + '" role="note"' +
      (open ? "" : " hidden") + ">" + HELP[key][lang] + "</div>" : "") + "</div>";
}

/* ---------- the Chain Probe: the researchers' own protocol, made runnable ----------
   The engine INVENTS NOTHING. It asks the same twelve questions our four
   researchers answered from sources for the thirty objects above, points the
   user at real research routes for each, and computes the six-link profile from

function probeScore() {
  // per link: worst answered value wins (0=thin, 1=strong); unanswered -> null
  var out = {};
  CHAIN_LINKS.forEach(function (k) { out[k] = { vals: [], unknown: 0 }; });
  PROBE_QS.forEach(function (q, i) {
    var a = S.probe.ans[i];
    if (a === "strong") out[q.k].vals.push(1);
    else if (a === "weak") out[q.k].vals.push(0);
    else out[q.k].unknown++;
  });
  CHAIN_LINKS.forEach(function (k) {
    var o = out[k];
    o.state = o.vals.length === 0 ? "unknown" : Math.min.apply(null, o.vals) === 0 ? "weak" : "strong";
  });
  return out;
}

/* ============================================================
   Navigation & URL
   ============================================================ */
function go(v, noScroll) {
  if (VIEWS.indexOf(v) < 0) v = "overview";
  S.view = v; S.menu = false;
  render(); syncHash();
  if (!noScroll) window.scrollTo({ top: 0, behavior: "smooth" });
}
function syncHash() {
  if (!S.ready) return;
  var q = new URLSearchParams();
  if (lang === 1) q.set("lang", "en");
  if (S.view === "model") { q.set("capacity", String(S.model.capacity)); q.set("gain", String(S.model.gain)); if (S.preset) q.set("preset", S.preset); if (S.modelCase) q.set("case", S.modelCase); }
  if (S.view === "history") { q.set("window", String(S.windowYears)); q.set("event", S.selectedId); if (S.category !== "all") q.set("cat", S.category); }
  if (S.view === "sources" && S.sourceFilter !== "all") q.set("group", S.sourceFilter);
  if (S.view === "chains" && S.chainItem) q.set("item", S.chainItem);
  var qs = q.toString();
  var target = "#/" + S.view + (qs ? "?" + qs : "");
  // Sandboxed/srcdoc previews reject replaceState on origin grounds. The app state
  // lives in S, so a failure here only means the address bar stops mirroring it.
  if (!CAN_WRITE_URL) return;
  try {
    history.replaceState(null, "", target);
  } catch (e) {
    CAN_WRITE_URL = false;
    try { if (location.hash !== target) location.hash = target; } catch (e2) {}
  }
}
function readHash() {
  var hash = "";
  try { hash = location.hash || ""; } catch (e) { return false; }
  var raw = hash.slice(2);
  if (!raw && hash && hash.indexOf("#/") !== 0) return false;
  var parts = raw.split("?"), path = parts[0], q = new URLSearchParams(parts[1] || "");
  if (q.get("lang") === "en") lang = 1;
  else if (q.get("lang") === "tr") lang = 0;
  if (VIEWS.indexOf(path) >= 0) S.view = path;
  if (S.view === "model") {
    var p = q.get("preset"), pr = p && presetById(p);
    if (pr) { S.model = Object.assign({}, pr.v); S.preset = pr.id; }
    var c = Number(q.get("capacity")), g = Number(q.get("gain"));
    if (c) S.model.capacity = c;
    if (g) S.model.gain = g;
    S.selGen = Math.min(S.selGen, S.model.generations);
    var cs = q.get("case");
    S.modelCase = cs && prodById(cs) ? cs : null;
    if (S.modelCase) {
      // a shared case URL must reproduce the scenario, not just the banner:
      // apply the fixed rule, then let explicit URL params win back capacity/gain.
      S.model = Object.assign({}, caseScenario(prodById(S.modelCase)));
      var c2 = Number(q.get("capacity")), g2 = Number(q.get("gain"));
      if (c2) S.model.capacity = c2;
      if (g2) S.model.gain = g2;
      S.preset = null;
      S.selGen = Math.min(S.selGen, S.model.generations);
    }
  }
  if (S.view === "history") {
    var w = Number(q.get("window"));
    if (WINDOWS.some(function (x) { return x[0] === w; })) S.windowYears = w;
    var cat = q.get("cat");
    if (CATS.some(function (x) { return x[0] === cat; })) S.category = cat;
    var e = q.get("event");
    if (e && byId(e)) S.selectedId = e;
    var pl = catList();
    if (pl.length && !pl.some(function (x) { return x.id === S.selectedId; })) S.selectedId = pl[pl.length - 1].id;
  }
  if (S.view === "sources") {
    var gr = q.get("group");
    if (gr && sourceGroups.some(function (x) { return x.id === gr; })) S.sourceFilter = gr;
  }
  if (S.view === "chains") {
    var it = q.get("item");
    S.chainItem = it === "probe" ? "probe" : it && prodById(it) ? it : null;
  }
  return true;
}

function setTheme(th) {
  S.theme = th;

function toggleLang() {

function applyPreset(id) {
  var p = presetById(id);

  S.selGen = Math.min(S.selGen, S.model.generations);

}
function freezeCurve() {
  if (S.frozen.length >= 3) { toast(t("mlFrozenFull")); return; }
  var label = S.modelCase && prodById(S.modelCase) ? prodById(S.modelCase).icon + " " + tx(prodById(S.modelCase).name)
    : S.preset ? tx(presetById(S.preset).label)
    : "G " + nf(S.model.gain, 1) + " · q" + (lang === 0 ? "b" : "c") + " " + pct(Math.round(S.model.qc * 100)) + " · q" + (lang === 0 ? "ç" : "d") + " " + pct(Math.round(S.model.qd * 100));
  S.frozen.push({ label: label, data: simulate(S.model), hidden: false });
  mountView(); toast(t("mlFrozenAdded"));
}
function stepEvent(d) {
  var pool = catList(), i = pool.indexOf(byId(S.selectedId));
  var n = Math.max(0, Math.min(pool.length - 1, i + d));
  if (pool[n]) { S.selectedId = pool[n].id; refreshHistory(); syncHash(); }
}

document.addEventListener("click", function (ev) {
  var a = ev.target.closest("[data-act]");
  var anchor = ev.target.closest('a[href^="#"]');
  if (anchor && !a && anchor.getAttribute("href").indexOf("#/") !== 0) {
    ev.preventDefault();
    var id = anchor.getAttribute("href").slice(1), el = document.getElementById(id);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); if (id === "main") el.focus({ preventScroll: true }); }
    return;
  }
  if (!a) return;
  var act = a.dataset.act;
  if (act === "closeHelp" && ev.target.closest("[data-stop]") && ev.target.closest("[data-act]") !== a) return;
  if (act === "anchor") {
    ev.preventDefault();
    var el = document.getElementById(a.dataset.t);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); if (a.dataset.t === "main") el.focus({ preventScroll: true }); }
    return;
  }
  if (act === "nav") { ev.preventDefault(); go(a.dataset.v); return; }
  if (act === "goEvt") { S.selectedId = a.dataset.id; S.category = "all"; S.windowYears = 100000; go("history"); return; }
  if (act === "theme") { setTheme(S.theme === "light" ? "dark" : "light"); render(); return; }
  if (act === "lang") { toggleLang(); return; }
  if (act === "menu") { S.menu = true; render(); var d = document.querySelector(".drawer button"); if (d) d.focus(); return; }
  if (act === "closeMenu") { S.menu = false; render(); var b = document.getElementById("menu-btn"); if (b) b.focus(); return; }
  if (act === "help") { S.help = !S.help; render(); return; }
  if (act === "closeHelp") { S.help = false; render(); return; }
  if (act === "share") {
    var url = "";
    try { url = location.href; } catch (e) {}
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast(t("copied")); }, function () { toast(url); });
      } else if (navigator.share) { navigator.share({ url: url })["catch"](function () {}); }
      else toast(url);
    } catch (e) { toast(url); }
    return;
  }
  if (act === "rhelp") {
    var k = a.dataset.k, open = !S.openHelp[k];
    S.openHelp[k] = open;
    $$('[data-help-for="' + k + '"]').forEach(function (el) { el.hidden = !open; });
    $$('.qm[data-k="' + k + '"]').forEach(function (btn) { btn.setAttribute("aria-expanded", String(open)); });
    return;
  }
  if (act === "preset") { applyPreset(a.dataset.p); return; }
  if (act === "reset") { S.model = Object.assign({}, DEFAULT_MODEL); S.preset = null; S.selGen = Math.min(S.selGen, S.model.generations); mountView(); syncHash(); return; }
  if (act === "presetRevert") {
    var pv = presetById(S.preset); if (!pv) return;
    S.model = Object.assign({}, pv.v); S.selGen = Math.min(S.selGen, S.model.generations);
    mountView(); syncHash(); return;
  }
  if (act === "freeze") { freezeCurve(); return; }
  if (act === "clearFrozen") { S.frozen = []; mountView(); return; }
  if (act === "toggleFrozen") { var fi = Number(a.dataset.i); if (S.frozen[fi]) S.frozen[fi].hidden = !S.frozen[fi].hidden; mountView(); return; }
  if (act === "removeFrozen") { S.frozen.splice(Number(a.dataset.i), 1); mountView(); return; }
  if (act === "dl") { downloadChart(a.dataset.chart, a.dataset.fmt); return; }
  if (act === "evt") { S.selectedId = a.dataset.id; refreshHistory(); syncHash(); return; }
  if (act === "stepEvt") { stepEvent(Number(a.dataset.d)); return; }
  if (act === "srcFilter") { S.sourceFilter = a.dataset.f; mountView(); syncHash(); return; }
  if (act === "chItem") { S.chainItem = a.dataset.id || null; mountView(); syncHash(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (act === "chGuess") { if (S.chainItem) { S.chainGuess[S.chainItem] = a.dataset.k; mountView(); } return; }
  if (act === "chRetry") { if (S.chainItem) { delete S.chainGuess[S.chainItem]; mountView(); } return; }
  if (act === "mcOpen") {
    S.modelCase = a.dataset.id;
    var cx = prodById(S.modelCase);
    if (cx) { S.model = Object.assign({}, caseScenario(cx)); S.preset = null; S.selGen = Math.min(S.selGen, S.model.generations); }
    go("model"); return;
  }
  if (act === "mcClose") { S.modelCase = null; mountView(); syncHash(); return; }
  if (act === "mcBack" || act === "chJump") { S.chainItem = a.dataset.id; go("chains"); return; }
  if (act === "prAns") { S.probe.ans[a.dataset.i] = a.dataset.v; mountView(); return; }
  if (act === "prReset") { S.probe = { name: S.probe.name, ans: {} }; mountView(); return; }
  if (act === "prModel") {
    // a probe result opens the lab through the SAME fixed rule, keyed by the
    // user's own single thin link; the lens shows a pseudo-case named by them.
    S.modelCase = null; S.preset = null;
    var wk2 = a.dataset.k;
    S.model = {
      capacity: DEFAULT_MODEL.capacity, innovation: DEFAULT_MODEL.innovation, generations: DEFAULT_MODEL.generations,
      qc: wk2 === "context" ? SCENARIO_RULE.qc.low : SCENARIO_RULE.qc.healthy,
      qd: wk2 === "decoder" ? SCENARIO_RULE.qd.low : SCENARIO_RULE.qd.healthy,
      gain: wk2 === "packet" ? SCENARIO_RULE.gain.low : SCENARIO_RULE.gain.healthy,
      halfLife: (wk2 === "apparatus" || wk2 === "maintenance") ? SCENARIO_RULE.halfLife.low : SCENARIO_RULE.halfLife.healthy
    };
    S.selGen = Math.min(S.selGen, S.model.generations);
    go("model"); return;
  }
  if (act === "chResetAll") { S.chainGuess = {}; mountView(); toast(t("chResetDone")); return; }
  if (act === "chStep") {
    var ci = products.indexOf(prodById(S.chainItem));
    var nx = Math.max(0, Math.min(products.length - 1, ci + Number(a.dataset.d)));
    S.chainItem = products[nx].id; mountView(); syncHash(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
});

document.addEventListener("keydown", function (ev) {
  var el = ev.target;
  if (ev.key === "Enter" || ev.key === " ") {
    var g = el.closest && el.closest('g[data-act="evt"]');
    if (g) { ev.preventDefault(); S.selectedId = g.dataset.id; refreshHistory(); syncHash(); return; }
  }
  if (ev.key === "Escape") {
    if (S.help) { S.help = false; render(); return; }
    if (S.menu) { S.menu = false; render(); var b = document.getElementById("menu-btn"); if (b) b.focus(); return; }
  }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var tag = (el.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea" || el.isContentEditable) return;
  var k = ev.key;
  if (k >= "1" && k <= "7") { go(VIEWS[+k - 1]); return; }
  if (k === "t" || k === "T") { setTheme(S.theme === "light" ? "dark" : "light"); render(); return; }
  if (k === "l" || k === "L") { toggleLang(); return; }
  if (k === "p" || k === "P") { ev.preventDefault(); try { window.print(); } catch (e) {} return; }
  if (k === "?" || (k === "/" && ev.shiftKey)) { S.help = !S.help; render(); return; }
  if (S.view === "history" && (k === "ArrowLeft" || k === "ArrowRight")) { ev.preventDefault(); stepEvent(k === "ArrowRight" ? 1 : -1); }
  if (S.view === "chains" && S.chainItem && (k === "ArrowLeft" || k === "ArrowRight")) {
    ev.preventDefault();
    var ci = products.indexOf(prodById(S.chainItem));
    var nx = Math.max(0, Math.min(products.length - 1, ci + (k === "ArrowRight" ? 1 : -1)));
    S.chainItem = products[nx].id; mountView(); syncHash();
  }
});

document.addEventListener("change", function (ev) {

  } else if (key === "showEvidence") { S.showEvidence = el.checked; syncCopies(key, el.checked); refreshHistory(); }
});
function syncCopies(key, val) {
  $$('[data-inp="' + key + '"]').forEach(function (i) { if (i.type === "checkbox") i.checked = !!val; else i.value = val; });
}
function setOut(key, text) {
  $$('[data-out="' + key + '"]').forEach(function (o) { o.textContent = text; });
}

function setFreezePending(on) {
  var live = document.querySelector('svg[data-chart="model"] .plot.rebuilt');
  if (live) live.classList.toggle("pending", on);
}
document.addEventListener("pointerover", function (ev) {
  if (ev.target.closest && ev.target.closest('[data-act="freeze"]')) setFreezePending(true);
});
document.addEventListener("pointerout", function (ev) {
  if (ev.target.closest && ev.target.closest('[data-act="freeze"]')) setFreezePending(false);
});
document.addEventListener("focusin", function (ev) {
  if (ev.target.closest && ev.target.closest('[data-act="freeze"]')) setFreezePending(true);
});
document.addEventListener("focusout", function (ev) {
  if (ev.target.closest && ev.target.closest('[data-act="freeze"]')) setFreezePending(false);
});
document.addEventListener("pointermove", handleHover, { passive: true });
document.addEventListener("pointerleave", function (ev) {
  var svg = ev.target.closest ? ev.target.closest("svg[data-chart]") : null;
  if (svg) clearHover(svg);
}, true);

var rzTimer;
window.addEventListener("resize", function () {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(function () {
    if (S.view === "model") refreshModel();
    else if (S.view === "history") refreshHistory();
  }, 160);
});
window.addEventListener("hashchange", function () {
  var hs = ""; try { hs = location.hash || ""; } catch (e) { return; }
  if (hs.indexOf("#/") !== 0) return;
  readHash();
  render();
});

/* ============================================================
   Boot
   ============================================================ */
(function boot() {
 try {
  var savedLang = null, savedTheme = null;
  try { savedLang = localStorage.getItem("bz-lang"); savedTheme = localStorage.getItem("bz-theme"); } catch (e) {}
  // DEFAULT_LANG: sitenin varsayılan dili. Tarayıcı diline göre otomatik seçmek için
  // AUTO_LANG değerini true yapın. / Set AUTO_LANG to true to follow the browser locale.
  var AUTO_LANG = false;
  if (savedLang === "en") lang = 1;
  else if (savedLang === "tr") lang = 0;
  else if (AUTO_LANG && (navigator.language || "").slice(0, 2).toLowerCase() !== "tr") lang = 1;
  readHash();
  S.theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme
    : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = S.theme;
  S.ready = true;
  syncHash();            // probes replaceState; flips CAN_WRITE_URL on a SecurityError
  var docUrl = "";
  try { docUrl = document.URL || ""; } catch (e) {}
  EMBEDDED = !CAN_WRITE_URL || docUrl.indexOf("about:") === 0;
  render();
 } catch (err) {
  if (window.console && console.error) console.error(err);
  try { S.ready = true; render(); } catch (e2) {}
 }
})();
</script>
