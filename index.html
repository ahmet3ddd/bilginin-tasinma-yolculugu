EE Engineering and Technology History Wiki"],"m":["Marş motorunun 1911 gösterimini, 1912 Cadillac'taki çıkışını ve elektrikli araç payının 1913'te %1'e düşüp 1920'lerin başında piyasadan silinmesini anlatır.","Documents the starter's 1911 demonstration, its debut on the 1912 Cadillac, and the collapse of the EV share to 1% in 1913 and out of the market by the early 1920s."],"u":"https://ethw.org/Charles_F._Kettering"},{"t":["Global EV Outlook 2026, yönetici özeti — IEA","Global EV Outlook 2026, executive summary — IEA"],"m":["2025'te 20 milyondan fazla satış ve yeni araçların dörtte birinin elektrikli olduğu güncel rakamların kaynağı.","Source for the current figures: over 20 million sold in 2025 and one in four new cars electric."],"u":"https://www.iea.org/reports/global-ev-outlook-2026/executive-summary"},{"t":["EV1'in hikâyesi — General Motors kurum arşivi","Driving the future, then and now: the story of the EV1 — General Motors"],"m":["EV1'in 1996 sonunda kiralanmaya başladığını, yaklaşık 1.000 adet üretildiğini, hiç satılmayıp geri toplandığını üreticinin kendi ağzından verir.","GM's own account that the EV1 first reached lessors in late 1996, that about 1,000 were built, and that they were never sold, only leased and later recalled."],"u":"https://news.gm.com/home.detail.html/Pages/news/us/en/2026/mar/0311-ev1.html"}]},{"id":"aspirin","cat":"everyday","civ":"modern","icon":"💊","name":["Aspirin (asetilsalisilik asit)","Aspirin (acetylsalicylic acid)"],"era":["1763 – bugün","1763 – present"],"hook":["Aspirin 10 Ağustos 1897'de saf hâlde sentezlendi, 1899'da satışa çıktı ve yılda 100 milyardan fazla tablet olarak yutuldu — nasıl işlediğini kimse bilmeden. John Vane mekanizmayı ilk sentezden 74 yıl sonra, 1971'de buldu.","Aspirin was synthesised pure on 10 August 1897, was on sale by 1899, and was swallowed at more than 100 billion tablets a year — with nobody knowing how it worked. John Vane found the mechanism in 1971, 74 years after that first synthesis."],"timeline":[{"y":1763,"t":["Chipping Norton papazı Edward Stone'un söğüt kabuğu mektubu 25 Nisan'da yazılır, 2 Haziran 1763'te Royal Society'de okunur: elli hastada ateş düşürücü etki.","The Rev. Edward Stone of Chipping Norton writes his willow bark letter on 25 April; it is read to the Royal Society on 2 June 1763: fifty patients, fevers relieved."],"link":"packet","src":"https://makingscience.royalsociety.org/items/l-and-p_4_161/letter-of-willow-bark-in-ague-from-edward-stone-to-george-parker"},{"y":1829,"t":["Henri Leroux söğütten salisini izole eder; 1838'de Raffaele Piria salisinden salisilik asidi elde eder. Bitkisel çay, ölçülebilir bir moleküle indirgenir.","Henri Leroux isolates salicin from willow; in 1838 Raffaele Piria obtains salicylic acid from it. A herbal tea is reduced to a measurable molecule."],"link":"packet","src":"https://www.nlm.nih.gov/exhibition/the-story-of-aspirin/index.html"},{"y":1853,"t":["Charles Gerhardt asetilsalisilik asidi ilk kez sentezler, ama bileşik kararsız ve saf değildir; bırakır. Paket vardır; onu kullanılabilir kılacak süreç yoktur.","Charles Gerhardt first synthesises acetylsalicylic acid, but it is unstable and impure and he abandons it. The packet exists; the process that makes it usable does not."],"link":"tacit","src":"https://www.nlm.nih.gov/exhibition/the-story-of-aspirin/index.html"},{"y":1897,"t":["10 Ağustos 1897: Bayer'de Felix Hoffmann, salisilik asidi asetik anhidritle asetilleyerek ASA'yı kimyasal olarak saf ve kararlı biçimde elde eder.","10 August 1897: at Bayer, Felix Hoffmann acetylates salicylic acid with acetic anhydride and obtains ASA in chemically pure, stable form."],"link":"tacit","src":"https://www.bayer.com/en/history/felix-hoffmann"},{"y":1899,"t":["Aspirin adıyla, cam şişede toz olarak piyasaya çıkar. Alman patenti reddedilir — bileşik yeni değildir; ABD patenti 1900-1917 arası tekel sağlar.","It launches as Aspirin, a powder in glass bottles. The German patent is refused — the compound is not new — while a US patent gives Bayer a monopoly from 1900 to 1917."],"link":"apparatus","src":"https://www.sciencehistory.org/education/scientific-biographies/felix-hoffmann/"},{"y":1971,"t":["John Vane, Nature New Biology'de aspirinin prostaglandin sentezini engelleyerek etki ettiğini gösterir. İlk sentezden 74, piyasaya çıkışından 72 yıl sonra.","In Nature New Biology, John Vane shows that aspirin works by inhibiting prostaglandin synthesis — 74 years after the first synthesis, 72 after it went on sale."],"link":"context","src":"https://www.nature.com/articles/newbio231232a0"},{"y":1982,"t":["Vane; Sune Bergström ve Bengt Samuelsson ile 'prostaglandinler ve ilgili biyolojik etkin maddeler' üzerine Nobel Tıp Ödülü'nü paylaşır. Bağlam halkası kapanır.","Vane shares the Nobel Prize in Physiology or Medicine with Sune Bergström and Bengt Samuelsson for prostaglandins and related biologically active substances."],"link":"context","src":"https://www.nobelprize.org/prizes/medicine/1982/summary/"},{"y":1988,"t":["FDA, çocuklarda Reye sendromu uyarısını aspirin etiketine zorunlu kılar. İlacın bir sınırı, piyasaya çıkışından 89 yıl sonra kutunun üzerine yazılır.","The FDA writes the Reye's syndrome warning for children into the aspirin label. One of the drug's limits reaches the box 89 years after it went on sale."],"link":"context","src":"https://www.federalregister.gov/documents/2003/04/17/03-9382/labeling-for-oral-and-rectal-over-the-counter-drug-products-containing-aspirin-and-nonaspirin"}],"links":{"packet":["Neredeyse yok edilemez. Molekül ve sentezi her lisans laboratuvar kitabında; patent süresi dolalı bir asır oldu; DSÖ Temel İlaçlar Listesi'nde. Tek bir kurumun çökmesi bu paketi silemez.","All but indestructible. The molecule and its synthesis sit in every undergraduate lab manual, the patent lapsed a century ago, and it is on the WHO Essential Medicines List. No single institution's collapse can erase this packet."],"decoder":["Buradaki dört zincirin en genişi. Kimyagerler ve eczacılardan, kutunun üstündeki dozu okuyup uygulayabilen yüz milyonlarca sıradan insana kadar uzanıyor.","The broadest of the four chains here. It runs from chemists and pharmacists all the way to the hundreds of millions of ordinary people who can read a dose off a box and act on it."],"context":["En geç gelen ve hâlâ yazılmakta olan halka. Mekanizma yalnızca 1971'den beri biliniyor; çocuklarda Reye sendromu sınırı 1988'de etikete girdi; birincil korunmada günlük aspirin önerisi son yıllarda büyük ölçüde geri çekildi. Antikçağ soyağacı da sanıldığı kadar sağlam değil: Ebers papirüsü çevirisinde söğüdün ağrı ya da ateş için kullanıldığına dair kayıt bulunmuyor ve Hippokratik külliyat söğütten yalnızca bir kez, rahim tütsülemesi bağlamında söz ediyor.","The latest-arriving link, and still being written. The mechanism has been known only since 1971; the Reye's syndrome limit for children reached the label in 1988; and the routine daily-aspirin recommendation for primary prevention has been largely withdrawn in recent years. The ancient pedigree is weaker than usually told: a search of the Ebers Papyrus translation finds no willow used for pain or fever, and the Hippocratic corpus mentions willow once, in a uterine fumigation."],"tacit":["Kullanıcı ucunda neredeyse sıfır — ve zincirin gücü tam da bu. Endüstriyel uçta ise hâlâ zanaat var: asetilleme kontrolü, kristalizasyon, tabletleme, bağlayıcı ve dağıtıcı reçeteleri. Gerhardt'ın 1853'ü bu halkanın ne kadar belirleyici olduğunun kanıtı.","Almost zero at the user end — and that is precisely the chain's strength. At the industrial end craft remains: controlling the acetylation, crystallisation, tabletting, and the binder and disintegrant recipes. Gerhardt in 1853 is the proof of how decisive this link is."],"apparatus":["Sıradanlaşmış ve dağıtık: fenolden Kolbe-Schmitt yoluyla salisilik asit, dökme asetik anhidrit, tablet presleri. Yılda yaklaşık 35.000 metrik ton üretiliyor — 100 milyar tabletten fazlası.","Commoditised and distributed: salicylic acid from phenol by the Kolbe-Schmitt route, bulk acetic anhydride, tablet presses. About 35,000 tonnes are made each year — more than 100 billion tablets."],"maintenance":["Farmakope monografları, GMP denetimleri ve etiket revizyonlarıyla yürüyor. Zayıf nokta ticari: ilaç o kadar ucuz ki yeni endikasyon çalışmalarını üretici değil, kamu fonları taşımak zorunda.","Carried by pharmacopoeial monographs, GMP inspection and label revisions. The weak point is commercial: the drug is so cheap that new indication trials must be publicly funded rather than paid for by a manufacturer."]},"weakest":{"k":"context","why":["Bu zincirin tanımlayıcı özelliği, paketin bağlamın hep önünde koşması — ve bu hâlâ sürüyor. Mekanizma 1971'de bulundu, ama 'kim, hangi dozda, ne kadar süre almalı' sorusu her on yılda yeniden yazılıyor: 1988'de çocuklar etiketten çıkarıldı, son yıllarda birincil korunmada günlük kullanım büyük ölçüde geri çekildi. Üstelik halk arasında dolaşan bağlam — 'binlerce yıllık söğüt kabuğu geleneği' — birincil kaynaklarda karşılığı olmayan bir anlatı. Paket kusursuz korunurken bağlamın hem bilimsel hem tarihsel yarısı sürekli aşınıyor.","This chain's defining feature is that the packet has always run ahead of the context — and still does. The mechanism arrived in 1971, but the question of who should take it, at what dose, for how long, is rewritten every decade: children came off the label in 1988, and routine daily use for primary prevention has been largely withdrawn in recent years. Worse, the context circulating publicly — 'a thousands-of-years-old willow bark tradition' — is a story the primary sources do not support. The packet is perfectly preserved while both halves of the context, scientific and historical, keep eroding."]},"nearBreak":["1980'ler: Reye sendromu. Aspirin, viral enfeksiyon atlatan çocuklarda nadir ama çoğu zaman ölümcül bir ansefalopati ve karaciğer hasarı tablosuyla ilişkilendirildi; teşhis konan çocukların %80'inden fazlası önceki üç hafta içinde aspirin almıştı. Ohio Sağlık Bakanlığı çalışması 1982'de, Halk Sağlığı Hizmeti çalışmaları 1985 ve 1987'de, Yale çalışması 1989'da ilişkiyi doğruladı; FDA uyarıyı etikete 1988'de zorunlu kıldı. Rutin bir çocuk dozu, ilacın piyasaya çıkışından seksen yılı aşkın süre sonra hâlâ okunmamış bir bağlam boşluğuydu — ve okunduğunda vaka sayısı yılda yaklaşık 100'den 1991-94 arasında milyonda 0,2-1,1'e düştü.","The 1980s: Reye's syndrome. Aspirin was linked to a rare but often fatal encephalopathy with liver injury in children recovering from viral infection; more than 80% of children diagnosed had taken aspirin in the preceding three weeks. An Ohio Department of Health study in 1982, Public Health Service studies in 1985 and 1987 and a Yale study in 1989 confirmed the association, and the FDA wrote the warning into the label in 1988. A routine children's dose had been an unread gap in the context more than eighty years after launch — and once it was read, cases fell from around 100 a year to between 0.2 and 1.1 per million in 1991-94."],"thesis":["Çalışmanın PAKET ile BAĞLAM'ın birbirinden ayrılabilir olduğu iddiasının en saf olumlu örneği. Aspirin, bağlam halkası tümüyle boşken yetmiş dört yıl boyunca endüstriyel ölçekte işledi; çünkü diğer beş halka — kod çözücü, örtük beceri, aparat, bakım ve paketin kendisi — sapasağlam duruyordu. Dürüst sınır: eksik bağlam bedava değildi. Reye sendromu bu boşluğun faturasını çocuklara kesti; ve 1971 boşluğu kapatmaktan çok daraltıp yaşanabilir kıldı — endikasyon listesi bugün hâlâ yeniden yazılıyor.","The purest positive specimen of the study's claim that PACKET and CONTEXT are separable. Aspirin ran at industrial scale for seventy-four years with the context link entirely empty, because the other five links — decoder, tacit, apparatus, maintenance and the packet itself — held. Honest limit: the missing context was not free. Reye's syndrome billed the gap to children; and 1971 did not so much close the gap as narrow it into something survivable — the indication list is still being rewritten today."],"sources":[{"t":["Edward Stone'un söğüt kabuğu mektubu — Royal Society, Science in the Making","Edward Stone's willow bark letter — The Royal Society, Science in the Making"],"m":["Mektubun 25 Nisan 1763'te yazıldığını ve 2 Haziran 1763'te okunduğunu el yazması kaydından doğrular.","Confirms from the manuscript record that the letter was written on 25 April 1763 and read on 2 June 1763."],"u":"https://makingscience.royalsociety.org/items/l-and-p_4_161/letter-of-willow-bark-in-ague-from-edward-stone-to-george-parker"},{"t":["Felix Hoffmann — Bayer kurum tarihi","Felix Hoffmann — Bayer corporate history"],"m":["10 Ağustos 1897 sentez tarihini ve 1899'daki Aspirin lansmanını şirketin kendi arşivinden verir.","The company's own archive giving the 10 August 1897 synthesis date and the 1899 launch as Aspirin."],"u":"https://www.bayer.com/en/history/felix-hoffmann"},{"t":["Felix Hoffmann — Science History Institute","Felix Hoffmann — Science History Institute"],"m":["Alman patentinin reddini, 1900-1917 ABD tekelini ve Arthur Eichengrün'ün payına dair tartışmayı bağımsız bir kurumdan aktarır.","Independent institutional account of the refused German patent, the 1900-1917 US monopoly, and the dispute over Arthur Eichengrün's role."],"u":"https://www.sciencehistory.org/education/scientific-biographies/felix-hoffmann/"},{"t":["1982 Nobel Fizyoloji veya Tıp Ödülü — NobelPrize.org","The Nobel Prize in Physiology or Medicine 1982 — NobelPrize.org"],"m":["Bergström, Samuelsson ve Vane'e verilen ödülün gerekçesini birincil ağızdan doğrular.","Confirms the citation for the prize shared by Bergström, Samuelsson and Vane."],"u":"https://www.nobelprize.org/prizes/medicine/1982/summary/"},{"t":["Aspirinin Belirsiz Kökenleri — Asimov Press","The Uncertain Origins of Aspirin — Asimov Press"],"m":["Efsane söküm kaynağı: epidemiyolog Sean Harrison, Ebers papirüsü çevirisinde söğüdün ağrı-ateş kullanımına rastlamadığını ve Hippokratik külliyatta söğüdün yalnızca bir kez, rahim tütsülemesi için geçtiğini gösteriyor.","The myth-busting source: epidemiologist Sean Harrison reports finding no willow-for-pain-or-fever entry in a translation of the Ebers Papyrus, and only one willow reference in the Hippocratic corpus — a uterine fumigation."],"u":"https://www.asimov.press/p/aspirin"}]},{"id":"radio","cat":"info","civ":"modern","icon":"📻","name":["Radyo","Radio"],"era":["1864 – bugün","1864 – present"],"hook":["Maxwell 1864'te elektromanyetik dalgayı yalnızca kâğıt üzerinde öngördü; Hertz 11 Kasım 1886'da Karlsruhe'de bir derslikte bir dalganın yayıldığını ilk kez gözledi. Bugün ABD'de 731.045 kişinin amatör telsiz lisansı var: zincirin insan halkası hâlâ nefes alıyor.","Maxwell predicted the electromagnetic wave on paper alone in 1864; Hertz watched one propagate for the first time in a Karlsruhe lecture hall on 11 November 1886. Today 731,045 Americans hold an amateur radio licence — the chain's human link is still breathing."],"timeline":[{"y":1864,"t":["Maxwell'in 'A Dynamical Theory of the Electromagnetic Field' bildirisi 27 Ekim 1864'te Royal Society'ye ulaşır, 8 Aralık'ta okunur ve 1865'te basılır.","Maxwell's paper 'A Dynamical Theory of the Electromagnetic Field' reaches the Royal Society on 27 October 1864, is read on 8 December, and appears in print in 1865."],"link":"packet","src":"https://makingscience.royalsociety.org/items/pt_72_7/paper-a-dynamical-theory-of-the-electromagnetic-field-by-j-james-clerk-maxwell"},{"y":1886,"t":["11 Kasım 1886: Karlsruhe'de Kaiserstraße'deki bir derslikte bir elektromanyetik dalganın yayılımı ilk kez gözlenir. Kâğıttaki denklem laboratuvara iner.","11 November 1886: in a lecture hall on Kaiserstraße in Karlsruhe, the propagation of an electromagnetic wave is observed for the first time. Paper becomes bench."],"link":"apparatus","src":"https://www.kit.edu/kit/english/pi_2011_8434.php"},{"y":1895,"t":["1895 yazı, Villa Griffone: Marconi telsiz sinyalini Celestini tepesinin ardına, yaklaşık iki kilometre öteye ulaştırır. Fiziksel engel artık sorun olmaktan çıkar.","Summer 1895, Villa Griffone: Marconi sends a radiotelegraph signal beyond the Celestini hill, about two kilometres away. A physical obstacle stops being an obstacle."],"link":"tacit","src":"https://ethw.org/Milestones:Marconi's_Early_Experiments_in_Wireless_Telegraphy,_1895"},{"y":1901,"t":["12 Aralık 1901: Poldhu'dan Signal Hill'e (Newfoundland) 'S' harfi. Tek tanık Kemp'ti ve sinyal kaydedilemedi; olayın gerçekliği o günden beri tartışılıyor.","12 December 1901: the letter 'S' from Poldhu to Signal Hill, Newfoundland. Kemp was the sole witness and the signal too weak to record; it has been doubted ever since."],"link":"context","src":"https://ethw.org/Milestones:Reception_of_Transatlantic_Radio_Signals,_1901"},{"y":1904,"t":["Fleming 16 Kasım 1904'te 'salınım valfi' için patent başvurusu yapar (ABD 803.684). De Forest 1906'da ızgarayı ekler; triyot patenti 1908'de gelir (879.532).","Fleming applies for a patent on his 'oscillation valve' on 16 November 1904 (US 803,684). De Forest adds a grid in 1906; the triode patent follows in 1908 (879,532)."],"link":"apparatus","src":"https://ethw.org/Milestones:Fleming_Valve,_1904"},{"y":1920,"t":["2 Kasım 1920: KDKA, Harding-Cox seçim sonuçlarını yayınlar — ilk programlı ticari yayın. Dört yıl içinde ABD'de 600 istasyon kurulur.","2 November 1920: KDKA broadcasts the Harding-Cox election returns — the first scheduled commercial broadcast. Within four years the US has 600 stations."],"link":"maintenance","src":"https://www.fcc.gov/media/radio/history-of-commercial-radio"},{"y":1954,"t":["18 Ekim 1954'te Regency TR-1 duyurulur, 1 Kasım'da satışa çıkar: dört germanyum transistör, 49,95 dolar. İlk yılında 100.000 adet satar.","The Regency TR-1 is announced on 18 October 1954 and reaches shops on 1 November: four germanium transistors, $49.95. It sells 100,000 in its first year."],"link":"apparatus","src":"https://spectrum.ieee.org/transistor-radio-invented"},{"y":2026,"t":["19 Ağustos 2026 itibarıyla ABD'de 731.045 etkin amatör telsiz lisansı var: 359.068 Technician, 184.349 General, 157.657 Extra.","As of 19 August 2026 there are 731,045 active US amateur radio licences: 359,068 Technician, 184,349 General and 157,657 Extra."],"link":"decoder","src":"https://www.arrl.org/fcc-license-counts"}],"links":{"packet":["Çok güçlü. Maxwell denklemleri her fizik müfredatında; ITU Telsiz Tüzüğü ile modülasyon ve kodlama standartları açık ve uluslararası olarak bakımı yapılan belgeler.","Very strong. Maxwell's equations are in every physics curriculum; the ITU Radio Regulations and the modulation and coding standards are open documents maintained internationally."],"decoder":["İki katmanlı ve alışılmadık biçimde sağlam. Profesyonel RF mühendisleri dar ama derin; yanlarında yalnız ABD'de 731.045 lisanslı amatör var — 160 yıllık bir fizik paketi için var olan tek kitlesel kod çözücü topluluğu. Lisans sayıları da artıyor.","Two-layered and unusually robust. Professional RF engineers are narrow but deep; alongside them stand 731,045 licensed amateurs in the US alone — the only mass decoder community that exists for a 160-year-old physics packet. Licence numbers are rising."],"context":["İyi belgelenmiş: yayılım fiziği, iyonosfer davranışı, spektrum kıtlığı, girişim. Bir düzeltme: Hertz'in kendi buluşu için söylediği iddia edilen 'hiçbir işe yaramaz' sözünün izi yalnızca 2000 tarihli bir ders kitabına (Norton, Dynamic Fields and Waves, s. 83) kadar sürülebiliyor; çağdaş bir kaynağı yok. Belgelenmiş olan, Hertz'in uygulamayla pek ilgilenmeyen bir temel araştırmacı olduğudur.","Well documented: propagation physics, ionospheric behaviour, spectrum scarcity, interference. One correction: the famous line in which Hertz supposedly dismissed his own discovery as 'of no use whatsoever' can be traced no further back than a textbook from 2000 (Norton, Dynamic Fields and Waves, p. 83) and has no contemporary source. What is documented is that Hertz worked as a basic researcher with little interest in applications."],"tacit":["Aktarılıyor, ama inceliyor. Anten ayarı, RF lehimi, şelale ekranını okumak, pile-up çalıştırmak, yön bulma, acil durum ağ disiplini — hepsi kulüplerde ve Field Day'de elden ele geçiyor. Sorun şu ki lisans almak artık cihaz kurmayı ya da tamir etmeyi gerektirmiyor.","Still transmitted, but thinning. Tuning an antenna, RF soldering, reading a waterfall display, working a pile-up, direction finding, emergency net discipline — all pass hand to hand at clubs and on Field Day. The trouble is that getting licensed no longer requires building or repairing anything."],"apparatus":["Saçma derecede bol: her telefon bir alıcı-verici, otuz dolara SDR alıcısı, açık kaynak yazılım yığınları. Ama amaca özel HF donanımı üreten firma sayısı az ve gönüllü röle istasyonları tek tek kapanıyor.","Absurdly abundant: every phone is a transceiver, an SDR receiver costs thirty dollars, and the software stacks are open source. But few firms still build purpose-made HF gear, and volunteer repeaters are being switched off one by one."],"maintenance":["Gerçekten kurumsallaşmış: lisans sınavları, gönüllü sınav görevlileri, ARRL ve IARU, yıllık tatbikat işlevi gören yarışmalar ve Field Day. Zincir kendini her yıl bilerek prova ediyor.","Genuinely institutionalised: licence examinations, volunteer examiners, the ARRL and IARU, and contests and Field Day that function as annual drills. The chain deliberately rehearses itself every year."]},"weakest":{"k":"tacit","why":["Lisans sayısı yükselirken el becerisi düşüyor ve bu ikisi aynı şey sanılıyor. 731.045 rakamı KOD ÇÖZÜCÜ halkasını ölçer, ÖRTÜK BECERİ halkasını değil: bugün lisans almak için ne verici kurmak ne de tamir etmek gerekiyor, çoğu operatör hazır cihaz kullanıyor. Anten kesmek, RF katı ayarlamak, ölü bir alıcıyı geriye doğru izlemek — bunlar hâlâ yazılamayan, yalnızca yan yana çalışarak geçen beceriler. Zincirin en sağlıklı görünen yeri, tam da kimsenin saymadığı yerinden inceliyor.","Licence numbers rise while hand skill falls, and the two are mistaken for each other. The figure 731,045 measures the DECODER link, not the TACIT one: getting licensed today requires neither building nor repairing a transmitter, and most operators run appliance radios. Cutting an antenna, aligning an RF stage, tracing a dead receiver backwards — these remain unwritable skills that pass only by working side by side. The healthiest-looking chain here is thinning exactly where nobody is counting."]},"nearBreak":["12 Aralık 1901, Signal Hill. Zincirin kurucu kanıtı neredeyse hiç aktarılamadan kayboluyordu: Marconi'nin Poldhu'dan gelen 'S' harfini duyduğunu söylediği anda yanında tek bir tanık vardı — asistanı George Kemp — ve sinyal otomatik kaydediciyi çalıştıramayacak kadar zayıftı. Modern yayılım bilgisi o günkü koşulların elverişsiz olduğunu söylüyor; bazı tarihçiler Marconi'nin ayarsız alıcısıyla yüksek frekanslı bir harmoniği yakalamış olabileceğini öne sürüyor. Doğrulama ancak iki ay sonra, tanıklar önünde Morse kaydediciyi sürecek kadar güçlü sinyaller alındığında geldi. O kaydedici sessiz kalsaydı, tarih başka yazılabilirdi.","12 December 1901, Signal Hill. The chain's founding proof came close to never being transmitted at all: when Marconi said he heard the letter 'S' from Poldhu there was a single witness beside him — his assistant George Kemp — and the signal was too weak to drive an automatic recorder. Modern propagation knowledge says conditions that day were unfavourable, and some historians suggest Marconi's untuned receiver may have caught a high-frequency harmonic. Verification only arrived two months later, when signals strong enough to drive a Morse inker were received before witnesses. Had that inker stayed silent, the history could have been written differently."],"thesis":["Çalışmanın 'bir zincir en uzun ömrü, kod çözücü topluluğu mesleki değil gönüllü ve kendini yeniden üreten olduğunda yaşar' iddiasını destekliyor. Amatör telsiz, hiçbir pazarın talep etmediği bir fiziği her yıl yeniden öğretiyor; sınavlar, kulüpler ve Field Day bakım halkasını piyasadan bağımsız kılıyor. Dürüst sınır: bu okuma hayatta kalana bakıp genelleme yapma riski taşıyor. Amatör telsiz aynı zamanda bir düzenleyici ona spektrum ayırdığı için yaşıyor; o yasal koruma kalkarsa topluluğun coşkusu aparatı kurtarmaz. Zinciri ayakta tutan yalnızca gönüllülük değil, gönüllülüğe tahsis edilmiş bir kamu kaynağıdır.","Supports the study's claim that a chain lives longest when its decoder community is voluntary and self-reproducing rather than purely occupational. Amateur radio re-teaches, every year, a physics no market demands; exams, clubs and Field Day make the maintenance link independent of commerce. Honest limit: this reading risks generalising from a survivor. Amateur radio also lives because a regulator reserves spectrum for it; remove that legal protection and no amount of enthusiasm saves the apparatus. What holds the chain up is not volunteerism alone but a public resource allocated to volunteerism."],"sources":[{"t":["Maxwell'in bildirisi — Royal Society, Science in the Making","Maxwell's paper — The Royal Society, Science in the Making"],"m":["Bildirinin 27 Ekim 1864'te alındığını ve 8 Aralık 1864'te okunduğunu arşiv kaydından doğrular; 'Maxwell 1865' basım yılıdır.","Confirms from the archival record that the paper was received on 27 October 1864 and read on 8 December 1864; 'Maxwell 1865' is the year of publication."],"u":"https://makingscience.royalsociety.org/items/pt_72_7/paper-a-dynamical-theory-of-the-electromagnetic-field-by-j-james-clerk-maxwell"},{"t":["Hertz'in Karlsruhe deneyleri — Karlsruhe Teknoloji Enstitüsü (KIT)","Hertz's Karlsruhe experiments — Karlsruhe Institute of Technology (KIT)"],"m":["Deneyin yapıldığı kurum, elektromanyetik dalga yayılımının ilk kez 11 Kasım 1886'da gözlendiğini ve Hertz'in çalışmasının başlangıçta uygulamasız olduğunu belirtir.","The institution where it happened states that wave propagation was first observed on 11 November 1886 and that Hertz's work was initially application-free."],"u":"https://www.kit.edu/kit/english/pi_2011_8434.php"},{"t":["Kilometre Taşı: Transatlantik Telsiz Sinyallerinin Alınması, 1901 — IEEE ETHW","Milestone: Reception of Transatlantic Radio Signals, 1901 — IEEE ETHW"],"m":["12 Aralık 1901 tarihini doğrularken kanıtın zayıflığını da açıkça yazar: tek tanık, kayıt yok, elverişsiz yayılım koşulları, iki ay sonraki doğrulama.","Confirms the 12 December 1901 date while stating the weakness of the evidence plainly: one witness, no recording, unfavourable propagation, verification two months later."],"u":"https://ethw.org/Milestones:Reception_of_Transatlantic_Radio_Signals,_1901"},{"t":["Ticari Radyonun Tarihi — FCC","History of Commercial Radio — FCC"],"m":["Düzenleyicinin kendi kaydı: KDKA'nın 2 Kasım 1920 yayını, Ekim 1920'de alınan ilk ticari yayın lisansı ve dört yıl içinde 600 istasyon.","The regulator's own record: KDKA's 2 November 1920 broadcast, the first commercial broadcasting licence issued in October 1920, and 600 stations within four years."],"u":"https://www.fcc.gov/media/radio/history-of-commercial-radio"},{"t":["FCC Lisans Sayıları — ARRL","FCC License Counts — ARRL"],"m":["19 Ağustos 2026 itibarıyla 731.045 etkin ABD amatör lisansı ve sınıf dağılımı; bugünkü kod çözücü halkasının canlı ölçüsü.","731,045 active US amateur licences as of 19 August 2026, with the class breakdown; the live measure of today's decoder link."],"u":"https://www.arrl.org/fcc-license-counts"}]},{"id":"diode","cat":"electronics","civ":"modern","icon":"🔻","name":["Diyot","The Diode"],"era":["1874 – günümüz","1874 – present"],"hook":["1900'lerin başında radyo dinlemek, bir galen kristalinin yüzeyinde iğne ucuyla 'duyarlı nokta' avlamak demekti; iğne bir inçin binde biri kadar kaysa ses kesilirdi. Aynı tek yönlü akım hilesi bugün her şarj cihazında, her güneş panelinde ve her LED ampulde çalışıyor.","In the early 1900s, listening to the radio meant hunting a 'sensitive spot' on a galena crystal with a wire point; shift it a thousandth of an inch and the sound died. The same one-way-current trick now runs inside every charger, every solar panel and every LED bulb."],"timeline":[{"y":1874,"link":"packet","src":"https://www.computerhistory.org/siliconengine/semiconductor-point-contact-rectifier-effect-is-discovered/","t":["Ferdinand Braun, metal uç ile galen kristali arasındaki temasın akımı yalnızca tek yönde geçirdiğini bulur; Annalen der Physik'te yayımlar (153/4, s. 556-563).","Ferdinand Braun finds that contact between a metal point and a galena crystal passes current one way only, and publishes it in Annalen der Physik (153/4, pp. 556-563)."]},{"y":1904,"link":"apparatus","src":"https://ethw.org/Milestones:Fleming_Valve,_1904","t":["16 Kasım 1904: Fleming, Edison etkisine dayanan termiyonik valfin patentini alır. Diyot bir el becerisi olmaktan çıkıp satın alınabilir bir bileşene dönüşür.","16 November 1904: Fleming patents the thermionic valve built on the Edison effect. The diode stops being a knack and becomes a component you can buy."]},{"y":1906,"link":"tacit","src":"https://en.wikipedia.org/wiki/Crystal_detector","t":["Pickard 30 Ağustos 1906'da silisyum dedektörünün patentini alır. Kedi bıyığı çağı: kullanılabilir temas noktası her seferinde deneme yanılmayla yeniden bulunur.","Pickard patents his silicon detector on 30 August 1906. The cat's-whisker era: a usable contact point has to be found again by trial and error before every single use."]},{"y":1907,"link":"context","src":"https://en.wikipedia.org/wiki/History_of_the_LED","t":["9 Şubat 1907: H. J. Round, karborundum temasından ışık çıktığını bildirir; nedenini kimse bilmez. Losev 1920'lerde ayrıntılı çalışır, yarım yüzyıl fark edilmez.","9 February 1907: H. J. Round reports light from a carborundum contact; nobody knows why. Losev studies it in detail in the 1920s and goes unnoticed for half a century."]},{"y":1940,"link":"packet","src":"https://www.computerhistory.org/siliconengine/discovery-of-the-p-n-junction/","t":["23 Şubat 1940: Russell Ohl, çatlamış bir silisyum çubukta p-n bağlantısını kazara bulur; ışık altında akım fırlar. Patent 27 Mayıs 1941 (US 2.402.662).","23 February 1940: Russell Ohl stumbles on the p-n junction in a cracked silicon rod; under light the current jumps. Patent filed 27 May 1941 (US 2,402,662)."]},{"y":1941,"link":"decoder","src":"https://www.computerhistory.org/siliconengine/semiconductor-diode-rectifiers-serve-in-ww-ii/","t":["Radar, tüplerin ulaşamadığı frekansları ister: milyonlarca nokta temaslı kristal diyot üretilir, silisyum %99,999 saflığa çıkarılır, Purdue germanyumu doğar.","Radar needs frequencies tubes cannot reach: millions of point-contact crystal diodes are built, silicon is purified to 99.999%, and Purdue's germanium programme begins."]},{"y":1962,"link":"apparatus","src":"https://ieeephotonics.org/news/the-birth-of-the-visible-led-nick-holonyak-jr-and-a-turning-point-in-photonics/","t":["Aralık 1962: Holonyak ve Bevacqua, Applied Physics Letters'ta GaAsP bağlantısından görünür kırmızı ışık bildirir. Diyot artık doğrultmakla kalmıyor, ışık da yayıyor.","December 1962: Holonyak and Bevacqua report visible red light from a GaAsP junction in Applied Physics Letters. The diode now emits light as well as rectifying it."]},{"y":2014,"link":"maintenance","src":"https://www.nobelprize.org/prizes/physics/2014/summary/","t":["Nobel Fizik Ödülü Akasaki, Amano ve Nakamura'ya: 'verimli mavi ışık yayan diyotların icadı için'. Beyaz LED aydınlatma dünyayı bu bağlantı üzerinden aydınlatır.","The Nobel Prize in Physics goes to Akasaki, Amano and Nakamura 'for the invention of efficient blue light-emitting diodes'. White LED lighting now runs on this junction."]}],"links":{"packet":["En sağlam halka. Braun'un 1874 makalesi, Fleming'in patenti, Ohl'un US 2.402.662 patenti ve p-n bağlantısı kuramının tamamı sayısallaştırılmış ve serbestçe erişilebilir durumda.","The strongest link. Braun's 1874 paper, Fleming's patent, Ohl's US 2,402,662 and the full theory of the p-n junction are digitised and freely available."],"decoder":["Milyonlarca mühendis ve teknisyen bir diyot veri sayfasını okuyabiliyor. Ama kedi bıyığı dedektörünü elde ayarlayabilen kuşak öldü; o çözücü artık yalnızca hobici çevrelerde yaşıyor.","Millions of engineers and technicians can read a diode datasheet. But the generation that could tune a cat's-whisker by hand is gone; that decoder survives only among hobbyists."],"context":["Neden çalıştığı tam olarak biliniyor: bant kuramı, katkılama, Shockley'nin 1949 diyot kuramı. Sınırları da yazılı. Kristal çağının 'neden tam bu nokta' sorusu ise çözülmeden değil, cihaz emekli olduğu için gündemden düştü.","Why it works is fully understood — band theory, doping, Shockley's 1949 diode theory — and the limits are documented. The crystal era's question, 'why this exact spot', was never solved; it simply retired with the device."],"tacit":["Zayıf halka. Sıradan silisyum diyot tümüyle otomatik üretiliyor; ama yüksek verimli LED'in kalbindeki GaN epitaksi reçeteleri (MOCVD sıcaklık profilleri, kusur kontrolü) hiçbir ders kitabında yok — birkaç firmanın hattında ve o hattı işleten insanların elinde duruyor.","The weak link. Ordinary silicon diodes are fully automated, but the GaN epitaxy recipes at the heart of a high-efficiency LED — MOCVD temperature profiles, defect control — are in no textbook; they live on a few companies' lines and in the people who run them."],"apparatus":["Belirgin biçimde asimetrik. Bir diyotu okumak için 10 dolarlık bir multimetre yeter; yapmak için kristal büyütücü, epitaksi reaktörü ve fabrika gerekir. Okuma tarafı güvende, yapma tarafı değil.","Strikingly asymmetric. Reading a diode takes a $10 multimeter; making one takes crystal growers, epitaxy reactors and a fab. The reading side is safe, the making side is not."],"maintenance":["Kendiliğinden ve devasa: her yıl yüz milyarlarca diyot üretiliyor ve LED aydınlatma akkor lambanın yerini aldı. Bilgi arşivle değil, günlük sanayi pratiğiyle tazeleniyor.","Automatic and enormous: hundreds of billions of diodes a year, with LED lighting having displaced the incandescent bulb. The knowledge is refreshed by daily industrial practice, not by archives."]},"weakest":{"k":"tacit","why":["Yazılı halkaların hepsi tavan yapmış durumda: fizik açık, patentler açık, çözücüler milyonlarca. Geriye kırılabilecek tek şey yazılamayan kısım kalıyor — ve tarih bu deneyi zaten yaptı. Kedi bıyığı zanaati, cihaz emekli olur olmaz yaşayan pratik olarak tamamen yok oldu; bugün onu yeniden öğrenmek isteyen biri, metinlerden değil ancak deneyerek öğrenebilir. Bunun modern karşılığı, birkaç firmanın hattında duran LED epitaksi süreç bilgisidir.","Every written link is maxed out: the physics is open, the patents are open, the decoders number in the millions. The only thing left that can break is the part that cannot be written — and history has already run that experiment. The cat's-whisker craft vanished as living practice the moment the device retired; anyone re-learning it today learns by fumbling, not from text. Its modern equivalent is LED epitaxy process knowledge, held on a handful of production lines."]},"nearBreak":["1920'lerde triyot tüpler kristal dedektörü piyasadan sildi ve yarı iletken doğrultma bilimsel bir çıkmaz sokağa döndü. Bu boşlukta, karborundum bağlantılarından ışık yayılmasını 1920'lerden itibaren sistematik olarak inceleyen Oleg Losev'in çalışması okunmadı; Losev 1942'de Leningrad kuşatmasında 38 yaşında açlıktan öldü ve mezarının yeri bilinmiyor. Çalışması yarım yüzyıl 'bilinmeyen' olarak kaldı. Zincir ancak radar, tüplerin ulaşamadığı mikrodalga frekanslarını talep edince yeniden kuruldu: Müttefikler nokta temaslı kristali sıfırdan yeniden öğrenmek, silisyumu %99,999 saflığa çıkarmak ve Purdue'da yüksek saflıkta germanyum üretmek zorunda kaldı — Brattain'in Aralık 1947'de elinde tuttuğu malzeme tam olarak buydu.","In the 1920s triode tubes wiped the crystal detector off the market and semiconductor rectification became a scientific dead end. In that gap, Oleg Losev's systematic study of light emission from carborundum junctions, begun in the 1920s, went unread; Losev starved to death in the Siege of Leningrad in 1942, aged 38, and his burial place is unknown. His work languished unknown for half a century. The chain was rebuilt only because radar demanded microwave frequencies tubes could not reach: the Allies had to re-learn the point-contact crystal from scratch, purify silicon to 99.999% and grow high-purity germanium at Purdue — precisely the material Brattain held in his hands in December 1947."],"thesis":["Çalışmanın 'canlı çözücüsü olmayan paket ölmez, uykuya yatar' iddiasını destekliyor: Round'un 1907 gözlemi ve Losev'in makaleleri metin olarak elli yıl hayatta kaldı ama hiçbir şey üretmedi. Dürüst sınır: 1940'lardaki canlanma eski zincirin kurtarılması değildi; savaş bilgiyi fizikten yeniden türetti. Yani 'uyuyan paket uyandırılabilir' önermesi ancak altındaki bilim bağımsız olarak yeniden türetilebiliyorsa geçerli — kayıp bir zanaat reçetesi için değil.","Supports the study's claim that a packet without a live decoder does not die but goes dormant: Round's 1907 observation and Losev's papers survived as text for fifty years and produced nothing. The honest limit: the 1940s revival was not a rescue of the old chain — the war re-derived the knowledge from physics. So 'a dormant packet can be woken' holds only where the underlying science is independently re-derivable, which is exactly what a lost craft recipe is not."],"sources":[{"t":["CHM Silicon Engine: 1874 nokta temaslı doğrultma etkisi","CHM Silicon Engine: 1874 point-contact rectifier effect"],"m":["Braun'un tarihi, yayın künyesi ve 'kedi bıyığı' adının kaynağı.","Establishes Braun's date, the exact journal citation and the origin of the 'cat's-whisker' name."],"u":"https://www.computerhistory.org/siliconengine/semiconductor-point-contact-rectifier-effect-is-discovered/"},{"t":["IEEE Kilometre Taşı: Fleming Valfi, 1904","IEEE Milestone: Fleming Valve, 1904"],"m":["Patent başvuru tarihini (16 Kasım 1904) ve resmî IEEE künyesini doğrular.","Confirms the 16 November 1904 patent application date and the official IEEE citation text."],"u":"https://ethw.org/Milestones:Fleming_Valve,_1904"},{"t":["Kristal dedektör (Wikipedia)","Crystal detector (Wikipedia)"],"m":["Kedi bıyığının örtük becerisi: duyarlı noktanın her kullanımda yeniden aranması, Pickard'ın 1906 patenti.","Documents the cat's-whisker's tacit skill — hunting the sensitive spot before every use — and Pickard's 1906 patent."],"u":"https://en.wikipedia.org/wiki/Crystal_detector"},{"t":["CHM Silicon Engine: 1940 p-n bağlantısının keşfi","CHM Silicon Engine: 1940 discovery of the p-n junction"],"m":["Ohl'un 23 Şubat 1940 tarihli kazası, patent başvurusu ve numarası.","Gives Ohl's 23 February 1940 accident, the patent filing date and number."],"u":"https://www.computerhistory.org/siliconengine/discovery-of-the-p-n-junction/"},{"t":["CHM Silicon Engine: 1941 yarı iletken diyotlar İkinci Dünya Savaşı'nda","CHM Silicon Engine: 1941 semiconductor diode rectifiers in WW II"],"m":["Radarın kristal diyotu diriltmesi, %99,999 silisyum ve Purdue germanyumu — 1947'ye giden malzeme zinciri.","Radar's revival of the crystal diode, 99.999% silicon and Purdue germanium — the material chain that led to 1947."],"u":"https://www.computerhistory.org/siliconengine/semiconductor-diode-rectifiers-serve-in-ww-ii/"}]},{"id":"transistor","cat":"electronics","civ":"modern","icon":"🔬","name":["Transistör","The Transistor"],"era":["1947 – günümüz","1947 – present"],"hook":["Bugüne kadar yaklaşık 13 seksilyon (1,3×10²²) transistör üretildi; insanlığın en çok kopyaladığı nesne bu. Bu ölçek mümkün oldu çünkü Nisan 1952'de Bell Labs 40 şirketten 25.000'er dolar aldı ve dokuz gün boyunca onlara nasıl yapıldığını anlattı.","About 13 sextillion (1.3×10²²) transistors have been manufactured — the most-copied object humans have ever made. That scale was possible because in April 1952 Bell Labs took $25,000 from each of 40 companies and spent nine days teaching them how to build one."],"timeline":[{"y":1947,"link":"tacit","src":"https://www.computerhistory.org/siliconengine/invention-of-the-point-contact-transistor/","t":["16 Aralık 1947: Bardeen ve Brattain germanyum üzerindeki iki altın temasla yükseltme elde eder; 23 Aralık'ta yönetime gösterilir. Cihaz elle yapılmış ve zor tekrarlanır.","16 Dec 1947: Bardeen and Brattain get amplification from two gold contacts on germanium; shown to management on 23 December. The device was handmade and hard to repeat."]},{"y":1948,"link":"packet","src":"https://www.computerhistory.org/siliconengine/invention-of-the-point-contact-transistor/","t":["23 Ocak 1948: Shockley bağlantı transistörünü tasarlar. 17 Haziran'da patent başvurusu yapılır (US 2.524.035), 30 Haziran'da buluş halka duyurulur.","23 January 1948: Shockley conceives the junction transistor. The patent is filed on 17 June (US 2,524,035) and the invention is announced publicly on 30 June."]},{"y":1949,"link":"context","src":"https://www.computerhistory.org/siliconengine/conception-of-the-junction-transistor/","t":["Shockley, bağlantı transistörünün ayrıntılı kuramını Bell System Technical Journal'da yayımlar. Cihazın neden çalıştığı artık yazılı ve herkese açık.","Shockley publishes his detailed theory of the junction transistor in the Bell System Technical Journal. Why the device works is now written down and public."]},{"y":1951,"link":"apparatus","src":"https://www.pbs.org/transistor/background1/events/symposia.html","t":["1951: Bell, bağlantı transistörünü seri üretilebilir kılar (patent 25 Eylül'de verilir). Eylül'deki ilk sempozyum yaklaşık 300 bilim insanı ve mühendisi toplar.","1951: Bell makes the junction transistor manufacturable (patent granted 25 September). September's first symposium gathers some 300 scientists and engineers."]},{"y":1952,"link":"decoder","src":"https://www.computerhistory.org/siliconengine/bell-labs-licenses-transistor-technology/","t":["Nisan 1952: dokuz günlük Transistör Teknolojisi Sempozyumu. 40 şirketten 100'ü aşkın temsilci; şirket başına 25.000 dolar, %5 telifin iade edilmeyen avansı.","April 1952: the nine-day Transistor Technology Symposium. Over 100 representatives from 40 companies; $25,000 each, as a non-refundable advance against 5% royalties."]},{"y":1953,"link":"tacit","src":"https://www.ebsco.com/research-starters/history/morita-licenses-transistor-technology","t":["Totsuko (sonraki Sony) 25.000 dolara lisans alır. Ama lisans beceriyi taşımaz: yüksek frekanslı transistörde hata oranı projeyi tehlikeye atacak kadar yüksek çıkar.","Totsuko (later Sony) buys a licence for $25,000. The licence does not carry the skill: failure rates on high-frequency transistors run high enough to imperil the project."]},{"y":1955,"link":"apparatus","src":"https://en.wikipedia.org/wiki/TR-55","t":["Ağustos 1955: Sony TR-55, Japonya'nın ilk transistörlü radyosu; beş transistörünü de Sony kendi tasarlar. Zincir ikinci bir kıtada kendi ayakları üzerinde durur.","August 1955: the Sony TR-55, Japan's first transistor radio, with all five transistors designed in-house. The chain now stands on its own feet on a second continent."]},{"y":1956,"link":"maintenance","src":"http://www.monika-schnitzer.com/uploads/4/9/4/1/49415675/watzinger_fackler_nagler_schnitzer_bell_labs.pdf","t":["24 Ocak 1956: uzlaşma kararı Bell'in 7.820 patentini (geçerli ABD patentlerinin %1,3'ü) telifsiz açar. O yılın Nobel'i Shockley, Bardeen ve Brattain'e gider.","24 Jan 1956: the consent decree opens 7,820 Bell patents (1.3% of unexpired US patents) royalty-free. That year's Nobel goes to Shockley, Bardeen and Brattain."]}],"links":{"packet":["Kusursuz. Aralık 1947 defterleri, US 2.524.035 patenti, Shockley'nin 1949 tarihli BSTJ kuramı ve 1952 sempozyumundan çıkan iki ciltlik Transistor Technology — hepsi yayımlanmış ve dijital. 20. yüzyılın en iyi belgelenmiş icadı.","Flawless. The December 1947 notebooks, patent US 2,524,035, Shockley's 1949 BSTJ theory and the two-volume Transistor Technology from the 1952 symposium are all published and digitised. The best-documented invention of the twentieth century."],"decoder":["Dört ürün arasındaki en güçlü halka. Transistör dünyadaki her elektrik mühendisliği müfredatının çekirdeğinde; milyonlarca insan onu tasarlayabilir, ölçebilir ve arızasını bulabilir.","The strongest link of the four. The transistor sits at the core of every electrical-engineering curriculum on earth; millions of people can design one, measure it and debug it."],"context":["Açık ve öğretiliyor: bant kuramı, azınlık taşıyıcı enjeksiyonu, ölçekleme sınırları. 1947'nin nokta temaslı cihazının neden bu kadar kararsız olduğu bile artık anlaşılmış durumda.","Open and taught: band theory, minority-carrier injection, scaling limits. Even why the 1947 point-contact device was so unstable is now understood."],"tacit":["Zincirin inceldiği yer. Bir transistör tasarlamak öğretiliyor; modern bir transistörü ölçekte üretmek öğretilmiyor. O süreç bilgisi birkaç fabrikanın hattında, o hattı işleten insanların içinde duruyor.","Where the chain thins. Designing a transistor is taught; manufacturing a modern one at scale is not. That process knowledge sits on a few companies' lines, inside the people who run them."],"apparatus":["İkiye bölünmüş. Ayrık bir transistör hâlâ 1950'lerin ekipmanıyla, onlarca ülkede yapılabilir — bu kısım sağlıklı. Ama bugün üretilen transistörlerin %99,9'u ileri fabrikalardan çıkan MOS aygıtlar.","Split in two. A discrete transistor can still be made with 1950s equipment in dozens of countries — that part is healthy. But 99.9% of transistors made today are MOS devices from advanced fabs."],"maintenance":["Otomatik ve muazzam: her gün milyarlarca yeni kopya üretiliyor. Bu zincir bilinçli bir koruma çabası gerektirmiyor; ticaret onu bedavaya kopyalıyor.","Automatic and enormous: billions of new copies every day. This chain needs no conscious preservation effort; commerce copies it for free."]},"weakest":{"k":"tacit","why":["Yazılı halkaların hepsi tavan yapmış durumda, dolayısıyla kırılabilecek tek şey yazılamayan kısım — ve tarih bu deneyi zaten yaptı. Sony 1953'te paketin tamamını satın aldı ve yine de yüksek frekanslı transistörlerde kullanılabilir verime, kendi mühendisleri süreci yeniden türetene kadar ulaşamadı. Bell'in dokuz gün boyunca yüz yüze ders vermesinin nedeni tam olarak buydu: kâğıt tek başına aktarmıyordu.","Every written link is maxed out, so the only thing that can break is the part that cannot be written — and history has already run that experiment. Sony bought the complete packet in 1953 and still could not reach usable yields on high-frequency transistors until its own engineers re-derived the process. That is exactly why Bell taught nine days of face-to-face classes: paper alone did not transfer it."]},"nearBreak":["Transistör pekâlâ tescilli kalabilirdi. Patentler AT&T'nindi ve üretim Western Electric'in içinde tutulabilirdi. Adalet Bakanlığı'nın 14 Ocak 1949'da açtığı ve Bell'i telefon aygıtı üretiminde tekelcilikle suçlayan antitröst davası bütün süreç boyunca şirketin üzerinde asılı durdu; 1952 sempozyumu ücretli bir lisans olarak kurgulandı (25.000 dolar, %5 telifin iade edilmeyen avansı). 24 Ocak 1956'daki uzlaşma kararı ardından Bell'in 7.820 patentini ABD'li her başvurucuya telifsiz açtı; hakemli bir çalışma (Watzinger, Fackler, Nagler, Schnitzer) bunun ardından türev buluşlarda ortalama %11'lik bir artış ölçüyor ve artışın üçte ikisinden fazlasının genç, küçük firmalardan ve bireysel mucitlerden geldiğini buluyor. Efsane düzeltmesi: karar transistörü serbest bırakmadı — bunu sempozyumlar dört yıl önce yapmıştı; kararın yaptığı, kapının bir daha kapanmasını engellemekti.","The transistor could easily have stayed proprietary. AT&T held the patents and could have kept manufacture inside Western Electric. The DOJ's antitrust complaint of 14 January 1949, charging Bell with monopolising telephone-apparatus manufacture, hung over the company throughout, and the 1952 symposium was structured as a paid licence ($25,000 as a non-refundable advance against 5% royalties). The consent decree of 24 January 1956 then opened 7,820 Bell patents royalty-free to any US applicant; a peer-reviewed study (Watzinger, Fackler, Nagler, Schnitzer) measures roughly an 11% rise in follow-on innovation afterwards, with more than two-thirds of the increase coming from young, small firms and individual inventors. Myth correction: the decree did not release the transistor — the symposia had done that four years earlier; what the decree did was stop the door from closing again."],"thesis":["Çalışmanın 'zincir, çözücüleri kasten çoğaltarak yaşar' iddiasını destekliyor ve Yunan ateşinin tam tersi bir vaka sunuyor: sır saklamak yerine dokuz günlük ders. Dürüst sınır: bu tek bir vaka ve karşı-olgusal kanıtlanamaz. Noyce'un entegre devre için söylediği gibi, buluş çok yakın bir gelecekte başka bir yerde de ortaya çıkardı; Bell vakasının gösterdiği şey zorunluluk değil, hız.","Supports the study's claim that a chain survives by deliberately multiplying decoders — and offers the exact inverse of Greek fire: nine days of teaching instead of a state secret. Honest limit: this is a single case and the counterfactual is unprovable. As Noyce said of the IC, the invention would have arisen elsewhere in the very near future; what the Bell case demonstrates is timing, not necessity."],"sources":[{"t":["CHM Silicon Engine: 1947 nokta temaslı transistörün icadı","CHM Silicon Engine: 1947 invention of the point-contact transistor"],"m":["16 ve 23 Aralık 1947 tarihleri, patent numarası ve 30 Haziran 1948 duyurusu.","Fixes the 16 and 23 December 1947 dates, the patent number and the 30 June 1948 announcement."],"u":"https://www.computerhistory.org/siliconengine/invention-of-the-point-contact-transistor/"},{"t":["CHM Silicon Engine: 1952 Bell Labs transistör teknolojisini lisanslıyor","CHM Silicon Engine: 1952 Bell Labs licenses transistor technology"],"m":["Nisan 1952, dokuz gün, 40 şirket, 100'den fazla temsilci, 25.000 dolar — sempozyumun temel rakamları.","April 1952, nine days, 40 companies, 100+ representatives, $25,000 — the symposium's core figures."],"u":"https://www.computerhistory.org/siliconengine/bell-labs-licenses-transistor-technology/"},{"t":["PBS: Bell sempozyumlarla teknolojiyi paylaşıyor","PBS: Sharing the Technology — Bell Hosts Transistor Symposia"],"m":["Eylül 1951 sempozyumu (~300 kişi), iki ciltlik 'Transistor Technology' ve Jack Morton'ın açık paylaşım gerekçesi.","The September 1951 symposium (~300 people), the two-volume Transistor Technology, and Jack Morton's rationale for opening it up."],"u":"https://www.pbs.org/transistor/background1/events/symposia.html"},{"t":["Watzinger, Fackler, Nagler & Schnitzer: Bell Labs ve 1956 uzlaşma kararı","Watzinger, Fackler, Nagler & Schnitzer: Bell Labs and the 1956 consent decree"],"m":["Kararın tarihi ve kapsamı (7.820 patent, %1,3), 1949 davası ve türev buluşlarda ölçülen %11'lik artış.","The decree's date and scope (7,820 patents, 1.3%), the 1949 complaint, and the measured ~11% rise in follow-on innovation."],"u":"http://www.monika-schnitzer.com/uploads/4/9/4/1/49415675/watzinger_fackler_nagler_schnitzer_bell_labs.pdf"},{"t":["Nobel Fizik Ödülü 1956","The Nobel Prize in Physics 1956"],"m":["Ödülün Shockley, Bardeen ve Brattain'e 'yarı iletkenler üzerine araştırmaları ve transistör etkisini keşifleri için' verildiğini doğrular.","Confirms the award to Shockley, Bardeen and Brattain 'for their researches on semiconductors and their discovery of the transistor effect'."],"u":"https://www.nobelprize.org/prizes/physics/1956/summary/"}]},{"id":"integrated-circuit","cat":"electronics","civ":"modern","icon":"🧩","name":["Entegre Devre","The Integrated Circuit"],"era":["1958 – günümüz","1958 – present"],"hook":["Dünyadaki her ileri yonga, tek bir Hollanda şirketinin yaptığı makinelerle basılıyor; ASML bu teknolojiyi kendi ürün sayfasında 'ASML'e özgü' diye tanımlıyor. Her makinede 100.000'den fazla parça var ve arkasında 5.000'i aşkın tedarikçi duruyor.","Every advanced chip on Earth is printed by machines that one Dutch company builds; ASML's own product page calls the technology 'unique to ASML'. Each machine holds over 100,000 components and rests on a supply chain of more than 5,000 firms."],"timeline":[{"y":1958,"link":"packet","src":"https://www.ti.com/about-ti/newsroom/company-blog/from-idea-to-invention-the-origin-story-of-the-tiny-chip-that-changed-the-world.html","t":["12 Eylül 1958: Jack Kilby, TI laboratuvarında ilk çalışan entegre devreyi gösterir — germanyum bir parça, elle bağlanmış altın teller. Patent Şubat 1959'da başvurulur.","12 September 1958: Kilby demonstrates the first working integrated circuit in a TI lab — a germanium sliver with hand-attached gold wires. Patent filed February 1959."]},{"y":1959,"link":"tacit","src":"https://www.computerhistory.org/siliconengine/invention-of-the-planar-manufacturing-process/","t":["Hoerni'nin düzlemsel süreci: fikir Aralık 1957 defterinde, cihaz Mart 1959'da, patent 1 Mayıs 1959'da. Oksit yerinde bırakılır; zanaat tekrarlanabilir sürece dönüşür.","Hoerni's planar process: idea in a December 1957 notebook, device March 1959, patent filed 1 May 1959. The oxide is left in place — craft becomes repeatable process."]},{"y":1959,"link":"apparatus","src":"https://www.computerhistory.org/siliconengine/practical-monolithic-integrated-circuit-concept-patented/","t":["23 Ocak 1959: Noyce'un defter kaydı; 30 Temmuz'da patent başvurusu (US 2.981.877). Oksit üstüne buharlaştırılan alüminyum bağlantı, üretilebilir tek parça mimariyi verir.","23 January 1959: Noyce's notebook entry; patent filed 30 July (US 2,981,877). Aluminium evaporated onto the oxide gives the manufacturable monolithic architecture."]},{"y":1960,"link":"decoder","src":"https://computerhistory.org/blog/who-invented-the-ic/","t":["Mayıs 1960: Fairchild ilk çalışan tek parça düzlemsel devreleri üretir (4 transistör, 5 direnç). Mart 1961'de Micrologic adıyla duyurulur; artık satın alınabilir.","May 1960: Fairchild builds the first working monolithic planar ICs (4 transistors, 5 resistors). Announced as Micrologic in March 1961 — now a part any engineer can buy."]},{"y":1965,"link":"context","src":"https://www.computerhistory.org/siliconengine/moores-law-predicts-the-future-of-integrated-circuits/","t":["19 Nisan 1965: Moore'un 'Cramming more components onto integrated circuits' yazısı Electronics'te çıkar (38/8, s. 114). Sanayi neyi hedefleyeceğini yazılı olarak öğrenir.","19 April 1965: Moore's 'Cramming more components onto integrated circuits' appears in Electronics (38/8, p. 114). The industry gets its target written down."]},{"y":2013,"link":"apparatus","src":"https://www.construction-physics.com/p/how-asml-got-euv","t":["ASML ilk üretim EUV makinesini sevk eder — ilk prototipinden yedi, EUV LLC'nin kurulmasından on altı yıl sonra. Nikon ve Canon bu teknolojiyi hiç piyasaya sokamaz.","ASML ships its first production EUV machine — seven years after its prototype, sixteen after the EUV LLC formed. Nikon and Canon never bring the technology to market."]},{"y":2026,"link":"maintenance","src":"https://counterpointresearch.com/en/insights/global-semiconductor-foundry-market-share","t":["2026'nın ilk çeyreğinde TSMC saf döküm pazarının %73'ünü elinde tutuyor (Samsung %7, SMIC %5). İleri mantık üretimi üç firmada yoğunlaşmış durumda.","In Q1 2026 TSMC holds 73% of the pure-play foundry market (Samsung 7%, SMIC 5%). Leading-edge logic production is concentrated in three firms."]}],"links":{"packet":["İkiye bölünmüş. Kilby ve Noyce patentleri, Moore'un 1965 makalesi, binlerce ders kitabı — fikirler tamamen açık. Ama bugün asıl önemli paket, yani bir 2 nm süreç akışı ya da bir EUV maske yığını, hiçbir yerde yayımlanmıyor; iki üç şirketin ticari sırrı.","Split in two. The Kilby and Noyce patents, Moore's 1965 paper, thousands of textbooks — the ideas are fully open. But the packet that matters today, a 2 nm process flow or an EUV mask stack, is published nowhere; it is the trade secret of two or three companies."],"decoder":["Tasarım tarafında milyonlarca kişi; süreç tarafında birkaç bin. İleri bir süreç akışını okuyup değiştirebilecek insanların sayısı, avuç içi kadar şirketin içinde binlerle ölçülüyor.","Millions on the design side; a few thousand on the process side. The number of people who can read and modify a leading-edge process flow is measured in thousands, inside a handful of companies."],"context":["Fiziği açık; ama 2 nm'de neden işe yaradığı — gerilim mühendisliği, EUV stokastikleri, kusur fiziği — kısmen yayımlanmış, kısmen tescilli. Sınırların tam olarak nerede olduğunu yalnızca hattı işletenler biliyor.","The physics is open; but why it works at 2 nm — stress engineering, EUV stochastics, defect physics — is part published, part proprietary. Only the people running the line know exactly where the limits are."],"tacit":["En yoğunlaşmış halkalardan biri. Dan Wang'ın 'süreç bilgisi' argümanı tam buraya oturuyor: Moore yasasını ayakta tutan şey planlar değil, hattı nasıl çalıştıracağını bilen insanlar. Fabrikalar kapanırsa bu bilgi belgeyle geri getirilemez.","One of the most concentrated links. Dan Wang's 'process knowledge' argument lands exactly here: what keeps Moore's law running is not blueprints but people who know how to run the line. If those fabs close, no document brings the knowledge back."],"apparatus":["En zayıf halka ve bu çalışmanın en keskin uyarısı. EUV litografi makinelerini dünyada tek bir firma üretiyor; ASML teknolojiyi kendi ürün sayfasında 'ASML'e özgü' diye tanımlıyor. Her makinede 100.000'den fazla parça var, tedarik zinciri 5.000'i aşkın şirkete yayılıyor ve optiğini yalnızca Zeiss yapıyor.","The weakest link and this study's sharpest warning. EUV lithography machines are made by a single firm in the world; ASML's own product page calls the technology 'unique to ASML'. Each machine holds over 100,000 components, draws on more than 5,000 suppliers, and its optics come from Zeiss alone."],"maintenance":["Sürekli ama coğrafi olarak sıkışmış: TSMC 2026'nın ilk çeyreğinde saf döküm gelirinin %73'ünü aldı ve ileri mantık üretimi üç firmada. Bakım çabası muazzam, ama yedeği yok.","Continuous but geographically squeezed: TSMC took 73% of pure-play foundry revenue in Q1 2026 and leading-edge logic runs at three firms. The maintenance effort is enormous, but it has no backup."]},"weakest":{"k":"apparatus","why":["Diğer bütün halkalarda bir miktar yedek var: tasarımlar belgeli, on binlerce mühendis mevcut, birden fazla fabrika çalışıyor. Aygıtta yedek yok. EUV üretimi dursa ikinci bir kaynak bulunmuyor ve tarihsel kayıt bunun neden böyle olduğunu gösteriyor: EUV yaklaşık yirmi beş yıl ve sektörün toplamda 20 milyar doları aşan yatırımını gerektirdi; dünyanın diğer iki büyük litografi firması Nikon ve Canon, bütün teşviklere rağmen çalışan bir EUV sistemi teslim edemedi. Örtük bilgi çok yakın bir ikinci sırada — ama o en azından birkaç şirkete dağılmış durumda; aygıtta sayı bir.","Every other link carries some redundancy: designs are documented, tens of thousands of engineers exist, several fabs run. Apparatus carries none. If EUV production stopped, no second source exists — and the historical record shows why: EUV took roughly twenty-five years and over $20 billion of collective industry investment, and the world's other two great lithography firms, Nikon and Canon, never delivered a working EUV system despite every incentive to. Tacit knowledge is a very close second — but at least it is spread across a few companies; on apparatus the number is one."]},"nearBreak":["EUV'nin kendisi neredeyse ölüyordu. Fikir 1980'lerde ortaya çıktı — Kinoshita'nın NTT ekibi 1985'te çok katmanlı aynalarla yumuşak X-ışını görüntüsü yansıttı — ve hakemler tam bir EUV litografi sisteminin o kadar karmaşık olacağını, çalışma süresinin ihmal edilebilir kalacağını savundu. ABD federal fonu 1996'da Kongre tarafından kesildi; Intel yaklaşık 250 milyon dolarla devreye girdi. EUV LLC 1997-2003 arasında çalıştı, ASML ilk prototipini 2006'da, ilk üretim makinesini 2013'te sevk etti; 2014'e gelindiğinde sektör toplu olarak 20 milyar doların üzerinde harcamıştı. Nikon ve Canon hiçbir zaman teslim edemedi. ASML de vazgeçseydi Moore yasası 7 nm civarında sona ererdi — diğer beş halkanın hepsi sapasağlam dururken.","EUV itself nearly died. The idea emerged in the 1980s — Kinoshita's NTT team projected a soft X-ray image with multilayer mirrors in 1985 — and reviewers argued that a complete EUV lithography system would be so complex its uptime would be negligible. US federal funding was terminated by Congress in 1996; Intel stepped in with roughly $250 million. The EUV LLC ran from 1997 to 2003, ASML shipped its first prototype in 2006 and its first production machine in 2013; by 2014 the industry had collectively spent over $20 billion. Nikon and Canon never delivered. Had ASML also given up, Moore's law would have ended around 7 nm — with all five other links perfectly intact."],"thesis":["Çalışmanın çekirdek iddiasını destekliyor: modern kırılma noktası PAKET değil AYGIT. Bilgi kusursuz kaydedilmiş ve geniş biçimde öğretiliyor olabilir; onu okuyan ya da üreten tek makine yapılmaz olursa aktarım yine durur. Dürüst sınır: tek tedarikçi olmak kırılganlıkla aynı şey değil. ASML büyük, kârlı ve devam etmek için güçlü teşvikleri olan bir şirket; kopuş ihmalle değil ancak bir olayla — savaş, doğal afet, ihracat kontrolü zinciri — gelir. Uyarı yakın bir çöküş hakkında değil, yedeğin yokluğu hakkında.","Supports the study's core claim that the modern failure mode is APPARATUS, not PACKET: knowledge can be perfectly recorded and widely taught and still stop transmitting if the one machine that reads or makes it stops being built. Honest limit: single-supplier is not the same as fragile. ASML is large, profitable and strongly incentivised to continue; a break would take an event — war, natural disaster, an export-control cascade — not mere neglect. The warning is about the absence of a fallback, not an imminent collapse."],"sources":[{"t":["CHM: Entegre devreyi kim icat etti?","CHM: Who Invented the IC?"],"m":["Kilby'nin 12 Eylül 1958 gösterimi, Noyce'un 23 Ocak 1959 defter kaydı, Mayıs 1960'taki ilk tek parça devreler ve patent davasının sonucu.","Kilby's 12 September 1958 demonstration, Noyce's 23 January 1959 notebook entry, the first monolithic ICs of May 1960 and the outcome of the patent fight."],"u":"https://computerhistory.org/blog/who-invented-the-ic/"},{"t":["CHM Silicon Engine: 1959 düzlemsel üretim sürecinin icadı","CHM Silicon Engine: 1959 invention of the planar manufacturing process"],"m":["Hoerni'nin Aralık 1957 defteri, Mart 1959'daki çalışan cihaz, 1 Mayıs 1959 patenti ve oksit tabakasının işlevi.","Hoerni's December 1957 notebook, the working device of March 1959, the 1 May 1959 patent and the role of the oxide layer."],"u":"https://www.computerhistory.org/siliconengine/invention-of-the-planar-manufacturing-process/"},{"t":["ASML: EUV litografi sistemleri (ürün sayfası)","ASML: EUV lithography systems (product page)"],"m":["Şirketin kendi ifadesi: teknoloji 'ASML'e özgü'; 13,5 nm dalga boyu ve sistem ailesi (NXE, EXE).","The company's own wording: the technology is 'unique to ASML'; 13.5 nm wavelength and the NXE/EXE system families."],"u":"https://www.asml.com/en/products/euv-lithography-systems"},{"t":["Works in Progress: Dünyanın en karmaşık makinesi","Works in Progress: The World's Most Complex Machine"],"m":["Makine başına 100.000'den fazla parça, 5.000'i aşkın tedarikçi, 2014'e kadar 20 milyar doları aşan sektör yatırımı ve fiili EUV tekeli.","Over 100,000 components per machine, 5,000+ suppliers, over $20 billion of industry investment by 2014, and the de facto EUV monopoly."],"u":"https://worksinprogress.co/issue/the-worlds-most-complex-machine/"},{"t":["Counterpoint Research: Küresel döküm pazar payı","Counterpoint Research: Global foundry market share"],"m":["2026 1. çeyrek payları: TSMC %73, Samsung %7, SMIC %5 — ileri üretimdeki yoğunlaşmanın güncel ölçüsü.","Q1 2026 shares: TSMC 73%, Samsung 7%, SMIC 5% — the current measure of concentration in advanced manufacturing."],"u":"https://counterpointresearch.com/en/insights/global-semiconductor-foundry-market-share"}]},{"id":"hdd","cat":"electronics","civ":"modern","icon":"💽","name":["Sabit Disk (HDD)","The Hard Disk Drive"],"era":["1956 – günümüz","1956 – present"],"hook":["IBM'in 1956'daki ilk sabit diski, elli adet 24 inçlik plakada 5 milyon karakter (yaklaşık 3,75 MB) tutuyordu ve kafaları diske hiç dokunmuyordu: basınçlı hava yastığının üzerinde uçuyorlardı. Aynı kafalar bugün birkaç nanometre yükseklikte uçuyor ve bu sürücüleri dünyada yalnızca üç şirket üretebiliyor.","IBM's first hard disk, in 1956, held 5 million characters — about 3.75 MB — on fifty 24-inch platters, and its heads never touched the disk: they floated on a cushion of pumped air. Those heads now fly a few nanometres up, and exactly three companies on Earth can still build the drives around them."],"timeline":[{"y":1956,"link":"apparatus","src":"https://www.computerhistory.org/storageengine/first-commercial-hard-disk-drive-shipped/","t":["14 Eylül 1956: IBM 305 RAMAC ve 350 disk birimi duyurulur. Elli adet 24 inçlik plaka, 1.200 dev/dk, inç kare başına 2.000 bit, 5 milyon karakter (yaklaşık 3,75 MB).","14 September 1956: IBM announces the 305 RAMAC and its 350 disk unit. Fifty 24-inch platters, 1,200 rpm, 2,000 bits per square inch, 5 million characters (about 3.75 MB)."]},{"y":1957,"link":"packet","src":"https://ed-thelen.org/RAMAC/Myths.html","t":["Gerçek rakamlar: 1957 satın alma fiyatı 34.500 dolar, sistem kirası ayda 3.200 dolar, 350 biriminin ağırlığı 785 kg. Yaygın '50.000 dolar' ve '5 MB' rakamları tutmuyor.","The real numbers: a 1957 purchase price of $34,500, a system lease of $3,200 a month, a 350 unit weighing 785 kg. The popular '$50,000' and '5 MB' figures do not hold up."]},{"y":1961,"link":"context","src":"https://en.wikipedia.org/wiki/Flying_height","t":["IBM 1301, kendi kendine uçan hidrodinamik hava yatağını getirir: boşluk 0,00025 inçe (6,35 µm) iner. Kafayı taşıyan artık pompalı hava değil, akışkan fiziği.","The IBM 1301 brings the self-flying hydrodynamic air bearing: the gap falls to 0.00025 inch (6.35 µm). What holds the head up is no longer pumped air but fluid physics."]},{"y":1980,"link":"maintenance","src":"https://www.computerhistory.org/storageengine/seagate-5-25-inch-hdd-becomes-pc-standard/","t":["Seagate ST-506, 5,25 inçlik kutuya 5 MB koyar — RAMAC'in kapasitesi masaüstünde. Arayüzü standart olur; disk bilgisi anabilgisayar rahiplerinin elinden çıkar.","The Seagate ST-506 puts 5 MB in a 5.25-inch box — RAMAC's capacity on a desktop. Its interface becomes standard, and disk knowledge escapes the mainframe priesthood."]},{"y":2002,"link":"decoder","src":"https://www.ed-thelen.org/RAMAC/","t":["IBM emeklileri ve Santa Clara öğrencileri bir RAMAC 350'yi restore etmeye başlar (2002-2004, sonra 2006-2011). Ünite iz arıyor; yazma hiç kapsama alınmadı.","IBM retirees and Santa Clara students restore a RAMAC 350 (2002-2004, then 2006-2011). The unit can seek to tracks; writing was never part of the restoration."]},{"y":2011,"link":"apparatus","src":"https://spectrum.ieee.org/the-lessons-of-thailands-flood","t":["Tayland selleri: ülke dünya sabit disklerinin yaklaşık %40'ını üretiyordu. WD'nin Bang Pa-In fabrikası 1,8 metre suyun altında kaldı; ilk sürücü 46 gün sonra çıktı.","The Thailand floods: the country made about 40% of the world's hard drives. WD's Bang Pa-In plant sat under 1.8 metres of water; its first drive came 46 days later."]},{"y":2012,"link":"maintenance","src":"https://www.prnewswire.com/news-releases/wdr-completes-acquisition-of-hitachi-global-storage-technologies-142007743.html","t":["8 Mart 2012: WD, HGST alımını tamamlar. Düzenleyiciler üçüncü rakibi elle ayakta tutar: WD, 3,5 inç varlıklarının bir kısmını Toshiba'ya devretmek zorunda kalır.","8 March 2012: WD completes its HGST acquisition. Regulators keep a third competitor alive by hand: WD must divest some 3.5-inch assets to Toshiba."]},{"y":2025,"link":"tacit","src":"https://investors.seagate.com/news/news-details/2025/Seagate-Introduces-Hard-Drive-Capacities-of-Up-to-36TB-Extending-Its-HAMR-Based-Mozaic-3-Technology-Platform/default.aspx","t":["21 Ocak 2025: Seagate, HAMR tabanlı Mozaic 3+ ile plaka başına 3,6 TB duyurur; bunu ölçekte üretebilen tek imalatçı olduğunu söyler. Yazmak artık lazer istiyor.","21 January 2025: Seagate announces 3.6 TB per platter on HAMR-based Mozaic 3+, saying it is the only maker able to build them at scale. Writing now needs a laser."]}],"links":{"packet":["Kâğıt üstünde iyi ama aşınmış. RAMAC'in belgeleri ve patentleri duruyor; ama en çok tekrarlanan rakamları — '5 MB', 'bir tondan ağır', '50.000 dolar' — kaynağına gidildiğinde tutmuyor. Modern sürücülerin kanal kodları ve kafa tasarımları ise hiç yayımlanmıyor.","Good on paper, but worn. RAMAC's documentation and patents survive, yet its most-repeated numbers — '5 MB', 'over a ton', '$50,000' — do not hold up at the source. And modern drives' channel codes and head designs are never published at all."],"decoder":["Kullanıcı tarafında evrensel; üretici tarafında üç şirketin içinde. 2002-2011 restorasyonu bunu somutlaştırdı: bir RAMAC 350'yi yeniden hareket ettirmek IBM emeklilerini gerektirdi ve yazma işlevi hiç geri getirilmedi.","Universal on the user side; inside three companies on the maker side. The 2002-2011 restoration made this concrete: getting a RAMAC 350 moving again required IBM retirees, and the write function was never restored at all."],"context":["Manyetik kayıt fiziği açık ve öğretiliyor; sınırlar da biliniyor — süperparamanyetik sınır, HAMR'ın neden zorunlu hâle geldiği. Ama belirli bir sürücünün neden tam o verimi tutturduğu ticari sır.","The physics of magnetic recording is open and taught, and the limits are known — the superparamagnetic limit, why HAMR became necessary. Why a particular drive hits its particular yield is a trade secret."],"tacit":["En kritik halka. Kafayı birkaç nanometrelik boşlukta uçurmak, plaka yüzeyini bitirmek, HAMR lazerini kafanın içine yerleştirmek — bunlar hiçbir ders kitabının tam taşımadığı süreç bilgisi. Seagate, plaka başına 3,6 TB'yi ölçekte üretebilen tek firma olduğunu söylüyor.","The critical link. Flying a head in a gap of a few nanometres, finishing a platter surface, putting a HAMR laser inside the head — this is process knowledge no textbook fully carries. Seagate says it is the only firm that can make 3.6 TB platters at scale."],"apparatus":["Üç imalatçı kaldı: 2025 birim sevkiyatlarında WD %42,3, Seagate %40,8, Toshiba %17. 1956'dan bu yana en az 218 şirket sabit disk üretti; 215'i çekildi. Üretim ayrıca Güneydoğu Asya'da coğrafi olarak yoğunlaşmış durumda.","Three manufacturers left: WD 42.3%, Seagate 40.8%, Toshiba 17% of 2025 unit shipments. At least 218 companies have made hard drives since 1956; 215 are gone. Production is also geographically clustered in Southeast Asia."],"maintenance":["Hacim olarak sağlıklı: sektör 2025'te 1,61 zetabayt sevk etti, yıllık %22 artışla. Ama bakım tümüyle üç şirketin ticari sağlığına bağlı; kâr etmeyi bırakırlarsa bilgiyi taşıyacak başka kurum yok.","Healthy by volume: the industry shipped 1.61 zettabytes in 2025, up 22% year on year. But maintenance rides entirely on three companies' commercial health; if they stop being profitable, no other institution carries the knowledge."]},"weakest":{"k":"apparatus","why":["Örtük bilgi ile aygıt burada aynı üç binada duruyor, ama aygıt daha keskin okuma: bilgi yalnızca üç şirketin içinde yaşamakla kalmıyor, o şirketlerin fabrikaları da dar bir coğrafyada toplanmış. 2011 Tayland selleri bunun provasıydı — tek bir ovadaki su dünya sabit disk arzını aylarca bozdu. Daha da çarpıcısı düzenleyici kayıt: WD'nin 2012'de HGST'yi alması, ancak WD bazı 3,5 inç varlıklarını Toshiba'ya devrederek üçüncü bir rakibi ayakta tutması şartıyla onaylandı. Bu sektörde rekabet — dolayısıyla yedeklilik — piyasanın kendi ürünü değil, elle korunan bir şey.","Tacit and apparatus sit in the same three buildings here, but apparatus is the sharper reading: the knowledge does not merely live inside three companies, those companies' plants are clustered in a narrow geography. The 2011 Thailand floods were the rehearsal — water in one plain disrupted world drive supply for months. More telling still is the regulatory record: WD's 2012 purchase of HGST was cleared only on condition that WD divest 3.5-inch assets to Toshiba so a third competitor would survive. In this industry, competition — and therefore redundancy — is not a market outcome but something kept alive by hand."]},"nearBreak":["İki gerçek olay üst üste bindi. Ekim-Kasım 2011'de Tayland selleri, dünya sabit disklerinin yaklaşık %40'ını üreten bir ülkeyi bir aydan uzun süre su altında bıraktı; Western Digital'in Bang Pa-In fabrikası 1,8 metre suyun altına girdi, ilk sürücüsünü ancak 46 gün sonra üretebildi ve normal kapasiteye dönmesi birkaç ay daha aldı. Fiyatlar fırladı; WD ile Seagate'in brüt kâr marjı yaklaşık %20'den %30'a çıktı. Tam aynı aylarda sektör kalıcı olarak daralıyordu: Seagate, Samsung'un disk işini 20 Aralık 2011'de devraldı; WD, HGST alımını 8 Mart 2012'de tamamladı — ve bu onay ancak düzenleyiciler bir düopolü önlemek için WD'yi 3,5 inç varlıklarını Toshiba'ya devretmeye zorladığı için geldi. 1956'dan bu yana en az 218 şirketin ürettiği bir teknoloji üç yıl içinde üç şirkete indi ve üçüncüsü yalnızca zorlamayla var.","Two real events overlapped. In October-November 2011 the Thailand floods put a country making about 40% of the world's hard drives under water for more than a month; Western Digital's Bang Pa-In plant sat under 1.8 metres, produced its first drive only 46 days later, and took a further couple of months to reach normal capacity. Prices spiked and WD's and Seagate's gross margins rose from around 20% to around 30%. In exactly those months the industry was contracting permanently: Seagate completed its purchase of Samsung's HDD business on 20 December 2011, and WD completed the HGST acquisition on 8 March 2012 — cleared only because regulators forced WD to divest 3.5-inch assets to Toshiba to prevent a duopoly. A technology that at least 218 companies have manufactured since 1956 fell to three within three years, and the third exists only by compulsion."],"thesis":["Çalışmanın 'bir zincir, ürün bollaşırken bile zayıflayabilir' iddiasını destekliyor: sabit disk hiç bu kadar çok üretilmemişti — 2025'te 1,61 zetabayt — ama onu yapabilen kurum sayısı hiç bu kadar az olmamıştı. Dürüst sınır: bu bir teknoloji kaybı senaryosu değil, bir kapasite yoğunlaşması senaryosu. Sabit diskin yerini flash bellek ve teyp alabilir; asıl kayıp riski nanometre ölçeğinde mekanik konumlandırma zanaatinde ve bu zanaati ayakta tutacak başka neredeyse hiçbir uygulama yok.","Supports the study's claim that a chain can weaken while the product multiplies: more hard drives were made than ever in 2025 — 1.61 zettabytes — yet fewer institutions than ever can make them. Honest limit: this is a concentration scenario, not a lost-technology scenario. Flash and tape can substitute for hard disks; the real loss risk sits in the craft of nanometre-scale mechanical positioning, a craft with almost no other application to keep it alive."],"sources":[{"t":["CHM Storage Engine: 1956, ilk ticari sabit disk","CHM Storage Engine: 1956, first commercial hard disk drive shipped"],"m":["350 biriminin doğrulanmış teknik künyesi: 50 plaka, 24 inç, 1.200 dev/dk, 2.000 bit/inç², 3,75 MB.","The 350's verified specification: 50 platters, 24 inches, 1,200 rpm, 2,000 bits/in², 3.75 MB."],"u":"https://www.computerhistory.org/storageengine/first-commercial-hard-disk-drive-shipped/"},{"t":["Ed Thelen: IBM RAMAC hakkındaki efsaneler","Ed Thelen: Myths About IBM RAMAC, First HDD"],"m":["Efsane temizliği: '5 MB' aslında 3,75 MB, ağırlık 785 kg, 1957 fiyatı 34.500 dolar; duyuru 14 Eylül 1956.","The myth-bust: '5 MB' is really 3.75 MB, weight 785 kg, 1957 price $34,500, announcement 14 September 1956."],"u":"https://ed-thelen.org/RAMAC/Myths.html"},{"t":["IEEE Spectrum: Tayland selinin dersleri","IEEE Spectrum: The Lessons of Thailand's Flood"],"m":["Tayland'ın dünya sabit disklerinin ~%40'ını ürettiği, WD fabrikasındaki 1,8 metre su ve 46 günlük kesinti.","That Thailand made ~40% of the world's hard drives, the 1.8 metres of water at WD's plant, and the 46-day outage."],"u":"https://spectrum.ieee.org/the-lessons-of-thailands-flood"},{"t":["Western Digital: HGST alımının tamamlanması (basın bülteni)","Western Digital: completion of the HGST acquisition (press release)"],"m":["8 Mart 2012 tarihi ve düzenleyici şart: üçüncü rakibi korumak için 3,5 inç varlıkların Toshiba'ya devri.","The 8 March 2012 date and the regulatory condition: divesting 3.5-inch assets to Toshiba to preserve a third competitor."],"u":"https://www.prnewswire.com/news-releases/wdr-completes-acquisition-of-hitachi-global-storage-technologies-142007743.html"},{"t":["Forbes / Tom Coughlin: 2025 sabit disk sektörü güncellemesi","Forbes / Tom Coughlin: 2025 hard disk drive industry update"],"m":["Kalan üç üretici ve 2025 birim payları (WD %42,3, Seagate %40,8, Toshiba %17); sektör 1,61 zetabayt sevk etti.","The three remaining makers and their 2025 unit shares (WD 42.3%, Seagate 40.8%, Toshiba 17%); 1.61 zettabytes shipped."],"u":"https://www.forbes.com/sites/tomcoughlin/2026/02/02/c4q-2025-and-2025-hard-disk-drive-industry-update/"}]},{"id":"television","cat":"info","civ":"modern","icon":"📺","name":["Televizyon","Television"],"era":["1884 – günümüz","1884 – present"],"hook":["Televizyonun tarama ilkesi 6 Ocak 1884'te patentlendi; Paul Nipkow onu hiç inşa etmedi — paket, kendisini okuyabilecek kadar hızlı elektroniği kırk yıl bekledi. Baird 26 Ocak 1926'da dünyaya kendi sistemini gösterdi; 6 Şubat 1937'de BBC o sistemi kapattı.","Television's scanning principle was patented on 6 January 1884, and Paul Nipkow never built it — the packet waited some forty years for electronics fast enough to read it. Baird showed the world his system on 26 January 1926; on 6 February 1937 the BBC switched it off."],"timeline":[{"y":1884,"t":["Nipkow, 6 Ocak 1884'te 'Elektrikli Teleskop'u (DE30105) başvurur; patent 15 Ocak 1885'te verilir. Onu hiç inşa etmez: paketi okuyacak aygıt yoktur.","Nipkow files the 'Electric Telescope' (DE30105) on 6 January 1884; granted 15 January 1885. He never builds it — no apparatus exists that can read the packet."],"link":"packet","src":"https://patents.google.com/patent/DE30105C/en"},{"y":1926,"t":["26 Ocak 1926: Baird, 22 Frith Street'teki atölyesinde Royal Institution üyelerine dünyanın ilk canlı televizyon gösterimini yapar. Paket 42 yıl beklemiştir.","26 January 1926: Baird gives the world's first public demonstration of live television to Royal Institution members at 22 Frith Street. The packet had waited 42 years."],"link":"apparatus","src":"https://ethw.org/Milestones:First_Public_Demonstration_of_Television,_1926"},{"y":1927,"t":["7 Eylül 1927: 21 yaşındaki Farnsworth, San Francisco'da Green Street 202'de tümüyle elektronik ilk televizyon görüntüsünü iletir. Mekanik disk doğmadan eskir.","7 September 1927: Farnsworth, aged 21, transmits the first all-electronic television image at 202 Green Street, San Francisco. The mechanical disc is obsolete."],"link":"apparatus","src":"https://ohp.parks.ca.gov/ListedResources/Detail/941"},{"y":1935,"t":["Temmuz 1935: Pate
