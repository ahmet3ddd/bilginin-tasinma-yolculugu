z; yalnızca izin verildiğinde işin yürüdüğünü ve sürdürülemediğini gösterir.","The output does not explain why the press was not founded before 1729, and it proves neither the claim that a ban existed nor the claim that calligraphers blocked it; it shows only that once permitted the work ran, and that it was not sustained."],"source":["TDV İslâm Ansiklopedisi, “Müteferrika Matbaası”","TDV Encyclopaedia of Islam, “Müteferrika Matbaası”"],"url":"https://islamansiklopedisi.org.tr/muteferrika-matbaasi"}},{"id":"roman-law","cat":"threshold","civ":"roman","icon":"⚖️","name":["Roma hukuku ve Corpus Iuris Civilis","Roman Law and the Corpus Juris Civilis"],"era":["MÖ 2. yüzyıl – bugün; derleme MS 529–534","2nd century BCE – present; the compilation 529–534 CE"],"hook":["Bin yıllık bir hukuk birikimi tek bir imparatorluk emriyle elli kitaba sıkıştırıldı, Batı’da beş yüzyıl okunmadan bekledi ve bugün dünyanın büyük bölümünün medenî hukuku o paketin üzerinde duruyor. Zincir, geç antik dönemden gelen tek bir yazma sayesinde koptuğu yerden yeniden bağlandı.","A thousand years of jurisprudence was compressed into fifty books by a single imperial order, lay effectively unread in the West for five centuries, and now underpins the civil law of most of the world. The chain was re-tied at the break by one late-antique manuscript."],"timeline":[{"y":529,"t":["Iustinianus’un ilk Codex’i ilan edildi; derlemenin dışında kalan bütün imparatorluk emirnameleri aynı anda yürürlükten kaldırıldı.","Justinian’s first Codex is promulgated; every imperial ordinance left outside it is repealed in the same act."],"link":"packet","src":"https://www.britannica.com/topic/Roman-law/The-law-of-Justinian"},{"y":533,"t":["Digesta ve Institutiones ilan edildi: iki bini aşkın kitap ve üç milyon satırlık hukuk yazını, elli kitaplık tek bir külliyata indirildi.","The Digest and Institutes are promulgated: over two thousand books and three million lines of legal writing reduced to a single fifty-book corpus."],"link":"packet","src":"https://www.worldhistory.org/Corpus_Juris_Civilis/"},{"y":534,"t":["Gözden geçirilmiş Codex yayımlandı ve derleme üzerine şerh yazmak yasaklandı: paket kilitlendi, onu doğuran tartışma dışarıda bırakıldı.","The revised Codex appears and commentaries on the compilation are forbidden: the packet is locked and the argument that produced it left outside."],"link":"context","src":"https://en.wikipedia.org/wiki/Digests_(Roman_law)"},{"y":1080,"t":["Bologna’da Digesta’nın Codex Secundus adlı nüshası eldedir; Irnerius’un öğretisiyle metin derse girer ve glossator okulu doğar.","At Bologna a Digest copy known as the Codex Secundus is at hand; under Irnerius’s teaching the text enters the curriculum and the school of glossators is born."],"link":"decoder","src":"https://max-eup2012.mpipriv.de/index.php/Corpus_Juris_Civilis"},{"y":1250,"t":["Accursius’un Glossa Ordinaria’sı tamamlanır: 96.940 kenar notu, bunların 62.577’si yalnızca Digesta üzerine. Paketin bakım defteri.","Accursius completes the Glossa Ordinaria: 96,940 marginal notes, 62,577 of them on the Digest alone. The packet’s maintenance log."],"link":"maintenance","src":"https://en.wikipedia.org/wiki/Glossa_ordinaria_(Accursius)"},{"y":1406,"t":["Savaş ganimeti olarak Pisa’dan Floransa’ya getirilen geç antik Digesta yazması, bugün Littera Florentina adıyla bilinen tek tam tanıktır.","Taken from Pisa to Florence as war booty, the late-antique Digest codex is the one near-complete witness now called the Littera Florentina."],"link":"apparatus","src":"https://www.historyofinformation.com/detail.php?id=165"},{"y":1804,"t":["Code civil yürürlüğe girdi; kategorileri eski Fransız hukukundan değil, doğrudan Iustinianus’un altıncı yüzyıl derlemesinden alınmıştı.","The Code civil takes effect; its categories are drawn not from earlier French law but directly from Justinian’s sixth-century codification."],"link":"packet","src":"https://en.wikipedia.org/wiki/Napoleonic_Code"},{"y":1926,"t":["17 Şubat 1926’da Türk Kanunu Medenîsi kabul edildi; İsviçre medenî kanunundan çevrilen metin zinciri Bologna üzerinden Roma’ya bağladı.","On 17 February 1926 the Turkish Civil Code is adopted; translated from the Swiss code, it ties the chain back through Bologna to Rome."],"link":"decoder","src":"https://en.wikipedia.org/wiki/Turkish_civil_code_(1926)"}],"links":{"packet":["Elli kitaplık Digesta, dört kitaplık Institutiones, on iki kitaplık Codex ve 534’ten sonra çıkan Novellae. Digesta otuz sekiz klasik hukukçudan yapılmış alıntılardan kuruludur; alıntı dışında kalan klasik hukuk yazınının neredeyse tamamı kaybolmuştur. Paket, kaynaklarını tüketerek hayatta kaldı.","Fifty books of Digest, four of Institutes, twelve of Codex, and the Novellae issued after 534. The Digest is built from excerpts of thirty-eight classical jurists; almost all classical legal literature outside those excerpts is lost. The packet survived by consuming its own sources."],"decoder":["Latince bilen ve hukukî akıl yürütmeyi öğrenmiş insanlar. Bologna’dan sonra bu çözücü kurumsallaştı: glossatorlar, hukuk fakülteleri, ius commune. Bugün aynı işlevi, aynı kavram dizgesini yeniden üreten medenî kanunlar ve onları okuyan hukukçular görüyor.","People who read Latin and have been trained to reason legally. After Bologna this decoder was institutionalised: glossators, law faculties, the ius commune. Today the same function is carried by civil codes that reproduce the same conceptual grid, and by the jurists who read them."],"context":["Bir kuralın hangi davadan doğduğu, hangi karşı görüşe rağmen kabul edildiği, nerede işlemediği. Tribonianus’un kurulu alıntıları kısaltıp değiştirdi, ihtilafı ayıkladı; Iustinianus da şerhi yasakladı. Elimizde cevaplar var, hata tarihi yok.","Which case produced a rule, which counter-argument it defeated, where it failed. Tribonian’s commission abridged and altered its excerpts and stripped out disagreement; Justinian then banned commentary. We hold the answers without the record of error."],"tacit":["Hukukçunun el becerisi: bir olayı hangi kavramın altına yerleştireceğini, hangi ayrımın taşıyıcı hangisinin süs olduğunu görmek. Bu hiçbir zaman tam olarak yazıya geçmedi; çıraklıkla, derste ve dava içinde aktarıldı — Bologna’da olduğu gibi bugün de.","The jurist’s hand skill: seeing which concept a set of facts belongs under, which distinction carries weight and which is ornament. It was never fully written down; it passed by apprenticeship, in the lecture room and in litigation — at Bologna as today."],"apparatus":["Parşömen kodeks ve scriptorium; ardından metni ortada, glossayı kenarda dizen sayfa düzeni; ardından matbaa. On altıncı yüzyıldan bu yana basılı edisyonlar Bologna geleneğini değil Floransa yazmasını esas alır — yani bugün okuduğumuz Digesta, tek bir fiziksel nesnenin okunmasına bağlıdır.","Parchment codex and scriptorium; then the page layout that set text in the centre and gloss in the margin; then print. Since the sixteenth century printed editions have followed the Florentine manuscript rather than the Bolognese tradition — so the Digest we read today depends on the reading of one physical object."],"maintenance":["Kopyalama, glossa yazma, ders verme, yeniden kanunlaştırma. Accursius’un 96.940 notu, ius commune’nin yüzyıllara yayılan mahkeme pratiği, 1804 ve 1900 kanunlaştırmaları, 1926’daki Türk alımı: hepsi aynı yinelenen emeğin farklı adları. Bu emek durduğunda paket bir arşiv nesnesine döner.","Copying, glossing, teaching, re-codifying. Accursius’s 96,940 notes, centuries of ius commune court practice, the codifications of 1804 and 1900, the Turkish reception of 1926: all names for the same recurring labour. When it stops, the packet becomes an archival object."]},"weakest":{"k":"context","why":["Paket olağanüstü dayanıklı çıktı; onu taşıyan bağlam ise derlemenin kendisi tarafından silindi. Kurul alıntıladığı metinleri kısalttı ve değiştirdi, hukukçuların birbirine itirazını attı, sonra Iustinianus derleme üzerine şerh yazılmasını yasakladı. Sonuç, sebeplerinden kopmuş bir cevaplar dizisidir: kuralların neden o biçimi aldığını, hangi çözümlerin denenip başarısız olduğunu ancak dolaylı olarak çıkarabiliyoruz. Ortaçağ hukukçularının yüzyıllarca glossa yazmak zorunda kalmasının sebebi tam olarak budur — silinen bağlamı yeniden inşa etmek.","The packet proved extraordinarily durable; the context that carried it was erased by the compilation itself. The commission abridged and altered what it excerpted, removed the jurists’ disagreements, and then Justinian forbade commentary on the result. What remains is a series of answers severed from their reasons: why the rules took that shape, and which solutions were tried and failed, can only be inferred indirectly. This is exactly why medieval jurists had to write glosses for centuries — to rebuild the context that had been deleted."]},"nearBreak":["Batı’da Digesta yaklaşık beş yüzyıl boyunca fiilen okunmaz durumdaydı ve Iustinianus derlemesinin geç antik dönemden gelen tam sayılabilecek tek tanığı bugün Floransa’daki Biblioteca Medicea Laurenziana’da duran tek bir yazmadır. Ancak popüler anlatıya dikkat etmek gerekir: “1135’te Amalfi’de tesadüfen bulundu” hikâyesi arşiv kaydıyla desteklenmiyor. Yazmanın 1406’da Pisa’dan Floransa’ya getirildiği kesin biçimde belgelidir; Amalfi sahnesi ise efsane sayılmalıdır. Üstelik Bologna öğretimi bu yazmaya değil, 1080 dolayında elde bulunan Codex Secundus adlı ayrı bir nüshaya dayanıyordu — yani zincir tek bir nesneye değil, birbirini yedekleyen iki hatta bağlıydı ve bunlardan biri kayboldu.","In the West the Digest was effectively unread for some five centuries, and the one near-complete late-antique witness to Justinian’s compilation is a single manuscript now in the Biblioteca Medicea Laurenziana in Florence. But the popular story needs care: the tale of an accidental rediscovery at Amalfi in 1135 is not supported by archival evidence. That the codex was carried from Pisa to Florence in 1406 is firmly documented; the Amalfi scene should be treated as legend. Moreover, Bolognese teaching rested not on this manuscript but on a separate copy, the Codex Secundus, available around 1080 — so the chain hung on two mutually redundant lines rather than one object, and one of those lines has since disappeared."],"thesis":["Roma hukuku, altı halkanın en uzun süre birlikte ayakta kaldığı vakadır: paket sıkıştırıldı, çözücü kurumsallaştı, bakım emeği bin yıl boyunca yenilendi ve zincir bir uygarlığın çöküşünü aşarak 1926’da Ankara’ya kadar uzandı. Ama bu vaka, bir metnin hayatta kalmasının o metnin doğru ya da adil olduğunu göstermez: Digesta köleliğin hukukunu da aynı sadakatle taşıdı. Ayakta kalan çoğu zaman en iyi metin değil, en kurumsallaşmış metindir; bu vaka zincirin nasıl tutunduğunu gösterir, taşıdığı şeyin değerini değil.","Roman law is the case in which all six links stayed alive together for the longest time: the packet was compressed, the decoder institutionalised, the maintenance labour renewed for a millennium, and the chain crossed the collapse of a civilisation to reach Ankara in 1926. But the case does not show that a text’s survival makes it right or just: the Digest transmitted the law of slavery with the same fidelity. What survives is usually not the best text but the most institutionalised one; this case shows how a chain holds, not the worth of what it carries."],"sources":[{"t":["Max Planck Avrupa Özel Hukuku Ansiklopedisi, “Corpus Juris Civilis”","Max Planck Encyclopedia of European Private Law, “Corpus Juris Civilis”"],"m":["Derlemenin tarihlerini, Bologna’daki Codex Secundus’u ve littera Florentina ile littera Bononiensis ayrımını hakemli bir referans kaynağında verir.","Gives the compilation’s dates, the Codex Secundus at Bologna, and the distinction between the littera Florentina and the littera Bononiensis in a peer-reviewed reference work."],"u":"https://max-eup2012.mpipriv.de/index.php/Corpus_Juris_Civilis"},{"t":["Britannica, “Roman law: the law of Justinian”","Britannica, “Roman law: The law of Justinian”"],"m":["Codex (529), Digesta (533), Institutiones ve Novellae (534–565) tarihlerini bağımsız olarak doğrular.","Independently corroborates the dates of the Codex (529), Digest (533), Institutes, and Novels (534–565)."],"u":"https://www.britannica.com/topic/Roman-law/The-law-of-Justinian"},{"t":["Jeremy Norman, History of Information: Pandectarum codex Florentinus","Jeremy Norman, History of Information: Pandectarum codex Florentinus"],"m":["Floransa yazmasının 907 yaprağını, altıncı yüzyıl tarihini ve Konstantinopolis–Amalfi–Pisa–Floransa (1406) izini belgeler.","Documents the Florentine codex’s 907 leaves, its sixth-century date, and the Constantinople–Amalfi–Pisa–Florence (1406) trail."],"u":"https://www.historyofinformation.com/detail.php?id=165"},{"t":["Bologna Üniversitesi, Irnerius sayfası ve Accursius’un Glossa Ordinaria’sı","University of Bologna on Irnerius, and the Glossa Ordinaria of Accursius"],"m":["Çözücünün kurumsallaşmasını gösterir: Irnerius 1125’e kadar belgelidir ve Accursius’un glossası 96.940 nottan oluşur.","Shows the decoder becoming an institution: Irnerius is documented to 1125, and Accursius’s gloss runs to 96,940 notes."],"u":"https://www.unibo.it/en/university/who-we-are/our-history/famous-people-and-students/Irnerius"}],"ev":{"year":533,"start":533,"end":600,"type":"direct","conf":"high","region":["Konstantinopolis’te yazıldı, Floransa’da korunuyor","Written in Constantinople, preserved in Florence"],"role":["Iustinianus Digesta’sının geç antik dönemden gelen, tam sayılabilecek tek yazma tanığı: 907 yapraklık parşömen kodeks","The one near-complete late-antique manuscript witness to Justinian’s Digest: a 907-leaf parchment codex"],"shows":["Bin yıllık bir hukuk geleneğinin metinsel aktarımının, tek bir fiziksel nesnenin sağ kalmasına indirgenebildiğini gösterir.","It shows that the textual transmission of a thousand-year legal tradition could be reduced to the survival of one physical object."],"limits":["Yazmanın altıncı ya da erken yedinci yüzyıla tarihlenmesi ve Konstantinopolis’te üretildiği paleografik çıkarımdır, belgeye dayanmaz; Amalfi anlatısı ise doğrulanamamıştır.","Its sixth- or early-seventh-century date and Constantinopolitan origin are palaeographic inferences rather than documented facts, and the Amalfi episode remains unverified."],"source":["Max Planck Avrupa Özel Hukuku Ansiklopedisi ile Laurenziana ve History of Information kayıtları","Max Planck Encyclopedia of European Private Law, with Laurenziana and History of Information records"],"url":"https://www.historyofinformation.com/detail.php?id=165"}},{"id":"aqueducts","cat":"loss","civ":"roman","icon":"💧","name":["Su kemerleri ve Frontinus’un bakım kılavuzu","The Aqueducts and Frontinus’s Maintenance Manual"],"era":["MÖ 1. yüzyıl – bugün; Frontinus’un raporu MS 97–98","1st century BCE – present; Frontinus’s report 97–98 CE"],"hook":["Roma su kemeri yapmayı değil, su kemerini işletmeyi yazıya döktü: kadro sayıları, boru ölçüleri, hırsızlık yöntemleri. Kılavuz kaldı; kılavuzu uygulayan kurum gitti ve şehir çeşmelerini kaybetti. Aynı işletme bilgisi bin yıl sonra İstanbul’da yeniden kuruldu.","Rome wrote down not how to build an aqueduct but how to run one: staff numbers, pipe gauges, methods of theft. The manual survived; the institution that executed it did not, and the city lost its fountains. The same operating knowledge was rebuilt a thousand years later in Istanbul."],"timeline":[{"y":-19,"t":["Agrippa’nın Aqua Virgo’su tamamlandı: 20,5 kilometrenin son 1.800 metresi dışında tamamı yer altında — hayatta kalmasının asıl sebebi bu.","Agrippa’s Aqua Virgo is completed: of its 20.5 km all but the last 1,800 m runs underground — the real reason it outlived the others."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/Aqua_Virgo"},{"y":97,"t":["Nerva, Frontinus’u curator aquarum olarak atadı; işletme sorumluluğu Britannia eski valisi bir devlet adamına verildi.","Nerva appoints Frontinus curator aquarum; responsibility for the system passes to a statesman who had governed Britain."],"link":"maintenance","src":"https://www.britannica.com/biography/Sextus-Julius-Frontinus"},{"y":98,"t":["De aquaeductu yazıldı: Frontinus onu commentarius pro formula administrationis, yani başvurulacak bir idarî elkitabı olarak tanımlar.","De aquaeductu is written: Frontinus calls it a commentarius pro formula administrationis — an administrative handbook to be consulted."],"link":"maintenance","src":"https://assets.cambridge.org/97805218/32519/excerpt/9780521832519_excerpt.htm"},{"y":373,"t":["Konstantinopolis’te Valens Kemeri tamamlandı; hat, Trakya’da 120 kilometre öteye uzanan 250 kilometreyi aşkın bir kanal ağının parçasıydı.","The Aqueduct of Valens is completed at Constantinople, part of a network of over 250 km of channels reaching 120 km into Thrace."],"link":"apparatus","src":"https://www.thebyzantinelegacy.com/valens-aqueduct"},{"y":537,"t":["Gotlar Roma’yı kuşatırken Vitiges su kemerlerini kesti; Belisarius Tiber üzerinde yüzer değirmenler kurdu. Ortaçağa yalnız Virgo ulaştı.","During the Gothic siege Vitiges cuts the aqueducts; Belisarius answers with floating mills on the Tiber. Only the Virgo reaches the Middle Ages."],"link":"maintenance","src":"http://www.romanaqueducts.info/aquasite/romaaftermath/index.html"},{"y":1429,"t":["Poggio Bracciolini, De aquaeductu’nun bilinen tek yazmasını Monte Cassino’da buldu; sonraki bütün nüshalar onun kopyalarından türer.","Poggio Bracciolini finds the only known manuscript of De aquaeductu at Monte Cassino; every later copy descends from his transcripts."],"link":"packet","src":"https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/manuscripts*.html"},{"y":1453,"t":["Fetihten hemen sonra II. Mehmed Valens hattının onarımını emretti; aynı yıl Roma’da V. Nicolaus Aqua Virgo’nun kanalını onarttı.","Just after the conquest Mehmed II orders the Valens line repaired; in the same year Nicholas V restores the channel of the Aqua Virgo in Rome."],"link":"maintenance","src":"https://www.thebyzantinelegacy.com/valens-aqueduct"},{"y":1563,"t":["Sinan, Süleyman için Kırkçeşme sistemini tamamladı: yaklaşık 55 kilometre kanal, 33 kemer, 300’ü aşkın çeşme, kısmen Roma hatları üzerinde.","Sinan completes the Kırkçeşme system for Süleyman: some 55 km of channels, 33 aqueducts, over 300 fountains, partly on Roman lines."],"link":"maintenance","src":"https://islamicart.museumwnf.org/database_item.php?id=monument%3BISL%3Btr%3BMon01%3B34%3Ben"}],"links":{"packet":["İki kitaplık De aquaeductu: dokuz su kemerinin tarihi, güzergâhı, ölçümü ve hukuku; quinaria cinsinden boru ölçüleri; kadro ve hırsızlık kayıtları. Yanında ikinci bir paket daha var — üzerine hak sahibinin adı damgalanmış kurşun künkler, yani okunabilir fiziksel belgeler.","Two books of De aquaeductu: the history, route, measurement and law of nine aqueducts; pipe gauges in quinariae; staffing and records of theft. A second packet runs alongside it — lead pipes stamped with the grantee’s name, readable physical documents."],"decoder":["Curator aquarum’un bürosu, ölçümü yapan mimarlar, su tahsis belgelerini okuyan hukukçular. Bugün bu çözücü kısmen çalışıyor: Frontinus’un tablolarını okuyabiliyoruz ama quinaria bir debi değil bir kesit ölçüsü olduğu için rakamlarının modern litre karşılığı hâlâ tartışmalıdır.","The curator’s office, the architects who took the measurements, the jurists who read the water grants. Today this decoder works only partly: we can read Frontinus’s tables, but because the quinaria measures a cross-section rather than a flow rate, the modern equivalent of his figures is still disputed."],"context":["Sistemin neden çalıştığı — sabit ve çok küçük bir eğim, çökeltme havuzları, castellum’larda dağıtım — ve nerede çalışmadığı. Frontinus’un asıl katkısı ikincisidir: verilen su ile ulaşan su arasındaki farkı açıkça yazar ve bunun sebebini kaçaktan çok hırsızlığa bağlar.","Why the system works — a constant, very shallow gradient, settling tanks, distribution at the castella — and where it fails. Frontinus’s real contribution is the second: he states plainly the gap between water granted and water delivered, and attributes it more to theft than to leakage."],"tacit":["Kaçağı sesinden bulmak, eğimi elle tutturmak, kurşunu lehimlemek, kireç kabuğunu kanalı zayıflatmadan kazımak. Yazıya girmeyen bu bilginin en güzel kanıtı Mağlova Kemeri’dir: 1563’te tamamlandığı yıl sel götürdü, Sinan 1564’te ayakları piramit biçiminde genişleterek yeniden yaptı. Başarısızlıkla düzeltilen el bilgisi.","Finding a leak by sound, holding a gradient by hand, soldering lead, scraping calcite without weakening the channel. The finest proof of this unwritten knowledge is the Mağlova Aqueduct: destroyed by flood in 1563, the year it was finished, and rebuilt by Sinan in 1564 with piers widened in pyramid form. Hand skill corrected by failure."],"apparatus":["Kanalların kendisi, çökeltme havuzları, castellum divisorium, hak sahibinin adı damgalı kurşun calix’ler; Osmanlı tarafında maksemler ve su terazileri. Bu donanım olmadan paket okunabilir ama uygulanamaz — nitekim ortaçağ Roması’nda tam olarak bu oldu.","The channels themselves, settling tanks, the castellum divisorium, the lead calices stamped with the grantee’s name; on the Ottoman side the distribution basins and water towers. Without this apparatus the packet is legible but not executable — which is exactly what happened in medieval Rome."],"maintenance":["Sürekli iki ekip: Agrippa’dan miras kalıp devlete geçen 240 kişilik kamu familia’sı ve Claudius’un kurduğu 460 kişilik imparatorluk familia’sı. İçlerinde kâhyalar, hazne bekçileri, devriye müfettişleri, kaldırımcılar ve sıvacılar vardı. Bu vakanın bütün tezi bu iki sayıda duruyor.","Two standing gangs: the public familia of about 240 inherited from Agrippa and transferred to the State, and the imperial familia of 460 established by Claudius. They included overseers, reservoir-keepers, inspectors, pavers and plasterers. The whole thesis of this case sits in those two numbers."]},"weakest":{"k":"maintenance","why":["Paket, donanım ve çözücü hayatta kaldı; duran şey yinelenen emek ve onu ödeyen maliye oldu. 537’de Vitiges kanalları kestiğinde asıl sorun kesik değildi — Belisarius onarımın bir kısmını yapabildi — asıl sorun on bir su kemerini sürekli bakımda tutacak kurumun ve gelirin artık bulunmamasıydı. Sonuç bir anda değil yüzyıllar içinde geldi: onuncu yüzyılın sonunda Romalılar yeniden kuyu ve dere suyu içiyordu, on dördüncü yüzyılda şehir yaklaşık 25.000 kişiye inmişti. Taş kemerler ayaktaydı; onları su taşıyan bir sisteme çeviren şey yoktu.","The packet, the apparatus and the decoder all survived; what stopped was the recurring labour and the treasury that paid for it. When Vitiges cut the channels in 537 the cut was not the real problem — Belisarius managed part of the repair — the real problem was that no institution or revenue remained to keep eleven aqueducts permanently maintained. The result came over centuries, not at once: by the end of the tenth century Romans were drawing water from wells and streams again, and by the fourteenth the city held about 25,000 people. The stone arcades stood; what turned them into a working system was gone."]},"nearBreak":["Kılavuzun kendisi neredeyse kayboldu. De aquaeductu’nun bilinen tek yazması Monte Cassino’daki C 361 kodeksidir ve Poggio Bracciolini onu ancak 1429’da manastıra giderek buldu; bugün elimizdeki bütün nüshalar onun orada çıkarttığı kopyalardan türer. Yazmanın tarihi bile tartışmalıdır — on birinci yüzyıl sonundan on dördüncü yüzyıl başına kadar uzanan öneriler vardır. O tek kodeks yansaydı, Roma su sisteminin taş kalıntılarına sahip olurduk ama kadro sayılarına, boru ölçülerine ve hırsızlık kayıtlarına sahip olmazdık: bakım halkasının kendisi görünmez kalırdı.","The manual itself came close to vanishing. The only known manuscript of De aquaeductu is codex C 361 at Monte Cassino, and Poggio Bracciolini found it only in 1429 by going to the monastery; every copy we now have descends from the transcripts he made there. Even the manuscript’s date is contested, with proposals ranging from the late eleventh to the early fourteenth century. Had that one codex burned, we would have the stone remains of Rome’s water system but not the staff numbers, the pipe gauges or the records of theft: the maintenance link itself would be invisible."],"thesis":["Bu vaka, bakımın diğer beş halkadan bağımsız olarak ölebileceğini ve öldüğünde geri kalan her şeyin işe yaramaz hâle geldiğini gösterir; İstanbul’un Roma hattı üzerine kurulan Kırkçeşme sistemi ise aynı bilginin bir uygarlıktan diğerine devredilebildiğini gösterir. Ama bu vaka yazılı kılavuzun kurumun yerini tutabileceğini göstermez — tam tersini gösterir: Frontinus’un metni bin dört yüz yıl boyunca elde kaldı ve Roma’nın çeşmelerini bir gün bile akıtmadı. Frontinus’un rakamlarının doğruluğunu da göstermez; quinaria bir kesit ölçüsü olduğu için verdiği debi değerleri modern birimlere güvenle çevrilemez.","This case shows that maintenance can die independently of the other five links, and that when it does everything else becomes useless; the Kırkçeşme system, built partly on Roman lines, shows that the same knowledge can be handed from one civilisation to another. But the case does not show that a written manual can substitute for an institution — it shows the opposite: Frontinus’s text was in hand for fourteen centuries and never made a single Roman fountain run. Nor does it show that his numbers are accurate; because the quinaria measures a cross-section, his discharge figures cannot be converted to modern units with confidence."],"sources":[{"t":["Frontinus, De aquaeductu, Kitap II (Bennett çevirisi, LacusCurtius)","Frontinus, De aquaeductu, Book II (Bennett translation, LacusCurtius)"],"m":["Kadro sayılarını (240 kamu, 460 imparatorluk familia’sı), görev adlarını ve boru delme yoluyla su hırsızlığını birinci elden verir.","Gives at first hand the staff numbers (240 public, 460 imperial familia), the job titles, and water theft by pipe-puncturing."],"u":"https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/De_Aquis/Bennett/2*.html"},{"t":["R. H. Rodgers, Frontinus: De Aquaeductu Urbis Romae (Cambridge)","R. H. Rodgers, Frontinus: De Aquaeductu Urbis Romae (Cambridge)"],"m":["Frontinus’un 97’de göreve geldiğini ve metni bir idarî başvuru elkitabı olarak tasarladığını hakemli edisyonla doğrular.","Confirms in a peer-reviewed edition that Frontinus took office in 97 and designed the text as an administrative reference handbook."],"u":"https://assets.cambridge.org/97805218/32519/excerpt/9780521832519_excerpt.htm"},{"t":["romanaqueducts.info, Roma su kemerlerinin sonrası ve Aqua Virgo dosyası","romanaqueducts.info, on the aftermath of Rome’s aqueducts and the Aqua Virgo"],"m":["537 kesintisini, ortaçağ boyunca yalnız Virgo’nun akmaya devam ettiğini ve nüfusun çöküşünü belgeler.","Documents the cutting of 537, the fact that only the Virgo kept flowing through the Middle Ages, and the population collapse."],"u":"http://www.romanaqueducts.info/aquasite/romavirgo/"},{"t":["Museum With No Frontiers ve The Byzantine Legacy, Kırkçeşme ve Valens dosyaları","Museum With No Frontiers and The Byzantine Legacy on Kırkçeşme and Valens"],"m":["Kırkçeşme’nin 1554–1563 tarihlerini, 55 kilometrelik uzunluğunu, 33 kemerini ve Bizans hatları üzerine kurulduğunu verir.","Gives Kırkçeşme’s 1554–1563 dates, its 55 km length, its 33 aqueducts, and its partial construction on Byzantine lines."],"u":"https://islamicart.museumwnf.org/database_item.php?id=monument%3BISL%3Btr%3BMon01%3B34%3Ben"}],"ev":{"year":98,"start":97,"end":98,"type":"direct","conf":"high","region":["Roma kenti ve çevresindeki dokuz su kemeri hattı","The city of Rome and its nine aqueduct lines"],"role":["Roma’da bir kamu hizmetinin işletmesine dair elimizdeki en ayrıntılı idarî belge; kadroyu, ölçüyü ve suistimali sayılarla verir","The most detailed administrative document we have on the running of a Roman public utility, giving staffing, measurement and abuse in numbers"],"shows":["Romalıların bakımı bir erdem olarak değil, sayılabilir bir kadro ve ölçü rejimi olarak kavradığını doğrudan gösterir.","It shows directly that the Romans conceived maintenance not as a virtue but as a countable regime of staffing and measurement."],"limits":["Metin tek bir ortaçağ nüshasından gelir ve sayıları yer yer bozuktur; ayrıca Frontinus kendi yönetimini savunan taraflı bir tanıktır.","The text descends from a single medieval copy whose figures are corrupt in places, and Frontinus is a partisan witness defending his own administration."],"source":["Frontinus, De aquaeductu; R. H. Rodgers’ın Cambridge edisyonu ve LacusCurtius yazma dosyası","Frontinus, De aquaeductu; R. H. Rodgers’s Cambridge edition and the LacusCurtius manuscript file"],"url":"https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/manuscripts*.html"}},{"id":"latin-alphabet","cat":"threshold","civ":"roman","icon":"🔤","name":["Latin alfabesi","The Latin Alphabet"],"era":["MÖ 7. yüzyıl – bugün","7th century BCE – present"],"hook":["Yirmi üç işaret, iki bin yedi yüz yıl boyunca hiç tam kopmadan kopyalandı ve bugün dünya nüfusunun yaklaşık yüzde yetmişinin kullandığı çözücü oldu. Ama bir alfabe kendi anahtarını taşımaz: harfleri tanımak, ne dediğini bilmek değildir.","Twenty-three signs, copied for two thousand seven hundred years without ever fully breaking, are now the decoder used by roughly seventy per cent of the world’s population. But an alphabet carries no key to itself: knowing the letters is not knowing what they say."],"timeline":[{"y":-700,"t":["Latinler alfabeyi Etrüsklerden aldı; Etrüsklerin yirmi altı işaretinden Latince için yalnız yirmi biri tutuldu, üç Yunan nefesli harfi atıldı.","The Latins take the alphabet from the Etruscans; of twenty-six Etruscan signs only twenty-one are kept for Latin, the three Greek aspirates being dropped."],"link":"packet","src":"https://www.britannica.com/topic/alphabet-writing/Later-development-of-the-Latin-alphabet"},{"y":-560,"t":["Roma Forumu’ndaki Lapis Niger cippusu: bilinen en eski Latince yazıtlardan biri, boustrophedon dizilmiş, MÖ 570–550 dolayına tarihleniyor.","The Lapis Niger cippus in the Roman Forum: one of the oldest known Latin inscriptions, written boustrophedon, dated to about 570–550 BCE."],"link":"packet","src":"https://en.wikipedia.org/wiki/Lapis_Niger"},{"y":-250,"t":["C’den türetilen G eklendi ve düşen zeta’nın yeri dolduruldu; alfabe artık ödünç alınmış değil, Latinceye ayarlanmış bir çözücüydü.","G, derived from C, is added and fills the place of the dropped zeta; the alphabet is now not a borrowing but a decoder tuned to Latin."],"link":"decoder","src":"https://www.britannica.com/topic/alphabet-writing/Later-development-of-the-Latin-alphabet"},{"y":-50,"t":["Yunanca alıntıları yazmak için Y ve Z alındı; klasik alfabe yirmi üç harfe ulaştı. J, U ve W ancak ortaçağda ayrı harfler oldu.","Y and Z are adopted to transliterate Greek loanwords, bringing the classical alphabet to twenty-three letters; J, U and W separate only in the Middle Ages."],"link":"decoder","src":"https://www.britannica.com/topic/alphabet-writing/Later-development-of-the-Latin-alphabet"},{"y":800,"t":["Karolenj minüskülü: Corbie ve Tours’da geliştirilen, kelime aralığı ve noktalama getiren tek tip okunaklı yazı bölgesel elleri tasfiye etti.","Carolingian minuscule: a single legible hand developed at Corbie and Tours, introducing word spacing and punctuation, displaces the regional hands."],"link":"maintenance","src":"https://www.britannica.com/art/Carolingian-minuscule"},{"y":1450,"t":["İtalyan hümanistleri Karolenj yazmalarını antik Roma işi sandı ve taklit etti; bu yanlış, bugünkü roman harf karakterlerinin doğrudan atası oldu.","Italian humanists mistake Carolingian manuscripts for ancient Roman work and imitate them; the error becomes the direct ancestor of modern roman type."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/Carolingian_minuscule"},{"y":1928,"t":["1 Kasım 1928 tarihli 1353 sayılı kanunla Türkiye yirmi dokuz harfli Latin alfabesine geçti; okuryazar bir kuşak bir gecede yeniden öğrenci oldu.","By Law No. 1353 of 1 November 1928 Turkey adopts a twenty-nine-letter Latin alphabet; a literate generation becomes students again overnight."],"link":"decoder","src":"https://en.wikipedia.org/wiki/Turkish_alphabet_reform"},{"y":1989,"t":["ISO/IEC 8859-9 (Latin-5) yayımlandı: ğ, İ, ı ve ş, İzlandaca harflerin boşalttığı yerlere yerleşerek sayısal alfabeye girdi.","ISO/IEC 8859-9 (Latin-5) is published: ğ, İ, ı and ş enter the digital alphabet in the slots vacated by Icelandic letters."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/ISO/IEC_8859-9"}],"links":{"packet":["Harf biçimlerinin kendisi: klasik dönemde yirmi üç, bugün yirmi altı temel işaret ve üzerlerine binen aksan dizgesi. Bu paket taşa, mum tablete, papirüse, parşömene, kâğıda, kurşun harfe, fosfora ve sonunda bir kod noktasına yazıldı ve her taşınmada biçimini korudu.","The letterforms themselves: twenty-three signs in the classical period, twenty-six basic ones today plus the diacritics layered on them. This packet has been written on stone, wax, papyrus, parchment, paper, cast lead, phosphor, and finally a code point, and kept its shape at every transfer."],"decoder":["Okumayı öğrenmiş insanlar ve her dilin kendi imlâ sözleşmesi. Yirminci yüzyılda buna ikinci bir çözücü katmanı eklendi: karakter kodlama standartları. Bir metnin bugün okunabilmesi, hem okurun imlâyı hem de makinenin kodlamayı doğru çözmesine bağlı.","People who have learned to read, and each language’s own orthographic convention. In the twentieth century a second decoder layer was added: character encoding standards. A text is readable today only if both the reader resolves the orthography and the machine resolves the encoding."],"context":["Bir harfin neden o sesi karşıladığı ve nerede karşılamadığı. Bu bilgi alfabenin içinde yazılı değildir; her dil kendi anahtarını ayrıca kurar ve bu anahtar öğretilmezse aynı işaretler sessiz kalır.","Why a letter stands for a given sound, and where it does not. This information is not written inside the alphabet; each language builds its own key separately, and if the key is not taught the same signs stay mute."],"tacit":["El yazısı ve harf kesme. Bir kalemin açısını tutmak, bir harfin omzunu doğru yuvarlamak, bir yazı karakterini optik olarak dengelemek — hepsi ancak yaparak öğrenilir. Türkçenin İ ve ı çiftini bir yazı karakterinde ikna edici biçimde çözmek de bugün aynı türden bir el işidir.","Handwriting and letter-cutting. Holding a pen at its angle, rounding a letter’s shoulder correctly, balancing a typeface optically — all learned only by doing. Resolving Turkish’s İ and ı pair convincingly in a typeface is the same kind of hand work today."],"apparatus":["Kalem, keski, kamış, tüy, hareketli harf, daktilo, dizgi makinesi, font dosyası, kodlama tablosu. Bu zincirin en kırılgan halkası şu anda sonuncusudur: yanlış kodlanmış bir Türkçe metin bozuk karakterlere dönüşür ve paket okunamaz hâle gelir — harfler yerinde dururken.","Chisel, reed, quill, movable type, typewriter, phototypesetter, font file, encoding table. The most fragile link of this chain is currently the last: a Turkish text in the wrong encoding turns to broken characters and the packet becomes unreadable — while the letters themselves are still there."],"maintenance":["Her kuşağa yazmayı öğreten okul. Scriptorium’un yerini önce matbaa, sonra standart komiteleri aldı; ama işin özü değişmedi. 1928’de Türkiye bu emeği tek bir kuşağa sıkıştırmak zorunda kaldı ve bunun için Millet Mektepleri’ni kurdu.","The school that teaches each generation to write. The scriptorium was replaced first by the press and then by standards committees, but the substance of the work did not change. In 1928 Turkey had to compress that labour into a single generation, and founded the Nation’s Schools to do it."]},"weakest":{"k":"context","why":["Alfabe kusursuz seyahat eder, ses değerleri etmez. Aynı işaretler Latincede, İngilizcede, Lehçede ve Türkçede farklı sesleri kodlar; c, j, y ve ğ bunun en açık örnekleridir. Bir alfabe, kendi kullanım kılavuzunu taşımayan bir çözücüdür: harfleri tanımak bir metni okuyabilmek demek değildir. 1928’de Türkiye’nin yalnızca harfleri almakla yetinemeyip yirmi dokuz harflik yeni bir anahtarı sıfırdan kurmak zorunda kalmasının sebebi tam olarak budur. Sayısal katmanda aynı boşluk kendini yeniden gösteriyor: İ ve ı ayrımı, yazılımın hangi dil bağlamında çalıştığını bilmesini gerektirir ve bilmediğinde harfleri sessizce yanlış çevirir.","The alphabet travels perfectly; its sound values do not. The same signs encode different phonemes in Latin, English, Polish and Turkish — c, j, y and ğ are the clearest cases. An alphabet is a decoder that carries no manual for itself: recognising the letters is not being able to read the text. This is exactly why Turkey in 1928 could not simply take the letters but had to build a new twenty-nine-letter key from scratch. The same gap reappears in the digital layer: the İ/ı distinction requires software to know which language context it is running in, and when it does not, it silently converts the letters wrongly."]},"nearBreak":["Alfabenin en kritik anı sekizinci yüzyıldı. Roma’nın çöküşünden sonra Latin kitap yazısı bölgesel ellere ayrılmıştı — Merovenj kursifi, İnsular, Beneventan, Vizigot — ve bir bölgede yazılan metin başka bir bölgede güçlükle okunuyordu. Paket duruyordu ama çözücü parçalanıyordu. Corbie ve Tours’da geliştirilen, Charlemagne’ın eğitim reformuyla yayılan Karolenj minüskülü kelime aralığı ve noktalama getirerek tek bir okunaklı standart dayattı ve kopmayı önledi. İkinci bir kritik an 1928’dir; bu kez kopma bilinçli olarak seçildi ve yeni çözücünün maliyeti okuryazarlığın sıfırdan yeniden kurulması oldu.","The alphabet’s most critical moment was the eighth century. After the collapse of Rome, Latin book hands had split into regional scripts — Merovingian cursive, Insular, Beneventan, Visigothic — and a text written in one region was hard to read in another. The packet was intact but the decoder was fragmenting. Carolingian minuscule, developed at Corbie and Tours and spread by Charlemagne’s educational reforms, imposed a single legible standard with word spacing and punctuation, and prevented the break. A second critical moment is 1928, when the break was chosen deliberately and the cost of the new decoder was the rebuilding of literacy from zero."],"thesis":["Latin alfabesi, altı halkanın hepsinin aynı anda küresel ölçekte yedeklendiği tek vakadır: paket milyarlarca kopyada, çözücü her okulda, bakım her kuşakta tekrarlanır. Bir çözücünün gücü, içeriğinden bağımsız olarak yalnızca ne kadar çok kopyalandığından gelir. Ama bu vaka bir yazının hayatta kalmasının onunla yazılmış paketlerin de hayatta kalacağını göstermez — hatta tersini ima eder: bir çözücü değiştiğinde eski çözücüyle yazılmış arşiv yerinde durmaya devam eder ama okurunu kaybeder. Ayrıca yüzde yetmiş gibi bir yaygınlık rakamı nüfus tahminine dayanır ve kesin bir ölçüm değildir.","The Latin alphabet is the one case in which all six links are simultaneously backed up on a global scale: the packet in billions of copies, the decoder in every school, the maintenance repeated in every generation. A decoder’s strength comes, independently of its content, only from how many times it has been copied. But the case does not show that a script’s survival guarantees the survival of the packets written in it — it implies the opposite: when a decoder changes, the archive written in the old one stays physically where it is and loses its readers. And a reach figure such as seventy per cent rests on population estimates, not on an exact measurement."],"sources":[{"t":["Britannica, “Alphabet: later development of the Latin alphabet”","Britannica, “Alphabet: Later development of the Latin alphabet”"],"m":["Etrüsk kökenini, yirmi bir harflik ilk kadroyu, G’nin eklenmesini ve Y ile Z’nin MÖ 1. yüzyılda alınmasını verir.","Gives the Etruscan origin, the initial twenty-one-letter set, the addition of G, and the adoption of Y and Z in the 1st century BCE."],"u":"https://www.britannica.com/topic/alphabet-writing/Later-development-of-the-Latin-alphabet"},{"t":["Britannica, “Carolingian minuscule” ve Karolenj yazısı üzerine ansiklopedi maddeleri","Britannica, “Carolingian minuscule”, with encyclopedic accounts of the script"],"m":["Alcuin, Tours ve Corbie bağlantısını, kelime aralığı gibi yenilikleri ve on beşinci yüzyıl hümanist canlanmasını belgeler.","Documents the Alcuin, Tours and Corbie connection, innovations such as word spacing, and the fifteenth-century humanist revival."],"u":"https://www.britannica.com/art/Carolingian-minuscule"},{"t":["Britannica, dünyanın en yaygın beş yazı sistemi listesi","Britannica, list of the world’s five most commonly used writing systems"],"m":["Latin alfabesinin dünya nüfusunun yaklaşık yüzde yetmişi tarafından kullanıldığı tahminini kaynaklandırır.","Sources the estimate that the Latin alphabet is used by nearly seventy per cent of the world’s population."],"u":"https://www.britannica.com/list/the-worlds-5-most-commonly-used-writing-systems"},{"t":["1928 Harf Devrimi (1353 sayılı kanun) ve ISO/IEC 8859-9 standardı","The 1928 alphabet reform (Law No. 1353) and the ISO/IEC 8859-9 standard"],"m":["Türkçenin çözücü devrini ve altmış bir yıl sonra aynı harflerin sayısal katmana kabul edilişini tarihlendirir.","Dates Turkish’s decoder handover and, sixty-one years later, the admission of the same letters into the digital layer."],"u":"https://en.wikipedia.org/wiki/ISO/IEC_8859-9"}],"ev":{"year":-560,"start":-570,"end":-550,"type":"direct","conf":"medium","region":["Roma Forumu, Lapis Niger alanı; 1899’da Giacomo Boni tarafından yerinde bulundu","The Roman Forum, the Lapis Niger precinct; found in situ by Giacomo Boni in 1899"],"role":["Latin alfabesinin erken kullanımının yerinde bulunmuş, sağlam bağlamlı en eski tanıklarından biri: boustrophedon yazılmış bir cippus","One of the oldest securely contextualised in-situ witnesses to early use of the Latin alphabet: a cippus inscribed boustrophedon"],"shows":["Alfabenin Roma’ya, henüz yazı yönü bile sabitlenmemişken, MÖ altıncı yüzyılın ortasında ulaşmış olduğunu gösterir.","It shows that the alphabet had reached Rome by the middle of the sixth century BCE, while even the direction of writing was not yet fixed."],"limits":["Yazıt kırıktır ve okunuşu tartışmalıdır; tarihi belgeye değil tabakalanmaya ve harf biçimlerine dayanır.","The inscription is broken and its reading is disputed, and its date rests on stratigraphy and letterforms rather than on any document."],"source":["Lapis Niger yazıtı üzerine arkeolojik ve epigrafik literatür; karşılaştırma için Praeneste fibulası tartışması","Archaeological and epigraphic literature on the Lapis Niger inscription, with the Praeneste fibula debate for comparison"],"url":"https://en.wikipedia.org/wiki/Lapis_Niger"}},{"id":"glassblowing","cat":"threshold","civ":"roman","icon":"🫧","name":["Cam üfleme","Glassblowing"],"era":["MÖ y. 50 – günümüz","c. 50 BCE – present"],"hook":["Bir borunun ucundaki nefes, camı lüks eşyadan mutfak kabına çevirdi. Zincirin yazıya en az dökülebilen halkası olan el bilgisi iki bin yıldır hiç kopmadı; kopan hep başka bir şey oldu.","Breath at the end of a pipe turned glass from a luxury into kitchenware. The least writable link in the chain, hand skill, has not broken in two thousand years; what broke was always something else."],"timeline":[{"y":-50,"t":["Kudüs Yahudi Mahallesi’ndeki atölye molozunda bir ucu şişirilmiş mavi cam borular: üflemenin yakın tarihlenebilen en erken kanıtı (MÖ y. 50–40).","Blue glass tubes with one end inflated, in workshop refuse from the Jewish Quarter of Jerusalem: the earliest closely datable evidence of blowing (c. 50–40 BCE)."],"link":"tacit","src":"https://renvenetian.cmog.org/chapter/earliest-inflated-glass"},{"y":25,"t":["Sidonlu Ennion kalıba üflediği kapları Yunanca imzalar. Roma cam ustalarının bıraktığı yazılı izin neredeyse tamamı bu tür imzalardan ibarettir.","Ennion of Sidon signs his mould-blown vessels in Greek. Signatures like these are very nearly the whole written trace Roman glassblowers left behind."],"link":"packet","src":"https://www.metmuseum.org/met-publications/ennion-master-of-roman-glass"},{"y":79,"t":["Vezüv’ün mühürlediği katmanlarda cam buluntuların %70–95’i üflemedir; teknik bir kuşakta Batı eyaletlerine yayılmış, cam gündelik kap hâline gelmiştir.","In deposits sealed by Vesuvius, 70–95% of the glass is blown; within a generation the technique had reached the western provinces and glass had become everyday ware."],"link":"apparatus","src":"https://www.cambridge.org/core/journals/journal-of-roman-archaeology/article/abs/cheap-fast-good-the-roman-glassblowing-revolution-reconsidered/4118C6A250083B0331819FA8287BD64C"},{"y":673,"t":["Benedict Biscop, Wearmouth manastırının camları için Galya’dan usta getirtir: Britanya’da zanaat, Roma’nın çekilmesinden sonra fiilen durmuştur.","Benedict Biscop brings glaziers from Gaul for his monastery at Wearmouth: in Britain the craft had effectively stopped after Rome withdrew."],"link":"maintenance","src":"https://the-past.com/feature/glass-roots-examining-the-archaeology-of-glassmaking-in-england/"},{"y":800,"t":["Mısır natronunun arzı tükenince Yakın Doğu ve Avrupa bitki külüne geçer: reçete ve fırın değişir, borunun ucundaki el hareketi değişmez.","As the supply of Egyptian natron ran out, the Near East and Europe switched to plant ash: the recipe and the furnace changed, the hand at the end of the pipe did not."],"link":"apparatus","src":"https://discovery.ucl.ac.uk/id/eprint/1519741/"},{"y":1962,"t":["Toledo’da Mart ve Haziran’da iki atölye: Harvey Littleton ile Dominick Labino küçük bir fırınla camı fabrikadan çıkarıp stüdyoya taşır.","Two workshops at Toledo, in March and June: Harvey Littleton and Dominick Labino use a small furnace to take glass out of the factory and into the studio."],"link":"decoder","src":"https://blog.cmog.org/2013/harvey-k-littleton-american-1922-2013"},{"y":2023,"t":["UNESCO, altı ülkenin ortak dosyasıyla “el yapımı cam üretimi bilgisi, zanaatı ve becerileri”ni Temsilî Liste’ye alır.","UNESCO inscribes “knowledge, craft and skills of handmade glass production”, submitted jointly by six countries, on the Representative List."],"link":"maintenance","src":"https://ich.unesco.org/en/RL/knowledge-craft-and-skills-of-handmade-glass-production-01961"},{"y":2024,"t":["Corning, William Gudenrath’ın Roma dönemi üfleme işlemlerini 53 videoyla yeniden kurduğu dijital yayını çıkarır: kayıp usul deneyle geri türetilir.","Corning publishes William Gudenrath’s digital reconstruction of Roman-period blowing procedures in 53 videos: lost method re-derived by experiment."],"link":"context","src":"https://glassmaking.cmog.org/techniques-roman-period-glassblowing-2024"}],"links":{"packet":["Paket, nesnenin kendisidir. Roma cam ustaları tarif bırakmadı; elimizdeki kayıt kaplar, atölye molozu, boru artıkları, hatalı üflenmiş parçalar ve Ennion gibi birkaç imzadan ibarettir. Metin yok, ürün var.","The packet is the object itself. Roman glassblowers left no instructions; the record is vessels, workshop debris, moils, misblown wasters and a handful of signatures such as Ennion’s. No text, only product."],"decoder":["Paketi okuyabilenler iki ayrı topluluktur: bugün hâlâ tezgâh başında çalışan üfleyiciler ve nesneyi kimyasal olarak sorgulayan arkeometristler. Birincisi hareketi, ikincisi hammaddeyi çözer; ikisi olmadan cam kap sadece kaptır.","Two separate populations can read the packet: glassblowers still working at the bench, and archaeometrists who interrogate the object chemically. The first recovers the gesture, the second the raw material; without both, a glass vessel is only a vessel."],"context":["Neden işlediğinin bilgisi: camın işlenebilir viskozite aralığı dardır, tavlama zorunludur, ısı hızla kaçar. Hata tarihi ise moloz yığınındadır — çatlamış, çökmüş, kopmuş parçalar ustanın nerede sınıra dayandığını kaydeder.","Why it works: glass has a narrow workable viscosity window, annealing is compulsory, heat is lost fast. The error history lies in the spoil heap — cracked, collapsed and sheared-off pieces record exactly where the maker met the limit."],"tacit":["Zincirin en güçlü halkası burada. Alma, çevirme, nefesin basıncı ile yerçekiminin zamanlaması yazıya geçmez; tezgâh başında, usta yanında öğrenilir. Bu aktarım MÖ 1. yüzyıldan bu yana hiçbir yerde tümüyle kesilmedi.","This is the chain’s strongest link. The gather, the turn, the timing of breath against gravity are not writable; they are learned at the bench, beside a master. That transmission has nowhere been wholly severed since the 1st century BCE."],"apparatus":["Üfleme borusu, fırın, mermer levha, punta ve maşa; arkalarında hiç sönmeyen bir ocak, yakıt ve ham cam tedariki. Roma düzeninde ham cam Levant ve Mısır’daki dev tank fırınlarında dökülür, biçimlendirme ise imparatorluğa dağılmış ikincil atölyelerde yapılırdı.","Blowpipe, furnace, marver, pontil and jacks; behind them a fire that never goes out, fuel, and a supply of raw glass. In the Roman system raw glass was melted in huge tank furnaces in the Levant and Egypt and shaped in secondary workshops scattered across the empire."],"maintenance":["Çıraklık, tekrar tekrar. Beceri ancak her kuşakta yeniden öğretilirse yaşar; fırın söndüğünde ise öğretecek yer de kalmaz. UNESCO’nun 2023 kaydı, tam da bu tekrarlayan emeğin bugün tehdit altında olduğunu tescil eder.","Apprenticeship, over and over. The skill lives only if it is retaught every generation; when the furnace goes out there is nowhere left to teach it. UNESCO’s 2023 inscription registers precisely that this recurring labour is now under threat."]},"weakest":{"k":"apparatus","why":["El bilgisi hiç kaybolmadı; kaybolan hep donanım ve tedarik oldu. Roma sonrası Britanya’da fırınlar sönünce zanaat durdu; 8.–9. yüzyılda Mısır natronu tükenince bütün Akdeniz reçeteyi değiştirmek zorunda kaldı. Bugün de tehdit unutmak değil, sürekli yanan bir fırının maliyetidir.","The hand skill never lapsed; what lapsed was always equipment and supply. In post-Roman Britain the craft stopped when the furnaces went cold; in the 8th–9th century the whole Mediterranean had to change its recipe when Egyptian natron ran out. Today the threat is not forgetting but the cost of a furnace that never goes out."]},"nearBreak":["Zanaat imparatorluk ölçeğinde hiç kesilmedi, ama yerel olarak defalarca öldü. Britanya’da cam yapımı Roma’nın çekilmesinden sonra fiilen durdu; 673’te Benedict Biscop, Wearmouth için Galya’dan usta getirtmek zorunda kaldı ve beceri Manş’ı birkaç insanın bedeninde geçti. Aynı kırılganlık hammaddede de görüldü: 8. yüzyıl sonunda natron arzı çökünce Filistin’de natron camı üretimi tümüyle durdu ve teknoloji bitki külü üzerine yeniden kurulmak zorunda kaldı.","The craft was never cut at empire scale, but it died locally many times. Glassmaking in Britain effectively stopped after Rome withdrew; in 673 Benedict Biscop had to import craftsmen from Gaul for Wearmouth, and the skill crossed the Channel inside the bodies of a few men. The same fragility showed in the raw material: when the natron supply collapsed at the end of the 8th century, natron glass production in Palestine ceased entirely and the technology had to be rebuilt on plant ash."],"thesis":["Cam üfleme, TACIT halkasının ne kadar dayanıklı olabileceğinin en temiz örneğidir: hiçbir Romalı usta tarif yazmadı, buna rağmen hareket iki bin yıl boyunca bedenden bedene aktarıldı. Ama vaka, sessiz bilginin doğası gereği güvende olduğunu göstermez. Beceri, kesintisiz bir talebi, hiç sönmeyen bir fırını ve bunu ödeyebilen bir ekonomiyi bulduğu için yaşadı; bunlar çekildiğinde Britanya örneğindeki gibi tek kuşakta yok oldu. Dahası hayatta kalan şey “üfleme” genel yeteneğidir: yılan iplikli bezeme, kırılarak düzeltilen ağız kenarı, kafes kadeh gibi Roma’ya özgü işlemler gerçekten kayboldu ve bugün ancak deneysel arkeolojiyle geri türetiliyor. Yani vaka, bir zanaatın sürmesinin o zanaatın tekil çözümlerinin de sürdüğü anlamına gelmediğini gösterir.","Glassblowing is the cleanest case of how durable the TACIT link can be: no Roman master wrote a recipe, and yet the gesture passed body to body for two thousand years. But the case does not show that silent knowledge is inherently safe. The skill survived because it found uninterrupted demand, a furnace that never went out and an economy that could pay for it; where those withdrew, as in Britain, it vanished within a single generation. And what survived is the general capacity to blow: Roman-specific procedures such as snake-thread decoration, cracked-off rims and cage cups genuinely were lost and are now being re-derived only by experiment. The case shows that a craft continuing does not mean its particular solutions continued."],"sources":[{"t":["Corning Cam Müzesi, “The Earliest Inflated Glass”","Corning Museum of Glass, “The Earliest Inflated Glass”"],"m":["Kudüs Yahudi Mahallesi buluntusunun MÖ y. 50–40 tarihini ve tekniğin erken, henüz olgunlaşmamış evresini belgeler.","Documents the c. 50–40 BCE date of the Jewish Quarter find in Jerusalem and the early, not yet mature stage of the technique."],"u":"https://renvenetian.cmog.org/chapter/earliest-inflated-glass"},{"t":["K. A. Larson, “Cheap, fast, good: the Roman glassblowing revolution reconsidered”, JRA 32 (2019), 7–22","K. A. Larson, “Cheap, fast, good: the Roman glassblowing revolution reconsidered”, JRA 32 (2019), 7–22"],"m":["Yayılma hızının nicel dayanağı: kalıba dökülmüş kâseye karşı üflenmiş kapta üretim süresi, Batı eyaletlerinde MS 1. yüzyıl ortasında %70 üfleme oranı, Pompeii’de %70–95.","The quantitative basis for the speed of spread: production time for a sagged bowl against a blown vessel, a 70% blown share in the western provinces by the mid-1st century CE, and 70–95% at Pompeii."],"u":"https://www.cambridge.org/core/journals/journal-of-roman-archaeology/article/abs/cheap-fast-good-the-roman-glassblowing-revolution-reconsidered/4118C6A250083B0331819FA8287BD64C"},{"t":["UNESCO Somut Olmayan Kültürel Miras, unsur no. 01961 (2023)","UNESCO Intangible Cultural Heritage, element no. 01961 (2023)"],"m":["Unsurun tam adını, 2023 kayıt yılını ve dosyayı sunan altı ülkeyi (Çekya, Finlandiya, Fransa, Almanya, Macaristan, İspanya) doğrular.","Confirms the exact element name, the 2023 inscription year, and the six submitting countries (Czechia, Finland, France, Germany, Hungary, Spain)."],"u":"https://ich.unesco.org/en/RL/knowledge-craft-and-skills-of-handmade-glass-production-01961"},{"t":["M. Phelps, I. Freestone, Y. Gorin-Rosen, B. Gratuze, Journal of Archaeological Science (2016)","M. Phelps, I. Freestone, Y. Gorin-Rosen, B. Gratuze, Journal of Archaeological Science (2016)"],"m":["Natron arzının 7.–9. yüzyıllarda gerileyip çöküşünü ve bitki külü teknolojisine geçişi arkeometrik olarak tarihler.","Dates, archaeometrically, the decline and collapse of the natron supply across the 7th–9th centuries and the switch to plant ash technology."],"u":"https://discovery.ucl.ac.uk/id/eprint/1519741/"},{"t":["W. Gudenrath, “The Techniques of Roman-Period Glassblowing” (Corning, 2024)","W. Gudenrath, “The Techniques of Roman-Period Glassblowing” (Corning, 2024)"],"m":["Roma usullerinin yazılı kayıt olmadığı için nesne analizi ve tekrarlı deneyle yeniden kurulduğunu gösterir; 53 video.","Shows that Roman procedures, having no written record, are reconstructed by object analysis and repeated experiment; 53 videos."],"u":"https://glassmaking.cmog.org/techniques-roman-period-glassblowing-2024"},{"t":["Metropolitan Sanat Müzesi, “Roman Glass” (Heilbrunn Sanat Tarihi Kronolojisi)","The Metropolitan Museum of Art, “Roman Glass” (Heilbrunn Timeline of Art History)"],"m":["Tekniğin Suriye-Filistin bölgesinde MÖ 1. yüzyıl başında ortaya çıkışını ve Roma cam sanayiinin bir-iki kuşakta olgunlaşmasını özetler.","Summarises the technique’s appearance in the Syro-Palestinian region in the early 1st century BCE and the maturing of the Roman glass industry within a couple of generations."],"u":"https://www.metmuseum.org/essays/roman-glass"}],"ev":{"year":-50,"start":-60,"end":-40,"type":"direct","conf":"high","region":["Kudüs, Yahudi Mahallesi (Roma İudaea eyaleti)","Jerusalem, Jewish Quarter (Roman province of Judaea)"],"role":["Tekniğin bugün yakın biçimde tarihlenebilen en erken maddi izi.","The earliest closely datable material trace of the technique."],"shows":["Bir atölyenin attığı moloz, MÖ 50–40 arasında birinin cam boruların ucunu üfleyerek şişirdiğini doğrudan kanıtlar.","Refuse thrown out by a workshop proves directly that between 50 and 40 BCE someone was inflating the ends of glass tubes by blowing."],"limits":["Buluntu tekniğin nerede icat edildiğini değil nerede erkenden uygulandığını gösterir; Plinius’un sahilde soda külçeleriyle camın bulunuşunu anlatan hikâyesi ise camın kendisiyle ilgilidir, üflemeyle değil, ve icat kanıtı olarak kullanılamaz.","The find shows where the technique was early in use, not where it was invented; and Pliny’s story of glass being discovered on a beach under blocks of natron concerns glass itself rather than blowing, so it cannot serve as evidence for the invention."],"source":["Corning Cam Müzesi, “The Earliest Inflated Glass”","Corning Museum of Glass, “The Earliest Inflated Glass”"],"url":"https://renvenetian.cmog.org/chapter/earliest-inflated-glass"}},{"id":"codex","cat":"threshold","civ":"roman","icon":"📖","name":["Kodeks","The codex"],"era":["MS y. 1 – y. 400 (biçim göçü)","c. 1st – 4th century CE (the format migration)"],"hook":["Antik edebiyatın hangi kısmının bize ulaştığına yazarlar değil, bir ciltleme kararı karar verdi. Rulodan kodekse geçemeyen metin kötü olduğu için değil, kopyalanmadığı için yok oldu.","Which part of ancient literature reached us was decided not by authors but by a binding decision. A text that failed to cross from roll to codex disappeared not because it was bad but because it was not copied."],"timeline":[{"y":85,"t":["Martialis, Homeros ve Vergilius’un “tek elde tutulan” parşömen kodekslerini kitapçının adresini vererek över; yenilik kendi kuşağında tutmaz.","Martial praises parchment codices of Homer and Vergil that “one hand holds”, naming the bookseller; the novelty does not catch on in his own generation."],"link":"apparatus","src":"https://www.historyofinformation.com/detail.php?id=1577"},{"y":150,"t":["Mısır’dan gelen Hıristiyan dışı edebî metinlerin 1.–2. yüzyıl diliminde yalnızca %1,43’ü kodekstir; kitap demek hâlâ rulo demektir.","In the 1st–2nd century band, only 1.43% of non-Christian literary texts from Egypt are codices; a book still means a roll."],"link":"packet","src":"https://publications.dainst.org/journals/chiron/article/download/369/4977"},{"y":250,"t":["3. yüzyılda oran %18,5’e çıkar. MS 1–400 arasına tarihlenen 172 İncil elyazmasının 161–168’i kodekstir: cemaatler biçimi neredeyse tekelinde kullanır.","By the 3rd century the share is 18.5%. Of 172 biblical manuscripts dated 1–400 CE, between 161 and 168 are codices: the communities use the format almost exclusively."],"link":"decoder","src":"https://publications.dainst.org/journals/chiron/article/download/369/4977"},{"y":331,"t":["Constantinus, başkentin kiliseleri için parşömen üzerine elli İncil kodeksi ısmarlar (Eusebios, Vita Constantini 4.36): biçim artık devlet bütçesiyle çoğaltılır.","Constantine orders fifty Bible codices on parchment for the churches of the capital (Eusebius, Vita Constantini 4.36): the format is now copied on a state budget."],"link":"maintenance","src":"https://en.wikipedia.org/wiki/Fifty_Bibles_of_Constantine"},{"y":350,"t":["4. yüzyıl diliminde kodeksler %62,34’e ulaşır. Eşik burada aşılır: bir metnin geleceği artık onu yeni biçime geçirmeye karar veren kişiye bağlıdır.","In the 4th-century band codices reach 62.34%. The threshold is crossed here: a text’s future now depends on whoever decides to transfer it into the new form."],"link":"packet","src":"https://publications.dainst.org/journals/chiron/article/download/369/4977"},{"y":400,"t":["5. yüzyılda oran %89’dur; y. 400’de kitapların yaklaşık %80’i kodekstir. Rulo hâlinde kalan metin okunmaz, okunmayan metin de kopyalanmaz.","In the 5th century the share is 89%; by c. 400 about 80% of books are codices. A text left on a roll is not read, and a text not read is not recopied."],"link":"context","src":"https://kiwihellenist.blogspot.com/2020/06/who-preserved-greek-literature-2.html"},{"y":850,"t":["Yunanca için ikinci elek: majüskülden minüsküle geçilir. Aktarım eski bitişik yazıyı hâlâ sökebilen bir el ister; eski uncial nüshaların pek azı korunur.","A second sieve for Greek: majuscule gives way to minuscule. Transfer needs a hand that can still read the old continuous script; few older uncial copies are kept."],"link":"tacit","src":"https://en.wikipedia.org/wiki/Greek_minuscule"},{"y":1897,"t":["Grenfell ve Hunt Oksirinkhos çöplüklerini kazmaya başlar. Rulo–kodeks istatistiği buradan çıkar: elimizdeki örneklem kütüphanelerin değil, atılanların örneklemidir.","Grenfell and Hunt begin digging the rubbish mounds of Oxyrhynchus. The roll-versus-codex statistics come from here: our sample is of what was discarded, not of libraries."],"link":"decoder","src":"https://oxyrhynchus.web.ox.ac.uk/introduction"}],"links":{"packet":["Paket metnin kendisidir; ama taşıyıcı değişince paketin kapasitesi de değişir. Kodeks yaprağın iki yüzünü de kullanır, tek ciltte bir rulodan çok daha fazla metin taşır ve baştan sona sarılmadan istenen yerinden açılır — antikçağın rastgele erişimi budur.","The packet is the text; but when the carrier changes, so does what the packet can hold. A codex uses both faces of the leaf, carries far more text in one binding than a roll, and opens at any point without being wound through — this is antiquity’s random access."],"decoder":["Antikçağda kodeksi çoğaltan skriptoryum; bugün onu okuyan papirolog ve paleograf. Oksirinkhos istatistiklerini üreten de bu ikinci topluluktur: 1897’de başlayan ve hâlâ bitmemiş bir okuma emeği, seksen sekiz ciltten fazlası.","In antiquity the scriptorium that copied the codex; today the papyrologist and palaeographer who read it. The Oxyrhynchus statistics are the product of this second community: a reading labour begun in 1897, still unfinished, running past eighty-eight volumes."],"context":["Kodeksin kazanma nedeni tek bir üstünlük değil, üst üste binen küçük avantajlardır: rastgele erişim, hacim, taşınabilirlik, malzemenin iki yüzünün kullanılması, dayanıklılık. Sınır ise kanıt tabanındadır — bildiğimiz hemen her şey Mısır’ın kuru kumundan gelir.","The codex won not by one superiority but by small advantages stacked on one another: random access, capacity, portability, both faces of the material used, durability. The limit lies in the evidence base — nearly everything we know comes out of Egypt’s dry sand."],"tacit":["Kodeks yapmak ayrı bir el işidir: derinin traşlanıp gerilmesi, forma katlaması, satır cetveli, dikiş. Aktarımın öbür ucunda ise eski yazıyı sökebilme becerisi durur; 9. yüzyıl Bizans’ında bu beceri seyreldikçe aktarılamayan metin de arttı.","Making a codex is its own handwork: scraping and stretching skin, folding quires, ruling lines, sewing. At the other end of transmission sits the skill of deciphering an old hand; as that thinned in 9th-century Byzantium, the untransferred texts multiplied."],"apparatus":["Kodeks yeni bir makine istemedi — kazanmasının asıl nedeni budur. Papirüs de parşömen de aynı biçime uyar; Mısır’daki erken Hıristiyan kodekslerinin çoğu hâlâ papirüstür (Oksirinkhos’ta 126 papirüse karşı 38 parşömen). Parşömenin üstünlüğü sonradan ve önce lüks nüshalarda gelir.","The codex required no new machine — that is the main reason it won. Papyrus and parchment both take the form; most early Christian codices in Egypt are still papyrus (126 papyrus against 38 parchment at Oxyrhynchus). Parchment’s dominance comes later, and first in deluxe copies."],"maintenance":["Her metnin birkaç yüzyılda bir yeniden kopyalanması gerekir; kopyalama emeği sonlu olduğu için her turda bir seçim yapılır. Kaybı yaratan yangın değil, dört yüzyıl boyunca tekrarlanan bu sessiz seçimdir.","Every text must be recopied every few centuries; because copying labour is finite, each round involves a selection. What produced the losses was not fire but this silent selection, repeated across four centuries."]},"weakest":{"k":"maintenance","why":["Kodeks biçim olarak her şeyi taşıyabilirdi; hiçbir metin teknik bir uyumsuzluk yüzünden dışarıda kalmadı. Dışarıda bırakan şey, dört yüzyıl boyunca “bunu yeniden yazmaya değer mi” sorusuna verilen tekrarlayan cevaptı. Livius’un 142 kitabından 35’i kaldı; okul müfredatına, ilgiye ve parşömenin fiyatına giremeyen düştü.","As a format the codex could carry anything; no text was excluded by technical incompatibility. What excluded texts was the repeated answer, over four centuries, to the question “is this worth writing out again”. Of Livy’s 142 books, 35 remain; whatever could not get into a curriculum, an interest or a parchment budget fell out."]},"nearBreak":["Menandros bu eleğin ölçüsüdür. Antikçağın en çok okunan komedya yazarlarından biriydi, yüz sekiz komedya yazdı ve kodeks çağını geçemedi; Ortaçağ boyunca eserleri yalnızca alıntılardan, toplam bin altı yüz elli kadar dizeden biliniyordu. Metinlerin gövdesi ancak 20. yüzyılda Mısır’ın çöplüklerinden — 1907 Kahire kodeksi, 1959 Bodmer papirüsü — geri döndü; yani göç edemediği eski taşıyıcının içinde saklanmıştı.","Menander is the measure of this sieve. One of antiquity’s most read comic poets, he wrote 108 comedies and did not cross into the codex age; through the Middle Ages his work was known only from quotations, some 1,650 lines in all. The body of the text returned only in the 20th century, out of Egyptian rubbish — the Cairo codex of 1907, the Bodmer papyrus of 1959 — that is, preserved inside the very carrier he had failed to migrate off."],"thesis":["Kodeks, biçim göçünün hayatta kalmaya karar verdiği en iyi dijital öncesi vakadır: MS 2. yüzyıl ortasında kitapların yaklaşık %1,4’ü kodeksti, MS 400’de yaklaşık %80’i; bu iki yüzyıl arasında hangi metnin yeni biçime taşınacağına karar veren birkaç kuşak kopyacı, bugün elimizde olan antik edebiyatın sınırını çizdi. Ama vaka şunu göstermez: hiçbir eser için “kodekse geçirilmediği için öldü” tek tek kanıtlanamaz. Kayıp, biçim değişimiyle aynı yüzyıllarda ilgi kaymasının, okul müfredatının daralmasının, dil değişiminin ve sıradan yıpranmanın da işlediği bir dönemde gerçekleşti. Biçim bu güçlerden yalnızca biridir — yalnız şu farkla ki, her kitaba, her yerde, aynı anda dokunan tek güç odur.","The codex is the best pre-digital case of a format migration deciding survival: about 1.4% of books were codices in the mid-2nd century and roughly 80% by 400, and the few generations of copyists who chose what to carry across drew the boundary of the ancient literature we now hold. But the case does not show this: for no individual work can it be proved that it died because it was not transferred. The losses fall in the same centuries as shifting taste, a narrowing school curriculum, language change and plain attrition. Format is only one of these forces — distinguished only in that it is the one that touched every book, everywhere, at the same time."],"sources":[{"t":["E. A. Meyer, “Roman Tabulae, Egyptian Christians, and the Adoption of the Codex”, Chiron 37 (2007), 295–348","E. A. Meyer, “Roman Tabulae, Egyptian Christians, and the Adoption of the Codex”, Chiron 37 (2007), 295–348"],"m":["Roberts ve Skeat’in yüzyıl bazlı kodeks oranlarını (%1,43 / %18,5 / %62,34 / %89) ve Hıristiyan elyazması sayılarını hakemli bir çerçevede aktarır.","Reports Roberts and Skeat’s century-by-century codex shares (1.43% / 18.5% / 62.34% / 89%) and the Christian manuscript counts within a peer-reviewed frame."],"u":"https://publications.dainst.org/journals/chiron/article/download/369/4977"},{"t":["C. H. Roberts ve T. C. Skeat, “The Birth of the Codex” (British Academy / OUP, 1983)","C. H. Roberts and T. C. Skeat, “The Birth of the Codex” (British Academy / OUP, 1983)"],"m":["Alanın temel istatistiksel çalışması; yazarların kendileri, Mısır kökenli örneklemin antik dünyaya genellenemeyeceği uyarısını yapar.","The field’s foundational statistical study; the authors themselves warn that a sample of Egyptian origin cannot be generalised to the ancient world."],"u":"https://global.oup.com/academic/product/the-birth-of-the-codex-9780197260616"},{"t":["A. Luijendijk ve B. Nongbri, “The Codicology of Early Christian Books from Oxyrhynchus”, ISAW Papers 29.3 (2025)","A. Luijendijk and B. Nongbri, “The Codicology of Early Christian Books from Oxyrhynchus”, ISAW Papers 29.3 (2025)"],"m":["Oksirinkhos kodekslerinin malzeme dağılımını verir: Hıristiyan kodekslerinde 126 papirüse karşı 38 parşömen; 4. yüzyıla kadarki 857 kodeksin 283’ü Oksirinkhos kökenlidir.","Gives the material breakdown of Oxyrhynchus codices: 126 papyrus against 38 parchment among Christian codices; of 857 codices down to the 4th century, 283 are of Oxyrhynchus provenance."],"u":"https://dlib.nyu.edu/awdl/isaw/isaw-papers/29-3/"},{"t":["D. C. Barker, “Codex, Roll, and Libraries in Oxyrhynchus”, Tyndale Bulletin 57.1 (2006)","D. C. Barker, “Codex, Roll, and Libraries in Oxyrhynchus”, Tyndale Bulletin 57.1 (2006)"],"m":["2.–3. yüzyıl Oksirinkhos’unda yaklaşık 1.150 edebî papirüs içinde yalnızca 31 Hıristiyan ve 28 Hıristiyan dışı kodeks bulunduğunu sayar.","Counts, among roughly 1,150 literary papyri of 2nd–3rd century Oxyrhynchus, only 31 Christian and 28 non-Christian codices."],"u":"https://www.tyndalebulletin.org/article/29208-codex-roll-and-libraries-in-oxyrhynchus.pdf"},{"t":["Oxyrhynchus Papyri projesi, Oxford Üniversitesi","The Oxyrhynchus Papyri project, University of Oxford"],"m":["Kazının 1896/97’de başladığını, altı sezon sürdüğünü ve yayın dizisinin bugün seksen sekizinci cilde ulaştığını belgeler.","Documents that excavation began in 1896/97, ran for six seasons, and that the publication series has now reached its eighty-eighth volume."],"u":"https://oxyrhynchus.web.ox.ac.uk/introduction"},{"t":["P. Gainsford, “Who preserved Greek literature?” (Kiwi Hellenist, 2020)","P. Gainsford, “Who preserved Greek literature?” (Kiwi Hellenist, 2020)"],"m":["Biçim göçünü kayıpların başlıca eleği olarak konumlandırır ve Casson’a dayanarak y. 100’de %1,5, y. 400’de %80 kodeks oranını verir; hakemli değil, klasik filolog bir akademisyenin blogudur.","Positions the format migration as the principal sieve of the losses and, following Casson, gives a codex share of 1.5% at c. 100 and 80% at c. 400; not peer-reviewed, but the blog of a credentialed classicist."],"u":"https://kiwihellenist.blogspot.com/2020/06/who-preserved-greek-literature-2.html"}],"ev":{"year":300,"start":200,"end":400,"type":"proxy","conf":"high","region":["Oksirinkhos ve genel olarak Mısır (Roma Aegyptus eyaleti)","Oxyrhynchus and Egypt generally (Roman province of Aegyptus)"],"role":["Biçim göçünün hızını ve yönünü ölçen tek nicel kaynak.","The only quantitative source that measures the speed and direction of the format migration."],"shows":["Tarihlenebilen edebî papirüslerde kodeksin payı 1.–2. yüzyılda %1,43 iken 3. yüzyılda %18,5’e ve 4. yüzyılda %62,34’e çıkar; geçiş 3. ve 4. yüzyıllar boyunca tamamlanır.","Among datable literary papyri the codex share rises from 1.43% in the 1st–2nd centuries to 18.5% in the 3rd and 62.34% in the 4th; the transition completes across the 3rd and 4th centuries."],"limits":["Örneklem Mısır’ın kuru ikliminin koruduğu ve büyük ölçüde tek bir taşra kasabasının çöplüğünden çıkan malzemedir; Roberts ile Skeat bu oranların antik dünyanın geneline yansıtılamayacağını kendileri uyarır. “Kodeks Hıristiyanların icadıdır” yollu yaygın iddia da yanlıştır: Martialis biçimi Hıristiyan kullanımından önce tanıtır, Hıristiyanlar onu icat etmedi, benimseyip yaygınlaştırdı.","The sample is material preserved by Egypt’s dry climate and drawn largely from one provincial town’s rubbish; Roberts and Skeat themselves warn that these proportions cannot be projected onto the ancient world at large. The common claim that “the codex was a Christian invention” is also wrong: Martial advertises the format before Christian use — Christians did not invent it, they adopted and generalised it."],"source":["E. A. Meyer, Chiron 37 (2007), Roberts ve Skeat’in sayılarını aktararak","E. A. Meyer, Chiron 37 (2007), reporting Roberts and Skeat’s figures"],"url":"https://publications.dainst.org/journals/chiron/article/download/369/4977"}},{"id":"hypocaust","cat":"loss","civ":"roman","icon":"♨️","name":["Hipokaust","The hypocaust"],"era":["MÖ y. 200 – MS y. 400 (Batı); Doğu’da kesintisiz","c. 200 BCE – c. 400 CE in the West; unbroken in the East"],"hook":["Batı Roma çöktüğünde tarif de duvarlar da yerinde duruyordu. Kaybolan bilgi değil, her kış ocağın başında duracak insanı ve odunu ödeyen düzendi — ve o düzen Doğu’da hiç çökmedi.","When the western empire fell, both the specification and the walls were still standing. What was lost was not knowledge but the order that paid for the wood and for someone to stand at the furnace every winter — and in the East that order never fell."],"timeline":[{"y":-175,"t":["Fregellae hamamında bilinen ilk tam hipokaust; Pompeii’deki Stabia Hamamı örneğinden yaklaşık yarım yüzyıl öncedir. Sistem bir Roma icadı olarak tarihlenemez.","The first full hypocaust known, at the baths of Fregellae, predates the Stabian Baths at Pompeii by about half a century. It cannot be dated as a Roman invention."],"link":"context","src":"https://ajaonline.org/book-review/1872/"},{"y":-25,"t":["Vitruvius askılı döşemeyi tarif eder (De architectura V.10). Roma geleneği icadı Sergius Orata’ya bağlar; bu atıf bugün tartışmalıdır (Fagan 1996).","Vitruvius describes the suspended floor (De architectura V.10). Roman tradition credits the invention to Sergius Orata; that attribution is now contested (Fagan 1996)."],"link":"packet","src":"https://en.wikipedia.org/wiki/Suspensura"},{"y":100,"t":["Sistem imparatorluğa yayılır: kent hamamları, sınır kalelerindeki asker hamamları, villa daireleri. Sıcaklık odası yaklaşık 40, ılıklık 30 dereceye ulaşır.","The system spreads across the empire: town baths, military bathhouses at frontier forts, villa suites. The hot room reaches about 40°C, the warm room about 30°C."],"link":"apparatus","src":"https://www.english-heritage.org.uk/learn/story-of-england/romans/roman-bathing/"},{"y":400,"t":["Batı’da villa ve kent ekonomisi çekilir. Modern hesap, 45 metrekarelik tek bir ısıtılan odanın kışını yaklaşık 5,5 ton kayın odununa koyar; artık ödenemez.","In the West the villa and civic economy withdraws. A modern calculation puts one heated room of 45 m² at roughly 5.5 tonnes of beech a winter; it can no longer be paid."],"link":"maintenance","src":"https://www.academia.edu/29145599/The_Roman_Hypocaust_Heating_System_Calculations_and_thoughts_about_construction_performance_and_function"},{"y":730,"t":["Emevî hamamları geç antik yapıları doğrudan devralır: Walīlā hamamı soğukluk–ılıklık–sıcaklık dizisini ve alttan ısıtmayı olduğu gibi sürdürür.","Umayyad baths take over late antique buildings directly: the hammam at Walīlā keeps both the cold-warm-hot room sequence and the underfloor heating intact."],"link":"decoder","src":"https://al-qantara.revistas.csic.es/index.php/al-qantara/article/download/719/812?inline=1"},{"y":1350,"t":["Baltık çevresinde ısı depolamalı hipokaustlar: 1500’e doğru sekiz yüz ile bin arası örnek. Bunlar Roma mirası değil, taş yığınıyla çalışan yeni bir çözümdür.","Heat-storage hypocausts around the Baltic: eight hundred to a thousand examples by 1500. Not a Roman inheritance but a new solution working off a pile of stones."],"link":"context","src":"https://solar.lowtechmagazine.com/2017/03/heat-storage-hypocausts-air-heating-in-the-middle-ages/"},{"y":1584,"t":["İstanbul’da Çemberlitaş Hamamı yapılır: külhandaki ateş cehennemlikte dolaşır, duvarlardaki tütekliklerden çıkar. Yapı bugün de aynı düzenle ısınıyor.","Çemberlitaş Hamam is built in Istanbul: fire in the külhan circulates through the cehennemlik and leaves by the tüteklik flues. It is still heated the same way."],"link":"tacit","src":"https://jfa.arch.metu.edu.tr/uploads/docs/sayilar/sayi-21-1-2/81-110.pdf"},{"y":1936,"t":["Frank Lloyd Wright, ilk Jacobs Evi’nde döşeme içine gömülü boruyla “yerçekimi ısıtması” kurar: alttan ısıtma Batı konutuna borulu biçimde döner.","Frank Lloyd Wright builds “gravity heat” into the first Jacobs House with pipe embedded in the slab: underfloor heating returns to the western house, now as pipework."],"link":"apparatus","src":"https://savewright.org/radiant-heating-101/"}],"links":{"packet":["Yazılı paket şaşırtıcı ölçüde sağlamdır: Vitruvius’un beşinci kitabı askılı döşemeyi, ocağı ve duvar künklerini tarif eder ve Ortaçağ boyunca hiç kaybolmaz. Fiziksel paket daha da açıktır — yıkıntılardaki tuğla ayak sıraları herkesin görebileceği yerde durur.","The written packet is unusually robust: Vitruvius’s fifth book describes the suspended floor, the furnace and the wall flues, and it is never lost through the Middle Ages. The physical packet is plainer still — rows of brick piers stand visible in the ruins for anyone to see."],"decoder":["Sistemi okuyabilenler hiç tükenmedi. Emevî hamam yapıcıları geç antik planı ve alttan ısıtmayı doğrudan devraldı; Bizans ve Osmanlı ustaları aynı ilkeyi kesintisiz uyguladı. Batı’da okuyucu kalmadığı için değil, okumaya değecek talep kalmadığı için durdu.","The people who could read the system never ran out. Umayyad bath builders took over the late antique plan and its underfloor heating directly; Byzantine and Ottoman masters applied the same principle without a break. In the West it stopped not because no reader remained but because no demand worth reading for remained."],"context":["Neden işlediği: ısı döşemenin kütlesinde depolanır ve yavaş yayılır; duman odaya değil duvar künklerinden bacaya gider. Sınırı da ölçülebilir — dışarısı eksi 12 derece iken içeriyi 20 dereceye çıkarmak için döşemenin 35 dereceye kadar ısınması gerekir ki bu bugünkü 29 derecelik güvenlik sınırının üstündedir.","Why it works: heat is stored in the mass of the floor and released slowly; smoke goes not into the room but up the wall flues to the chimney. Its limit is measurable too — to hold 20°C indoors at -12°C outside, the floor has to reach about 35°C, above today’s 29°C safety limit for living space."],"tacit":["Ocağın başındaki kişinin yargısı: ne kadar odun, ne zaman kısılacağı, döşemenin ayakla okunması. Bu, Vitruvius’un yazmadığı ve yazamayacağı kısımdır; İstanbul hamamlarında külhancının bilgisi olarak bugüne kadar geldi.","The judgement of the person at the furnace: how much wood, when to damp it down, how to read the floor through the sole of the foot. This is the part Vitruvius did not and could not write; in the hamams of Istanbul it has come down to us as the külhancı’s knowledge."],"apparatus":["Ocak (praefurnium), döşemeyi taşıyan tuğla ayaklar (pilae), duvar içindeki künkler (tubuli) ve üstteki askılı döşeme (suspensura). Ama asıl donanım görünmeyendir: ucuz bir yakıt kaynağı ve onu her gün taşıyacak iş gücü.","The furnace (praefurnium), the brick piers carrying the floor (pilae), the flue tiles inside the walls (tubuli) and the suspended floor above (suspensura). But the real apparatus is the invisible one: a cheap fuel source and the labour to carry it every day."],"maintenance":["Zincirin kırılan halkası budur.
