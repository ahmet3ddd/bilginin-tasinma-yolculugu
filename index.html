  { v: "v4.1", was: ["Yöntem bölümünde basılan formüller, sitenin çalıştırdığı kodu tarif etmiyordu; q<sub>c</sub> = %100 iken bile belgelenmemiş bir sabit bağlam açığını açık bırakıyordu.", "The formulas printed in the Method section did not describe the code the site runs, and an undocumented constant kept a context gap open even at q<sub>c</sub> = 100%."], now: ["Formüller koda birebir uyduruldu ve doğrulandı (40 nesil boyunca fark yok); belgelenmemiş bir sabit ve gereksiz bir kırpma kaldırıldı, q<sub>c</sub> = 1 artık C = A verir. Yedi kaydırıcının açıklaması ölçülen davranışa göre yeniden yazıldı — biri okuyucuya modelin çürüttüğü bir deney öneriyordu. İki aracın <i>R</i> eğrisi ad ve renk olarak ayrıldı; tarihsel endeksin R'si yeşilden mora alındı.", "The formulas were made to match the code exactly and verified (bit-identical over 40 generations); an undocumented constant and a redundant clamp were removed, so q<sub>c</sub> = 1 now yields C = A. All seven slider explanations were rewritten against measured behaviour — one had been instructing the reader to run an experiment the model refutes. The <i>R</i> curves of the two instruments were separated by name and colour; the historical index's R moved from green to violet."] },
  { v: "v4.2", was: ["İkinci inceleme turu: kaynakların bir kısmı iddiaları taşımıyordu, sayılar sürüm bilgisiyle uyuşmuyordu ve kayıt etiketleri yazılı ölçüte uymuyordu.", "A second review round: several sources did not carry the claims made from them, some figures disagreed with the version notes, and record tags did not follow the stated criterion."], now: ["Onbir kayıt olgusal olarak düzeltildi (Antikythera, Roma betonu, Yunan ateşi, matbaa, rongorongo, Maya, dergi, Domesday, Cerf, bağlantı çürümesi, model çöküşü). Maddi kayıt / dolaylı gösterge ölçütü yazıya geçirildi ve altı etiket ile bir kategori buna göre değişti (şimdi 15 maddi kayıt, 8 dolaylı gösterge). Hakemliğin 1665'te başladığı efsanesi için yedinci düzeltme paneli eklendi. Altı kaynak eklendi (Gerstgrasser, Schaeffer, Moxham & Fyfe, Baldwin, Field & Wright, UNESCO Jikji) ve her biri dayandığı iddiaya bağlandı. “Birincil kaynak” iddiası hem rozetten hem 23 kayıt bağlantısının etiketinden kaldırıldı.", "Eleven records were factually corrected (Antikythera, Roman concrete, Greek fire, printing, rongorongo, Maya, journal, Domesday, Cerf, link rot, model collapse). The material-record / indirect-indicator criterion was written down, and six tags plus one category changed to follow it (now 15 material records, 8 indirect indicators). A seventh myth-correction was added for the 1665 peer-review date. Six sources were added (Gerstgrasser, Schaeffer, Moxham & Fyfe, Baldwin, Field & Wright, UNESCO Jikji), each attached to the claim that rests on it. The words “primary source” were removed from the badge and from the link label on all 23 records."] },
  { v: "v4.3", was: ["Kanıt seti yalnız kopan zincirlerden oluşuyordu; incelemeciler bunun bağımlı değişkene göre seçim olduğunu söylemişti.", "The evidence set held only broken chains; reviewers had called this selection on the dependent variable."], now: ["Zincir Haritaları sekmesi eklendi: on yedi gündelik nesnenin — kurşun kalemden entegre devreye — tutmuş aktarım zincirleri, altı halka üzerinden, her tarihi kaynaklı zaman haritalarıyla belgelendi. Her nesne için kopma noktası, bugünkü en kırılgan halka okuması ve vakanın neyi göstermediği açıkça yazıldı.", "The Chain Maps tab was added: the intact transmission chains of seventeen everyday objects — from the pencil to the integrated circuit — documented across the six links, with source-backed time maps for every date. Each object carries its near-break, a reasoned weakest-link-today reading, and an explicit statement of what the case does not show."] },
  { v: "v4.4", was: ["Zincir Haritaları ile Model Laboratuvarı birbirinden kopuktu; modelin gerçek vakalar karşısında ne kadarını temsil edebildiği hiç sınanmamıştı.", "The Chain Maps and the Model Lab stood apart, and the model had never been tested against real cases to see how much of them it can represent."], now: ["17×6'lık karşılaştırma matrisi eklendi ve her halkanın modelde karşılığı olup olmadığı işaretlendi. Sonuç modelin aleyhine: 17 vakanın yalnız 5'inde model kırılgan halkayı yalıtabiliyor, 7'sinde yarı ömrün içine gömülü, 5'inde (örtük bilgi) hiçbir terim yok. Her nesneden laboratuvara açılan “vaka merceği” bu sınırı ismen söyler ve <b>hiçbir nesneye parametre değeri atfetmez.</b>", "A 17×6 comparison matrix was added, marking whether each link has any term in the model. The result goes against the model: in only 5 of 17 cases can it isolate the fragile link, in 7 the link is folded into the half-life, and in 5 (tacit knowledge) there is no term at all. A “case lens” opens from each object into the lab, naming that limit and <b>assigning no parameter value to any object.</b>"] },
  { v: "v4.5", was: ["Mercek yalnız işaret ediyordu: laboratuvara giden okuyucu boş varsayılanlarla karşılaşıyor, eğrilerde vakadan hiçbir iz göremiyordu. Model köprüsü tahmin oyununun arkasına gizliydi ve sondaj yalnız 17 hazır nesneyle sınırlıydı.", "The lens only pointed: a reader arriving in the lab met blank defaults and saw no trace of the case in the curves. The model bridge hid behind the guessing game, and probing was limited to the 17 prepared objects."], now: ["Mercek artık kaydırıcıları <b>kaba senaryoya</b> ayarlar: değerler nesneden ölçülmez, kaynaklı nitel okumanın ekranda basılı <b>tek sabit kuralla</b> çevirisidir (kırılgan halka → düşük; diğerleri → sağlıklı; kural her nesnede aynıdır). Örtük bilgi vakalarında senaryo bilerek sağlıklı bırakılır ki modelin körlüğü eğrilerde görünür kalsın. Dondur-karşılaştır vaka adlarıyla çalışır. Altı halka satırına model işaretleri eklendi ve laboratuvar kapısı tahminden bağımsız erişilir oldu. Zincir Sondası eklendi: on iki soruluk araştırma protokolü, her soruda gerçek araştırma bağlantıları — motor hiçbir olgu üretmez, yalnız kullanıcının cevaplarını profile çevirir.", "The lens now sets the sliders to a <b>coarse scenario</b>: the values are not measured from the object but are the translation of the sourced qualitative reading by <b>one fixed rule printed on screen</b> (thinnest link → low; the rest → healthy; the same rule for every object). In tacit cases the scenario is left healthy on purpose, so the model's blindness stays visible in the curves. Freeze-and-compare carries case names. Model marks were added to all six link rows, and the lab door became reachable without guessing. The Chain Probe was added: the twelve-question research protocol with real research links on every question — the engine fabricates no facts and only translates the user's own answers into a profile."] },
  { v: "v4.6", was: ["On yedi haritanın hepsi modern sanayi ürünüydü. Altı halka modeli tam da bu nesnelerden çıkarıldığı için, “model yalnız moderniteyi tarif ediyor” itirazına verilecek veriye dayalı bir cevap yoktu. 100.000 Yıl sekmesindeki kanıt şeritleri de aynı dar örneklemi taşıyordu.", "All of the maps were modern industrial products. Because the six-link model was derived from exactly those objects, there was no evidence-based answer to the objection that it only describes modernity. The evidence lanes in the 100,000 Years tab carried the same narrow sample."], now: ["Osmanlı ve Roma dünyalarından on üç nesne eklendi (İznik çinisi, hat icâzetnâmesi, ebru, Sinan'ın yapıları, Osmanlı yazısı, vakıf, matbaa; Roma hukuku, su kemerleri, Latin alfabesi, cam üfleme, kodeks, hypocaust) — 104 tarihli olay ve 65 kaynak kaydıyla. Sonuç modeli çürütmedi: her birinde en ince halka altı halkadan biri çıktı ve modelin yalıtabildiği vaka oranı %29'dan %33'e çıktı; ama vurgu kaydı — on üç tarihsel nesnenin dördünde en ince halka <b>bakım</b> (otuz nesnenin tamamında altı kez). Her haritanın tarihli tanığı 100.000 Yıl şeritlerine işlendi; <b>eğrideki hiçbir sayı değiştirilmedi.</b> Bunun yerine eğrinin kendi sınırı basıldı: 1928 harf devrimi bölgesel bir çözücü kopuşudur ve küresel endeks yükselirken gerçekleşir — kayıp yerel, endeks küreseldir.", "Thirteen objects from the Ottoman and Roman worlds were added (Iznik ceramics, the calligraphic icâzetnâme, ebru, Sinan's buildings, the Ottoman script, the vakıf, the press; Roman law, the aqueducts, the Latin alphabet, glassblowing, the codex, the hypocaust) — with 104 dated events and 65 source records. The result did not refute the model: in every one the thinnest link came out as one of the six, and the share of cases the model can isolate rose from 29% to 33%; but the emphasis shifted — in four of the thirteen historical objects the thinnest link is <b>maintenance</b> (six times across all thirty). Each map's dated witness was written onto the 100,000 Years lanes; <b>not one number in the curve was changed.</b> What was printed instead is the curve's own limit: the 1928 alphabet reform is a regional decoder break occurring while the global index rises — the loss is local, the index is global."] }

var products = [{"id":"pencil","cat":"everyday","civ":"modern","icon":"✏️","name":["Kurşun kalem","The pencil"],"era":["1540'lar → bugün","1540s → today"],"hook":["1761'de bir ton Borrowdale grafiti 1.344 sterline, 1804'te 3.920 sterline satılıyordu; madenciler ocaktan çıkarken soyulup aranıyor, girişleri silahlı muhafızlar bekliyordu. Bugün aynı mineral kuruşluk bir çubuk — ve Leonard Read'in 1958'de yazdığı gibi, hâlâ “yeryüzünde beni nasıl yapacağını bilen tek bir insan yok”.","In 1761 a ton of Borrowdale graphite fetched £1,344, and £3,920 by 1804; miners were stripped and searched on their way out, and armed guards patrolled the entrances. Today the same mineral is a stick worth pennies — and, as Leonard Read wrote in 1958, still “not a single person on the face of this earth knows how to make me.”"],"timeline":[{"y":1540,"t":["Borrowdale'de grafitin (“wad”) işlendiğine dair ilk belgesel kanıt: kesilebilir saf grafitin bilinen tek büyük damarı.","First documentary evidence of graphite (“wad”) being worked at Borrowdale: the only known large seam of pure, saw-able graphite."],"link":"apparatus","src":"https://historicengland.org.uk/listing/the-list/list-entry/1019941"},{"y":1565,"t":["Conrad Gessner, fosil kitabında grafiti ahşap bir tutacağa geçirilmiş hâlde çizer: kalemin bilinen ilk kaydı.","Conrad Gessner's book on fossil objects shows graphite fitted into a wooden holder: the first known record of a pencil."],"link":"packet","src":"https://hyperallergic.com/244767/the-17th-century-fossil-book-that-first-illustrated-the-pencil/"},{"y":1752,"t":["Silahlı bir baskının ardından Parlamento wad madenine izinsiz girmeyi suç sayar: kırbaç ve bir yıl kürek ya da yedi yıl sürgün.","After an armed raid, Parliament makes unlawful entry into a wad mine a felony: public whipping plus a year's hard labour, or seven years' transportation."],"link":"maintenance","src":"https://heritagerecords.nationaltrust.org.uk/HBSMR/MonRecord.aspx?uid=MNA119961"},{"y":1761,"t":["Kaspar Faber Nürnberg yakınındaki Stein'da kalem yapmaya başlar; bugünkü Faber-Castell'in çekirdeği.","Kaspar Faber begins making pencils at Stein near Nuremberg; the seed of today's Faber-Castell."],"link":"tacit","src":"https://www.faber-castell.cz/-/media/Faber-Castell/brochures/en/Press/A--brief-history-of-the-pencil.ashx"},{"y":1795,"t":["İngiliz grafiti savaş yüzünden kesilince Nicolas-Jacques Conté grafit tozunu kille karıştırıp fırınlar: sertlik artık orana göre ayarlanabilir.","With English graphite cut off by war, Nicolas-Jacques Conté mixes powdered graphite with clay and kiln-fires it: hardness becomes tunable by ratio."],"link":"packet","src":"https://www.britannica.com/biography/Nicolas-Jacques-Conte"},{"y":1839,"t":["Lothar von Faber A.W. Faber'in başına geçer; kalem markalı, standart ölçülü bir sanayi ürününe dönüşür.","Lothar von Faber takes over A.W. Faber; the pencil becomes a branded, standardised industrial product."],"link":"decoder","src":"https://www.faber-castell.cz/-/media/Faber-Castell/brochures/en/Press/A--brief-history-of-the-pencil.ashx"},{"y":1958,"t":["Leonard Read'in “I, Pencil” denemesi Aralık 1958'de The Freeman'da çıkar: kalemi hiç kimsenin tek başına yapamadığı tezi.","Leonard Read's essay “I, Pencil” appears in the December 1958 Freeman: the claim that no one person can make a pencil."],"link":"context","src":"https://fee.org/articles/leonard-read-the-spiritual-economist/"},{"y":2023,"t":["Çin Aralık 2023'te grafit ihracatını izne bağlar; 2024'ün ilk iki ayında ihracat %78 düşer. Çin dünya üretiminin %78'ini yapmaktadır.","China makes graphite exports permit-only from December 2023; exports fall 78% in the first two months of 2024. China mines 78% of world output."],"link":"apparatus","src":"https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-graphite.pdf"}],"links":{"packet":["Paket eksiksiz ve açıkta: grafit–kil oranı, fırınlama sıcaklığı, sedir yuvasının geometrisi. Conté'den bu yana temel reçete değişmedi.","The packet is complete and in the open: the graphite–clay ratio, the firing, the geometry of the cedar groove. The basic recipe has not changed since Conté."],"decoder":["Okuyucu kütlesi neredeyse evrensel. HB, 2B, F gibi sertlik işaretleri ülkeler ve markalar arasında anlaşılıyor; kalemi tutmayı her yıl milyonlarca çocuk öğreniyor.","The reader base is close to universal. Hardness marks such as HB, 2B and F are read across countries and brands, and millions of children are taught to hold one every year."],"context":["Neden çalıştığı biliniyor: grafitin tabakaları birbiri üzerinde kayar, kil bu kaymayı frenler. Hata tarihi de kayıtlı — 1795 tedarik krizi ve kurşunsuz “kurşun kalem” yanılgısı dahil.","Why it works is understood: graphite's sheets slide over each other and the clay brakes that slide. The error history is on record too — including the 1795 supply crisis and the misnomer of “lead”."],"tacit":["İnce halka. ABD'de bir zamanlar yaklaşık yirmi dört kalem fabrikası varken bugün belki dört kaldı; Musgrave gibi ayakta kalanlar malzemenin neredeyse tamamını Çin'den alıyor.","A thin link. The United States once had roughly two dozen pencil factories and now has perhaps four; survivors such as Musgrave source nearly all their materials from China."],"apparatus":["En kırılgan halka. Slat kesme, çekirdek ekstrüzyonu ve boyama hatları çalışıyor, ama hammadde tek merkezde: USGS'e göre dünya doğal grafitinin %78'i Çin'den geliyor, ABD %100 ithalata bağımlı.","The most brittle link. Slat mills, core extruders and lacquer lines all run, but the raw material is concentrated: USGS puts 78% of world natural graphite in China, with the US 100% import-reliant."],"maintenance":["Bakım güçlü: Faber-Castell tek başına yılda 1,8 milyardan fazla kalem üretiyor; okul sistemleri her yıl yeni kullanıcı yetiştiriyor.","Maintenance is strong: Faber-Castell alone makes over 1.8 billion pencils a year, and school systems raise a fresh cohort of users annually."]},"weakest":{"k":"apparatus","why":["Paket, çözücü ve bakım halkaları sağlam; kırılgan olan fiziksel taban. Doğal grafitin %78'i tek bir ülkeden çıkıyor ve Aralık 2023 izin rejimi bunun ne kadar hızlı daralabileceğini gösterdi: iki ayda ihracat %78 azaldı. Sedir de benzer biçimde birkaç bölgeye sıkışmış durumda; reçete hayatta kalsın, madde durursa hat durur.","Packet, decoder and maintenance are all robust; what is brittle is the physical base. 78% of natural graphite comes out of a single country, and the December 2023 permit regime showed how fast that can narrow: exports fell 78% in two months. Incense cedar is similarly concentrated in a few regions. The recipe can survive perfectly well and the line still stops if the matter does."]},"nearBreak":["1790'ların savaşları Fransa'yı tek iyi grafit kaynağından, Borrowdale'den kesti. Nicolas-Jacques Conté 1795'te grafit tozunu kille karıştırıp fırınlayarak çözümü buldu; zincir kopmadığı gibi güçlendi, çünkü sertlik artık oranla ayarlanabiliyordu. Borrowdale damarı 1891'de terk edildiğinde kimse fark etmedi bile: bilgi artık madende değil, reçetedeydi.","The wars of the 1790s cut France off from Borrowdale, the only good source of graphite. In 1795 Nicolas-Jacques Conté solved it by mixing powdered graphite with clay and firing it; the chain not only held but improved, because hardness could now be dialled in by ratio. When the Borrowdale seam was abandoned in 1891 nobody noticed: the knowledge had moved out of the mine and into the recipe."],"thesis":["Bu vaka çalışmanın merkezî iddiasını destekliyor: paket bağımsız bir tarife dönüştüğünde — “belirli bir madeni kaz” yerine “grafiti kille şu oranda karıştır” — zincir hammaddesini kaybetse bile yaşar. Göstermediği şey: kalem hiç kesintisiz talep gördüğü için ayakta kaldı; talebi çekilen bir bilginin aynı dayanıklılığı göstereceğine dair hiçbir kanıt sunmuyor.","This case supports the study's central claim: once the packet becomes an abstract procedure — “mix graphite with clay in this ratio” rather than “dig this particular mine” — the chain survives the loss of its raw material. What it does not show: the pencil held because demand for it never lapsed, and it offers no evidence that a body of knowledge nobody currently wants would prove equally durable."],"sources":[{"t":["I, Pencil (1958)","I, Pencil (1958)"],"m":["Foundation for Economic Education","Foundation for Economic Education"],"u":"https://fee.org/ebooks/i-pencil/"},{"t":["Seathwaite çiftliğindeki grafit (wad) madeni","Graphite (Wad) Mine on Seathwaite Farm, Borrowdale"],"m":["National Trust Heritage Records","National Trust Heritage Records"],"u":"https://heritagerecords.nationaltrust.org.uk/HBSMR/MonRecord.aspx?uid=MNA119961"},{"t":["Nicolas-Jacques Conté","Nicolas-Jacques Conté"],"m":["Encyclopædia Britannica","Encyclopædia Britannica"],"u":"https://www.britannica.com/biography/Nicolas-Jacques-Conte"},{"t":["Grafit (doğal), Mineral Commodity Summaries 2025","Graphite (Natural), Mineral Commodity Summaries 2025"],"m":["U.S. Geological Survey, 2025","U.S. Geological Survey, 2025"],"u":"https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-graphite.pdf"},{"t":["Amerika'nın son kalem fabrikalarından birinin içi","See Inside One of America's Last Pencil Factories"],"m":["Smithsonian Magazine, 2023","Smithsonian Magazine, 2023"],"u":"https://www.smithsonianmag.com/innovation/see-inside-one-americas-last-pencil-factories-180982344/"}]},{"id":"ballpoint","cat":"everyday","civ":"modern","icon":"🖊️","name":["Tükenmez kalem","The ballpoint pen"],"era":["1888 → bugün","1888 → today"],"hook":["1945'te tükenmez kalem bir mucize diye satıldı: Gimbels'te tanesi 12,50 dolar, açılış günü yaklaşık 125.000 dolarlık satış. Sonra sızdırdı, mürekkebi soldu, bankalar onunla imzalanmış çeki geri çevirdi. Fikri kurtaran yeni bir buluş değil, Marcel Bich'in 1950'de lisansı düzgünce alıp ucuz bir seri üretime çevirmesi oldu: Cristal 2006'da 100 milyarıncı satışını geçti.","In 1945 the ballpoint was sold as a miracle: $12.50 a pen at Gimbels, some $125,000 taken on opening day. Then they leaked, the ink faded, and banks refused cheques signed with them. What rescued the idea was not a new invention but Marcel Bich properly licensing it in 1950 and turning it into cheap mass production: the Cristal passed its 100 billionth sale in 2006."],"timeline":[{"y":1888,"t":["John J. Loud, kaba yüzeyleri işaretlemek için bilyeli bir kalem patenti alır (US 392.046); kâğıt için fazla kabadır ve ticarileşmez.","John J. Loud patents a rolling-ball pen for marking rough surfaces (US 392,046); too coarse for paper, it is never commercialised."],"link":"packet","src":"https://patents.google.com/patent/US392046A/en"},{"y":1938,"t":["László Bíró 15 Haziran 1938'de İngiliz patentini dosyalar (GB 498.997): dönen bilye artı hamurumsu, yavaş kuruyan boya.","László Bíró files his British patent on 15 June 1938 (GB 498,997): a rotating ball plus a soft, pulpy, slow-drying dye."],"link":"packet","src":"https://patents.google.com/patent/GB498997A/en"},{"y":1943,"t":["Arjantin'e sığınan Bíró'nun kalemini RAF keşfeder: yüksek irtifada sızmadığı için 30.000'den fazla “Eterpen” sipariş edilir.","The RAF discovers the pen of the exiled Bíró: because it does not leak at altitude, more than 30,000 “Eterpens” are ordered."],"link":"context","src":"https://www.smithsonianmag.com/air-space-magazine/ballpoint-pens-RAF-180955537/"},{"y":1945,"t":["Ekim 1945: Reynolds Rocket New York'ta Gimbels'te 12,50 dolara satışa çıkar; üç yıl içinde fiyat 50 sente düşer ve Reynolds işi bırakır.","October 1945: the Reynolds Rocket goes on sale at Gimbels in New York for $12.50; within three years the price falls to 50¢ and Reynolds quits the business."],"link":"tacit","src":"https://www.thebeliever.net/logger/vintage-tech-the-ballpoint-pen/"},{"y":1949,"t":["Bíró'nun ABD patenti (US 2.491.082) 13 Aralık 1949'da verilir — haklar çoktan Eversharp'a geçmiştir; mucit neredeyse hiç kazanmaz.","Bíró's US patent (US 2,491,082) is granted on 13 December 1949 — by then assigned to Eversharp; the inventor profits almost nothing."],"link":"maintenance","src":"https://patents.google.com/patent/US2491082A/en"},{"y":1950,"t":["Marcel Bich BIC Cristal'i piyasaya sürer; lisans yasal olarak alınmıştır ve Bich metali 0,01 milimetreye kadar işleyen İsviçre teknolojisine yatırım yapar.","Marcel Bich launches the BIC Cristal on a properly licensed design, investing in Swiss technology able to shape metal down to 0.01 millimetres."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/Bic_Cristal"},{"y":1961,"t":["Paslanmaz çelik bilyenin yerini tungsten karbür alır; elmas aşındırıcı plakalar arasında 0,1 mikrometre hassasiyetle taşlanır.","The stainless-steel ball is replaced by tungsten carbide, ground to 0.1 µm between plates coated with industrial diamond abrasive."],"link":"apparatus","src":"https://en.wikipedia.org/wiki/Bic_Cristal"},{"y":2017,"t":["Çin yılda 38 milyar tükenmez üretirken uç çeliğinin tamamını Japonya'dan alıyordu; TISCO beş yıllık çalışmayla yerli ucu başardı.","China was making 38 billion ballpoints a year while importing all its tip steel from Japan; after five years' work TISCO produced a domestic tip."],"link":"tacit","src":"https://www.chinadaily.com.cn/china/2017-01/10/content_27914009.htm"}],"links":{"packet":["Paket kamuya açık ve tam: Bíró'nun 1938 İngiliz, 1949 ABD patentleri ve sonraki tasarım patentleri tam metin hâlinde okunabiliyor.","The packet is public and complete: Bíró's 1938 British and 1949 US patents and the later design patents are all readable in full text."],"decoder":["Kullanıcı tarafında öğrenilecek hiçbir şey kalmadı — kapağı aç, yaz. Asıl çözücü kitle üretimde: mürekkep kimyacıları ve hassas talaşlı imalat mühendisleri, sayıca az ama var.","Nothing is left for the user to learn — uncap and write. The real decoders sit in production: ink chemists and precision-machining engineers, few in number but present."],"context":["Neden çalıştığı çok iyi anlaşılıyor: viskoz mürekkep, kılcal besleme, bilye ve yuva arasındaki mikron altı boşluk. Hata tarihi de belgeli — 1945-48 çöküşü tam olarak bu üçlünün tutturulamamasıydı.","Why it works is well understood: viscous ink, capillary feed, a sub-micron clearance between ball and socket. The error history is documented too — the 1945-48 collapse was exactly a failure to hit those three."],"tacit":["En ince halka. Patent metni ucu yapmayı öğretmiyor: Çin, 38 milyarlık üretimine ve tüm çizimlere rağmen kendi uç çeliğini ancak 2011'de başlayan beş yıllık bir programla üretebildi.","The thinnest link. The patent text does not teach you to make the tip: despite 38 billion units of output and every drawing available, China only produced its own tip steel through a five-year programme begun in 2011."],"apparatus":["Mikron altı taşlama tezgâhları, tungsten karbür bilye tedariki ve otomatik montaj hatları az sayıda firmada toplanmış; ama bu firmalar birden fazla ülkede.","Sub-micron grinding machines, tungsten-carbide ball supply and automated assembly lines sit with a small number of firms — though those firms are spread across more than one country."],"maintenance":["Bakım olağanüstü güçlü: Cristal, Eylül 2006'da 100 milyarıncı satışını geçti; 2001'de MoMA, 2006'da Pompidou koleksiyonuna girerek kültürel kayda da geçti.","Maintenance is exceptionally strong: the Cristal passed its 100 billionth sale in September 2006 and entered MoMA's collection in 2001 and the Pompidou's in 2006, so it is culturally archived too."]},"weakest":{"k":"tacit","why":["Yazılı paket eksiksiz, patentler herkese açık, talep sonsuz — ve buna rağmen ucu yapmak ayrı bir iş. Çin örneği bunun en temiz kanıtı: dünyanın tükenmez kalemlerinin çoğunu üreten ülke, uç çeliğini yıllarca ithal etmek zorunda kaldı. Aktarılamayan şey çizim değil, alaşımın ve taşlamanın atölye bilgisi.","The written packet is complete, the patents are public, demand is endless — and making the tip is still a separate job. China is the cleanest proof: the country that makes most of the world's ballpoints had to import its tip steel for years. What fails to transfer is not the drawing but the shop-floor knowledge of the alloy and the grind."]},"nearBreak":["Ekim 1945'te Reynolds Rocket New York'ta çılgınca satıldı, ama kalemler sızdı, mürekkep soldu ve müşteriler Reynolds'a kuru temizleme faturalarını gönderdi; bankalar tükenmezle imzalanan çekleri kabul etmedi. Fiyat üç yılda 12,50 dolardan 50 sente çöktü ve Reynolds işi bıraktı. Fikri kurtaran şey yeni bir patent değil, Marcel Bich'in 1950'de mürekkep kimyasını ve bilye toleransını nihayet tutturan üretim disiplini oldu.","In October 1945 the Reynolds Rocket sold wildly in New York, but the pens leaked, the ink faded, and customers posted Reynolds their dry-cleaning bills; banks refused cheques signed with a ballpoint. The price collapsed from $12.50 to 50¢ within three years and Reynolds left the business. What saved the idea was not a new patent but Marcel Bich's 1950 manufacturing discipline, which finally got the ink chemistry and the ball tolerance right."],"thesis":["Bu vaka çalışmanın “paket tek başına yetmez” iddiasını doğruluyor: 1888'den beri elde olan bir fikir, aygıt ve örtük bilgi halkaları hazır olana kadar iki kez piyasada çöktü. Göstermediği şey: burada kesin bir kopuş hiç yaşanmadı — Bíró'nun patenti hep okunabilir durumdaydı, dolayısıyla vaka gerçek bir bilgi kaybının nasıl telafi edileceğine dair kanıt sunmuyor.","This case confirms the study's claim that a packet alone is not enough: an idea available since 1888 collapsed twice in the market until the apparatus and tacit links caught up. What it does not show: nothing here was ever truly lost — Bíró's patent stayed legible throughout — so the case offers no evidence about recovering from an actual break."],"sources":[{"t":["Tükenmez kalem – László Biró","Ballpoint pen – László Biró"],"m":["Deutsches Patent- und Markenamt (DPMA)","German Patent and Trade Mark Office (DPMA)"],"u":"https://www.dpma.de/english/our_office/publications/milestones/inventionsthatmadehistory/kugelschreiber/index.html"},{"t":["GB 498.997 – Geliştirilmiş dolma kalem, 1938","GB 498,997 – Improved fountain pen, 1938"],"m":["Google Patents / UK Patent Office","Google Patents / UK Patent Office"],"u":"https://patents.google.com/patent/GB498997A/en"},{"t":["Tükenmez kalemi seviyorsanız RAF'a teşekkür edin","If You Like Ballpoint Pens, Thank the R.A.F."],"m":["Smithsonian Air & Space","Smithsonian Air & Space"],"u":"https://www.smithsonianmag.com/air-space-magazine/ballpoint-pens-RAF-180955537/"},{"t":["Eski teknoloji: tükenmez kalem","Vintage Tech: The Ballpoint Pen"],"m":["The Believer","The Believer"],"u":"https://www.thebeliever.net/logger/vintage-tech-the-ballpoint-pen/"},{"t":["Çin kendi tükenmez kalem uçlarını üretiyor","China develops its own ballpoint pen tips"],"m":["China Daily, 2017","China Daily, 2017"],"u":"https://www.chinadaily.com.cn/china/2017-01/10/content_27914009.htm"}]},{"id":"lighter","cat":"everyday","civ":"modern","icon":"🔥","name":["Çakmak (bütan gazlı)","The butane/gas lighter"],"era":["1823 → bugün","1823 → today"],"hook":["Cebinizdeki çakmak, 1903'te patentlenmiş bir alaşım sayesinde kıvılcım veriyor: %70 seryum, %30 demir. Öncesinde uzun bir boşluk var — Döbereiner'in 1823 tarihli platin lambası 1820'lerde 20.000'den fazla sattıktan sonra 1827'de sürtmeli kibrite yenildi ve taşınabilir kimyasal ateş fikri yaklaşık seksen yıl rafta bekledi.","The lighter in your pocket sparks because of an alloy patented in 1903: 70% cerium, 30% iron. Before that there is a long gap — Döbereiner's 1823 platinum lamp sold more than 20,000 units in the 1820s, then lost to the friction match in 1827, and the idea of portable chemical fire sat unused for some eighty years."],"timeline":[{"y":1823,"t":["Johann Wolfgang Döbereiner'in lambası: çinko ve sülfürik asit hidrojen üretir, platin sünger onu kendiliğinden tutuşturur.","Johann Wolfgang Döbereiner's lamp: zinc and sulphuric acid make hydrogen, and a platinum sponge ignites it spontaneously."],"link":"apparatus","src":"https://collection.sciencemuseumgroup.org.uk/objects/co8076929/german-dobereiners-lamp-1823-1889"},{"y":1880,"t":["Jacques ve Pierre Curie kuvars, turmalin ve topazda piezoelektrik etkiyi bulur: basınç uygulanan kristal yük üretir.","Jacques and Pierre Curie discover piezoelectricity in quartz, tourmaline and topaz: a squeezed crystal produces charge."],"link":"packet","src":"https://www.umontpellier.fr/en/articles/connaissez-vous-jacques-curie-la-piezoelectricite-dans-tous-ses-etats"},{"y":1903,"t":["Carl Auer von Welsbach piroforik çakmaktaşı alaşımını (“Auermetall”) patentler: en iyi bileşim %70 seryum, %30 demir.","Carl Auer von Welsbach patents his pyrophoric flint alloy (“Auermetall”): the optimum composition is 70% cerium, 30% iron."],"link":"packet","src":"http://www.auer-von-welsbach-museum.at/de/freiherr-auer-von-welsbach/biografie"},{"y":1958,"t":["Science Museum koleksiyonundaki Ronson bütan çakmağı: sıvılaştırılmış gaz artık cebe giriyor, benzinli fitil devri kapanıyor.","A Ronson butane lighter in the Science Museum collection: liquefied gas now fits in a pocket, closing the petrol-wick era."],"link":"apparatus","src":"https://collection.sciencemuseumgroup.org.uk/objects/co8047769/ronson-butane-fuel-lighter-1958"},{"y":1963,"t":["ABD'de piezoelektrik çakmak patenti (US 3.167.687): parmak basıncı yaklaşık 3.000 volt üretir; ne çakmaktaşı ne pil gerekir.","A US piezoelectric lighter patent (US 3,167,687): finger pressure yields about 3,000 volts, with neither flint nor battery."],"link":"apparatus","src":"https://patents.google.com/patent/US3167687A/en"},{"y":1972,"t":["Gillette, S.T. Dupont'un 1961'den beri Fransa'da yaptığı “Cricket”i ABD'ye getirir: kullanıcıdan artık hiçbir beceri istenmiyor.","Gillette brings the “Cricket” — made in France by S.T. Dupont since 1961 — to the United States: no skill is asked of the user any more."],"link":"decoder","src":"https://americanhistory.si.edu/collections/object/nmah_525"},{"y":1973,"t":["BIC tek kullanımlık çakmağını çıkarır; şirket 2024'e kadar 30 milyardan fazla çakmak sattığını bildirir.","BIC launches its disposable lighter; by 2024 the company reports having sold over 30 billion of them."],"link":"maintenance","src":"https://en.wikipedia.org/wiki/Bic_lighter"},{"y":1994,"t":["12 Temmuz 1994'ten sonra üretilen çakmaklar ABD'de çocuk kilidi zorunlu: 1988-90'da beş yaş altı çocukların yaktığı yangınlarda yılda ~150 ölüm.","Lighters made after 12 July 1994 must be child-resistant in the US: in 1988-90, fires lit by under-fives killed about 150 people a year."],"link":"context","src":"https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1210"}],"links":{"packet":["Paket sağlam ve dağınık: ferroseryum alaşımının bileşimi, bütanın buhar basıncı ve piezo seramiklerin davranışı patentlerde, standartlarda ve ders kitaplarında ayrı ayrı duruyor.","The packet is robust but scattered: the ferrocerium composition, butane's vapour pressure and the behaviour of piezo ceramics live separately in patents, standards and textbooks."],"decoder":["Kullanıcı tarafında öğrenilecek şey neredeyse sıfıra indi — çarkı çevir ya da düğmeye bas. Bunu okuyabilen mühendis kitlesi ise ferroseryum ve PZT seramik üreten birkaç firmada yoğunlaşmış.","What the user must learn has fallen to almost nothing — spin the wheel or press the button. The engineers who can actually read the packet are concentrated in the few firms making ferrocerium and PZT ceramics."],"context":["En zayıf halka. Milyarlarca insan taşıyor, hiç kimse içinde ne olduğunu bilmiyor; “neden çalıştığı” bilgisi bugün esasen güvenlik mevzuatında ve birkaç şirketin mühendislik dosyalarında yaşıyor.","The weakest link. Billions of people carry one and almost nobody knows what is inside; the “why it works” now survives mainly in safety regulation and in the engineering files of a few companies."],"tacit":["Ferroseryum çubuğun dökümü ve piezo elemanın kutuplanması hâlâ atölye işi, ama üretim o kadar otomatik ki insan eli neredeyse yalnızca hat ayarında.","Casting the ferrocerium rod and poling the piezo element remain shop-floor crafts, but production is so automated that the human hand appears mostly at line set-up."],"apparatus":["Aygıt tarafı güçlü: bütan rafineriden çıkıyor, ferroseryum ve PZT seramik sanayi ölçeğinde üretiliyor, dolum ve sızdırmazlık hatları rutin.","The apparatus side is strong: butane comes off the refinery, ferrocerium and PZT ceramics are made at industrial scale, and filling and sealing lines are routine."],"maintenance":["Bakım tamamen üretim hacmine devredilmiş: hiçbir çakmak tamir edilmiyor, yalnızca yenisi yapılıyor. BIC tek başına 30 milyardan fazla sattığını bildiriyor.","Maintenance has been handed entirely to volume: no lighter is repaired, only replaced. BIC alone reports having sold more than 30 billion."]},"weakest":{"k":"context","why":["Çakmak, bağlamı en eksiksiz silinmiş nesne. Nesne bir milyar cepte çalışıyor ama kullanıcı için tamamen opak: içinde ne olduğu, hangi sınırlarda patlayacağı, kıvılcımın nereden geldiği gündelik bilgiden çıkmış durumda. Hata tarihini taşıyan tek kurumsal hafıza güvenlik mevzuatı; 1994 çocuk kilidi standardı bu boşluğun ne kadar pahalıya öğrenildiğinin kaydıdır.","The lighter is the object whose context has been most completely erased. It works in a billion pockets while being wholly opaque to its user: what is inside, where its limits are, where the spark comes from, have all dropped out of ordinary knowledge. The only institutional memory carrying its error history is safety regulation; the 1994 child-resistance standard is the record of how expensively that gap was learned."]},"nearBreak":["Döbereiner'in lambası 1820'lerde Almanya ve Britanya'da 20.000'den fazla sattı; Goethe bile araştırmasını finanse etti. Ama 1827'de fosforlu sürtmeli kibritler çıkınca ağır ve tehlikeli lamba piyasadan silindi ve taşınabilir kimyasal ateş fikri fiilen terk edildi. Zincir kopmadı çünkü aktarılan alet değil sorunun kendisiydi: 1903'te Auer von Welsbach ferroseryumu bulduğunda cebe giren kıvılcım geri döndü.","Döbereiner's lamp sold more than 20,000 units in Germany and Britain in the 1820s; Goethe himself funded the research. Then phosphorus friction matches arrived in 1827, the heavy and dangerous lamp was wiped off the market, and portable chemical fire was effectively abandoned. The chain held because what was transmitted was not the device but the problem: when Auer von Welsbach found ferrocerium in 1903, the pocketable spark came back."],"thesis":["Bu vaka çalışmanın “bir halka onlarca yıl boş kalabilir ve zincir yine de sürer” iddiasını destekliyor: 1827 ile 1903 arasında ürün ortadan kalktı, sorun kalmadı sayılmaz. Göstermediği şey: burada kurtarılan şey belirli bir tarif değil, genel bir amaçtı; çakmak vakası kaybolmuş bir yöntemin geri kazanılabileceğine dair kanıt sunmuyor.","This case supports the study's claim that a link can lie empty for decades and the chain still continue: between 1827 and 1903 the product vanished while the problem did not. What it does not show: what was rescued here was a general purpose, not a specific procedure, so the lighter gives no evidence that a lost method can be recovered."],"sources":[{"t":["Alman yapımı Döbereiner lambası, 1823-1889","German Döbereiner's Lamp, 1823-1889"],"m":["Science Museum Group Collection","Science Museum Group Collection"],"u":"https://collection.sciencemuseumgroup.org.uk/objects/co8076929/german-dobereiners-lamp-1823-1889"},{"t":["Carl Auer von Welsbach – Biyografi ve patent tarihleri","Carl Auer von Welsbach – Biography and patent dates"],"m":["Auer von Welsbach Museum, Althofen","Auer von Welsbach Museum, Althofen"],"u":"http://www.auer-von-welsbach-museum.at/de/freiherr-auer-von-welsbach/biografie"},{"t":["US 3.167.687 – Piezoelektrik çakmak (1963/1965)","US 3,167,687 – Piezoelectric lighter (1963/1965)"],"m":["Google Patents / USPTO","Google Patents / USPTO"],"u":"https://patents.google.com/patent/US3167687A/en"},{"t":["Cricket bütan çakmak","Cricket Butane Lighter"],"m":["National Museum of American History, Smithsonian","National Museum of American History, Smithsonian"],"u":"https://americanhistory.si.edu/collections/object/nmah_525"},{"t":["16 CFR Bölüm 1210 – Çakmaklar için güvenlik standardı","16 CFR Part 1210 – Safety Standard for Cigarette Lighters"],"m":["U.S. Consumer Product Safety Commission / eCFR","U.S. Consumer Product Safety Commission / eCFR"],"u":"https://www.ecfr.gov/current/title-16/chapter-II/subchapter-B/part-1210"}]},{"id":"supermarket","cat":"everyday","civ":"modern","icon":"🛒","name":["Süpermarket","The supermarket"],"era":["1916 → bugün","1916 → today"],"hook":["Ortalama bir Amerikan süpermarketi 2025'te 33.248 farklı kalem taşıyordu. Mağaza bunların hiçbirini icat etmedi: self servis reyon 1917'de patentlendi, alışveriş arabası 1937'de tanıtıldı, malın içinde geldiği çelik kutu ilk kez 1956'da yüzdü ve kasadaki “bip”, 26 Haziran 1974'te Ohio'da 67 sentlik bir paket sakızla başladı.","The average American supermarket carried 33,248 distinct items in 2025. The store invented none of them: the self-service aisle was patented in 1917, the shopping cart debuted in 1937, the steel box the goods arrive in first sailed in 1956, and the beep at the till began with a 67-cent packet of gum in Ohio on 26 June 1974."],"timeline":[{"y":1916,"t":["Clarence Saunders Eylül 1916'da Memphis'te ilk Piggly Wiggly'yi açar: tek girişli, tek çıkışlı, tek yönlü koridor; müşteri kendi topluyor.","Clarence Saunders opens the first Piggly Wiggly in Memphis in September 1916: one entrance, one exit, a single one-way aisle, the customer serving herself."],"link":"packet","src":"https://invention.si.edu/invention-stories/one-way-supermarket-aisles"},{"y":1917,"t":["“Self-Serving Store” patenti 9 Ekim 1917'de verilir (US 1.242.872): mağaza düzeni artık yazıya dökülmüş, kopyalanabilir bir prosedür.","The “Self-Serving Store” patent is granted on 9 October 1917 (US 1,242,872): store layout becomes a written, copyable procedure."],"link":"packet","src":"https://patents.google.com/patent/US1242872A/en"},{"y":1930,"t":["Birds Eye'ın hızlı dondurulmuş ürünleri Springfield, Massachusetts'te perakendeye girer: soğuk zincir rafın altına kurulur.","Birds Eye's quick-frozen products reach retail in Springfield, Massachusetts: the cold chain is laid under the shelf."],"link":"apparatus","src":"https://www.invent.org/inductees/clarence-birdseye"},{"y":1930,"t":["4 Ağustos'ta King Kullen açılır; Smithsonian bunu modern süpermarketin beş ölçütünü birden karşılayan ilk mağaza olarak kabul eder.","King Kullen opens on 4 August; the Smithsonian recognises it as the first store to meet all five criteria of the modern supermarket."],"link":"decoder","src":"https://kingkullen.com/about-us/"},{"y":1937,"t":["4 Haziran'da Sylvan Goldman alışveriş arabasını tanıtır; kimse itmek istemeyince mağazaya kiralık modeller koyup davranışı öğretir.","On 4 June Sylvan Goldman debuts the shopping cart; when nobody will push one he hires models to demonstrate, teaching the behaviour."],"link":"tacit","src":"https://www.britannica.com/today-in-history/June-4-1937-Debut-of-the-Shopping-Cart"},{"y":1956,"t":["26 Nisan'da Ideal X, Newark'tan 58 konteynerle kalkar; yükleme sekiz saatten kısa sürer, oysa parça yük günler alıyordu.","On 26 April the Ideal X leaves Newark with 58 containers; loading takes under eight hours, where break-bulk took days."],"link":"apparatus","src":"https://porthouston.com/ideal-x/"},{"y":1973,"t":["1 Nisan'da UPC sembolü standart olarak kabul edilir; tasarımı IBM'den George Laurer'e ait. Ürün artık makinece okunabilir bir isme sahip.","On 1 April the UPC symbol is adopted as a standard, designed by IBM's George Laurer. A product now has a machine-readable name."],"link":"packet","src":"https://www.ibm.com/mx-es/history/upc"},{"y":1974,"t":["26 Haziran'da Troy, Ohio'daki Marsh süpermarketinde 67 sentlik Wrigley's Juicy Fruit taranır: dünyanın ilk UPC okuması.","On 26 June a 67-cent pack of Wrigley's Juicy Fruit is scanned at the Marsh supermarket in Troy, Ohio: the world's first UPC read."],"link":"decoder","src":"https://www.smithsonianmag.com/smithsonian-institution/supermarket-scanner-changed-way-we-buy-groceries-forever-180984293/"}],"links":{"packet":["Paket artık bir metin değil, bir formatlar demeti: mağaza planı, UPC/GS1 numarası, palet ölçüsü, ISO konteyner boyutu. Hepsi yazılı, hepsi kamuya açık.","The packet is no longer a text but a bundle of formats: store plan, UPC/GS1 number, pallet dimension, ISO container size. All written, all public."],"decoder":["Okuyucu artık büyük ölçüde makine. İnsan tarafı ise yavaş öğrendi: barkod 1974'te okundu ama Ocak 1985'te ABD süpermarketlerinin yalnızca %29'unda tarayıcı vardı.","The reader is now largely a machine. The human side learned slowly: the barcode was read in 1974, yet by January 1985 only 29% of US supermarkets had scanners."],"context":["Sistemin neden çalıştığı — dönüş hızı, soğuk zincir sıcaklıkları, ikmal aralıkları — kurumsal bilgi olarak sağlam; ama bu bilgi mağazada değil, tedarik zinciri yazılımında ve merkezî planlama birimlerinde duruyor.","Why the system works — turnover rates, cold-chain temperatures, replenishment intervals — is institutionally solid, but that knowledge sits in supply-chain software and central planning units, not in the store."],"tacit":["Reyon dizme, et kesme, taze ürün döndürme gibi el becerileri hâlâ mağaza içinde öğreniliyor; ama işgücü devir hızı yüksek olduğu için bu bilgi kısa ömürlü aktarımlarla taşınıyor.","Hand skills such as facing shelves, butchery and rotating fresh produce are still learned in-store, but high staff turnover means the knowledge travels in short, repeated handovers."],"apparatus":["En kırılgan halka. Raf; gemi, konteyner, soğutmalı kamyon, tarayıcı ve kesintisiz elektrik zincirine bağlı, ve bu zincirin tek noktalı arızaları kanıtlanmış durumda.","The most brittle link. The shelf hangs on ships, containers, refrigerated trucks, scanners and uninterrupted electricity — a chain whose single points of failure are demonstrated."],"maintenance":["Bakım muazzam ve sürekli: FMI'ya göre 2024'te ABD'de 45.575 süpermarket vardı ve ortalama mağaza 2025'te 33.248 kalemi her gün yeniden sayıp yeniden dolduruyor.","Maintenance is vast and continuous: FMI counted 45,575 US supermarkets in 2024, and in 2025 the average store recounts and refills 33,248 items every day."]},"weakest":{"k":"apparatus","why":["Prosedür, format ve emek halkaları sağlam; kırılgan olan fiziksel taşıyıcı. Rafın içeriği tek bir kanaldan, tek bir soğutucudan, tek bir elektrik hattından geçiyor ve bu darboğazların gerçek maliyeti ölçülmüş durumda: Mart 2021'de tek bir geminin Süveyş'i altı gün tıkaması 430'dan fazla gemiyi bekletti ve günde yaklaşık 9 milyar dolarlık ticareti durdurdu.","Procedure, format and labour are all robust; what is brittle is the physical carrier. What sits on the shelf passes through one canal, one refrigerator, one power line, and the real cost of those bottlenecks has been measured: in March 2021 a single ship blocking Suez for six days left more than 430 vessels waiting and held up some $9 billion of trade a day."]},"nearBreak":["23 Mart 2021'de 400 metrelik Ever Given Süveyş Kanalı'nı çaprazlamasına tıkadı; altı gün boyunca 430'dan fazla gemi bekledi ve günde yaklaşık 9 milyar dolarlık ticaret durdu. Gemi 29 Mart'ta yüzdürüldü, birikmiş kuyruk 3 Nisan'a kadar eritildi. Zincir tuttu çünkü ağın kendisi yedekliydi — rotalar Ümit Burnu'na kaydırılabildi ve raflarda kalıcı bir boşluk oluşmadı.","On 23 March 2021 the 400-metre Ever Given wedged itself across the Suez Canal; for six days more than 430 ships waited and roughly $9 billion of trade a day stalled. The vessel was refloated on 29 March and the backlog cleared by 3 April. The chain held because the network itself was redundant — routes could be swung around the Cape and no lasting gap opened on the shelves."],"thesis":["Bu vaka çalışmanın “bazı paketler bir metin değil, birbirine kilitlenmiş formatlar kümesidir” iddiasını destekliyor: süpermarket ancak mağaza planı, palet, konteyner ve barkod aynı anda anlaştığında var olabiliyor. Göstermediği şey: barkodun 1974'te okunup 1985'te hâlâ mağazaların yalnızca %29'una ulaşmış olması, bir formatın hızlı yayılacağına dair hiçbir güvence bulunmadığını hatırlatıyor.","This case supports the study's claim that some packets are not a text but a set of interlocking formats: a supermarket exists only when store plan, pallet, container and barcode all agree at once. What it does not show: the barcode was read in 1974 and had still reached only 29% of stores by 1985, a reminder that nothing guarantees a format will spread quickly."],"sources":[{"t":["Tek yönlü süpermarket koridorları","One-Way Supermarket Aisles"],"m":["Lemelson Center, Smithsonian Institution","Lemelson Center, Smithsonian Institution"],"u":"https://invention.si.edu/invention-stories/one-way-supermarket-aisles"},{"t":["4 Haziran 1937: alışveriş arabasının doğuşu","June 4, 1937: Debut of the Shopping Cart"],"m":["Encyclopædia Britannica","Encyclopædia Britannica"],"u":"https://www.britannica.com/today-in-history/June-4-1937-Debut-of-the-Shopping-Cart"},{"t":["Ideal X – ilk konteyner seferi, 1956","Ideal X – the first container voyage, 1956"],"m":["Port Houston","Port Houston"],"u":"https://porthouston.com/ideal-x/"},{"t":["UPC: barkodun tarihi","The UPC: a history of the barcode"],"m":["IBM","IBM"],"u":"https://www.ibm.com/mx-es/history/upc"},{"t":["Gıda sektörü verileri (2024-2025)","Food Industry Facts (2024-2025)"],"m":["FMI – The Food Industry Association","FMI – The Food Industry Association"],"u":"https://www.fmi.org/our-research/food-industry-facts"}]},{"id":"toaster","cat":"everyday","civ":"modern","icon":"🍞","name":["Elektrikli ekmek kızartma makinesi","The electric toaster"],"era":["1906 → bugün","1906 → today"],"hook":["2009'da Thomas Thwaites, Argos'ta 3,94 sterline satılan 404 parçalı bir ekmek kızartma makinesini ham cevherden yeniden yapmayı denedi. Dokuz ay ve 1.187,54 sterlin sonra fişe taktı; kendi anlatımıyla: “rezistans o kadar ısındı ki kendini eritti! Yine de ılık(ımsı) bir ekmeğim oldu.”","In 2009 Thomas Thwaites tried to rebuild, from raw ore, a 404-part toaster that Argos sold for £3.94. Nine months and £1,187.54 later he plugged it in; in his own words: “the element got so hot it melted itself! I had some warm(ish) bread though.”"],"timeline":[{"y":1906,"t":["Albert Marsh nikel-krom alaşımını patentler (US 852.338, 1907'de verilir): bakırın 50 katı direnç, yüksek erime noktası, oksitlenmeye direnç.","Albert Marsh patents his nickel-chromium alloy (US 852,338, granted 1907): 50 times the resistance of copper, a high melting point, resistant to oxidation."],"link":"packet","src":"https://www.chemistryworld.com/opinion/marshs-wires-and-the-birth-of-the-toaster/4019457.article"},{"y":1909,"t":["Frank Shailor'ın tasarladığı General Electric D-12 satışa çıkar: ticari olarak başarılı ilk elektrikli kızartma makinesi.","The General Electric D-12, designed by Frank Shailor, goes on sale: the first commercially successful electric toaster."],"link":"apparatus","src":"https://www.hagley.org/librarynews/history-making-toast"},{"y":1921,"t":["Charles Strite'ın “Bread-toaster” patenti 18 Ekim 1921'de verilir (US 1.394.450): zamanlayıcı akımı keser, ekmek kendiliğinden fırlar.","Charles Strite's “Bread-toaster” patent is granted on 18 October 1921 (US 1,394,450): a timer cuts the current and the bread ejects itself."],"link":"packet","src":"https://patents.google.com/patent/US1394450A/en"},{"y":1926,"t":["Minneapolis'teki Waters-Genter, Toastmaster'ı satışa çıkarır: eve giren ilk otomatik, zamanlayıcılı, iki yüzü birden kızartan makine.","Waters-Genter of Minneapolis launches the Toastmaster: the first automatic household toaster, timed, browning both sides at once."],"link":"apparatus","src":"https://www.hagley.org/librarynews/history-making-toast"},{"y":1928,"t":["7 Temmuz 1928'de Chillicothe, Missouri'de ilk dilimlenmiş ekmek satılır; yuvanın ölçüsüyle dilimin ölçüsü artık aynı formatta anlaşır.","On 7 July 1928 the first commercially sliced loaf is sold in Chillicothe, Missouri; slot and slice now agree on a single format."],"link":"decoder","src":"https://lemelson.mit.edu/resources/otto-rohwedder"},{"y":1941,"t":["ABD Savaş Üretim Kurulu L-23 emriyle ev tipi pişirme cihazlarının üretimini kısıtlar; M-6-b nikeli, M-21-d kromu savaşa ayırır.","The US War Production Board's order L-23 restricts making domestic cooking appliances; M-6-b rations nickel and M-21-d chromium for the war."],"link":"maintenance","src":"https://www.govinfo.gov/content/pkg/GOVPUB-PR32_400-1b58207067db7e1f9662e99d683f352f/html/GOVPUB-PR32_400-1b58207067db7e1f9662e99d683f352f.htm"},{"y":2009,"t":["Thwaites'in Toaster Project'i: 3,94 sterlinlik cihaz sıfırdan yapılınca dokuz ay ve 1.187,54 sterline mal olur, rezistans ilk denemede erir.","Thwaites's Toaster Project: rebuilt from scratch, the £3.94 appliance costs nine months and £1,187.54, and the element melts on first use."],"link":"tacit","src":"https://collections.vam.ac.uk/item/O1269559/the-toaster-project-installation-thomas-thwaites/"},{"y":2024,"t":["ABD krom tüketiminin %77'sini ithal ediyor; USGS'e göre paslanmaz çelikte ve ısıya dayanıklı alaşımlarda kromun ikamesi yok.","The US imports 77% of the chromium it consumes; USGS records no substitute for chromium in stainless or heat-resisting steel."],"link":"apparatus","src":"https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-chromium.pdf"}],"links":{"packet":["Paket açık ve olgun: Marsh'ın alaşım patenti, Strite'ın zamanlayıcı patenti ve bugünkü elektriksel güvenlik standartları hepsi kamuya açık metinler.","The packet is open and mature: Marsh's alloy patent, Strite's timer patent and today's electrical safety standards are all public texts."],"decoder":["Formatlar birbirine kilitli ve okunur durumda: dilim kalınlığı, yuva genişliği, şebeke gerilimi ve fiş standardı ülke ölçeğinde uyumlu; kullanıcı yalnızca kolu indirmeyi biliyor.","The formats interlock and stay legible: slice thickness, slot width, mains voltage and plug standard agree nationally, while the user only needs to know how to push the lever down."],"context":["Neden çalıştığı elektrik mühendisliğinin sıradan bilgisi — direnç, ısı, Maillard tepkimesi. Ama bu bilgi artık cihazla birlikte gelmiyor; kullanıcının elinde yalnızca bir kadran var.","Why it works is ordinary electrical engineering — resistance, heat, the Maillard reaction. That knowledge no longer travels with the device, though: the user is left holding a dial."],"tacit":["Çok ince. Thwaites'in kanıtladığı gibi tek bir insan bu nesneyi yeniden üretemiyor; 404 parçanın her biri ayrı bir hattın atölye bilgisine yaslanıyor.","Very thin. As Thwaites demonstrated, no single person can reproduce the object; each of its 404 parts leans on the shop-floor knowledge of a separate line."],"apparatus":["Nikel-krom teli, mika yalıtımı, damgalı sac ve enjeksiyon kalıpları hâlâ sanayi ölçeğinde üretiliyor; ama kromun ikamesi yok ve ABD ihtiyacının %77'sini dışarıdan alıyor.","Nickel-chromium wire, mica insulation, stamped sheet metal and injection moulds are all still made at industrial scale; but chromium has no substitute and the US buys in 77% of what it needs."],"maintenance":["En zayıf halka. Bakım tamamen yeni üretime devredildi: hiçbir tost makinesi tamir edilmiyor, kimse tamir etmeyi öğrenmiyor. Küçük cihazlar e-atığın %33'ünü oluşturuyor, geri dönüşüm oranı %12.","The weakest link. Maintenance has been handed wholly to new production: no toaster is repaired and nobody is taught to repair one. Small equipment is 33% of e-waste, of which only 12% is recycled."]},"weakest":{"k":"maintenance","why":["Kopyalama işi devasa ölçekte sürüyor ama öğretme işi tamamen durdu. Tost makinesi bugün yalnızca yeniden üretilerek yaşıyor; onarım kültürü, yedek rezistans stoğu ve tamirci yetiştiren hiçbir kurum kalmadı. Küçük cihazlar dünya e-atığının %33'ünü oluşturuyor ve bunun sadece %12'si geri dönüştürülüyor — yani hat dursa zinciri devralacak kimse yok.","The copying half runs at enormous scale while the teaching half has stopped altogether. The toaster now lives only by being remanufactured; there is no repair culture, no stock of spare elements, no institution training anyone to fix one. Small equipment makes up 33% of world e-waste and only 12% of it is recycled — so if the line stopped, nobody would be positioned to take the chain over."]},"nearBreak":["Aralık 1941'den itibaren ABD Savaş Üretim Kurulu, L-23 emriyle ev tipi pişirme cihazlarının üretimini kısıtladı; M-6-b nikeli, M-21-d ise kromu tahsis altına aldı — yani tost makinesinin varlık sebebi olan alaşımın iki bileşeni de savaşa gitti. Zincir koptu değil askıya alındı: patentler, kalıplar ve fabrikalar yerinde kaldığı için üretim savaştan sonra kaldığı yerden sürdü.","From December 1941 the US War Production Board restricted the manufacture of domestic cooking appliances under order L-23, while M-6-b rationed nickel and M-21-d chromium — that is, both constituents of the very alloy that makes a toaster possible went to the war. The chain was suspended rather than broken: because the patents, the tooling and the factories stayed in place, production resumed where it had left off."],"thesis":["Bu vaka çalışmanın “örtük bilgi ve aygıt olmadan paket ölü harftir” iddiasının en temiz deneysel testi: Thwaites'in elinde tüm tarifler vardı, sonuç dokuz ay ve 300 kat maliyetle eriyen bir teldi. Göstermediği şey: bu bir bilgi kaybı değil, ölçek kaybı deneyiydi — sanayi ayaktayken bireyin başarısızlığı zincirin kırılganlığını kanıtlamaz.","This case is the cleanest experimental test of the study's claim that a packet without tacit skill and apparatus is dead letter: Thwaites had every recipe and ended up, after nine months and 300 times the cost, with a wire that melted. What it does not show: this was an experiment in loss of scale, not loss of knowledge — one person failing while the industry stands does not by itself prove the chain is fragile."],"sources":[{"t":["Tost yapmanın tarihi","The History of Making Toast"],"m":["Hagley Museum and Library","Hagley Museum and Library"],"u":"https://www.hagley.org/librarynews/history-making-toast"},{"t":["Marsh'ın telleri ve tost makinesinin doğuşu","Marsh's wires and the birth of the toaster"],"m":["Chemistry World, Royal Society of Chemistry","Chemistry World, Royal Society of Chemistry"],"u":"https://www.chemistryworld.com/opinion/marshs-wires-and-the-birth-of-the-toaster/4019457.article"},{"t":["The Toaster Project – kitap üzerine inceleme (404 parça, dokuz ay)","The Toaster Project – on the book (404 parts, nine months)"],"m":["The Marginalian, 2011","The Marginalian, 2011"],"u":"https://www.themarginalian.org/2011/09/28/the-toaster-project/"},{"t":["The Toaster Project (yerleştirme)","The Toaster Project (installation)"],"m":["Victoria and Albert Museum","Victoria and Albert Museum"],"u":"https://collections.vam.ac.uk/item/O1269559/the-toaster-project-installation-thomas-thwaites/"},{"t":["The Toaster Project – sanatçının kendi anlatımı","The Toaster Project – the artist's own account"],"m":["thomasthwaites.com","thomasthwaites.com"],"u":"https://www.thomasthwaites.com/the-toaster-project/"}]},{"id":"natural-gas","cat":"energy","civ":"modern","icon":"🔥","name":["Doğal gaz (bir enerji sistemi olarak)","Natural gas (as an energy system)"],"era":["MÖ ~225 – bugün","c. 225 BCE – present"],"hook":["Doğal gaz kokusuzdur. Bugün burnunuzun aldığı o keskin koku, 1937'de Teksas'ta bir okulun altında biriken kokusuz gaz yaklaşık 298 çocuğu ve öğretmeni öldürdükten sonra sisteme kasten eklendi.","Natural gas has no smell. The sharp odour you notice today was deliberately added after odourless gas pooled under a Texas school in 1937 and killed about 298 children and teachers."],"timeline":[{"y":-225,"t":["Siçuan'da ilk kayıtlı tuzlu su kuyusu elle kazılır (~2.250 yıl önce). Yaygın 'MÖ 500 bambu gaz hattı' anlatısını sondaj literatürü desteklemiyor.","The first recorded brine well is hand-dug in Sichuan (~2,250 years ago). The popular '500 BCE bamboo gas pipeline' story is not what the drilling literature supports."],"link":"packet","src":"https://www.aapg.org/news-and-media/details/explorer/articleid/61813/big-drilling-in-ancient-china"},{"y":220,"t":["3. yüzyıl başında darbeli sondajla 140 metreye inilir; 1700'lerde kuyular 300-400 m, 1835'te Shenghai kuyusu dünyada ilk kez 1.000 metreyi geçer.","By the early 3rd century AD percussion drilling reaches 140 m; by the 1700s wells run 300–400 m, and in 1835 the Shenghai well is the first anywhere to pass 1,000 m."],"link":"tacit","src":"https://www.aapg.org/news-and-media/details/explorer/articleid/61813/big-drilling-in-ancient-china"},{"y":1550,"t":["16. yüzyılda tuzlu su sondajında çıkan gazı yakalama teknikleri gelişir; gaz bambu boruyla taşınır, 1700'lerin sonunda 'Kang Pen' davulu gazı sudan ayırır.","In the 16th century techniques emerge to capture gas struck while drilling brine; it moves by bamboo pipe, and a late-1700s 'Kang Pen' drum separates gas from brine."],"link":"apparatus","src":"https://www.aapg.org/news-and-media/details/explorer/articleid/61813/big-drilling-in-ancient-china"},{"y":1825,"t":["Fredonia (NY): William Hart'ın kuyusu. Lash'ler birincil kaynağı (31 Ağustos 1825 tarihli Fredonia Censor) bulup her yerde yinelenen '1821' tarihini düzeltti.","Fredonia, NY: William Hart's well. The Lashes traced the primary record — the Fredonia Censor of 31 August 1825 — and corrected the endlessly repeated date of 1821."],"link":"maintenance","src":"https://www.aapg.org/news-and-media/explorer/kicking-down-the-well/"},{"y":1937,"t":["18 Mart 1937: New London okulu, bir artık gaz hattından kaçak alarak patlar; yaklaşık 298 kişi ölür. Teksas, kokulandırıcı zorunluluğu getiren ilk eyalet olur.","18 March 1937: the New London school explodes after gas leaks from a tapped residue line; about 298 die. Texas becomes the first state to require a malodorant."],"link":"context","src":"https://www.tshaonline.org/handbook/entries/new-london-school-explosion"},{"y":1959,"t":["Methane Pioneer, Ocak 1959'da Lake Charles'tan (Louisiana) kalkıp Canvey Island'a (İngiltere) varır: dünyanın ilk okyanus aşırı LNG yükü.","The Methane Pioneer sails from Lake Charles, Louisiana in January 1959 and reaches Canvey Island, England: the world's first ocean cargo of LNG."],"link":"apparatus","src":"https://www.conocophillips.com/spiritnow/story/from-pioneer-to-powerhouse-how-conocophillips-shaped-the-lng-industry/"},{"y":1964,"t":["12 Ekim 1964: Methane Princess, Arzew'deki (Cezayir) CAMEL tesisinden Canvey Island'a ilk ticari LNG yükünü getirir. Zincir küresel bir ticarete dönüşür.","12 October 1964: the Methane Princess delivers the first commercial LNG cargo, from the CAMEL plant at Arzew, Algeria, to Canvey Island. The chain becomes a global trade."],"link":"maintenance","src":"https://www.conocophillips.com/spiritnow/story/from-pioneer-to-powerhouse-how-conocophillips-shaped-the-lng-industry/"},{"y":2026,"t":["Bugün yalnız ABD'de 3,3 milyon milden fazla boru hattı var ve gaz küresel elektriğin yaklaşık dörtte birini karşılıyor. Aparat devasa; onu okuyan eller azalıyor.","The US alone has over 3.3 million miles of pipeline, and gas supplies nearly a quarter of world electricity. The apparatus is vast; the hands that read it are thinning."],"link":"decoder","src":"https://primis.phmsa.dot.gov/stakeholder-comms/pipelinebasics/"}],"links":{"packet":["Güçlü. Rezerv verileri, boru hattı şemaları, ASME/API kodları, gaz kromatografisi standartları ve termodinamik tablolar yazılı, denetlenmiş ve düzenli güncelleniyor.","Strong. Reserve data, pipeline schematics, ASME/API codes, gas chromatography standards and thermodynamic tables are all written down, audited and regularly revised."],"decoder":["Zayıflıyor. Boru kaynakçıları, gaz tesisatçıları, kontrol odası dispeçerleri ve bütünlük mühendisleri yaşlanıyor; enerji dönüşümü tartışmaları genç girişini caydırıyor. Küçülen bir sistemin bile okuyucuya ihtiyacı var — üstelik söküm, işletmekten daha zordur.","Thinning. Pipeline welders, gas fitters, control-room dispatchers and integrity engineers are ageing, and transition politics discourage new entrants. A shrinking system still needs readers — and decommissioning is harder than operating."],"context":["Kanla öğrenildi ve büyük ölçüde donanıma gömüldü: kokulandırma, tahliye ve süpürme yordamları, katodik koruma. Ama bağlamın yeni yarısı — metan sızıntısının iklim maliyeti — hâlâ yazılıyor ve siyasi olarak tartışmalı.","Learned in blood and largely built into the hardware: odorisation, purge and venting procedures, cathodic protection. But the newer half of the context — the climate cost of methane leakage — is still being written and is politically contested."],"tacit":["Yazıya geçmeyen kısım büyük: boru kaynağının el hissi, hat yürüyüşünde kaçak avlamak, kriyojenik LNG'de soğuk metalle çalışmak. Belgeyle değil, usta-çırak hattıyla aktarılıyor.","A large unwritten share: the feel of a pipe weld, hunting leaks while walking a line, handling cold metal on cryogenic LNG. It passes master to apprentice, not by document."],"apparatus":["Neredeyse yük olacak kadar sağlam: yalnız ABD'de 3,3 milyon milden fazla hat, kompresör istasyonları, sıvılaştırma trenleri, LNG tankerleri, yeniden gazlaştırma terminalleri ve on milyonlarca ev sayacı.","Robust to the point of being a burden: over 3.3 million miles of line in the US alone, compressor stations, liquefaction trains, LNG tankers, regasification terminals and tens of millions of domestic meters."],"maintenance":["Kurumsallaşmış: bütünlük yönetimi programları, dökme demir ve çıplak çelik hatların değiştirilmesi, sürekli izlenen kokulandırıcı enjeksiyonu, zorunlu kaçak taramaları. Pahalı, ama bir düzenleyiciye cıvatalanmış.","Institutionalised: integrity-management programmes, replacement of legacy cast-iron and bare-steel mains, continuously monitored odorant injection, mandated leak surveys. Expensive, but bolted to a regulator."]},"weakest":{"k":"decoder","why":["Aparat, onu bakımda tutan insanlardan uzun yaşayacak. 3,3 milyon millik bir sistem küçülürken bile okunmak zorunda: hat kapatmak, süpürmek ve terk etmek işletmekten daha fazla uzmanlık ister — ama tam da bu dönemde mesleğe giriş azalıyor. Paket sağlam; eller değil.","The apparatus will outlive the people who maintain it. A 3.3-million-mile system must still be read while it shrinks: capping, purging and abandoning lines demands more expertise than running them — yet that is exactly when recruitment falls off. The packet is fine; the hands are not."]},"nearBreak":["18 Mart 1937, New London, Teksas. Okul, aylık 300 dolar tasarruf etmek için Parade Gasoline Company'nin artık gaz hattına bağlanmıştı; gaz kokusuzdu. Zeminin altında birikti ve saat 15.17'de atölye dersindeki bir zımparanın kıvılcımıyla patladı; yaklaşık 298 kişi öldü, çoğu çocuktu. Bağlam belgeye değil, cesetlere yazıldı: Teksas gaza kokulandırıcı katılmasını zorunlu kılan ilk eyalet oldu ve kural bugün neredeyse evrensel.","18 March 1937, New London, Texas. To save $300 a month the school had been tapped into Parade Gasoline Company's residue gas line; the gas was odourless. It pooled under the floor and ignited at 3:17 p.m. from a shop-class sander, killing about 298 people, most of them children. The context was written in bodies rather than documents: Texas became the first state to mandate a malodorant, and the rule is now near-universal."],"thesis":["Çalışmanın şu iddiasını destekliyor: bağlam en dayanıklı biçimini belgede değil, donanımın kendisinde bulur. Kokulandırıcı, 'gaz kaçağı öldürür' bilgisinin okunması gerekmeyen, unutulamayan bir fiziksel özelliğe çevrilmiş hâlidir — uyarı el kitabı açılmadan gelir. Dürüst sınır: bu çeviri tek bir hata biçimini kapatır. Kokunun toprakta soğurulması, koku körlüğü ve koku yorgunluğu hâlâ yazılı bağlam ister; üstelik sektörün kendi kuruluş tarihini iki yüzyıl boyunca yanlış kopyalaması (1821'e karşı 1825), bakım halkasının kaydın kendisinde bile aksadığını gösteriyor.","Supports the study's claim that context survives best when it is engineered into the apparatus rather than filed as a document. Odorant converts 'a gas leak kills' into a physical property nobody has to read and nobody can forget — the warning arrives without the manual. Honest limit: the translation closes exactly one failure mode. Odorant fade in soil, anosmia and olfactory fatigue still require written context — and the industry mis-copying its own founding date for two centuries (1821 vs 1825) shows the maintenance link failing even inside the record itself."],"sources":[{"t":["New London Okulu Patlaması — Texas State Historical Association","New London School Explosion — Texas State Historical Association"],"m":["18 Mart 1937 tarihini, ~298 ölüyü, artık gaz hattına yapılan bağlantıyı ve ardından gelen eyalet kokulandırma yasasını doğrular.","Confirms the 18 March 1937 date, ~298 dead, the tap into the residue gas line, and the state odorization law that followed."],"u":"https://www.tshaonline.org/handbook/entries/new-london-school-explosion"},{"t":["'Kicking Down the Well' — AAPG Explorer","'Kicking Down the Well' — AAPG Explorer"],"m":["Gary ve Eileen Lash'in Fredonia kuyusunu 31 Ağustos 1825 tarihli Fredonia Censor'a dayandırdığı ve '1821'i en bilinen hatalı anlatı ilan ettiği kaynak.","Where Gary and Eileen Lash date the Fredonia well from the Fredonia Censor of 31 August 1825 and call 1821 the best-known erroneous account."],"u":"https://www.aapg.org/news-and-media/explorer/kicking-down-the-well/"},{"t":["Eski Çin'de Büyük Sondaj — AAPG Explorer","Big Drilling in Ancient China — AAPG Explorer"],"m":["Siçuan tuzlu su kuyuları için ölçülü tarihler verir: ~2.250 yıl önce, 3. yüzyılda 140 m, 1835'te 1.000 metreyi aşan ilk kuyu. 'MÖ 500' iddiasını taşımaz.","Gives disciplined dates for Sichuan brine wells: ~2,250 years ago, 140 m by the 3rd century, the first well past 1,000 m in 1835. It does not support the '500 BCE' claim."],"u":"https://www.aapg.org/news-and-media/details/explorer/articleid/61813/big-drilling-in-ancient-china"},{"t":["Öncüden Güç Merkezine: ConocoPhillips ve LNG","From Pioneer to Powerhouse: ConocoPhillips and LNG"],"m":["Methane Pioneer'ın Ocak 1959 seferini ve Methane Princess'in 12 Ekim 1964'teki ilk ticari Cezayir yükünü şirket arşivinden verir.","Corporate archive giving the Methane Pioneer's January 1959 voyage and the Methane Princess's first commercial Algerian cargo on 12 October 1964."],"u":"https://www.conocophillips.com/spiritnow/story/from-pioneer-to-powerhouse-how-conocophillips-shaped-the-lng-industry/"},{"t":["Boru Hattı Temelleri — PHMSA, ABD Ulaştırma Bakanlığı","Pipeline Basics — PHMSA, US Department of Transportation"],"m":["ABD'deki 3,3 milyon milden fazla boru hattının resmi kaynağı; bugünkü aparatın ölçeğini belirler.","Official source for the 3.3+ million miles of US pipeline; establishes the scale of today's apparatus."],"u":"https://primis.phmsa.dot.gov/stakeholder-comms/pipelinebasics/"}]},{"id":"electric-car","cat":"energy","civ":"modern","icon":"🔋","name":["Elektrikli otomobil","The electric car"],"era":["1890 – bugün, arada altmış yıllık bir boşlukla","1890 – present, with a sixty-year gap"],"hook":["1900'de ABD'de üretilen 4.192 otomobilin 1.575'i elektrikliydi — yaklaşık %38. Sonra zincir altmış yıl boyunca soğudu: paket patentlerde ve kitaplarda hayatta kaldı, ama onu okuyacak pazar da onu üretecek makineler de yok oldu.","Of the 4,192 cars built in the United States in 1900, 1,575 were electric — about 38%. Then the chain went cold for sixty years: the packet survived in patents and books while the market that read it and the machines that made it both vanished."],"timeline":[{"y":1890,"t":["Des Moines'lı kimyager William Morrison ilk başarılı Amerikan elektrikli otomobilini yapar. Elektrik; sessiz, kokusuz ve marş kolu gerektirmeyen seçenektir.","William Morrison, a chemist in Des Moines, builds the first successful American electric car. Electric is the quiet, odourless option that needs no hand crank."],"link":"packet","src":"https://www.energy.gov/articles/history-electric-car"},{"y":1900,"t":["ABD yapımı 4.192 otomobilin 1.681'i buharlı, 1.575'i elektrikli, 936'sı benzinli — ~%37,6 elektrikli. Rakamlar 1900 Sanayi Sayımı'na ikincil kaynak üzerinden dayanır.","Of 4,192 US-built cars: 1,681 steam, 1,575 electric, 936 petrol — about 37.6% electric. The figures trace to the 1900 Census of Manufactures via secondary reporting."],"link":"apparatus","src":"https://gizmodo.com/about-40-of-american-made-cars-in-1900-were-steam-powe-1597522738"},{"y":1911,"t":["Kettering 15 Haziran 1911'de marş motoru patentine başvurur (ABD 1.150.523). 1912 Cadillac'ta piyasaya çıkar ve elektriklinin tek üstünlüğünü siler.","Kettering files his electric starter patent on 15 June 1911 (US 1,150,523). It debuts on the 1912 Cadillac and erases the electric car's one advantage."],"link":"context","src":"https://ethw.org/Charles_F._Kettering"},{"y":1935,"t":["Ucuz Teksas petrolü, şehirlerarası yollar ve Model T'nin fiyatı birleşir: ABD Enerji Bakanlığı'na göre elektrikli araçlar 1935'e gelindiğinde neredeyse tümüyle kaybolur.","Cheap Texas crude, intercity roads and the Model T's price converge: according to the US Department of Energy, electric vehicles all but disappear by 1935."],"link":"maintenance","src":"https://www.energy.gov/articles/history-electric-car"},{"y":1976,"t":["M. Stanley Whittingham, 1972'de geçtiği Exxon'da titanyum disülfür katotlu lityum pilini duyurur. Eski otomobil arşiviyle hiç ortak yanı olmayan yeni bir paket doğar.","M. Stanley Whittingham, who moved to Exxon in 1972, announces his titanium disulphide lithium battery. A new packet is born, sharing nothing with the old car archive."],"link":"packet","src":"https://www.nobelprize.org/prizes/chemistry/2019/popular-information/"},{"y":1980,"t":["John Goodenough kobalt oksitle dört volta ulaşır; Akira Yoshino 1985'te ilk ticari uygulanabilir lityum-iyon hücresini yapar, pil 1991'de piyasaya çıkar.","John Goodenough reaches four volts with cobalt oxide; in 1985 Akira Yoshino builds the first commercially viable lithium-ion cell, and it reaches the market in 1991."],"link":"packet","src":"https://www.nobelprize.org/prizes/chemistry/2019/press-release/"},{"y":1996,"t":["GM'in EV1'i kiralanmaya başlar: yaklaşık 1.000 adet, hiç satılmadı, sonradan geri toplandı. Prius 1997, Tesla Roadster Şubat 2008, Leaf ve Volt 2010 sonunda gelir.","GM's EV1 goes out on lease: about 1,000 built, never sold, later recalled. The Prius follows in 1997, the Tesla Roadster in February 2008, the Leaf and Volt in late 2010."],"link":"tacit","src":"https://news.gm.com/home.detail.html/Pages/news/us/en/2026/mar/0311-ev1.html"},{"y":2025,"t":["2025'te dünyada 20 milyondan fazla elektrikli otomobil satıldı: yeni araçların dörtte biri. Çin'de oran %55'e yakın, ABD'de %10'un biraz altında.","In 2025 more than 20 million electric cars were sold worldwide — one in four new cars. In China the share is near 55%; in the United States it is just under 10%."],"link":"decoder","src":"https://www.iea.org/reports/global-ev-outlook-2026/executive-summary"}],"links":{"packet":["Bugün olağanüstü zengin: hücre kimyası literatürü, açık veri setleri, SAE ve UNECE standartları, on binlerce patent. Ama dikkat — 1900'ün paketi de hayatta kaldı ve zinciri yeniden başlatmaya yetmedi.","Extraordinarily rich today: cell-chemistry literature, open datasets, SAE and UNECE standards, tens of thousands of patents. But note — the 1900 packet also survived, and it was not enough to restart the chain."],"decoder":["Geniş, ama yeni. Pil kimyagerleri, güç elektroniği mühendisleri, yüksek gerilim eğitimli servis teknisyenleri. Bu halkanın hiçbiri 1900'den devralınmadı; 1990'lardan itibaren sıfırdan kuruldu.","Broad, but new. Battery chemists, power-electronics engineers, high-voltage-trained service technicians. None of this link was inherited from 1900; it was built from scratch from the 1990s on."],"context":["İyi durumda: menzil, şarj eğrileri, termal kaçak, kapasite kaybı ve şebeke etkileşimi ölçülüp yayımlanıyor. Açık uçlar pil yangını davranışı, ikinci yaşam ve gerçek ömür sonu ekonomisi.","In good shape: range, charge curves, thermal runaway, capacity fade and grid interaction are measured and published. The loose ends are fire behaviour, second life and the real economics of end of life."],"tacit":["En dar boğaz. Elektrot kaplama ve kalenderleme, kuru oda disiplini, hücre formasyon çevrimleri, paket kaynağı — verim reçeteleri patentte değil, birkaç Doğu Asya firmasının içinde. Kâğıtla değil, insan transferiyle taşınıyor.","The narrowest neck. Electrode coating and calendering, dry-room discipline, cell formation cycles, pack welding — the yield recipes are not in the patents but inside a handful of East Asian firms. They travel by people moving, not on paper."],"apparatus":["Büyük ama coğrafi olarak yoğunlaşmış: gigafabrikalar, katot ve anot öncül tesisleri, lityum-nikel-grafit rafinasyonu, şarj ağları. Az sayıda ülkede kümelendiği için tek noktadan kırılabilir.","Large but geographically concentrated: gigafactories, cathode and anode precursor plants, lithium, nickel and graphite refining, charging networks. Clustered in few countries, so it breaks at single points."],"maintenance":["Karışık. Yazılım güncellemeleri ve pil garantileri güçlü; onarım hakkı, hücre düzeyinde tamir ve geri dönüşüm altyapısı hâlâ olgunlaşmamış. Aracın ömrü giderek pilin ömrüyle tanımlanıyor.","Mixed. Software updates and battery warranties are strong; right-to-repair, cell-level repair and recycling infrastructure are still immature. A car's life is increasingly defined by its pack's life."]},"weakest":{"k":"tacit","why":["Belge her yerde, el yok. Bir lityum-iyon hücresinin nasıl yapıldığı yayımlanmış durumda; kabul edilebilir verimle nasıl yapıldığı yayımlanmamıştır ve pratikte birkaç firmanın üretim hattında yaşıyor. Zincirin kendi tarihi de aynı dersi veriyor: 1935'te ölen şey belge değil, üretim eliydi — ve 1990'larda geri gelen de belge okuyarak değil, yeni bir el kurarak geldi.","The documents are everywhere; the hands are not. How to make a lithium-ion cell is published; how to make one at an acceptable yield is not, and in practice lives on the production lines of a few firms. This chain's own history teaches the same lesson: what died in 1935 was not the document but the manufacturing hand — and what returned in the 1990s came from building a new hand, not from reading an old page."]},"nearBreak":["1935-1996: altmış yıllık uyku. ABD Enerji Bakanlığı'na göre elektrikli araçlar 1935'e gelindiğinde neredeyse tamamen kaybolmuş ve 1960'lara kadar durgun kalmıştı. Bu süre boyunca paket eksiksizdi — patentler, mühendislik el kitapları ve kütüphaneler yerli yerindeydi. Kaybolan şey aparat ve pazardı. Zincir 1996'da GM EV1 ile yeniden ısındığında o belgeler neredeyse hiç kullanılmadı: dirilişi mümkün kılan arşiv değil, 1976-1991 arasında sıfırdan yazılmış yepyeni bir paketti — interkalasyon kimyası.","1935–1996: sixty years asleep. The US Department of Energy states that electric vehicles had all but disappeared by 1935 and stayed dormant into the 1960s. Throughout, the packet was intact — patents, engineering handbooks and libraries were all still there. What vanished was the apparatus and the market. When the chain warmed again with the GM EV1 in 1996, those documents were barely used: what made the revival possible was not the archive but an entirely new packet written from scratch between 1976 and 1991 — intercalation chemistry."],"thesis":["Çalışmanın 'paket tek başına zinciri yeniden başlatamaz' iddiasını destekliyor. 1900'ün elektrikli otomobil belgeleri hiç kaybolmadı; yine de altmış yıl boyunca hiçbir işe yaramadılar, çünkü onları okuyacak pazar, üretecek fabrika ve elleri eğitecek usta kalmamıştı. Dürüst sınır: bu vaka 'arşivden yeniden yakıldı' diye fazla iyimser okunuyor. Dirilen şey eski zincirin devamı değil, aynı amacı paylaşan yeni bir zincirdir; arşiv yalnızca hedefi taşıdı, yöntemi değil. Bu, arşivciliğe bir zafer değil, bir uyarıdır.","Supports the study's claim that a packet alone cannot restart a chain. The 1900 electric-car documents were never lost; they were useless for sixty years anyway, because no market read them, no factory made them and no master trained a hand to them. Honest limit: this case is read too optimistically as 'relit from the archive.' What revived was not a continuation of the old chain but a new chain sharing its goal; the archive carried the destination, not the method. That is a warning to archivists, not a victory."],"sources":[{"t":["Elektrikli Otomobilin Tarihi — ABD Enerji Bakanlığı","The History of the Electric Car — US Department of Energy"],"m":["1890 Morrison aracını, 1900 zirvesini, Kettering marşını ve 'elektrikli araçlar 1935'e gelindiğinde neredeyse tümüyle kayboldu' ifadesini kurumsal ağızdan verir.","Institutional statement of the 1890 Morrison car, the 1900 peak, the Kettering starter, and the line that EVs 'all but disappeared by 1935'."],"u":"https://www.energy.gov/articles/history-electric-car"},{"t":["2019 Nobel Kimya Ödülü — basın bülteni","The Nobel Prize in Chemistry 2019 — press release"],"m":["Goodenough'un 1980 kobalt oksidini, Yoshino'nun 1985 hücresini ve pilin 1991'de piyasaya girişini birincil ağızdan doğrular.","Confirms Goodenough's 1980 cobalt oxide, Yoshino's 1985 cell and the battery's 1991 market entry from the awarding body itself."],"u":"https://www.nobelprize.org/prizes/chemistry/2019/press-release/"},{"t":["Charles F. Kettering — IEEE Mühendislik ve Teknoloji Tarihi Wiki","Charles F. Kettering — IE
